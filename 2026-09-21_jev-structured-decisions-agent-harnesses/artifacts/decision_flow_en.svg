<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc"><title id="title">Decision composition</title><desc id="desc">Evidence is evaluated through focused questions. Code checks the results before routing to processing, reasoning or review.</desc><rect width="800" height="650" fill="#f0f3ed"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#58726a"/></marker></defs><g font-family="Arial,Noto Sans KR,sans-serif" fill="#182c31"><rect x="95" y="40" width="610" height="108" rx="8" fill="#dde9e3"/><text x="400" y="80" text-anchor="middle" font-size="27">Relevant evidence</text><text x="400" y="118" text-anchor="middle" font-size="21">Passages · execution records · criteria</text><path d="M400 148V183" stroke="#58726a" stroke-width="2" marker-end="url(#arrow)"/><rect x="95" y="192" width="610" height="108" rx="8" fill="#d5e9e6"/><text x="400" y="232" text-anchor="middle" font-size="27">Jev: focused questions</text><text x="400" y="270" text-anchor="middle" font-size="21">Choice · Score · Noul</text><path d="M400 300V335" stroke="#58726a" stroke-width="2" marker-end="url(#arrow)"/><rect x="95" y="344" width="610" height="108" rx="8" fill="#f2dfbd"/><text x="400" y="384" text-anchor="middle" font-size="27">Program checks and policy</text><text x="400" y="422" text-anchor="middle" font-size="21">Types · numbers · permissions · abstention</text><path d="M400 452V484H145V513M400 484V513M400 484H655V513" fill="none" stroke="#58726a" stroke-width="2"/><rect x="32" y="513" width="226" height="60" rx="7" fill="#dde9e3"/><text x="145" y="551" text-anchor="middle" font-size="22">Process</text><rect x="287" y="513" width="226" height="60" rx="7" fill="#dde9e3"/><text x="400" y="551" text-anchor="middle" font-size="22">Reason further</text><rect x="542" y="513" width="226" height="60" rx="7" fill="#dde9e3"/><text x="655" y="551" text-anchor="middle" font-size="22">Human review</text><text x="400" y="617" text-anchor="middle" font-size="18">Reviewer proposal · not a neural architecture</text></g></svg>