<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc"><title id="title">Browser action loop</title><desc id="desc">Observed controls feed operation and target questions together; typing invokes a text helper before checked execution and renewed observation.</desc><rect width="900" height="700" fill="#f0f3ed"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#58726a"/></marker></defs><g font-family="Arial,Noto Sans KR,sans-serif" fill="#182c31"><rect x="215" y="25" width="510" height="88" rx="9" fill="#dde9e3"/><text x="470" y="60" text-anchor="middle" font-size="27">Observe the page again</text><text x="470" y="92" text-anchor="middle" font-size="20">Index the currently observed controls</text><path d="M470 113V150" fill="none" stroke="#58726a" stroke-width="2.3" marker-end="url(#a)"/><rect x="160" y="152" width="690" height="173" rx="9" fill="#d5e9e6"/><text x="505" y="184" text-anchor="middle" font-size="23">Jev: one request</text><rect x="183" y="201" width="285" height="95" rx="9" fill="#f7f9f5"/><rect x="489" y="201" width="338" height="95" rx="9" fill="#f7f9f5"/><text x="326" y="238" text-anchor="middle" font-size="22">Choose operation</text><text x="326" y="274" text-anchor="middle" font-size="18">CLICK · TYPE_TEXT · WAIT…</text><text x="658" y="238" text-anchor="middle" font-size="22">Choose targets by operation</text><text x="658" y="274" text-anchor="middle" font-size="17">Click candidates · input candidates…</text><path d="M505 325V356" fill="none" stroke="#58726a" stroke-width="2.3" marker-end="url(#a)"/><rect x="210" y="360" width="590" height="65" rx="9" fill="#f2dfbd"/><text x="505" y="400" text-anchor="middle" font-size="22">Use only the matching target answer</text><path d="M505 425V450H670V475" fill="none" stroke="#58726a" stroke-width="2.3" marker-end="url(#a)"/><text x="681" y="443" text-anchor="middle" font-size="18">If TYPE_TEXT</text><rect x="420" y="482" width="420" height="65" rx="9" fill="#dde9e3"/><text x="630" y="522" text-anchor="middle" font-size="21">Small LLM generates field text</text><path d="M630 547V574" fill="none" stroke="#58726a" stroke-width="2.3" marker-end="url(#a)"/><path d="M300 425V574" fill="none" stroke="#58726a" stroke-width="2.3" marker-end="url(#a)"/><rect x="175" y="580" width="675" height="78" rx="9" fill="#d5e9e6"/><text x="512" y="612" text-anchor="middle" font-size="25">Executor checks → action</text><text x="512" y="642" text-anchor="middle" font-size="17">Check state and target; verify final outcome separately</text><path d="M175 619H72V68H208" fill="none" stroke="#58726a" stroke-width="2.3" marker-end="url(#a)"/><text x="40" y="350" transform="rotate(-90 40 350)" text-anchor="middle" font-size="17">Observe again</text><text x="470" y="684" text-anchor="middle" font-size="16">Conceptual reconstruction of the public implementation</text></g></svg>