<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">2026년 5월 초판에서 참조한 평가의 대상</title>
  <desc id="desc">Terminal-Bench 2.0, SWE-Bench Pro, MCP Atlas가 요구하는 행동과 검증 조건을 설명하는 개념도</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf6}
      .panel{fill:#fff;stroke:#d8d2c6;stroke-width:2}
      .gpt{fill:#2f6f73}
      .opus{fill:#6b4f8a}
      .shared{fill:#c58b3b}
      .line{stroke:#2e4057;stroke-width:2}
      .text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#233142}
      .title{font-size:25px;font-weight:700}
      .label{font-size:21px;font-weight:700}
      .body{font-size:17px}
      .note{font-size:15px;fill:#5d6670}
    </style>
  </defs>
  <rect class="bg" width="960" height="520" rx="22"/>
  <text x="46" y="54" class="text title">코딩과 도구 사용을 서로 다른 시험으로 잽니다</text>
  <text x="46" y="84" class="text note">2026년 5월 초판이 참조한 평가의 대상·환경·통과 기준을 읽는 개념도</text>
  <g transform="translate(46 126)">
    <rect class="panel" width="260" height="310" rx="20"/>
    <rect x="24" y="24" width="70" height="12" rx="6" class="gpt"/>
    <text x="24" y="66" class="text label">Terminal-Bench 2.0</text>
    <text x="24" y="108" class="text body">터미널 과제</text>
    <text x="24" y="134" class="text note">명령·파일·환경 조작</text>
    <text x="24" y="178" class="text body">여러 단계의 실행</text>
    <text x="24" y="204" class="text note">테스트와 종료 상태</text>
    <text x="24" y="248" class="text body">도구·시간 예산</text>
    <text x="24" y="274" class="text note">에이전트의 실행 설정</text>
  </g>
  <g transform="translate(350 126)">
    <rect class="panel" width="260" height="310" rx="20"/>
    <rect x="24" y="24" width="70" height="12" rx="6" class="shared"/>
    <text x="24" y="66" class="text label">SWE-Bench Pro</text>
    <text x="24" y="108" class="text body">저장소 이슈</text>
    <text x="24" y="134" class="text note">코드 위치와 수정</text>
    <text x="24" y="178" class="text body">회귀 테스트</text>
    <text x="24" y="204" class="text note">기능과 기존 동작</text>
    <text x="24" y="248" class="text body">평가 하네스</text>
    <text x="24" y="274" class="text note">시도 횟수와 계산 예산</text>
  </g>
  <g transform="translate(654 126)">
    <rect class="panel" width="260" height="310" rx="20"/>
    <rect x="24" y="24" width="70" height="12" rx="6" class="opus"/>
    <text x="24" y="66" class="text label">MCP Atlas</text>
    <text x="24" y="108" class="text body">여러 서버의 도구</text>
    <text x="24" y="134" class="text note">적절한 호출과 인자</text>
    <text x="24" y="178" class="text body">중간 결과 활용</text>
    <text x="24" y="204" class="text note">여러 도구 결과의 연결</text>
    <text x="24" y="248" class="text body">완료 여부 평가</text>
    <text x="24" y="274" class="text note">목표에 맞는 최종 결과</text>
  </g>
  <line x1="306" y1="282" x2="350" y2="282" class="line"/>
  <line x1="610" y1="282" x2="654" y2="282" class="line"/>
  <text x="46" y="474" class="text note">점수와 함께 과제 버전·모델·하네스·effort를 기록하면, 측정한 행동과 실제 업무를 연결할 수 있습니다.</text>
</svg>
