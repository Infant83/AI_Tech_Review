<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">GPT-5.5 참고자료 맵</title>
  <desc id="desc">공식 발표, 시스템 카드, API 문서, 외부 벤치마크, 안전성 평가가 리뷰의 어떤 판단을 뒷받침하는지 보여주는 자료 맵.</desc>
  <rect width="1280" height="700" fill="#fbf7ef"/>
  <text x="70" y="72" font-family="Noto Sans KR, Pretendard, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#17211c">자료는 같은 결론을 반복하지 않고 서로 다른 질문을 맡습니다</text>
  <text x="72" y="110" font-family="Noto Sans KR, Pretendard, Segoe UI, Arial, sans-serif" font-size="17" fill="#5c665f">공식 문서는 배포와 의도를, 외부 평가는 상대 위치와 한계를,</text>
  <text x="72" y="135" font-family="Noto Sans KR, Pretendard, Segoe UI, Arial, sans-serif" font-size="17" fill="#5c665f">시스템 카드는 위험 조건을 확인하게 해줍니다.</text>

  <g transform="translate(540 310)" font-family="Noto Sans KR, Pretendard, Segoe UI, Arial, sans-serif">
    <circle cx="100" cy="40" r="86" fill="#17211c"/>
    <text x="100" y="27" text-anchor="middle" font-size="21" font-weight="820" fill="#fffdf8">도입 판단</text>
    <text x="100" y="58" text-anchor="middle" font-size="14" fill="#eadfd1">업무 단위 평가</text>
  </g>

  <g stroke="#c9bfb1" stroke-width="2.5" fill="none">
    <path d="M385 210 C505 250 545 290 610 330"/>
    <path d="M885 210 C760 250 720 290 670 330"/>
    <path d="M350 505 C480 450 540 410 610 370"/>
    <path d="M930 505 C800 450 740 410 670 370"/>
  </g>

  <g font-family="Noto Sans KR, Pretendard, Segoe UI, Arial, sans-serif">
    <g transform="translate(70 160)">
      <rect width="340" height="165" rx="22" fill="#fffdf8" stroke="#d8d0c3"/>
      <text x="28" y="42" font-size="18" font-weight="780" fill="#0f7b65">공식 발표·API 문서</text>
      <text x="28" y="76" font-size="15" fill="#4e5a52">출시일, 모델 맥락, 가격, 추론 강도,</text>
      <text x="28" y="101" font-size="15" fill="#4e5a52">도구·긴 작업 포지셔닝을 확인합니다.</text>
      <text x="28" y="137" font-size="13" fill="#7a6f62">OpenAI release, Help Center, API docs</text>
    </g>
    <g transform="translate(870 160)">
      <rect width="340" height="165" rx="22" fill="#fffdf8" stroke="#d8d0c3"/>
      <text x="28" y="42" font-size="18" font-weight="780" fill="#a44a32">시스템 카드</text>
      <text x="28" y="76" font-size="15" fill="#4e5a52">Pro 해석, 사실성 평가 조건,</text>
      <text x="28" y="101" font-size="15" fill="#4e5a52">사이버·생물/화학 위험 취급을 봅니다.</text>
      <text x="28" y="137" font-size="13" fill="#7a6f62">GPT-5.5, GPT-5.5 Instant system cards</text>
    </g>
    <g transform="translate(70 455)">
      <rect width="340" height="165" rx="22" fill="#fffdf8" stroke="#d8d0c3"/>
      <text x="28" y="42" font-size="18" font-weight="780" fill="#536a8f">외부 벤치마크</text>
      <text x="28" y="76" font-size="15" fill="#4e5a52">공식 주장과 독립 평가의 차이를 보며</text>
      <text x="28" y="101" font-size="15" fill="#4e5a52">상대 우위가 어디서 갈리는지 확인합니다.</text>
      <text x="28" y="137" font-size="13" fill="#7a6f62">Artificial Analysis, Scale MCP Atlas</text>
    </g>
    <g transform="translate(870 455)">
      <rect width="340" height="165" rx="22" fill="#fffdf8" stroke="#d8d0c3"/>
      <text x="28" y="42" font-size="18" font-weight="780" fill="#70623a">안전성·운영 평가</text>
      <text x="28" y="76" font-size="15" fill="#4e5a52">능력 상승이 어떤 권한·승인·감사 체계를</text>
      <text x="28" y="101" font-size="15" fill="#4e5a52">요구하는지 확인합니다.</text>
      <text x="28" y="137" font-size="13" fill="#7a6f62">UK AISI cyber evaluation</text>
    </g>
  </g>
</svg>
