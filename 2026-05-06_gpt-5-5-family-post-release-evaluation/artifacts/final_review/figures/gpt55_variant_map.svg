<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">GPT-5.5 계열 모델 구분</title>
  <desc id="desc">GPT-5.5 Thinking, GPT-5.5 Pro, GPT-5.5 Instant를 사용 맥락, 평가 질문, 주의점으로 나누어 보여주는 도식.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#243027" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1280" height="620" fill="#f7f3ea"/>
  <circle cx="1090" cy="80" r="130" fill="#e7efe9" opacity=".75"/>
  <circle cx="155" cy="500" r="150" fill="#f2dfd2" opacity=".55"/>
  <text x="70" y="72" font-family="Noto Sans KR, Pretendard, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#18221d">같은 GPT-5.5라도 평가 단위는 다릅니다</text>
  <text x="72" y="110" font-family="Noto Sans KR, Pretendard, Segoe UI, Arial, sans-serif" font-size="17" fill="#5c665f">모델명 하나로 묶으면 비용, 지연 시간, 사실성, 검증 책임이 섞입니다.</text>

  <g transform="translate(70 160)" font-family="Noto Sans KR, Pretendard, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect x="0" y="0" width="350" height="350" rx="22" fill="#fffdf8" stroke="#d7d0c1"/>
    <rect x="0" y="0" width="350" height="13" rx="6.5" fill="#137b64"/>
    <text x="28" y="54" font-size="27" font-weight="800" fill="#17211c">GPT-5.5 Thinking</text>
    <text x="28" y="88" font-size="15" fill="#68736b">긴 작업을 맡기는 수행 모델</text>
    <line x1="28" y1="115" x2="322" y2="115" stroke="#e4ded2"/>
    <text x="28" y="154" font-size="18" font-weight="750" fill="#17211c">무엇을 확인하나</text>
    <text x="28" y="185" font-size="15" fill="#4e5a52">코드 수정, 터미널 작업, 도구 호출,</text>
    <text x="28" y="209" font-size="15" fill="#4e5a52">긴 문맥 조사처럼 여러 단계를</text>
    <text x="28" y="233" font-size="15" fill="#4e5a52">이어 가는 능력</text>
    <text x="28" y="282" font-size="18" font-weight="750" fill="#17211c">주의할 점</text>
    <text x="28" y="313" font-size="15" fill="#4e5a52">공개 점수 상당수는 높은 추론 강도와</text>
    <text x="28" y="337" font-size="15" fill="#4e5a52">연구 환경을 함께 봐야 합니다.</text>
  </g>

  <g transform="translate(465 160)" font-family="Noto Sans KR, Pretendard, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect x="0" y="0" width="350" height="350" rx="22" fill="#fffdf8" stroke="#d7d0c1"/>
    <rect x="0" y="0" width="350" height="13" rx="6.5" fill="#a44a32"/>
    <text x="28" y="54" font-size="27" font-weight="800" fill="#17211c">GPT-5.5 Pro</text>
    <text x="28" y="88" font-size="15" fill="#68736b">더 많은 계산 시간을 쓰는 고정확도 설정</text>
    <line x1="28" y1="115" x2="322" y2="115" stroke="#e4ded2"/>
    <text x="28" y="154" font-size="18" font-weight="750" fill="#17211c">무엇을 확인하나</text>
    <text x="28" y="185" font-size="15" fill="#4e5a52">어려운 분석, 전문가 검토,</text>
    <text x="28" y="209" font-size="15" fill="#4e5a52">실패 비용이 큰 비동기 작업에서</text>
    <text x="28" y="233" font-size="15" fill="#4e5a52">품질 상승이 비용을 정당화하는지</text>
    <text x="28" y="282" font-size="18" font-weight="750" fill="#17211c">주의할 점</text>
    <text x="28" y="313" font-size="15" fill="#4e5a52">공개 문서상 별도 구조의 모델로</text>
    <text x="28" y="337" font-size="15" fill="#4e5a52">단정하지 않는 편이 안전합니다.</text>
  </g>

  <g transform="translate(860 160)" font-family="Noto Sans KR, Pretendard, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect x="0" y="0" width="350" height="350" rx="22" fill="#fffdf8" stroke="#d7d0c1"/>
    <rect x="0" y="0" width="350" height="13" rx="6.5" fill="#d39b2a"/>
    <text x="28" y="54" font-size="27" font-weight="800" fill="#17211c">GPT-5.5 Instant</text>
    <text x="28" y="88" font-size="15" fill="#68736b">ChatGPT 기본 경험에 가까운 제품 맥락</text>
    <line x1="28" y1="115" x2="322" y2="115" stroke="#e4ded2"/>
    <text x="28" y="154" font-size="18" font-weight="750" fill="#17211c">무엇을 확인하나</text>
    <text x="28" y="185" font-size="15" fill="#4e5a52">일상 응답, 간결성, 개인화,</text>
    <text x="28" y="209" font-size="15" fill="#4e5a52">기본 사용자 경험, 선택된 사실성</text>
    <text x="28" y="233" font-size="15" fill="#4e5a52">평가 묶음에서의 개선</text>
    <text x="28" y="282" font-size="18" font-weight="750" fill="#17211c">주의할 점</text>
    <text x="28" y="313" font-size="15" fill="#4e5a52">표적 평가의 오류 감소가 전체 운영</text>
    <text x="28" y="337" font-size="15" fill="#4e5a52">오류율 감소를 뜻하지는 않습니다.</text>
  </g>

  <text x="72" y="565" font-family="Noto Sans KR, Pretendard, Segoe UI, Arial, sans-serif" font-size="14" fill="#6b746d">읽는 순서: 모델 유형을 먼저 나누고, 각 유형의 평가 질문과 배치 위험을 따로 기록합니다.</text>
</svg>
