  <title id="title">GPT-5.5 공개와 평가 흐름</title>
  <desc id="desc">2026년 4월 23일부터 5월 9일 접근 시점까지 GPT-5.5 발표, API 업데이트, 외부 사이버 평가, Instant 공개, Help Center 업데이트를 시간순으로 보여주는 타임라인.</desc>
