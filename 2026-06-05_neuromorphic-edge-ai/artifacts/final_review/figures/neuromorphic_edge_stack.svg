<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">피지컬 AI와 뉴로모픽 edge layer</title>
  <desc id="desc">센서, 뉴로모픽 edge layer, NPU GPU, LLM VLA, 실행 제어가 physical AI stack에서 연결되는 구조도</desc>
  <defs>
    <style>
      .bg { fill: #f7f8f4; }
      .title { font: 700 34px "Segoe UI", "Malgun Gothic", sans-serif; fill: #161616; }
      .subtitle { font: 400 18px "Segoe UI", "Malgun Gothic", sans-serif; fill: #4a4a4a; }
      .label { font: 700 21px "Segoe UI", "Malgun Gothic", sans-serif; fill: #111; }
      .body { font: 400 16px "Segoe UI", "Malgun Gothic", sans-serif; fill: #333; }
      .small { font: 400 14px "Segoe UI", "Malgun Gothic", sans-serif; fill: #555; }
      .box { rx: 12; stroke-width: 2; }
      .sensor { fill: #e8f4f1; stroke: #2f8b7b; }
      .neuro { fill: #fff3df; stroke: #c97920; }
      .compute { fill: #eaf0fb; stroke: #4b70ad; }
      .model { fill: #f0e8f6; stroke: #7b4a9c; }
      .act { fill: #f7e7e7; stroke: #a94e4e; }
      .line { stroke: #333; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #7c7c7c; stroke-width: 1.7; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrowSoft); }
      .rail { fill: #fff; stroke: #d8dad2; stroke-width: 1.5; rx: 16; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#333" />
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#777" />
    </marker>
  </defs>
  <rect width="1280" height="720" class="bg"/>
  <text x="68" y="70" class="title">큰 모델이 모든 감각을 직접 볼 필요는 없습니다</text>
  <text x="68" y="106" class="subtitle">피지컬 AI에서는 지능이 한 곳에 모이지 않고, 센서 가까운 반응 계층과 상위 모델 계층으로 나뉩니다.</text>

  <rect x="58" y="145" width="1164" height="420" class="rail"/>

  <rect x="88" y="220" width="190" height="145" class="box sensor"/>
  <text x="112" y="255" class="label">센서 세계</text>
  <text x="112" y="292" class="body">카메라 · 레이더</text>
  <text x="112" y="318" class="body">마이크 · 촉각</text>
  <text x="112" y="344" class="body">생체신호</text>

  <rect x="326" y="190" width="230" height="205" class="box neuro"/>
  <text x="352" y="228" class="label">뉴로모픽 edge layer</text>
  <text x="352" y="266" class="body">spike / event encoding</text>
  <text x="352" y="292" class="body">in-sensor preprocessing</text>
  <text x="352" y="318" class="body">항상 켜진 저전력 감지</text>
  <text x="352" y="344" class="body">빠른 reflex trigger</text>
  <text x="352" y="372" class="small">raw data를 줄이고 의미 있는 변화만 전달</text>

  <rect x="604" y="220" width="190" height="145" class="box compute"/>
  <text x="628" y="255" class="label">NPU / GPU</text>
  <text x="628" y="292" class="body">고해상도 perception</text>
  <text x="628" y="318" class="body">batch inference</text>
  <text x="628" y="344" class="body">vision backbone</text>

  <rect x="842" y="190" width="220" height="205" class="box model"/>
  <text x="866" y="228" class="label">LLM / VLA</text>
  <text x="866" y="266" class="body">명령 이해</text>
  <text x="866" y="292" class="body">상황 설명</text>
  <text x="866" y="318" class="body">계획과 도구 호출</text>
  <text x="866" y="344" class="body">사람과의 대화</text>
  <text x="866" y="372" class="small">느려도 되는 판단을 맡는다</text>

  <rect x="470" y="470" width="410" height="72" class="box act"/>
  <text x="500" y="500" class="label">실행 제어: 로봇, 설비, 웨어러블</text>
  <text x="500" y="526" class="body">위험 이벤트는 빠르게, 복잡한 결정은 상위 모델과 함께 처리</text>

  <line x1="278" y1="292" x2="326" y2="292" class="line"/>
  <line x1="556" y1="292" x2="604" y2="292" class="line"/>
  <line x1="794" y1="292" x2="842" y2="292" class="line"/>
  <path d="M442 395 C450 435 518 458 590 470" class="line"/>
  <path d="M940 395 C925 436 846 458 760 470" class="soft"/>

  <text x="84" y="615" class="label">리뷰의 판단 기준</text>
  <text x="84" y="648" class="body">뉴로모픽은 LLM 대체재 질문보다 sensor-time workload 질문에 가깝다.</text>
  <text x="84" y="674" class="body">확인할 기준은 전력, 지연, 데이터 이동을 얼마나 줄이는가다.</text>
</svg>
