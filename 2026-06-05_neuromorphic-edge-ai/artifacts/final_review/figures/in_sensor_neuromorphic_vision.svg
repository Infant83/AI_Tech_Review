<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MoS2 뉴로모픽 시각 소자의 실험과 분류 모사</title>
  <desc id="desc">빛 입력, 주변 회로를 포함한 MoS2 LIF neuron, spike coding, HZO MoS2 FeFET synapse의 측정 특성을 소프트웨어 분류 모사로 연결한 기능 개념도. 점선 화살표는 모사로의 연결을 나타낸다.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf6; }
      .title { font: 800 52px "Segoe UI", "Malgun Gothic", sans-serif; fill: #121212; }
      .subtitle { font: 400 27px "Segoe UI", "Malgun Gothic", sans-serif; fill: #4c4c4c; }
      .card { stroke-width: 3; rx: 24; }
      .light { fill: #fff4d7; stroke: #c99328; }
      .neuron { fill: #e8f4f1; stroke: #2c8b79; }
      .code { fill: #e8eefb; stroke: #4c75b8; }
      .syn { fill: #f0e8f6; stroke: #7e529f; }
      .task { fill: #f7e7e7; stroke: #ad5656; }
      .h { font: 800 33px "Segoe UI", "Malgun Gothic", sans-serif; fill: #111; }
      .b { font: 500 25px "Segoe UI", "Malgun Gothic", sans-serif; fill: #2d3030; }
      .s { font: 500 21px "Segoe UI", "Malgun Gothic", sans-serif; fill: #5b5b5b; }
      .note { fill: #fff; stroke: #d7d8d1; stroke-width: 2; rx: 18; }
      .arrow { stroke: #303231; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .spike { fill: #dc842c; }
      .grid { fill: #d6c3e6; stroke: #7e529f; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#303231" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text x="70" y="82" class="title">빛에서 spike, spike에서 가중치로</text>
  <text x="72" y="128" class="subtitle">Wang et al. 2026: 소자·회로 실험과 소프트웨어 분류 모사의 연결</text>

  <rect x="76" y="210" width="190" height="150" class="card light"/>
  <text x="110" y="268" class="h">빛 입력</text>
  <text x="110" y="312" class="b">색 · 세기</text>

  <path d="M270 285 C310 248 350 228 392 224" class="arrow"/>
  <circle cx="316" cy="256" r="8" class="spike"/>
  <circle cx="344" cy="240" r="7" class="spike"/>
  <circle cx="374" cy="229" r="6" class="spike"/>

  <rect x="392" y="190" width="250" height="190" class="card neuron"/>
  <text x="430" y="250" class="h">MoS2</text>
  <text x="430" y="292" class="h">LIF neuron</text>
  <text x="416" y="338" class="s">비교기·reset 회로 포함</text>

  <path d="M642 285 C690 285 720 285 760 285" class="arrow"/>
  <circle cx="688" cy="285" r="6" class="spike"/>
  <circle cx="712" cy="285" r="6" class="spike"/>
  <circle cx="736" cy="285" r="6" class="spike"/>

  <rect x="760" y="190" width="210" height="190" class="card code"/>
  <text x="798" y="252" class="h">coding</text>
  <text x="798" y="300" class="b">rate</text>
  <text x="798" y="338" class="b">TTFS</text>

  <path d="M970 285 C1015 285 1042 285 1080 285" class="arrow"/>

  <rect x="1080" y="190" width="140" height="190" class="card syn"/>
  <text x="1112" y="246" class="h">FeFET</text>
  <text x="1112" y="288" class="b">synapse</text>
  <rect x="1115" y="318" width="18" height="18" class="grid"/>
  <rect x="1144" y="318" width="18" height="18" class="grid"/>
  <rect x="1173" y="318" width="18" height="18" class="grid"/>
  <rect x="1115" y="347" width="18" height="18" class="grid"/>
  <rect x="1144" y="347" width="18" height="18" class="grid"/>
  <rect x="1173" y="347" width="18" height="18" class="grid"/>

  <path d="M1150 380 C1128 455 980 488 810 500" class="arrow" stroke-dasharray="10 8"/>
  <rect x="420" y="476" width="390" height="116" class="card task"/>
  <text x="460" y="524" class="h">소프트웨어 분류</text>
  <text x="460" y="568" class="s">소자 특성 반영 · RGB와 객체 판별 모사</text>

  <rect x="112" y="616" width="1000" height="58" class="note"/>
  <text x="150" y="654" class="b">소자·회로 측정에서 분류 모사로 이어지는 기능 개념도입니다.</text>
</svg>
