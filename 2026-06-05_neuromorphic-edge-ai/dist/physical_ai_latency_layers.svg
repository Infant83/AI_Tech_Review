<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Physical AI latency layers</title>
  <desc id="desc">Physical AI systems split fast reflex loops, trained skill policies, and slower language planning layers by time scale.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8f4; }
      .title { font: 700 34px "Segoe UI", "Malgun Gothic", sans-serif; fill: #161616; }
      .subtitle { font: 400 18px "Segoe UI", "Malgun Gothic", sans-serif; fill: #4a4a4a; }
      .layerTitle { font: 700 23px "Segoe UI", "Malgun Gothic", sans-serif; fill: #111; }
      .time { font: 700 22px "Segoe UI", "Malgun Gothic", sans-serif; fill: #0f3f48; }
      .body { font: 400 17px "Segoe UI", "Malgun Gothic", sans-serif; fill: #2f2f2f; }
      .small { font: 400 14px "Segoe UI", "Malgun Gothic", sans-serif; fill: #555; }
      .axis { stroke: #2e2e2e; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #777; stroke-width: 2; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrowSoft); }
      .box { rx: 16; stroke-width: 2; }
      .fast { fill: #e8f4f1; stroke: #2f8b7b; }
      .skill { fill: #fff3df; stroke: #c97920; }
      .plan { fill: #f0e8f6; stroke: #7b4a9c; }
      .note { fill: #ffffff; stroke: #d8dad2; stroke-width: 1.5; rx: 16; }
      .neuro { fill: #153f3a; }
      .neuroText { font: 700 16px "Segoe UI", "Malgun Gothic", sans-serif; fill: #153f3a; }
      .tag { font: 700 14px "Segoe UI", "Malgun Gothic", sans-serif; fill: #fff; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2e2e2e"/>
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#777"/>
    </marker>
  </defs>
  <rect width="1280" height="720" class="bg"/>
  <text x="70" y="72" class="title">Physical AI는 하나의 속도로 움직이지 않습니다</text>
  <text x="70" y="106" class="subtitle">빠른 몸의 반응과 느린 언어 기반 판단은 같은 로봇 안에서도 서로 다른 계층으로 작동합니다.</text>

  <line x1="130" y1="590" x2="1120" y2="590" class="axis"/>
  <text x="132" y="626" class="small">빠른 센서-행동 루프</text>
  <text x="980" y="626" class="small">느린 계획·검증·대화</text>

  <rect x="95" y="180" width="300" height="320" class="box fast"/>
  <rect x="120" y="205" width="88" height="28" class="neuro" rx="14"/>
  <text x="138" y="225" class="tag">ms</text>
  <text x="120" y="272" class="layerTitle">반사 / 안전 루프</text>
  <text x="120" y="315" class="time">수 ms - 수십 ms</text>
  <text x="120" y="362" class="body">센서 이벤트 감지</text>
  <text x="120" y="390" class="body">충돌·미끄러짐·시야 변화</text>
  <text x="120" y="418" class="body">균형, 제동, 긴급 회피</text>
  <text x="120" y="462" class="small">뉴로모픽 event camera, in-sensor</text>
  <text x="120" y="484" class="small">computing이 먼저 들어갈 수 있는 자리</text>

  <rect x="490" y="150" width="300" height="350" class="box skill"/>
  <rect x="515" y="175" width="116" height="28" fill="#a65f13" rx="14"/>
  <text x="535" y="195" class="tag">policy</text>
  <text x="515" y="242" class="layerTitle">숙련 행동 정책</text>
  <text x="515" y="285" class="time">수십 ms - 수백 ms</text>
  <text x="515" y="332" class="body">차선 변경, 감속, 주차</text>
  <text x="515" y="360" class="body">보행·집기·부품 이동</text>
  <text x="515" y="388" class="body">학습된 action chunk 실행</text>
  <text x="515" y="432" class="small">Tesla FSD나 Atlas의 빠른 움직임은</text>
  <text x="515" y="454" class="small">대체로 이 계층과 제어기가 함께 만든다</text>

  <rect x="885" y="180" width="300" height="320" class="box plan"/>
  <rect x="910" y="205" width="116" height="28" fill="#654083" rx="14"/>
  <text x="930" y="225" class="tag">agent</text>
  <text x="910" y="272" class="layerTitle">언어 / 계획 / 도구 사용</text>
  <text x="910" y="315" class="time">수백 ms - 초 단위</text>
  <text x="910" y="362" class="body">작업 지시 이해</text>
  <text x="910" y="390" class="body">새로운 목표 분해</text>
  <text x="910" y="418" class="body">도구 호출, 사람과 대화</text>
  <text x="910" y="462" class="small">LLM/VLM/VLA가 맡기 좋은 자리지만</text>
  <text x="910" y="484" class="small">모든 관절을 직접 조종하지는 않는다</text>

  <path d="M395 335 C435 315 452 305 490 300" class="axis"/>
  <path d="M790 300 C830 305 848 315 885 335" class="axis"/>
  <path d="M1030 500 C1010 550 760 570 640 585" class="soft"/>
  <path d="M640 500 C610 545 340 570 245 585" class="soft"/>

  <rect x="205" y="518" width="850" height="138" class="note"/>
  <text x="235" y="554" class="neuroText" fill="#153f3a">읽는 법</text>
  <text x="235" y="590" class="body">빠른 동작은 지능이 없는 것이 아닙니다.</text>
  <text x="235" y="616" class="body">다만 언어 모델이 매 순간 직접 생각해서 움직이는 방식도 아닙니다.</text>
  <text x="235" y="642" class="body">뉴로모픽의 가치는 가장 빠르고 전력에 민감한 감각-반응 계층을 가볍게 만드는 데서 먼저 생깁니다.</text>
</svg>
