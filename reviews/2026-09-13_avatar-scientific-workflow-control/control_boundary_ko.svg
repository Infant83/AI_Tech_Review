<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc"><title id="title">빠른 실행은 규칙으로, 느린 판단은 제한적으로</title><desc id="desc">리뷰 제안 · Avatar의 구현 재현이 아님. 빠른 루프는 느린 검토를 기다리지 않는다</desc><metadata>Proposed / reviewer-constructed; inspired by arXiv:2609.10509v1; no measured data; CC BY-NC-SA 4.0</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#557477"/></marker></defs><rect width="960" height="700" fill="#f8f6ef"/><g font-family="Noto Sans CJK KR, Arial, sans-serif"><text x="480" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#182e36">빠른 실행은 규칙으로, 느린 판단은 제한적으로</text><text x="480" y="76" text-anchor="middle" font-size="16" font-weight="400" fill="#637579">리뷰 제안 · Avatar의 구현 재현이 아님</text><rect x="55" y="120" width="390" height="96" rx="12" fill="#dcedea" stroke="#adbab9"/><text x="250.0" y="153" text-anchor="middle" font-size="21" font-weight="700" fill="#182e36">빠른 실행</text><text x="250.0" y="185" text-anchor="middle" font-size="15" font-weight="400" fill="#182e36">의존관계 · 자원 제어 · 작업 실행</text><rect x="515" y="120" width="390" height="96" rx="12" fill="#e9eeee" stroke="#adbab9"/><text x="710.0" y="153" text-anchor="middle" font-size="21" font-weight="700" fill="#182e36">관측 이력</text><text x="710.0" y="185" text-anchor="middle" font-size="15" font-weight="400" fill="#182e36">실패 · 재시도 · 탐색 진전</text><path d="M445 168 H507" fill="none" stroke="#557477" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="108" text-anchor="middle" font-size="14" font-weight="400" fill="#182e36">상태와 결과 기록</text><rect x="515" y="300" width="390" height="96" rx="12" fill="#f7e6be" stroke="#adbab9"/><text x="710.0" y="333" text-anchor="middle" font-size="21" font-weight="700" fill="#182e36">느린 검토</text><text x="710.0" y="365" text-anchor="middle" font-size="15" font-weight="400" fill="#182e36">LLM 진단과 행동 제안</text><path d="M710 216 V291" fill="none" stroke="#557477" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="623.0" y="245" width="174" height="24" rx="4" fill="#f8f6ef"/><text x="710" y="262" text-anchor="middle" font-size="16" font-weight="400" fill="#182e36">예외만 전달</text><rect x="55" y="300" width="390" height="96" rx="12" fill="#e0e9ef" stroke="#adbab9"/><text x="250.0" y="333" text-anchor="middle" font-size="21" font-weight="700" fill="#182e36">행동 수용 검사</text><text x="250.0" y="365" text-anchor="middle" font-size="15" font-weight="400" fill="#182e36">상태 버전 · 권한 · 비용 · 과학 조건</text><path d="M515 348 H453" fill="none" stroke="#557477" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="290" text-anchor="middle" font-size="15" font-weight="400" fill="#182e36">제안</text><rect x="55" y="495" width="390" height="96" rx="12" fill="#dcedea" stroke="#adbab9"/><text x="250.0" y="528" text-anchor="middle" font-size="21" font-weight="700" fill="#182e36">허용된 행동만 실행</text><text x="250.0" y="560" text-anchor="middle" font-size="15" font-weight="400" fill="#182e36">재시도 · 다음 묶음 · 종료</text><path d="M250 396 V487" fill="none" stroke="#557477" stroke-width="2.5" marker-end="url(#arrow)"/><text x="218" y="451" text-anchor="middle" font-size="16" font-weight="400" fill="#182e36">통과</text><rect x="515" y="495" width="390" height="96" rx="12" fill="#f0e5df" stroke="#adbab9"/><text x="710.0" y="528" text-anchor="middle" font-size="21" font-weight="700" fill="#182e36">제안이 낡았거나 불충분하면</text><text x="710.0" y="560" text-anchor="middle" font-size="15" font-weight="400" fill="#182e36">폐기 · 규칙 유지 · 사람 검토</text><path d="M445 370 H478 V541 H507" fill="none" stroke="#557477" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="449.0" y="434" width="58" height="24" rx="4" fill="#f8f6ef"/><text x="478" y="451" text-anchor="middle" font-size="16" font-weight="400" fill="#182e36">보류</text><path d="M55 544 H25 V168 H47" fill="none" stroke="#557477" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="653" text-anchor="middle" font-size="21" font-weight="700" fill="#182e36">빠른 루프는 느린 검토를 기다리지 않는다</text></g></svg>
