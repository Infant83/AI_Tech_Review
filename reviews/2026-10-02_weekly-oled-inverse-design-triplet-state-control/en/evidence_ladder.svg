<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">이번 주 다섯 자료의 검증 대상과 증거 경계</title><desc id="desc">직접 OLED 소자부터 생성, 합성, 전자구조, QAOA까지의 근거 사다리</desc>
<rect width="1440" height="860" rx="30" fill="#0a1b2b"/><style>.h{font:700 36px system-ui;fill:#f1f8ff}.s{font:500 20px system-ui;fill:#b9cedd}.k{font:700 21px system-ui;fill:#66c7ff}.t{font:700 24px system-ui;fill:#fff}.b{font:500 19px system-ui;fill:#d4e2ec}.m{font:500 16px system-ui;fill:#a9becd}</style>
<text x="70" y="66" class="h">검증 사다리: 소자 근거에서 계산적 가능성까지</text><text x="70" y="103" class="s">원문 보고값이며 서로 다른 과제의 성능 순위가 아니다</text>
<g transform="translate(70 140)"><rect width="1300" height="120" rx="18" fill="#123b58" stroke="#55c5ff"/><text x="28" y="35" class="k">1 · 직접 OLED · 동료심사</text><text x="28" y="70" class="t">Bridged resonance blue OLED</text><text x="770" y="46" class="b">EQEmax 42.6%</text><text x="770" y="77" class="m">삼중항 준위 조절 → 고효율·협대역 발광</text><text x="28" y="102" class="m">합성·광물리·소자 검증. 장기 수명과 일반화는 별도 문제.</text></g>
<g transform="translate(105 275)"><rect width="1265" height="120" rx="18" fill="#12354a" stroke="#42b5cc"/><text x="28" y="35" class="k">2 · 분자 생성 · 프리프린트</text><text x="28" y="70" class="t">CAGenMol-2</text><text x="735" y="46" class="b">CrossDocked 30.2% → 70.8%</text><text x="735" y="77" class="m">ID/OOD 물성 hit 0.89/0.72</text><text x="28" y="102" class="m">drug-like SAFE 과제. OLED 여기상태·소자 검증 없음.</text></g>
<g transform="translate(140 410)"><rect width="1230" height="120" rx="18" fill="#163246" stroke="#59a7b6"/><text x="28" y="35" class="k">3 · 합성 가능성 · 로드맵</text><text x="28" y="70" class="t">Polymer informatics roadmap</text><text x="700" y="46" class="b">44 reaction chains · 32 classes</text><text x="700" y="77" class="m">잠재적 합성 가능 homopolymer &gt;289M</text><text x="28" y="102" class="m">선행 결과의 종합이며 새 폐루프 실험은 아니다.</text></g>
<g transform="translate(175 545)"><rect width="1195" height="120" rx="18" fill="#1b3040" stroke="#dfad55"/><text x="28" y="35" class="k">4 · 전자구조 · 무잡음 시뮬레이션</text><text x="28" y="70" class="t">Deep QSCI for benzene dimer</text><text x="665" y="46" class="b">40 → 20 qubits · 10⁴ shots/point</text><text x="665" y="77" class="m">−0.91 vs CCSD(T) −1.14 kcal/mol</text><text x="28" y="102" class="m">QPU·속도 우위·정량 정확도는 미입증.</text></g>
<g transform="translate(210 680)"><rect width="1160" height="120" rx="18" fill="#202d3b" stroke="#d28d56"/><text x="28" y="35" class="k">5 · 최적화 · 상태벡터 시뮬레이션</text><text x="28" y="70" class="t">Constraint-preserving QAOA</text><text x="630" y="46" class="b">mixer gates O(MN²) → O(MN)</text><text x="630" y="77" class="m">5–22 qubits · A100/PennyLane · no QPU</text><text x="28" y="102" class="m">문제별 landscape와 이산화 오차에 민감.</text></g></svg>
