<svg xmlns="http://www.w3.org/2000/svg" width="740" height="595" viewBox="0 0 740 595" role="img" aria-labelledby="title desc"><title id="title">직접 공유 후, 탐색 단계를 구분합니다</title><desc id="desc">고정 코드의 A–B–C 구성 · 전환 시점 P는 사전 설정</desc><metadata>Original reviewer reconstruction; source: https://github.com/chimie-paristech-CTM/TL-ChemBO/tree/a35276cdbf8b8c6dde4d71c224b918e04ddf52c2; not measured performance.</metadata><rect width="100%" height="100%" fill="#f0f3ed"/><g font-family="Arial, Noto Sans KR, sans-serif" fill="#182c31"><text x="35" y="46" font-size="27" fill="#182c31" text-anchor="start" font-weight="700">직접 공유 후, 탐색 단계를 구분합니다</text><text x="35" y="80" font-size="18" fill="#576b70" text-anchor="start" font-weight="400">고정 코드의 A–B–C 구성 · 전환 시점 P는 사전 설정</text><rect x="40" y="114" width="660" height="107" rx="8" fill="#dde9e3" stroke="#b3c4bd"/><text x="64" y="153" font-size="25" fill="#182c31" text-anchor="start" font-weight="700">A  과거 탐색</text><text x="64" y="190" font-size="21" fill="#182c31" text-anchor="start" font-weight="400">이전 화학 후보의 관측 기록</text><path d="M370 221 V247 m-6 -8 l6 8 l6 -8" fill="none" stroke="#577b76" stroke-width="2.5"/><rect x="40" y="259" width="660" height="107" rx="8" fill="#f2dfbd" stroke="#b3c4bd"/><text x="64" y="298" font-size="25" fill="#182c31" text-anchor="start" font-weight="700">B  새 후보의 초기 탐색</text><text x="64" y="335" font-size="21" fill="#182c31" text-anchor="start" font-weight="400">A를 재사용 · task parameter 없음 · P회</text><path d="M370 366 V392 m-6 -8 l6 8 l6 -8" fill="none" stroke="#577b76" stroke-width="2.5"/><rect x="40" y="404" width="660" height="107" rx="8" fill="#d9e9ea" stroke="#b3c4bd"/><text x="64" y="443" font-size="25" fill="#182c31" text-anchor="start" font-weight="700">C  새 후보의 나머지 탐색</text><text x="64" y="480" font-size="21" fill="#182c31" text-anchor="start" font-weight="400">A+B 이력: training · 이후 관측: test</text><text x="370" y="559" font-size="20" fill="#182c31" text-anchor="middle" font-weight="400">B도 C의 시작 시점에는 training 이력으로 들어갑니다.</text></g></svg>