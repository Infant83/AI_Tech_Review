<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
<title id="t">Proposed validation workflow for photoactive molecular inverse design</title>
<desc id="d">A proposed workflow links molecular generation, excited-state and aggregate calculations, failure discovery, and experimental or high-level validation.</desc>
<rect width="1200" height="470" rx="28" fill="#f7f3ea"/>
<text x="60" y="62" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#24363b">Proposed validation hierarchy</text>
<text x="60" y="94" font-family="Arial,sans-serif" font-size="16" fill="#59686b">Reviewer proposal; no selected paper demonstrates this end-to-end OLED workflow.</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#648086"/></marker></defs>
<g font-family="Arial,sans-serif">
<g transform="translate(55 160)"><rect width="200" height="145" rx="18" fill="#e7ece0" stroke="#6c7f4d"/><text x="20" y="35" font-size="18" font-weight="700" fill="#4d6033">1. Generate</text><text x="20" y="70" font-size="15" fill="#5d6f45">variable size + 3D</text><text x="20" y="96" font-size="15" fill="#5d6f45">scaffold / torsion control</text><text x="20" y="122" font-size="15" fill="#5d6f45">reaction-aware gate</text></g>
<g transform="translate(345 160)"><rect width="220" height="145" rx="18" fill="#e2e8ef" stroke="#526d8b"/><text x="20" y="35" font-size="18" font-weight="700" fill="#334c68">2. Electronic states</text><text x="20" y="70" font-size="15" fill="#48627d">S/T energies + ordering</text><text x="20" y="96" font-size="15" fill="#48627d">oscillator strength + SOC</text><text x="20" y="122" font-size="15" fill="#48627d">gradients / couplings</text></g>
<g transform="translate(655 160)"><rect width="220" height="145" rx="18" fill="#dcebe6" stroke="#3e716a"/><text x="20" y="35" font-size="18" font-weight="700" fill="#244d48">3. Environment</text><text x="20" y="70" font-size="15" fill="#365d58">dimer / aggregate</text><text x="20" y="96" font-size="15" fill="#365d58">dephasing observable</text><text x="20" y="122" font-size="15" fill="#365d58">host perturbation</text></g>
<g transform="translate(965 160)"><rect width="180" height="145" rx="18" fill="#f1e4cf" stroke="#987344"/><text x="20" y="35" font-size="18" font-weight="700" fill="#704d24">4. Falsify</text><text x="20" y="70" font-size="15" fill="#815f34">OOD splits</text><text x="20" y="96" font-size="15" fill="#815f34">failure hypotheses</text><text x="20" y="122" font-size="15" fill="#815f34">high-level / experiment</text></g>
<path d="M255 232 H335" stroke="#648086" stroke-width="3" marker-end="url(#a)"/><path d="M565 232 H645" stroke="#648086" stroke-width="3" marker-end="url(#a)"/><path d="M875 232 H955" stroke="#648086" stroke-width="3" marker-end="url(#a)"/>
<path d="M1055 320 C970 410 220 410 150 320" fill="none" stroke="#987344" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a)"/>
<text x="460" y="410" font-size="16" fill="#705a3f">failed cases return to the training and constraint ledger</text>
</g>
</svg>
