<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="TWO DISTINCT QUANTUM QUESTIONS">
<rect width="1200" height="690" rx="24" fill="#f6f3eb"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#526970" stroke-width="1.5"/></marker></defs>
<text x="48" y="57.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#183843">TWO DISTINCT QUANTUM QUESTIONS</text>
<text x="48" y="96.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526970">Classical records can support quantum inference; re-encoding does not restore the original state.</text>
<rect x="338" y="145" width="524" height="105" rx="16" fill="white" stroke="#177b80" stroke-width="2"/>
<text x="600.0" y="184.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#177b80">Detector event records</text>
<text x="600.0" y="221.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#526970">Momenta, directions, energies</text>
<line x1="475" y1="252" x2="300" y2="323" stroke="#526970" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="725" y1="252" x2="900" y2="323" stroke="#526970" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="67" y="329" width="466" height="141" rx="16" fill="white" stroke="#177b80" stroke-width="2"/>
<text x="300.0" y="368.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#177b80">INFER A SPIN STATE</text>
<text x="300.0" y="405.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#526970">Decay-angle distributions</text>
<text x="300.0" y="431.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#526970">Estimate a density matrix</text>
<rect x="667" y="329" width="466" height="141" rx="16" fill="white" stroke="#bc7937" stroke-width="2"/>
<text x="900.0" y="368.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#bc7937">ENCODE DATA INTO QUBITS</text>
<text x="900.0" y="405.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#526970">Choose features and circuit rotations</text>
<text x="900.0" y="431.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#526970">Train a quantum model</text>
<line x1="300" y1="473" x2="300" y2="514" stroke="#526970" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="900" y1="473" x2="900" y2="514" stroke="#526970" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="67" y="520" width="466" height="108" rx="16" fill="white" stroke="#177b80" stroke-width="2"/>
<text x="300.0" y="559.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#177b80">Correlation / entanglement test</text>
<text x="300.0" y="596.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#526970">Physics of the produced ensemble</text>
<rect x="667" y="520" width="466" height="108" rx="16" fill="white" stroke="#bc7937" stroke-width="2"/>
<text x="900.0" y="559.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#bc7937">Anomaly score / classification</text>
<text x="900.0" y="596.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#526970">Performance of a computation</text>
<text x="48" y="662.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526970">Neither route alone establishes a new particle or a practical quantum advantage.</text>
</svg>
