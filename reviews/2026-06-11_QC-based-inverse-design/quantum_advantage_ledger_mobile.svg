<svg xmlns="http://www.w3.org/2000/svg" width="620" height="2410" viewBox="0 0 620 2410" role="img" aria-labelledby="title desc">
  <title id="title">모바일용 표현 용량에서 종단 간 재료 이득까지의 양자 이득 장부</title>
  <desc id="desc">표현 용량, 알고리즘 이득, 종단 간 재료 이득을 세로로 구분한다. 상태 준비, 측정, 오류정정, 임베딩, 검증 비용이 앞 단계의 이득을 지울 수 있으며, 검증된 후보당 총시간과 총비용이 최선 고전 기준선보다 낮아야 실제 재료 이득으로 판정함을 보여준다.</desc>
  <defs>
    <style>
      .bg{fill:#faf8f2}.eyebrow{font:700 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:1.3px;fill:#684790}.title{font:700 35px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.subtitle{font:400 21px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#566172}.card{fill:#fff;stroke-width:3}.c1{stroke:#416b9a}.c2{stroke:#74519a}.c3{stroke:#28745a}.tag{font:800 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:1px}.head{font:700 29px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.body{font:400 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#4b5565}.formula{font:600 19px Consolas,'Segoe UI Symbol',monospace;fill:#293548}.sector{font:700 15px Consolas,'Segoe UI Symbol',monospace;fill:#416b9a}.gate{font:700 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif}.flow{stroke:#687386;stroke-width:5;fill:none}.notelabel{font:700 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#a44343}.ledger{fill:#fbeeee;stroke:#a44343;stroke-width:2.5}.ledgerhead{font:800 22px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#a44343}.leak{fill:#fff;stroke:#c96b6b;stroke-width:2}.leakhead{font:700 19px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#653333}.leakbody{font:400 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#6d5252}.verdict{fill:#edf7f1;stroke:#28745a;stroke-width:3}.verdicthead{font:800 23px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#1f654d}.verdictbody{font:600 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#354f46}.footer{font:700 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#354052}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#687386"/></marker>
  </defs>
  <rect class="bg" width="620" height="2410"/>

  <text class="eyebrow" x="42" y="48">QUANTUM ADVANTAGE LEDGER</text>
  <text class="title" x="42" y="94">‘큐비트로 표현’에서</text>
  <text class="title" x="42" y="136">‘재료개발 이득’까지</text>
  <text class="subtitle" x="42" y="177">각 단계는 다음 단계의 필요조건일 뿐입니다.</text>

  <rect class="card c1" x="42" y="215" rx="24" width="536" height="350"/>
  <text class="tag" x="74" y="255" fill="#416b9a">LEVEL 1 · REPRESENTATION</text>
  <text class="head" x="74" y="299">표현 용량</text>
  <text class="formula" x="74" y="342">n spin orbitals → n qubits</text>
  <text class="body" x="74" y="378">2<tspan baseline-shift="super" font-size="14">n</tspan>개 진폭을 양자 상태에 암묵적으로 보유</text>
  <text class="sector" x="74" y="404">고정 전자수 sector: C(n,N<tspan baseline-shift="sub" font-size="11">e</tspan>)</text>
  <line x1="74" y1="424" x2="546" y2="424" stroke="#d5d9df" stroke-width="2"/>
  <text class="gate" x="74" y="444" fill="#416b9a">통과 문</text>
  <text class="body" x="74" y="478">관심 상태를 효율적으로 준비하는가?</text>
  <text class="body" x="74" y="511">관심 관측량을 적은 측정으로 읽는가?</text>
  <text class="notelabel" x="74" y="545">상태 저장만으로 속도향상은 성립하지 않음</text>
  <path class="flow" d="M310 565 L310 607" marker-end="url(#arrow)"/>
  <text class="notelabel" x="330" y="593">충분조건 아님</text>

  <rect class="card c2" x="42" y="620" rx="24" width="536" height="365"/>
  <text class="tag" x="74" y="660" fill="#74519a">LEVEL 2 · ALGORITHM</text>
  <text class="head" x="74" y="704">알고리즘 이득</text>
  <text class="formula" x="74" y="747">QPE · Hamiltonian simulation</text>
  <text class="body" x="74" y="787">특정 오차 ε와 계 구조에서</text>
  <text class="body" x="74" y="819">유리할 수 있는 복잡도 경로</text>
  <line x1="74" y1="845" x2="546" y2="845" stroke="#d5d9df" stroke-width="2"/>
  <text class="gate" x="74" y="879" fill="#74519a">통과 문</text>
  <text class="body" x="74" y="913">상태 중첩·logical depth가 감당되는가?</text>
  <text class="body" x="74" y="946">같은 정확도에서 최선 고전법보다 싼가?</text>
  <text class="notelabel" x="74" y="975">점근 복잡도 ≠ 현재 wall-clock</text>
  <path class="flow" d="M310 985 L310 1027" marker-end="url(#arrow)"/>
  <text class="notelabel" x="330" y="1013">충분조건 아님</text>

  <rect class="card c3" x="42" y="1040" rx="24" width="536" height="365"/>
  <text class="tag" x="74" y="1080" fill="#28745a">LEVEL 3 · MATERIALS E2E</text>
  <text class="head" x="74" y="1124">종단 간 재료 이득</text>
  <text class="formula" x="74" y="1167">validated hits / total budget</text>
  <text class="body" x="74" y="1207">후보 생성부터 DFT·합성·소자 검증까지 포함</text>
  <line x1="74" y1="1235" x2="546" y2="1235" stroke="#d5d9df" stroke-width="2"/>
  <text class="gate" x="74" y="1269" fill="#28745a">통과 문</text>
  <text class="body" x="74" y="1303">시간·비용·에너지·hit rate가 좋아지는가?</text>
  <text class="body" x="74" y="1336">여러 배치에서 반복되고 실패도 추적되는가?</text>
  <text class="notelabel" x="74" y="1378">반복 가능한 차이만 재료 이득으로 채택</text>

  <rect class="ledger" x="42" y="1435" rx="22" width="536" height="650"/>
  <text class="ledgerhead" x="72" y="1478">이득이 새는 다섯 곳</text>
  <text class="notelabel" x="72" y="1511">각 비용을 wall-clock과 총자원 분모에 포함</text>

  <rect class="leak" x="72" y="1540" rx="15" width="476" height="88"/>
  <text class="leakhead" x="94" y="1572">상태 준비</text>
  <text class="leakbody" x="240" y="1572">낮은 overlap · 깊은 준비회로</text>
  <text class="leakbody" x="94" y="1605">반복 횟수와 성공확률을 악화</text>

  <rect class="leak" x="72" y="1645" rx="15" width="476" height="88"/>
  <text class="leakhead" x="94" y="1677">측정 · shots</text>
  <text class="leakbody" x="240" y="1677">Pauli 항·분산·통계 오차</text>
  <text class="leakbody" x="94" y="1710">판독량이 실험시간을 지배</text>

  <rect class="leak" x="72" y="1750" rx="15" width="476" height="88"/>
  <text class="leakhead" x="94" y="1782">오류정정</text>
  <text class="leakbody" x="240" y="1782">logical qubit · T-count</text>
  <text class="leakbody" x="94" y="1815">긴 결맞음 회로의 물리 자원</text>

  <rect class="leak" x="72" y="1855" rx="15" width="476" height="88"/>
  <text class="leakhead" x="94" y="1887">embedding · 변환</text>
  <text class="leakbody" x="285" y="1887">활성공간 · chain · SWAP</text>
  <text class="leakbody" x="94" y="1920">모델과 하드웨어 사이의 마찰</text>

  <rect class="leak" x="72" y="1960" rx="15" width="476" height="98"/>
  <text class="leakhead" x="94" y="1992">고정밀 · 실험 검증</text>
  <text class="leakbody" x="300" y="1992">합성 실패 · 소자 편차</text>
  <text class="leakbody" x="94" y="2025">실제 validated hit까지의 마지막 병목</text>

  <rect class="verdict" x="42" y="2120" rx="22" width="536" height="175"/>
  <text class="verdicthead" x="72" y="2162">채택 판정</text>
  <text class="verdictbody" x="72" y="2200">동일 정확도·동일 성공확률에서</text>
  <text class="verdictbody" x="72" y="2232">최선 고전 기준선보다 검증된 hit당</text>
  <text class="verdictbody" x="72" y="2264">총시간·총비용이 낮아야 합니다.</text>
  <text class="footer" x="42" y="2340">필요조건 ≠ 종단 이득</text>
  <text class="footer" x="42" y="2370">가장 큰 병목이 이득을 결정</text>
</svg>
