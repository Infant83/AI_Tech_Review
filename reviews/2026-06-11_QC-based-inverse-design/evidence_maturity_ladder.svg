<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">양자 재료 역설계의 E0에서 E4까지 증거 성숙도 사다리</title>
  <desc id="desc">이론과 자원 추정에서 소규모 실행, 통제 벤치마크, 전향적 고정밀 또는 실험 검증, 반복 가능한 종단 간 가치까지 다섯 단계의 증거 수준을 보여준다. 아래에는 NISQ, 초기 오류정정, 완전한 오류정정 체제에 대한 알고리즘 의존성을 별도 축으로 표시한다.</desc>
  <defs>
    <style>
      .bg{fill:#faf8f2}.eyebrow{font:700 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:2px;fill:#684790}.title{font:700 42px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.subtitle{font:400 24px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#566172}.step{fill:#fff;stroke-width:3}.e0{stroke:#8a94a3}.e1{stroke:#416b9a}.e2{stroke:#74519a}.e3{stroke:#aa681f}.e4{stroke:#28745a}.level{font:800 28px 'Segoe UI','Noto Sans KR',Arial,sans-serif}.head{font:700 26px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.body{font:400 19px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#4b5565}.pass{font:700 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif}.rise{stroke:#687386;stroke-width:5;fill:none}.panel{fill:#fff;stroke:#c7ced8;stroke-width:2}.regime{font:700 21px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.rbody{font:400 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#344054}.pill{font:700 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:.5px}.rule{font:700 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#a44343}.footer{font:700 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#354052}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#687386"/></marker>
  </defs>
  <rect class="bg" width="1440" height="1040"/>

  <text class="eyebrow" x="55" y="50">EVIDENCE MATURITY · E0 → E4</text>
  <text class="title" x="55" y="99">하드웨어가 좋아져도 증거 수준은 자동으로 오르지 않습니다</text>
  <text class="subtitle" x="55" y="137">알고리즘의 실행 가능성과 재료개발에서의 유효성은 서로 다른 질문입니다.</text>

  <rect class="step e0" x="55" y="330" rx="22" width="245" height="285"/>
  <text class="level" x="82" y="374" fill="#687386">E0</text>
  <text class="head" x="82" y="418">이론 · 자원 추정</text>
  <text class="body" x="82" y="458">복잡도 · qubit · depth</text>
  <text class="body" x="82" y="489">shots · 오류율 가정</text>
  <line x1="82" y1="520" x2="273" y2="520" stroke="#d2d7de" stroke-width="2"/>
  <text class="pass" x="82" y="554" fill="#687386">통과 기준</text>
  <text class="body" x="82" y="584">가정과 총비용 공개</text>

  <rect class="step e1" x="325" y="285" rx="22" width="245" height="285"/>
  <text class="level" x="352" y="329" fill="#416b9a">E1</text>
  <text class="head" x="352" y="373">소규모 실행 시연</text>
  <text class="body" x="352" y="413">작은 분자 · 작은 그래프</text>
  <text class="body" x="352" y="444">실기기 또는 logical demo</text>
  <line x1="352" y1="475" x2="543" y2="475" stroke="#d2d7de" stroke-width="2"/>
  <text class="pass" x="352" y="509" fill="#416b9a">통과 기준</text>
  <text class="body" x="352" y="539">실행 가능성 재현</text>

  <rect class="step e2" x="595" y="240" rx="22" width="245" height="285"/>
  <text class="level" x="622" y="284" fill="#74519a">E2</text>
  <text class="head" x="622" y="328">통제 벤치마크</text>
  <text class="body" x="622" y="368">강한 고전 기준선</text>
  <text class="body" x="622" y="399">동일 예산 · ablation</text>
  <line x1="622" y1="430" x2="813" y2="430" stroke="#d2d7de" stroke-width="2"/>
  <text class="pass" x="622" y="464" fill="#74519a">통과 기준</text>
  <text class="body" x="622" y="494">통계적 우위 또는 동등성</text>

  <rect class="step e3" x="865" y="195" rx="22" width="245" height="285"/>
  <text class="level" x="892" y="239" fill="#aa681f">E3</text>
  <text class="head" x="892" y="283">전향적 재료 검증</text>
  <text class="body" x="892" y="323">blind candidate 선정</text>
  <text class="body" x="892" y="354">고정밀 계산 · 실험 확인</text>
  <line x1="892" y1="385" x2="1083" y2="385" stroke="#d2d7de" stroke-width="2"/>
  <text class="pass" x="892" y="419" fill="#aa681f">통과 기준</text>
  <text class="body" x="892" y="449">validated hit 유지</text>

  <rect class="step e4" x="1135" y="150" rx="22" width="245" height="330"/>
  <text class="level" x="1162" y="194" fill="#28745a">E4</text>
  <text class="head" x="1162" y="238">반복 가능한</text>
  <text class="head" x="1162" y="272">E2E 가치</text>
  <text class="body" x="1162" y="313">여러 배치 · 시간 · 비용</text>
  <text class="body" x="1162" y="344">운영 안정성 · 재현성</text>
  <line x1="1162" y1="375" x2="1353" y2="375" stroke="#d2d7de" stroke-width="2"/>
  <text class="pass" x="1162" y="409" fill="#28745a">통과 기준</text>
  <text class="body" x="1162" y="439">가치와 한계가 반복</text>

  <path class="rise" d="M300 520 L325 475" marker-end="url(#arrow)"/>
  <path class="rise" d="M570 475 L595 430" marker-end="url(#arrow)"/>
  <path class="rise" d="M840 430 L865 385" marker-end="url(#arrow)"/>
  <path class="rise" d="M1110 385 L1135 340" marker-end="url(#arrow)"/>
  <text class="eyebrow" x="55" y="665" fill="#5b6473">COMPUTE REGIME / ALGORITHM DEPENDENCE · 증거 수준과 별도의 축</text>

  <rect class="panel" x="55" y="700" rx="22" width="1325" height="230"/>
  <rect x="78" y="725" rx="15" width="150" height="46" fill="#eaf1f9"/>
  <text class="pill" x="126" y="755" fill="#416b9a">NISQ</text>
  <text class="regime" x="255" y="754">변분형·얕은 회로 중심</text>
  <text class="rbody" x="585" y="754">VQE · quantum kernel/QNN · QAOA 소규모 실행</text>

  <line x1="78" y1="786" x2="1356" y2="786" stroke="#d8dde4" stroke-width="2"/>
  <rect x="78" y="802" rx="15" width="150" height="46" fill="#f3eef9"/>
  <text class="pill" x="101" y="832" fill="#74519a">EARLY FT</text>
  <text class="regime" x="255" y="831">작은 logical 회로·더 깊은 실행</text>
  <text class="rbody" x="585" y="831">small QPE · 오류정정 primitive · 더 엄격한 벤치마크</text>

  <line x1="78" y1="863" x2="1356" y2="863" stroke="#d8dde4" stroke-width="2"/>
  <rect x="78" y="879" rx="15" width="150" height="35" fill="#edf7f1"/>
  <text class="pill" x="137" y="903" fill="#28745a">FT</text>
  <text class="regime" x="255" y="903">장시간 coherence·대규모 logical 자원</text>
  <text class="rbody" x="650" y="903">production QPE · amplitude estimation</text>

  <text class="rule" x="55" y="963">
    <tspan x="55" dy="0">중요: NISQ·early FT·FT는 ‘무엇을 실행할 수 있는가’를 말할 뿐,</tspan>
    <tspan x="55" dy="28">E2·E3·E4를 보증하지 않습니다.</tspan>
  </text>
  <text class="footer" x="55" y="1026">채택 기준은 가장 높은 데모 단계가 아니라, 현재 claim을 지지하는 가장 높은 검증 단계입니다.</text>
</svg>
