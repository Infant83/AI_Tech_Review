<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1900" viewBox="0 0 620 1900" role="img" aria-labelledby="title desc">
  <title id="title">모바일용 후보 하나가 통과하는 재료 역설계 릴레이와 네 양자 전문 모듈</title>
  <desc id="desc">후보 하나에서 실험실 검증까지 이어지는 고전 재료 역설계 릴레이를 왼쪽에 끊김 없이 표시하고, 전자상태, 양자머신러닝, 분포와 표본추출, 이산결정의 네 양자 전문 모듈을 필요할 때만 연결되는 선택형 카드로 배치한다. 합성, 물성, 소자 실험과 실패 피드백은 고전 경로에 남는다.</desc>
  <defs>
    <style>
      .bg{fill:#faf8f2}.eyebrow{font:700 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:1.1px;fill:#684790}.title{font:700 35px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.subtitle{font:400 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#566172}.relay{stroke:#a66b3e;stroke-width:7;fill:none}.candidate{fill:#fff7ec;stroke:#a66b3e;stroke-width:3}.lab{fill:#edf7f1;stroke:#28745a;stroke-width:3}.station{fill:#fff;stroke-width:3}.s1{stroke:#416b9a}.s2{stroke:#28745a}.s3{stroke:#aa681f}.s4{stroke:#74519a}.tag{font:800 15px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:.8px}.head{font:700 27px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.method{font:700 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#344054}.role{font:400 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#4b5565}.optional{fill:#f3eef9}.optionaltext{font:700 15px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#684790}.plug{stroke:#74519a;stroke-width:4;stroke-dasharray:9 7}.port{fill:#faf8f2;stroke:#74519a;stroke-width:4}.paneltag{font:800 15px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:.8px}.panelhead{font:700 27px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.panelbody{font:400 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#4b5565}.node{fill:#f0c69d;stroke:#8b5732;stroke-width:2}.bond{stroke:#8b5732;stroke-width:4}.feedback{stroke:#a44343;stroke-width:4;stroke-dasharray:10 8;fill:none}.feedbacktext{font:700 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#a44343}.rule{fill:#f3eef9;stroke:#74519a;stroke-width:2.5}.rulehead{font:800 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#684790}.rulebody{font:700 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#354052}.small{font:700 16px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#687386}
    </style>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a44343"/></marker>
  </defs>
  <rect class="bg" width="620" height="1900"/>

  <text class="eyebrow" x="42" y="48">ONE CANDIDATE · FOUR SPECIALISTS</text>
  <text class="title" x="42" y="94">후보 하나가</text>
  <text class="title" x="42" y="136">재료 역설계 릴레이를 통과합니다</text>
  <text class="subtitle" x="42" y="176">양자 모듈은 네 전문 공정에만 선택적으로 투입됩니다.</text>
  <text class="subtitle" x="42" y="205">실험과 실패 피드백은 고전 경로에 남습니다.</text>

  <path class="relay" d="M55 315 L55 1500"/>
  <text class="small" x="82" y="236">구리색 선 · 끊기지 않는 고전 릴레이</text>

  <rect class="candidate" x="90" y="260" rx="24" width="460" height="150"/>
  <line class="bond" x1="126" y1="324" x2="160" y2="304"/>
  <line class="bond" x1="160" y1="304" x2="194" y2="330"/>
  <line class="bond" x1="160" y1="304" x2="162" y2="348"/>
  <circle class="node" cx="126" cy="324" r="9"/>
  <circle class="node" cx="160" cy="304" r="11"/>
  <circle class="node" cx="194" cy="330" r="8"/>
  <circle class="node" cx="162" cy="348" r="8"/>
  <text class="paneltag" x="230" y="300" fill="#8b5732">CANDIDATE TOKEN</text>
  <text class="panelhead" x="230" y="339">후보 1개</text>
  <text class="panelbody" x="230" y="371">구조 · 조성 · 공정 조건</text>
  <line class="plug" x1="55" y1="335" x2="90" y2="335"/>

  <rect class="station s1" x="90" y="455" rx="23" width="460" height="180"/>
  <text class="tag" x="118" y="491" fill="#416b9a">OPTIONAL 01 · 필요할 때 호출</text>
  <text class="head" x="118" y="532">전자상태</text>
  <text class="method" x="118" y="570">VQE · QPE</text>
  <text class="role" x="275" y="570">상관에너지 · 상태</text>
  <line class="plug" x1="55" y1="545" x2="90" y2="545"/>
  <circle class="port" cx="55" cy="545" r="9"/>

  <rect class="station s2" x="90" y="685" rx="23" width="460" height="180"/>
  <text class="tag" x="118" y="721" fill="#28745a">OPTIONAL 02 · 필요할 때 호출</text>
  <text class="head" x="118" y="762">학습</text>
  <text class="method" x="118" y="800">QML</text>
  <text class="role" x="275" y="800">물성 · 불확실성</text>
  <line class="plug" x1="55" y1="775" x2="90" y2="775"/>
  <circle class="port" cx="55" cy="775" r="9"/>

  <rect class="station s3" x="90" y="915" rx="23" width="460" height="180"/>
  <text class="tag" x="118" y="951" fill="#aa681f">OPTIONAL 03 · 필요할 때 호출</text>
  <text class="head" x="118" y="992">분포 · 샘플링</text>
  <text class="method" x="118" y="1030">QCBM · QBM · annealer</text>
  <text class="role" x="118" y="1063">후보 분포 · 표본</text>
  <line class="plug" x1="55" y1="1005" x2="90" y2="1005"/>
  <circle class="port" cx="55" cy="1005" r="9"/>

  <rect class="station s4" x="90" y="1145" rx="23" width="460" height="180"/>
  <text class="tag" x="118" y="1181" fill="#74519a">OPTIONAL 04 · 필요할 때 호출</text>
  <text class="head" x="118" y="1222">이산결정</text>
  <text class="method" x="118" y="1260">QUBO → QA · QAOA</text>
  <text class="role" x="350" y="1260">조성 · 배치 · 우선순위</text>
  <line class="plug" x1="55" y1="1235" x2="90" y2="1235"/>
  <circle class="port" cx="55" cy="1235" r="9"/>

  <rect class="lab" x="90" y="1380" rx="24" width="460" height="180"/>
  <path d="M126 1423 L166 1423 L161 1443 L181 1490 Q185 1505 168 1505 L124 1505 Q107 1505 111 1490 L131 1443Z" fill="#fff" stroke="#28745a" stroke-width="4"/>
  <path d="M118 1480 Q146 1468 174 1480 L181 1497 L111 1497Z" fill="#b7dfcc"/>
  <text class="paneltag" x="230" y="1424" fill="#28745a">CLASSICAL LAB</text>
  <text class="panelhead" x="230" y="1463">실험실 검증</text>
  <text class="panelbody" x="230" y="1498">합성 · 물성 · 소자</text>
  <text class="panelbody" x="230" y="1528">실패도 다음 후보의 데이터</text>
  <line class="plug" x1="55" y1="1470" x2="90" y2="1470"/>

  <path class="feedback" d="M320 1560 C320 1645 360 1645 580 1645 L580 315 C580 275 555 270 545 260" marker-end="url(#red)"/>
  <rect x="105" y="1660" rx="11" width="410" height="38" fill="#faf8f2"/>
  <text class="feedbacktext" x="133" y="1686">검증 결과 · 실패 원인 → 다음 후보</text>

  <rect class="rule" x="90" y="1740" rx="20" width="460" height="105"/>
  <text class="rulehead" x="120" y="1780">네 양자 모듈은 순차 관문이 아닙니다</text>
  <text class="rulebody" x="120" y="1815">필요한 전문 공정의 socket만 호출합니다</text>
  <text class="small" x="90" y="1880">실험실 검증 · feedback · 데이터 계보는 고전 기반으로 유지</text>
</svg>
