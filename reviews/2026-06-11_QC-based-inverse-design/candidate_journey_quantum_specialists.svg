<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">후보 하나가 통과하는 재료 역설계 릴레이와 네 양자 전문 모듈</title>
  <desc id="desc">구조, 조성, 공정 조건을 가진 후보 하나가 고전 재료 역설계 릴레이를 따라 실험실 검증으로 이동한다. 전자상태용 VQE와 QPE, 학습용 양자머신러닝, 분포와 표본추출용 QCBM·QBM·어닐러, 이산결정용 QUBO·QA·QAOA는 필요할 때만 연결되는 네 개의 독립 전문 모듈이다. 합성, 물성, 소자 실험과 실패 피드백은 고전 경로에 남는다.</desc>
  <defs>
    <style>
      .bg{fill:#faf8f2}.eyebrow{font:700 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:2px;fill:#684790}.title{font:700 43px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.subtitle{font:400 23px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#566172}.relay{stroke:#a66b3e;stroke-width:8;fill:none}.station{fill:#fff;stroke-width:3}.s1{stroke:#416b9a}.s2{stroke:#28745a}.s3{stroke:#aa681f}.s4{stroke:#74519a}.tag{font:800 15px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:1px}.head{font:700 29px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.method{font:700 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#344054}.role{font:400 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#4b5565}.optional{fill:#f3eef9}.optionaltext{font:700 15px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#684790}.plug{stroke-width:4;stroke-dasharray:9 7;fill:none}.plug1{stroke:#416b9a}.plug2{stroke:#28745a}.plug3{stroke:#aa681f}.plug4{stroke:#74519a}.port{stroke-width:4;fill:#faf8f2}.candidate{fill:#fff7ec;stroke:#a66b3e;stroke-width:3}.lab{fill:#edf7f1;stroke:#28745a;stroke-width:3}.paneltag{font:800 15px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:1px}.panelhead{font:700 28px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.panelbody{font:400 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#4b5565}.node{fill:#f0c69d;stroke:#8b5732;stroke-width:2}.bond{stroke:#8b5732;stroke-width:4}.feedback{stroke:#a44343;stroke-width:5;stroke-dasharray:12 9;fill:none}.feedbacktext{font:700 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#a44343}.rule{font:800 19px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#354052}.small{font:700 16px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#687386}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a66b3e"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a44343"/></marker>
  </defs>
  <rect class="bg" width="1440" height="900"/>

  <text class="eyebrow" x="55" y="50">ONE CANDIDATE · FOUR OPTIONAL QUANTUM SPECIALISTS</text>
  <text class="title" x="55" y="101">후보 하나가 재료 역설계 릴레이를 통과합니다</text>
  <text class="subtitle" x="55" y="140">양자 모듈은 네 전문 공정에만 선택적으로 투입되고, 실험실 검증과 실패 피드백은 고전 경로에 남습니다.</text>

  <path class="relay" d="M230 475 L1198 475" marker-end="url(#arrow)"/>
  <text class="small" x="540" y="462">CLASSICAL MATERIALS-DESIGN RELAY · 끊기지 않는 기본 경로</text>

  <rect class="candidate" x="55" y="355" rx="28" width="175" height="240"/>
  <text class="paneltag" x="79" y="390" fill="#8b5732">CANDIDATE TOKEN</text>
  <line class="bond" x1="105" y1="447" x2="142" y2="425"/>
  <line class="bond" x1="142" y1="425" x2="177" y2="452"/>
  <line class="bond" x1="142" y1="425" x2="145" y2="474"/>
  <circle class="node" cx="105" cy="447" r="10"/>
  <circle class="node" cx="142" cy="425" r="12"/>
  <circle class="node" cx="177" cy="452" r="9"/>
  <circle class="node" cx="145" cy="474" r="9"/>
  <text class="panelhead" x="79" y="525">후보 1개</text>
  <text class="panelbody" x="79" y="559">구조 · 조성</text>
  <text class="panelbody" x="79" y="584">공정 조건</text>

  <rect class="station s1" x="260" y="205" rx="23" width="220" height="220"/>
  <text class="tag" x="284" y="240" fill="#416b9a">OPTIONAL 01</text>
  <text class="head" x="284" y="283">전자상태</text>
  <text class="method" x="284" y="321">VQE · QPE</text>
  <text class="role" x="284" y="356">상관에너지 · 상태</text>
  <rect class="optional" x="282" y="377" rx="11" width="176" height="29"/>
  <text class="optionaltext" x="310" y="397">필요할 때 호출</text>
  <path class="plug plug1" d="M370 425 L370 463"/>
  <circle class="port s1" cx="370" cy="475" r="10"/>

  <rect class="station s2" x="495" y="525" rx="23" width="220" height="220"/>
  <text class="tag" x="519" y="560" fill="#28745a">OPTIONAL 02</text>
  <text class="head" x="519" y="603">학습</text>
  <text class="method" x="519" y="641">QML</text>
  <text class="role" x="519" y="676">물성 · 불확실성</text>
  <rect class="optional" x="517" y="697" rx="11" width="176" height="29"/>
  <text class="optionaltext" x="545" y="717">필요할 때 호출</text>
  <path class="plug plug2" d="M605 487 L605 525"/>
  <circle class="port s2" cx="605" cy="475" r="10"/>

  <rect class="station s3" x="730" y="205" rx="23" width="220" height="220"/>
  <text class="tag" x="754" y="240" fill="#aa681f">OPTIONAL 03</text>
  <text class="head" x="754" y="283">분포 · 샘플링</text>
  <text class="method" x="754" y="321">QCBM · QBM</text>
  <text class="role" x="754" y="348">annealer · 후보 표본</text>
  <rect class="optional" x="752" y="377" rx="11" width="176" height="29"/>
  <text class="optionaltext" x="780" y="397">필요할 때 호출</text>
  <path class="plug plug3" d="M840 425 L840 463"/>
  <circle class="port s3" cx="840" cy="475" r="10"/>

  <rect class="station s4" x="965" y="525" rx="23" width="220" height="220"/>
  <text class="tag" x="989" y="560" fill="#74519a">OPTIONAL 04</text>
  <text class="head" x="989" y="603">이산결정</text>
  <text class="method" x="989" y="641">QUBO → QA · QAOA</text>
  <text class="role" x="989" y="676">조성 · 배치 · 우선순위</text>
  <rect class="optional" x="987" y="697" rx="11" width="176" height="29"/>
  <text class="optionaltext" x="1015" y="717">필요할 때 호출</text>
  <path class="plug plug4" d="M1075 487 L1075 525"/>
  <circle class="port s4" cx="1075" cy="475" r="10"/>

  <rect class="lab" x="1200" y="355" rx="28" width="185" height="240"/>
  <text class="paneltag" x="1224" y="390" fill="#28745a">CLASSICAL LAB</text>
  <path d="M1260 421 L1304 421 L1298 446 L1320 500 Q1325 518 1305 518 L1259 518 Q1239 518 1244 500 L1266 446Z" fill="#fff" stroke="#28745a" stroke-width="4"/>
  <path d="M1254 489 Q1282 476 1310 489 L1318 508 L1246 508Z" fill="#b7dfcc"/>
  <circle cx="1270" cy="480" r="5" fill="#28745a"/>
  <circle cx="1298" cy="493" r="4" fill="#28745a"/>
  <text class="panelhead" x="1224" y="548">실험실 검증</text>
  <text class="panelbody" x="1224" y="578">합성 · 물성 · 소자</text>

  <path class="feedback" d="M1292 595 L1292 785 C1292 840 142 840 142 605" marker-end="url(#red)"/>
  <rect x="430" y="785" rx="12" width="580" height="38" fill="#faf8f2"/>
  <text class="feedbacktext" x="486" y="811">검증 결과 · 실패 원인 · 적용 가능 영역 → 다음 후보</text>
  <text class="rule" x="55" y="873">읽는 법 · 네 전문 모듈은 순차 관문이 아닙니다 · 필요한 socket만 호출합니다</text>
</svg>
