<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">VQE와 QPE의 실행 메커니즘과 지배 비용 비교</title>
  <desc id="desc">VQE는 기준 상태에 매개변수 회로를 적용하고 묶음 Pauli 측정으로 에너지를 추정한 뒤 고전 최적화기로 매개변수를 갱신하는 반복 과정이다. QPE는 고유상태와 중첩이 있는 초기 상태에 제어된 시간 진화를 적용하고 역 QFT로 위상을 판독해 에너지를 얻는다. VQE는 짧은 회로와 많은 샷, QPE는 긴 결맞음 회로와 오류정정이 지배 비용이며, QFT는 위상 판독 수단이지 DFT 대체물이 아니다.</desc>
  <defs>
    <style>
      .bg{fill:#faf8f2}.eyebrow{font:700 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:2px;fill:#684790}.title{font:700 42px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.subtitle{font:400 23px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#566172}.panel{stroke-width:3}.vqe{fill:#eef4fb;stroke:#416b9a}.qpe{fill:#f3eef9;stroke:#74519a}.tag{font:800 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:1.2px}.panelhead{font:700 31px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.formula{font:600 18px Consolas,'Segoe UI Symbol',monospace;fill:#293548}.body{font:400 19px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#4b5565}.box{fill:#fff;stroke-width:2}.boxhead{font:700 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.boxbody{font:400 16px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#4b5565}.flowb{stroke:#416b9a;stroke-width:4;fill:none}.flowp{stroke:#74519a;stroke-width:4;fill:none}.loop{stroke:#a44343;stroke-width:4;stroke-dasharray:10 8;fill:none}.looplabel{font:700 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#a44343}.cost{font:800 19px 'Segoe UI','Noto Sans KR',Arial,sans-serif}.ledger{fill:#fff;stroke:#c8ced8;stroke-width:2.5}.lhead{font:800 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.lbody{font:400 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#4b5565}.warn{fill:#fff4e5;stroke:#aa681f;stroke-width:2.5}.warnhead{font:800 21px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#8c571c}.warnbody{font:600 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#5f4a31}.footer{font:700 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#354052}
    </style>
    <marker id="bluearrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#416b9a"/></marker>
    <marker id="purplearrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#74519a"/></marker>
    <marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a44343"/></marker>
  </defs>
  <rect class="bg" width="1440" height="1080"/>

  <text class="eyebrow" x="55" y="50">VQE vs QPE · WHAT THE QPU ACTUALLY DOES</text>
  <text class="title" x="55" y="99">같은 해밀토니안을 풀어도 비용이 쌓이는 위치는 다릅니다</text>
  <text class="subtitle" x="55" y="137">VQE는 측정과 고전 반복을, QPE는 초기상태 중첩과 긴 결맞음 진화를 먼저 설계합니다.</text>

  <rect class="panel vqe" x="55" y="185" rx="24" width="650" height="585"/>
  <text class="tag" x="88" y="228" fill="#416b9a">VARIATIONAL QUANTUM EIGENSOLVER</text>
  <text class="panelhead" x="88" y="273">VQE · 짧은 회로 × 많은 shots</text>
  <text class="formula" x="88" y="310">min<tspan baseline-shift="sub" font-size="13">θ</tspan> E(θ)=Σ<tspan baseline-shift="sub" font-size="13">j</tspan> c<tspan baseline-shift="sub" font-size="13">j</tspan>〈ψ(θ)|P<tspan baseline-shift="sub" font-size="13">j</tspan>|ψ(θ)〉</text>

  <rect class="box" x="88" y="350" rx="15" width="130" height="130" stroke="#416b9a"/>
  <text class="boxhead" x="107" y="382">기준 상태</text>
  <text class="formula" x="107" y="418">|φ<tspan baseline-shift="sub" font-size="12">ref</tspan>〉</text>
  <text class="boxbody" x="107" y="452">HF · multi-ref</text>

  <rect class="box" x="239" y="350" rx="15" width="130" height="130" stroke="#416b9a"/>
  <text class="boxhead" x="258" y="382">U(θ)</text>
  <text class="boxbody" x="258" y="416">ansatz 회로</text>
  <text class="boxbody" x="258" y="444">짧은 depth</text>

  <rect class="box" x="390" y="350" rx="15" width="130" height="130" stroke="#416b9a"/>
  <text class="boxhead" x="409" y="382">Pauli 측정</text>
  <text class="boxbody" x="409" y="416">commuting</text>
  <text class="boxbody" x="409" y="444">group × shots</text>

  <rect class="box" x="541" y="350" rx="15" width="130" height="130" stroke="#416b9a"/>
  <text class="boxhead" x="560" y="382">에너지</text>
  <text class="formula" x="560" y="418">E(θ)</text>
  <text class="boxbody" x="560" y="452">통계 오차 포함</text>

  <path class="flowb" d="M218 415 L231 415" marker-end="url(#bluearrow)"/>
  <path class="flowb" d="M369 415 L382 415" marker-end="url(#bluearrow)"/>
  <path class="flowb" d="M520 415 L533 415" marker-end="url(#bluearrow)"/>

  <rect class="box" x="210" y="540" rx="17" width="340" height="105" stroke="#a44343"/>
  <text class="boxhead" x="236" y="577">고전 optimizer</text>
  <text class="body" x="236" y="609">E(θ), gradient/noise → θ 갱신</text>
  <path class="loop" d="M606 480 C606 570 566 592 550 592" marker-end="url(#redarrow)"/>
  <path class="loop" d="M210 592 C150 592 150 515 304 515 L304 488" marker-end="url(#redarrow)"/>
  <text class="looplabel" x="88" y="683">반복 지배 비용: Pauli groups × shots × optimizer iterations</text>
  <text class="body" x="88" y="722">얕은 회로의 장점은 측정 분산·noise·최적화 지형이 상쇄할 수 있습니다.</text>

  <rect class="panel qpe" x="735" y="185" rx="24" width="650" height="585"/>
  <text class="tag" x="768" y="228" fill="#74519a">QUANTUM PHASE ESTIMATION</text>
  <text class="panelhead" x="768" y="273">QPE · 긴 결맞음 회로 + 오류정정</text>
  <text class="formula" x="768" y="310">|ψ<tspan baseline-shift="sub" font-size="13">0</tspan>〉=Σ<tspan baseline-shift="sub" font-size="13">k</tspan> α<tspan baseline-shift="sub" font-size="13">k</tspan>|ψ<tspan baseline-shift="sub" font-size="13">k</tspan>〉</text>

  <rect class="box" x="768" y="350" rx="15" width="135" height="150" stroke="#74519a"/>
  <text class="boxhead" x="787" y="382">초기 상태</text>
  <text class="boxbody" x="787" y="416">목표 고유상태와</text>
  <text class="boxbody" x="787" y="442">중첩 α<tspan baseline-shift="sub" font-size="11">k</tspan></text>
  <text class="boxbody" x="787" y="474">준비비용 포함</text>

  <rect class="box" x="921" y="350" rx="15" width="145" height="150" stroke="#74519a"/>
  <text class="boxhead" x="940" y="382">controlled-U<tspan baseline-shift="super" font-size="12">2ʲ</tspan></text>
  <text class="formula" x="940" y="418">e<tspan baseline-shift="super" font-size="12">−iHt·2ʲ</tspan></text>
  <text class="boxbody" x="940" y="450">phase kickback</text>
  <text class="boxbody" x="940" y="476">긴 logical depth</text>

  <rect class="box" x="1084" y="350" rx="15" width="135" height="150" stroke="#74519a"/>
  <text class="boxhead" x="1103" y="382">역 QFT</text>
  <text class="boxbody" x="1103" y="416">위상 레지스터</text>
  <text class="boxbody" x="1103" y="442">판독 변환</text>
  <text class="boxbody" x="1103" y="474">readout only</text>

  <rect class="box" x="1237" y="350" rx="15" width="115" height="150" stroke="#74519a"/>
  <text class="boxhead" x="1256" y="382">결과</text>
  <text class="formula" x="1256" y="418">E<tspan baseline-shift="sub" font-size="12">k</tspan></text>
  <text class="boxbody" x="1256" y="450">성공확률</text>
  <text class="formula" x="1256" y="478">|α<tspan baseline-shift="sub" font-size="12">k</tspan>|²</text>

  <path class="flowp" d="M903 425 L913 425" marker-end="url(#purplearrow)"/>
  <path class="flowp" d="M1066 425 L1076 425" marker-end="url(#purplearrow)"/>
  <path class="flowp" d="M1219 425 L1229 425" marker-end="url(#purplearrow)"/>

  <rect class="box" x="850" y="550" rx="17" width="420" height="95" stroke="#74519a"/>
  <text class="boxhead" x="876" y="584">정확도 ε를 얻는 자원</text>
  <text class="body" x="876" y="617">state overlap · simulation queries · logical T-count</text>
  <text class="looplabel" x="768" y="683">반복 지배 비용: 성공확률 |α<tspan baseline-shift="sub" font-size="12">k</tspan>|²와 긴 오류정정 진화</text>
  <text class="body" x="768" y="722">좋은 복잡도 경로도 상태 준비가 어렵거나 overlap이 작으면 실행비용이 커집니다.</text>

  <rect class="ledger" x="55" y="810" rx="22" width="1330" height="150"/>
  <text class="lhead" x="85" y="852">지배 비용 비교</text>
  <line x1="85" y1="872" x2="1355" y2="872" stroke="#d4d9e0" stroke-width="2"/>
  <text class="cost" x="85" y="906" fill="#416b9a">VQE</text>
  <text class="lbody" x="170" y="906">circuit depth는 짧지만</text>
  <text class="lbody" x="385" y="906">측정 그룹 × shots × 최적화 반복</text>
  <text class="lbody" x="775" y="906">정확도·noise·관측량 수에 민감</text>
  <text class="cost" x="85" y="940" fill="#74519a">QPE</text>
  <text class="lbody" x="170" y="940">shot 수보다</text>
  <text class="lbody" x="385" y="940">상태 준비 × coherent evolution × 오류정정</text>
  <text class="lbody" x="825" y="940">overlap·ε·논리 자원에 민감</text>

  <rect class="warn" x="55" y="985" rx="20" width="1330" height="58"/>
  <text class="warnhead" x="85" y="1022">QFT는 위상 판독 수단입니다.</text>
  <text class="warnbody" x="385" y="1022">DFT·SCF·전자밀도 계산을 통째로 대체하는 별도 전자구조 알고리즘이 아닙니다.</text>
  <text class="footer" x="55" y="1071">선택 기준 · 정확도 · overlap · 관측량 · 총자원</text>
</svg>
