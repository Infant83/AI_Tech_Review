  <rect class="rule" x="300" y="975" rx="20" width="840" height="67"/>
  <text class="rulehead" x="332" y="1017">HYBRID MODULAR REPLACEMENT</text>
  <text class="rulebody" x="710" y="1017">한 번에 하나의 socket만 같은 입출력·예산으로 비교</text>
  <text class="footer" x="55" y="1060">채택 규칙 · 고전 기준선을 이긴 모듈만 남기고, 합성·실험 검증은 공통 종착점으로 유지</text>
