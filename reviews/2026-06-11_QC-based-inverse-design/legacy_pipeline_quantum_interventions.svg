  <text class="branchtext" x="141" y="568">BRANCH → 02 · 04</text>
  <rect class="branchplate" x="807" y="550" rx="10" width="160" height="26"/>
  <text class="branchtext" x="821" y="568">BRANCH → 02 · 05</text>

  <rect x="45" y="582" rx="8" width="765" height="36" fill="#faf8f2"/>
