  <text class="stagehead" x="460" y="729">물성 평가</text>
  <text class="stagebody" x="460" y="774">DFT · 양자화학</text>
  <text class="stagebody" x="460" y="802">MD · high-fidelity</text>

  <rect class="stage" x="631" y="660" rx="18" width="178" height="180"/>
  <text class="stagenum" x="652" y="693">04 · LEARN</text>
  <text class="stagehead" x="652" y="729">대리모델</text>
  <text class="stagehead" x="652" y="756">불확실성</text>
  <text class="stagebody" x="652" y="790">GNN · GP · kernel</text>
  <text class="stagebody" x="652" y="816">보정 · 적용영역</text>

  <rect class="stage" x="823" y="660" rx="18" width="178" height="180"/>
  <text class="stagenum" x="844" y="693">05 · SELECT</text>
  <text class="stagehead" x="844" y="729">다목적 선별</text>
  <text class="stagehead" x="844" y="756">최적화</text>
  <text class="stagebody" x="844" y="790">Pareto · BO · CP-SAT</text>
  <text class="stagebody" x="844" y="816">MILP · SA/Tabu</text>

  <rect class="stage" x="1015" y="660" rx="18" width="178" height="180"/>
