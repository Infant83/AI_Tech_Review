  <text class="stagehead" x="268" y="756">생성</text>
  <text class="stagebody" x="268" y="790">enumeration · VAE</text>
  <text class="stagebody" x="268" y="816">diffusion · 규칙</text>

  <rect class="stage" x="439" y="660" rx="18" width="178" height="180"/>
