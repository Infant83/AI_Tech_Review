  <text class="stagehead" x="1036" y="729">합성 · 실험</text>
  <text class="stagebody" x="1036" y="774">합성 가능성</text>
  <text class="stagebody" x="1036" y="802">물성 · 소자 측정</text>

  <rect class="stage" x="1207" y="660" rx="18" width="178" height="180"/>
