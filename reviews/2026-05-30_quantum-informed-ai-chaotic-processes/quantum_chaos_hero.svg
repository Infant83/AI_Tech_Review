<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Quantum prior for chaotic flow forecasting</title>
  <desc id="desc">A magazine-style hero illustration showing a turbulent flow field, a compact quantum circuit prior, and a classical predictor stabilizing a long rollout.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="0.45" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#059669"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity="0.42" filter="url(#soft)">
    <path d="M70 530 C200 390 340 615 470 450 C590 300 720 530 880 330 C1010 165 1130 265 1210 150" fill="none" stroke="#38bdf8" stroke-width="26"/>
    <path d="M40 400 C170 240 315 475 470 320 C610 180 720 415 910 230 C1030 112 1155 190 1240 82" fill="none" stroke="#fb923c" stroke-width="18"/>
  </g>
  <g fill="none" stroke="url(#flow)" stroke-width="5" opacity="0.9">
    <path d="M72 545 C195 405 340 620 468 455 C600 285 720 540 884 330 C1015 160 1130 265 1212 152"/>
    <path d="M56 438 C170 280 312 492 472 330 C612 190 732 430 908 232 C1040 90 1160 196 1232 88"/>
    <path d="M95 610 C240 520 315 675 480 535 C626 410 795 650 940 455 C1044 318 1160 340 1242 262"/>
  </g>
  <g transform="translate(130 116)">
    <rect x="0" y="0" width="420" height="248" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="34" y="52" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Chaotic flow data</text>
    <text x="34" y="84" font-family="Arial, sans-serif" font-size="18" fill="#475569">tiny errors grow, but statistics remain</text>
    <g transform="translate(38 116)" fill="none" stroke-width="4">
      <path d="M0 68 C58 -10 96 126 158 46 C224 -37 272 129 338 31" stroke="#2563eb"/>
      <path d="M0 106 C64 24 110 154 174 76 C248 -10 287 150 344 74" stroke="#dc2626" opacity="0.75"/>
    </g>
  </g>
  <g transform="translate(614 132)">
    <rect x="0" y="0" width="230" height="220" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="38" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14532d">Q-Prior</text>
    <text x="32" y="78" font-family="Arial, sans-serif" font-size="16" fill="#166534">compact invariant statistics</text>
    <g stroke="#16a34a" stroke-width="4" fill="none" transform="translate(36 112)">
      <line x1="0" y1="0" x2="152" y2="0"/>
      <line x1="0" y1="46" x2="152" y2="46"/>
      <circle cx="32" cy="0" r="10" fill="#bbf7d0"/>
      <circle cx="86" cy="0" r="10" fill="#bbf7d0"/>
      <circle cx="128" cy="0" r="10" fill="#bbf7d0"/>
      <circle cx="58" cy="46" r="10" fill="#bbf7d0"/>
      <circle cx="112" cy="46" r="10" fill="#bbf7d0"/>
      <path d="M32 0 C48 18 45 28 58 46"/>
      <path d="M86 0 C103 18 98 28 112 46"/>
      <path d="M128 0 C116 18 125 28 112 46"/>
    </g>
  </g>
  <g transform="translate(908 116)">
    <rect x="0" y="0" width="258" height="248" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="34" y="52" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#7c2d12">Classical rollout</text>
    <text x="34" y="84" font-family="Arial, sans-serif" font-size="17" fill="#9a3412">long forecasts checked by physics</text>
    <g transform="translate(36 120)" font-family="Arial, sans-serif" font-size="16" fill="#111827">
      <rect x="0" y="0" width="186" height="38" rx="8" fill="#ffedd5" stroke="#fb923c"/>
      <text x="20" y="25">PDF / spectrum</text>
      <rect x="0" y="56" width="186" height="38" rx="8" fill="#ffedd5" stroke="#fb923c"/>
      <text x="20" y="81">autocorrelation</text>
    </g>
  </g>
  <g stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M552 236 H606"/>
    <path d="M846 236 H900"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="128" y="610" font-size="38" font-weight="800">Quantum-informed AI for chaotic processes</text>
    <text x="130" y="648" font-size="22" fill="#334155">Can a quantum-generated prior</text>
    <text x="130" y="678" font-size="22" fill="#334155">steady long scientific ML forecasts?</text>
  </g>
