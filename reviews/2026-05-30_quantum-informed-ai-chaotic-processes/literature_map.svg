<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="-150 -25 1280 470" role="img" aria-labelledby="title desc">
  <title id="title">Literature map</title>
  <desc id="desc">Reading map from classical reservoir computing to quantum reservoir computing and QIML prior-based methods.</desc>
  <rect width="980" height="420" fill="#f8fafc"/>
  <text x="42" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Reading map for quantum-informed chaotic AI</text>
  <g font-family="Arial, sans-serif" font-size="17" fill="#111827">
    <rect x="56" y="105" width="250" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="86" y="143" font-size="20" font-weight="700">Classical baseline</text>
    <text x="86" y="183">Pathak PRL 2018</text>
    <text x="86" y="214">Pathak Chaos 2018</text>
    <text x="86" y="245">Reservoir computing</text>
    <text x="86" y="276">Hybrid forecasting</text>
    <rect x="365" y="105" width="250" height="210" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="395" y="143" font-size="20" font-weight="700">Quantum reservoir</text>
    <text x="395" y="183">Fujii 2017</text>
    <text x="395" y="214">Natural QRC 2022</text>
    <text x="395" y="245">Measurements and</text>
    <text x="395" y="276">oscillator hardware</text>
    <rect x="674" y="105" width="250" height="210" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="704" y="143" font-size="20" font-weight="700">Quantum-informed AI</text>
    <text x="704" y="183">Wang et al. 2026</text>
    <text x="704" y="214">Q-Prior</text>
    <text x="704" y="245">Chaotic flows</text>
    <text x="704" y="276">Practical advantage?</text>
  </g>
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M309 210 H360"/>
    <path d="M618 210 H669"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <text x="58" y="360" font-family="Arial, sans-serif" font-size="18" fill="#475569">Compare QIML with strong</text>
  <text x="58" y="390" font-family="Arial, sans-serif" font-size="18" fill="#475569">classical and QRC baselines.</text>
</svg>
