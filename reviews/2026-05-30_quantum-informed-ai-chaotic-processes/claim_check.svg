<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="-150 -55 1280 470" role="img" aria-labelledby="title desc">
  <title id="title">Claim check for practical quantum advantage</title>
  <desc id="desc">Checklist for validating quantum advantage claims in chaotic forecasting papers.</desc>
  <rect width="980" height="360" fill="#f8fafc"/>
  <text x="42" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">How to read a quantum advantage claim</text>
  <g font-family="Arial, sans-serif" font-size="18">
    <rect x="56" y="100" width="410" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="84" y="141" fill="#111827" font-weight="700">Metric: accuracy, spectrum, stability</text>
    <rect x="514" y="100" width="410" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="542" y="141" fill="#111827" font-weight="700">Baseline: strong classical comparator</text>
    <rect x="56" y="196" width="410" height="66" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="84" y="237" fill="#111827" font-weight="700">Cost: shots, queue, training, memory</text>
    <rect x="514" y="196" width="410" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="542" y="237" fill="#111827" font-weight="700">Scaling: data size and system dimension</text>
  </g>
  <text x="58" y="315" font-family="Arial, sans-serif" font-size="18" fill="#475569">Check improvement, cost,</text>
  <text x="58" y="345" font-family="Arial, sans-serif" font-size="18" fill="#475569">hardware use, reproducibility.</text>
</svg>
