<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="-150 -55 1280 470" role="img" aria-labelledby="title desc">
  <title id="title">Metrics for chaotic forecasting</title>
  <desc id="desc">Chaotic forecasting needs trajectory, distribution, spectrum, autocorrelation, and attractor statistics checks.</desc>
  <rect width="980" height="360" fill="#f8fafc"/>
  <text x="42" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">What matters after trajectories diverge</text>
  <line x1="105" y1="185" x2="875" y2="185" stroke="#94a3b8" stroke-width="3"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#111827">
    <circle cx="150" cy="185" r="54" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="150" y="179" font-size="17" font-weight="700">Lyapunov</text>
    <text x="150" y="202" font-size="15">horizon</text>
    <circle cx="322" cy="185" r="54" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/>
    <text x="322" y="179" font-size="17" font-weight="700">State</text>
    <text x="322" y="202" font-size="15">density</text>
    <circle cx="494" cy="185" r="54" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="494" y="179" font-size="17" font-weight="700">Energy</text>
    <text x="494" y="202" font-size="15">spectrum</text>
    <circle cx="666" cy="185" r="54" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="666" y="179" font-size="17" font-weight="700">Auto</text>
    <text x="666" y="202" font-size="15">correlation</text>
    <circle cx="838" cy="185" r="54" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="838" y="179" font-size="17" font-weight="700">Attractor</text>
    <text x="838" y="202" font-size="15">statistics</text>
  </g>
  <text x="88" y="290" font-family="Arial, sans-serif" font-size="18" fill="#475569">Long rollouts must still look</text>
  <text x="88" y="320" font-family="Arial, sans-serif" font-size="18" fill="#475569">like the same physical system.</text>
</svg>
