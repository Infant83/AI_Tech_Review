<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Hallucination 평가 층위</title>
  <desc id="desc">사실성, 근거 연결, 불확실성 보류, 운영 신뢰가 서로 다른 평가 층위임을 보여주는 도식</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf6}
      .ring1{fill:#f1e8d7;stroke:#c8a86a;stroke-width:2}
      .ring2{fill:#e5f0ee;stroke:#2f6f73;stroke-width:2}
      .ring3{fill:#ebe6f3;stroke:#6b4f8a;stroke-width:2}
      .ring4{fill:#f3e1df;stroke:#9a3f3f;stroke-width:2}
      .text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24313f;text-anchor:middle}
      .left{text-anchor:start}
      .title{font-size:25px;font-weight:700}
      .label{font-size:21px;font-weight:700}
      .body{font-size:16px}
      .note{font-size:15px;fill:#5d6670}
    </style>
  </defs>
  <rect class="bg" width="960" height="500" rx="22"/>
  <text x="480" y="52" class="text title">Hallucination은 여러 층위로 나누어 봅니다</text>
  <text x="480" y="82" class="text note">GPT-5.5는 더 많이 맞히면서도, 모를 때 멈추는 능력에서는 별도 검증이 필요할 수 있습니다.</text>
  <circle cx="480" cy="278" r="178" class="ring1"/>
  <circle cx="480" cy="278" r="136" class="ring2"/>
  <circle cx="480" cy="278" r="94" class="ring3"/>
  <circle cx="480" cy="278" r="52" class="ring4"/>
  <text x="480" y="152" class="text label">운영 신뢰</text>
  <text x="480" y="195" class="text label">근거 연결</text>
  <text x="480" y="248" class="text label">사실 정확도</text>
  <text x="480" y="284" class="text label">보류</text>
  <text x="480" y="306" class="text body">모를 때 멈춤</text>
  <g transform="translate(60 160)">
    <text x="0" y="0" class="text left label">읽는 방법</text>
    <text x="0" y="38" class="text left body">1. 맞힌 사실이 많아졌는가</text>
    <text x="0" y="68" class="text left body">2. 근거와 인용이 맞는가</text>
    <text x="0" y="98" class="text left body">3. 불확실할 때 멈추는가</text>
    <text x="0" y="128" class="text left body">4. 실제 사고가 줄어드는가</text>
  </g>
  <g transform="translate(690 160)">
    <text x="0" y="0" class="text left label">GPT-5.5의 교훈</text>
    <text x="0" y="38" class="text left body">지식 향상과 보류 능력은</text>
    <text x="0" y="68" class="text left body">분리해서 평가해야 합니다.</text>
    <text x="0" y="112" class="text left body">높은 정확도와 높은</text>
    <text x="0" y="142" class="text left body">Hallucination이 함께</text>
    <text x="0" y="172" class="text left body">나올 수 있습니다.</text>
  </g>
</svg>
