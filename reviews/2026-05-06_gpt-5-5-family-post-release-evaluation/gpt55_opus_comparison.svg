<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">GPT-5.5와 Claude Opus 4.7 비교</title>
  <desc id="desc">GPT-5.5와 Claude Opus 4.7의 강점이 작업 조건에 따라 달라짐을 설명하는 비교 도식</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf6}
      .panel{fill:#fff;stroke:#d8d2c6;stroke-width:2}
      .gpt{fill:#2f6f73}
      .opus{fill:#6b4f8a}
      .shared{fill:#c58b3b}
      .line{stroke:#2e4057;stroke-width:2}
      .text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#233142}
      .title{font-size:25px;font-weight:700}
      .label{font-size:21px;font-weight:700}
      .body{font-size:17px}
      .note{font-size:15px;fill:#5d6670}
    </style>
  </defs>
  <rect class="bg" width="960" height="520" rx="22"/>
  <text x="46" y="54" class="text title">비교의 단위는 작업 조건입니다</text>
  <text x="46" y="84" class="text note">같은 코딩, 같은 도구 사용이라도 시험지가 묻는 행동이 다르면 결과도 달라집니다.</text>
  <g transform="translate(46 126)">
    <rect class="panel" width="260" height="310" rx="20"/>
    <rect x="24" y="24" width="70" height="12" rx="6" class="gpt"/>
    <text x="24" y="66" class="text label">GPT-5.5 신호</text>
    <text x="24" y="108" class="text body">Terminal-Bench 2.0</text>
    <text x="24" y="134" class="text note">터미널 기반 실행</text>
    <text x="24" y="178" class="text body">BrowseComp</text>
    <text x="24" y="204" class="text note">검색과 브라우징</text>
    <text x="24" y="248" class="text body">토큰 효율</text>
    <text x="24" y="274" class="text note">작업당 비용 가능성</text>
  </g>
  <g transform="translate(350 126)">
    <rect class="panel" width="260" height="310" rx="20"/>
    <rect x="24" y="24" width="70" height="12" rx="6" class="shared"/>
    <text x="24" y="66" class="text label">공통 질문</text>
    <text x="24" y="108" class="text body">어떤 저장소인가</text>
    <text x="24" y="134" class="text note">코드 규모와 테스트</text>
    <text x="24" y="178" class="text body">어떤 도구인가</text>
    <text x="24" y="204" class="text note">MCP, API, 파일 권한</text>
    <text x="24" y="248" class="text body">어떤 검증인가</text>
    <text x="24" y="274" class="text note">사람 검토와 롤백</text>
  </g>
  <g transform="translate(654 126)">
    <rect class="panel" width="260" height="310" rx="20"/>
    <rect x="24" y="24" width="70" height="12" rx="6" class="opus"/>
    <text x="24" y="66" class="text label">Opus 4.7 신호</text>
    <text x="24" y="108" class="text body">SWE-Bench Pro</text>
    <text x="24" y="134" class="text note">긴 저장소 이슈</text>
    <text x="24" y="178" class="text body">MCP Atlas</text>
    <text x="24" y="204" class="text note">도구 오케스트레이션</text>
    <text x="24" y="248" class="text body">기업 문서 업무</text>
    <text x="24" y="274" class="text note">역할 유지와 지시 수행</text>
  </g>
  <line x1="306" y1="282" x2="350" y2="282" class="line"/>
  <line x1="610" y1="282" x2="654" y2="282" class="line"/>
  <text x="46" y="474" class="text note">실무 평가는 “누가 이겼는가”에서 머물지 않고, 우리 실패 유형을 어느 모델과 하네스가 줄이는지 봅니다.</text>
</svg>
