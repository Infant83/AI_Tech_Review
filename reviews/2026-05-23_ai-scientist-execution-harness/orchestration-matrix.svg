<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">오케스트레이션 판단 매트릭스</title>
  <desc id="desc">절차형 작업과 병렬 탐색 작업에서 단일 모델 흐름과 다중 에이전트 분할을 비교한다.</desc>
  <rect width="1200" height="620" fill="#fbfaf7"/>
  <rect x="38" y="38" width="1124" height="544" rx="18" fill="#fffdf9" stroke="#d8d5cb" stroke-width="2"/>
  <text x="78" y="96" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="31" font-weight="760" fill="#17211d">에이전트를 나눌지, 한 흐름으로 잡을지</text>
  <text x="78" y="132" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="19" fill="#5f6b65">오케스트레이션은 작업 구조와 맞아야 힘을 냅니다.</text>

  <g font-family="Segoe UI, Malgun Gothic, Arial, sans-serif">
    <rect x="84" y="188" width="492" height="332" rx="18" fill="#e7f2ee" stroke="#0f766e" stroke-width="3"/>
    <text x="330" y="240" text-anchor="middle" font-size="27" font-weight="780" fill="#0f766e">한 모델이 절차 전체를 잡는 방식</text>
    <line x1="124" y1="270" x2="536" y2="270" stroke="#b8d6ce" stroke-width="2"/>
    <text x="124" y="318" font-size="21" font-weight="720" fill="#17211d">잘 맞는 작업</text>
    <text x="124" y="350" font-size="18" fill="#37524b">순서가 분명하고 한 맥락을 유지해야 하는 일</text>
    <text x="124" y="398" font-size="21" font-weight="720" fill="#17211d">위험</text>
    <text x="124" y="430" font-size="18" fill="#37524b">맥락이 길어지면 누락과 오류가 쌓일 수 있음</text>
    <text x="124" y="478" font-size="21" font-weight="720" fill="#17211d">하네스 포인트</text>
    <text x="124" y="510" font-size="18" fill="#37524b">절차, 체크리스트, 재시도 조건을 명확히 넣기</text>

    <rect x="624" y="188" width="492" height="332" rx="18" fill="#e8edf5" stroke="#25456f" stroke-width="3"/>
    <text x="870" y="240" text-anchor="middle" font-size="27" font-weight="780" fill="#25456f">여러 에이전트로 역할을 나누는 방식</text>
    <line x1="664" y1="270" x2="1076" y2="270" stroke="#c1ccdc" stroke-width="2"/>
    <text x="664" y="318" font-size="21" font-weight="720" fill="#17211d">잘 맞는 작업</text>
    <text x="664" y="350" font-size="18" fill="#4c5d75">독립 조사, 병렬 실험, 구현과 검토 분리</text>
    <text x="664" y="398" font-size="21" font-weight="720" fill="#17211d">위험</text>
    <text x="664" y="430" font-size="18" fill="#4c5d75">상태가 흩어지고 책임 경계가 흐려질 수 있음</text>
    <text x="664" y="478" font-size="21" font-weight="720" fill="#17211d">하네스 포인트</text>
    <text x="664" y="510" font-size="18" fill="#4c5d75">역할, 공유 메모리, 병합 규칙, 승인 지점 설계</text>
  </g>
</svg>
