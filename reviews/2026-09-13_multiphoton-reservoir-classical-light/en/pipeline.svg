<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img"><title>Optical feature acquisition and trained readout</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Arial, Noto Sans KR, sans-serif" fill="#17211d"><text x="32" y="39" font-size="22" fill="#17211d" text-anchor="start">What stays fixed, and what is trained</text><rect x="32" y="65" width="326" height="132" rx="7" fill="#f2f5f6" stroke="#cad4d1"/><text x="52" y="94" font-size="12" fill="#0f766e" text-anchor="start">INPUT</text><text x="52" y="130" font-size="19" fill="#17211d" text-anchor="start">Input · polarization</text><text x="52" y="164" font-size="16" fill="#5f6b65" text-anchor="start">91 input settings</text><rect x="402" y="65" width="326" height="132" rx="7" fill="#f2f5f6" stroke="#cad4d1"/><text x="422" y="94" font-size="12" fill="#0f766e" text-anchor="start">FIXED</text><text x="422" y="130" font-size="19" fill="#17211d" text-anchor="start">Fixed · optical mixing</text><text x="422" y="164" font-size="16" fill="#5f6b65" text-anchor="start">Wave plates + q-plates</text><rect x="32" y="248" width="326" height="132" rx="7" fill="#f2f5f6" stroke="#cad4d1"/><text x="52" y="277" font-size="12" fill="#0f766e" text-anchor="start">MEASURE</text><text x="52" y="313" font-size="19" fill="#17211d" text-anchor="start">Measured · count features</text><text x="52" y="347" font-size="16" fill="#5f6b65" text-anchor="start">21 OAM × 41 entries = 861</text><rect x="402" y="248" width="326" height="132" rx="7" fill="#e8f2ed" stroke="#cad4d1"/><text x="422" y="277" font-size="12" fill="#0f766e" text-anchor="start">TRAINED</text><text x="422" y="313" font-size="19" fill="#17211d" text-anchor="start">Trained · classical readout</text><text x="422" y="347" font-size="16" fill="#5f6b65" text-anchor="start">Weights + ridge penalty</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker></defs><path d="M365 130H394 M565 203V222H195V240 M365 315H394" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/><text x="32" y="427" font-size="18" fill="#17211d" text-anchor="start">Acquisition is a separate cost from optical propagation.</text><text x="32" y="460" font-size="17" fill="#25456f" text-anchor="start">1 s / input–OAM setting → 1,911 s ≈ 32 min total</text><text x="32" y="488" font-size="14" fill="#5f6b65" text-anchor="start">Excludes switching, calibration and data transfer</text></g></svg>