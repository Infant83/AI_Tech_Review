<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">하네스 스택 도식</title>
  <desc id="desc">모델 코어 주변에 맥락, 도구, 기억, 권한, 검증, 승인, 병합과 되돌리기, 업무 산출물이 연결되는 구조를 보여준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="#53625d"/>
    </marker>
  </defs>
  <rect width="1200" height="740" fill="#fbfaf7"/>
  <rect x="38" y="38" width="1124" height="664" rx="18" fill="#fffdf9" stroke="#d8d5cb" stroke-width="2"/>

  <text x="88" y="96" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="32" font-weight="760" fill="#17211d">하네스 스택</text>
  <text x="88" y="134" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="19" fill="#5f6b65">모델의 답변이 실제 업무 산출물로 바뀌려면 주변 실행층이 함께 설계되어야 합니다.</text>

  <rect x="462" y="228" width="276" height="164" rx="20" fill="#e7f2ee" stroke="#0f766e" stroke-width="4"/>
  <text x="600" y="300" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="31" font-weight="760" fill="#0f766e">모델 코어</text>
  <text x="600" y="338" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="18" fill="#37524b">추론 · 생성</text>

  <g font-family="Segoe UI, Malgun Gothic, Arial, sans-serif">
    <rect x="112" y="196" width="244" height="86" rx="14" fill="#f7efe2" stroke="#a35a16" stroke-width="2.5"/>
    <text x="234" y="236" text-anchor="middle" font-size="25" font-weight="720" fill="#17211d">맥락</text>
    <text x="234" y="264" text-anchor="middle" font-size="16" fill="#6e5b44">업무 목표 · 정책 · 예시</text>

    <rect x="112" y="318" width="244" height="86" rx="14" fill="#e8edf5" stroke="#25456f" stroke-width="2.5"/>
    <text x="234" y="358" text-anchor="middle" font-size="25" font-weight="720" fill="#17211d">도구</text>
    <text x="234" y="386" text-anchor="middle" font-size="16" fill="#4c5d75">파일 · API · 브라우저 · 셸</text>

    <rect x="112" y="440" width="244" height="86" rx="14" fill="#f5e9e9" stroke="#8b3a3a" stroke-width="2.5"/>
    <text x="234" y="480" text-anchor="middle" font-size="25" font-weight="720" fill="#17211d">기억</text>
    <text x="234" y="508" text-anchor="middle" font-size="16" fill="#755151">이전 작업 · 실패 기록</text>

    <rect x="844" y="196" width="244" height="86" rx="14" fill="#f7efe2" stroke="#a35a16" stroke-width="2.5"/>
    <text x="966" y="236" text-anchor="middle" font-size="25" font-weight="720" fill="#17211d">권한</text>
    <text x="966" y="264" text-anchor="middle" font-size="16" fill="#6e5b44">접근 범위 · 실행 제한</text>

    <rect x="844" y="318" width="244" height="86" rx="14" fill="#e8edf5" stroke="#25456f" stroke-width="2.5"/>
    <text x="966" y="358" text-anchor="middle" font-size="25" font-weight="720" fill="#17211d">검증</text>
    <text x="966" y="386" text-anchor="middle" font-size="16" fill="#4c5d75">테스트 · 평가 · 재시도</text>

    <rect x="844" y="440" width="244" height="86" rx="14" fill="#e7f2ee" stroke="#0f766e" stroke-width="2.5"/>
    <text x="966" y="480" text-anchor="middle" font-size="25" font-weight="720" fill="#17211d">승인</text>
    <text x="966" y="508" text-anchor="middle" font-size="16" fill="#37524b">사람 검토 · 정책 게이트</text>
  </g>

  <g stroke="#53625d" stroke-width="3.2" fill="none" marker-end="url(#arrow)">
    <path d="M356 239 C404 239 420 270 462 286"/>
    <path d="M356 361 C402 361 420 338 462 338"/>
    <path d="M356 483 C404 483 424 382 462 372"/>
    <path d="M738 286 C784 270 802 239 844 239"/>
    <path d="M738 338 C784 338 802 361 844 361"/>
    <path d="M738 372 C784 382 804 483 844 483"/>
  </g>

  <rect x="462" y="478" width="276" height="82" rx="14" fill="#f0ede6" stroke="#b8b1a5" stroke-width="2.5"/>
  <text x="600" y="513" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="24" font-weight="720" fill="#17211d">병합 · 되돌리기</text>
  <text x="600" y="542" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="16" fill="#625f58">변경 관리 · 기록</text>
  <path d="M600 392 L600 478" stroke="#53625d" stroke-width="3.2" fill="none" marker-end="url(#arrow)"/>

  <rect x="462" y="606" width="276" height="64" rx="14" fill="#17211d"/>
  <text x="600" y="632" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="23" font-weight="760" fill="#ffffff">업무 산출물</text>
  <text x="600" y="657" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="15" fill="#d6ddd9">문서 · 코드 · 의사결정</text>
  <path d="M600 560 L600 606" stroke="#17211d" stroke-width="3.2" fill="none" marker-end="url(#arrow)"/>
</svg>
