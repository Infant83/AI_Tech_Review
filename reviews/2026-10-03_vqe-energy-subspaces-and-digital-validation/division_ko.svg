<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img"><title>에너지 측정과 전자배치 선택의 분업</title><rect width="1000" height="490" fill="#faf8f2"/><g font-family="Arial, Noto Sans KR, sans-serif"><text x="40" y="48" font-size="28" fill="#142b39">에너지 측정과 전자배치 선택의 분업</text><text x="40" y="100" font-size="22" font-weight="bold" fill="#116f79">VQE</text><rect x="40" y="125" width="208" height="102" rx="12" fill="white" stroke="#116f79" stroke-width="2"/><text x="144" y="157" text-anchor="middle" font-size="16" fill="#116f79">QPU</text><text x="144" y="196" text-anchor="middle" font-size="20" fill="#142b39">상태 준비</text><path d="M250 178 h20 m-8 -6 l8 6 -8 6" fill="none" stroke="#5c6770" stroke-width="2"/><rect x="275" y="125" width="208" height="102" rx="12" fill="white" stroke="#116f79" stroke-width="2"/><text x="379" y="157" text-anchor="middle" font-size="16" fill="#116f79">QPU</text><text x="379" y="196" text-anchor="middle" font-size="20" fill="#142b39">Pauli 기대값 측정</text><path d="M485 178 h20 m-8 -6 l8 6 -8 6" fill="none" stroke="#5c6770" stroke-width="2"/><rect x="510" y="125" width="208" height="102" rx="12" fill="white" stroke="#116f79" stroke-width="2"/><text x="614" y="157" text-anchor="middle" font-size="16" fill="#116f79">CPU</text><text x="614" y="196" text-anchor="middle" font-size="20" fill="#142b39">에너지 합산</text><path d="M720 178 h20 m-8 -6 l8 6 -8 6" fill="none" stroke="#5c6770" stroke-width="2"/><rect x="745" y="125" width="208" height="102" rx="12" fill="white" stroke="#116f79" stroke-width="2"/><text x="849" y="157" text-anchor="middle" font-size="16" fill="#116f79">CPU</text><text x="849" y="196" text-anchor="middle" font-size="20" fill="#142b39">회로 갱신</text><text x="40" y="280" font-size="22" font-weight="bold" fill="#b44e3a">HI-VQE / SQD</text><rect x="40" y="305" width="208" height="102" rx="12" fill="white" stroke="#b44e3a" stroke-width="2"/><text x="144" y="337" text-anchor="middle" font-size="16" fill="#b44e3a">QPU</text><text x="144" y="376" text-anchor="middle" font-size="20" fill="#142b39">상태 준비</text><path d="M250 358 h20 m-8 -6 l8 6 -8 6" fill="none" stroke="#5c6770" stroke-width="2"/><rect x="275" y="305" width="208" height="102" rx="12" fill="white" stroke="#b44e3a" stroke-width="2"/><text x="379" y="337" text-anchor="middle" font-size="16" fill="#b44e3a">QPU</text><text x="379" y="376" text-anchor="middle" font-size="20" fill="#142b39">전자배치 샘플링</text><path d="M485 358 h20 m-8 -6 l8 6 -8 6" fill="none" stroke="#5c6770" stroke-width="2"/><rect x="510" y="305" width="208" height="102" rx="12" fill="white" stroke="#b44e3a" stroke-width="2"/><text x="614" y="337" text-anchor="middle" font-size="16" fill="#b44e3a">CPU</text><text x="614" y="376" text-anchor="middle" font-size="20" fill="#142b39">부분공간 H 구성</text><path d="M720 358 h20 m-8 -6 l8 6 -8 6" fill="none" stroke="#5c6770" stroke-width="2"/><rect x="745" y="305" width="208" height="102" rx="12" fill="white" stroke="#b44e3a" stroke-width="2"/><text x="849" y="337" text-anchor="middle" font-size="16" fill="#b44e3a">CPU</text><text x="849" y="376" text-anchor="middle" font-size="20" fill="#142b39">고전 대각화</text><text x="40" y="458" font-size="19" fill="#5c6770">HI-VQE는 샘플 기반 에너지에 따라 회로를 반복 갱신할 수 있습니다.</text></g></svg>