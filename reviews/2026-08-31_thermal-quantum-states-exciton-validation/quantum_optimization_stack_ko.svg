<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">양자 계산 최적화의 전체 스택</title>
  <desc id="desc">문제 표현부터 고수준 합성, 논리 최적화, 매핑과 라우팅, 네이티브 게이트, 물리 아키텍처, 펄스 제어, 측정까지의 층과 Classiq, AshN, fluxonium-transmon, 기하학적 제어의 위치를 나타낸 그림</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#eef3f1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#73817a"/>
    </marker>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #17211d; }
      .title { font-size: 42px; font-weight: 700; }
      .subtitle { font-size: 21px; fill: #59665f; }
      .stage { font-size: 24px; font-weight: 700; }
      .examples { font-size: 19px; fill: #48554f; }
      .metric { font-size: 18px; font-weight: 600; fill: #25456f; }
      .tag { font-size: 17px; font-weight: 700; }
      .foot { font-size: 19px; fill: #e0ebe8; }
      .footstrong { font-size: 20px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1200" height="980" rx="28" fill="url(#bg)"/>
  <text x="62" y="72" class="title">Classiq와 AshN은 전체 최적화 스택의 두 사례다</text>
  <text x="62" y="109" class="subtitle">회로 깊이는 한 층의 숫자가 아니라, 여러 설계 선택이 backend에서 합쳐진 결과다.</text>

  <g stroke="#73817a" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M210 226 V254"/><path d="M210 326 V354"/><path d="M210 426 V454"/>
    <path d="M210 526 V554"/><path d="M210 626 V654"/><path d="M210 726 V754"/>
    <path d="M210 826 V854"/>
  </g>

  <g>
    <rect x="62" y="150" width="1076" height="76" rx="15" fill="#ffffff"/>
    <rect x="62" y="150" width="296" height="76" rx="15" fill="#edf3f1"/>
    <text x="90" y="180" class="stage">1. 문제 표현</text>
    <text x="90" y="207" class="examples">Hamiltonian · oracle · QUBO</text>
    <text x="392" y="181" class="examples">모델 자체의 sparsity·대칭·제약을 먼저 줄인다</text>
    <text x="392" y="207" class="metric">지표: 변수·Pauli term·제약 위반·state-preparation 비용</text>

    <rect x="62" y="250" width="1076" height="76" rx="15" fill="#ffffff"/>
    <rect x="62" y="250" width="296" height="76" rx="15" fill="#e5f3ef"/>
    <text x="90" y="280" class="stage">2. 고수준 합성</text>
    <text x="90" y="307" class="examples">기능 모델 → 회로 구현 탐색</text>
    <rect x="392" y="266" width="94" height="28" rx="14" fill="#cde8df"/>
    <text x="439" y="286" text-anchor="middle" class="tag" fill="#0f6d62">Classiq</text>
    <text x="503" y="286" class="examples">등 여러 합성·컴파일 프레임워크</text>
    <text x="392" y="312" class="metric">지표: logical depth · gate count · ancilla · correctness</text>

    <rect x="62" y="350" width="1076" height="76" rx="15" fill="#ffffff"/>
    <rect x="62" y="350" width="296" height="76" rx="15" fill="#eef0f7"/>
    <text x="90" y="380" class="stage">3. 논리 회로 최적화</text>
    <text x="90" y="407" class="examples">rewrite · ZX · phase polynomial</text>
    <text x="392" y="381" class="examples">gate cancellation, Boolean factorization, synthesis 재탐색</text>
    <text x="392" y="407" class="metric">지표: 1Q/2Q gate · T count/depth · critical path</text>

    <rect x="62" y="450" width="1076" height="76" rx="15" fill="#ffffff"/>
    <rect x="62" y="450" width="296" height="76" rx="15" fill="#f1eee7"/>
    <text x="90" y="480" class="stage">4. 매핑·라우팅</text>
    <text x="90" y="507" class="examples">topology · placement · SWAP</text>
    <text x="392" y="481" class="examples">물리 연결성·calibration을 반영해 qubit 이동을 줄인다</text>
    <text x="392" y="507" class="metric">지표: mapped 2Q depth · SWAP · success probability</text>

    <rect x="62" y="550" width="1076" height="76" rx="15" fill="#ffffff"/>
    <rect x="62" y="550" width="296" height="76" rx="15" fill="#f6eadf"/>
    <text x="90" y="580" class="stage">5. 네이티브 게이트</text>
    <text x="90" y="607" class="examples">hardware-native entangler</text>
    <rect x="392" y="566" width="76" height="28" rx="14" fill="#f2d8c0"/>
    <text x="430" y="586" text-anchor="middle" class="tag" fill="#955013">AshN</text>
    <text x="486" y="586" class="examples">등 native-gate·SWAP absorption 접근</text>
    <text x="392" y="612" class="metric">지표: calibrated entangler 수 · native depth · 실제 QPU fidelity</text>

    <rect x="62" y="650" width="1076" height="76" rx="15" fill="#ffffff"/>
    <rect x="62" y="650" width="296" height="76" rx="15" fill="#e8eef6"/>
    <text x="90" y="680" class="stage">6. 물리 아키텍처</text>
    <text x="90" y="707" class="examples">qubit · coupler · spectator</text>
    <rect x="392" y="666" width="278" height="28" rx="14" fill="#dce6f2"/>
    <text x="531" y="686" text-anchor="middle" class="tag" fill="#315887">fluxonium–transmon 제안</text>
    <text x="688" y="686" class="examples">은 이 층의 수치 설계</text>
    <text x="392" y="712" class="metric">지표: crosstalk · coherence · leakage · array yield</text>

    <rect x="62" y="750" width="1076" height="76" rx="15" fill="#ffffff"/>
    <rect x="62" y="750" width="296" height="76" rx="15" fill="#edf2e6"/>
    <text x="90" y="780" class="stage">7. 펄스·제어</text>
    <text x="90" y="807" class="examples">DRAG · GRAPE · CRAB · STA</text>
    <rect x="392" y="766" width="238" height="28" rx="14" fill="#dfe9d4"/>
    <text x="511" y="786" text-anchor="middle" class="tag" fill="#4c6635">기하학적 di-ad 제어</text>
    <text x="648" y="786" class="examples">도 이 층의 한 방법</text>
    <text x="392" y="812" class="metric">지표: pulse time · leakage · robustness · measured fidelity</text>

    <rect x="62" y="850" width="1076" height="76" rx="15" fill="#ffffff"/>
    <rect x="62" y="850" width="296" height="76" rx="15" fill="#f2e9ef"/>
    <text x="90" y="880" class="stage">8. 측정·후처리</text>
    <text x="90" y="907" class="examples">readout · shots · mitigation</text>
    <text x="392" y="881" class="examples">회로 출력이 신뢰 가능한 관측량으로 바뀌는 마지막 단계</text>
    <text x="392" y="907" class="metric">지표: assignment error · shots · postselection · wall-clock</text>
  </g>

  <rect x="62" y="944" width="1076" height="28" rx="14" fill="#173d36"/>
  <text x="88" y="965" class="footstrong">비교 원칙</text>
  <text x="190" y="965" class="foot">logical depth 하나 대신 backend까지 내린 Pareto front를 비교한다.</text>
</svg>
