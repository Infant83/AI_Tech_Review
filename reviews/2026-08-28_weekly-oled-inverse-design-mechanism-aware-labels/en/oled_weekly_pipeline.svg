<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Mechanism-aware OLED inverse-design evidence pipeline</title>
  <desc id="hero-desc">A four-stage academic diagram connecting OLED photophysical labels, density-functional and interaction calculations, machine-learning inverse design, and bounded quantum research components. The diagram emphasizes evidence gates and does not claim quantum advantage.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf6; }
      .paper { fill: #fffefa; stroke: #c9c7bf; stroke-width: 1.2; }
      .rule { stroke: #c9c7bf; stroke-width: 1; }
      .ink { fill: #151515; }
      .muted { fill: #64645f; }
      .navy { fill: #344866; }
      .rust { fill: #9a514a; }
      .green { fill: #55765d; }
      .purple { fill: #73657e; }
      .navy-stroke { fill: none; stroke: #344866; stroke-width: 1.8; }
      .rust-stroke { fill: none; stroke: #9a514a; stroke-width: 1.8; }
      .green-stroke { fill: none; stroke: #55765d; stroke-width: 1.8; }
      .purple-stroke { fill: none; stroke: #73657e; stroke-width: 1.8; }
      .soft-navy { fill: #eef1f5; }
      .soft-rust { fill: #f6efed; }
      .soft-green { fill: #eef3ef; }
      .soft-purple { fill: #f1eff4; }
      .sans { font-family: Inter, "Noto Sans", "Noto Sans KR", Arial, sans-serif; }
      .serif { font-family: "Source Serif 4", "Noto Serif", "Noto Serif KR", Georgia, serif; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.7px; }
      .title { font-size: 34px; font-weight: 600; letter-spacing: -0.4px; }
      .subtitle { font-size: 16px; }
      .panel-kicker { font-size: 11px; font-weight: 700; letter-spacing: 1.25px; }
      .panel-title { font-size: 20px; font-weight: 650; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .tiny { font-size: 10px; font-weight: 700; letter-spacing: 1px; }
      .label { font-size: 12px; font-weight: 650; }
      .mono { font-family: "STIX Two Math", "Cambria Math", Georgia, serif; font-size: 14px; }
    </style>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344866"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8a84"/>
    </marker>
    <pattern id="micro-grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#d9d8d2" stroke-width="0.7"/>
    </pattern>
  </defs>

  <rect class="bg" width="1200" height="675"/>

  <g class="sans" aria-label="Header">
    <text x="48" y="42" class="eyebrow navy">WEEKLY OLED INVERSE DESIGN REVIEW</text>
    <rect x="926" y="24" width="226" height="28" class="soft-navy" stroke="#344866" stroke-width="1"/>
    <text x="1039" y="43" text-anchor="middle" class="tiny navy">EVIDENCE-FIRST PIPELINE</text>
    <text id="visible-title" x="48" y="92" class="title serif ink">From photophysical mechanism to decision-ready candidates</text>
    <text x="48" y="122" class="subtitle sans muted">DFT and ML form the present-day screening core; quantum methods remain bounded, testable components.</text>
    <line x1="48" y1="148" x2="1152" y2="148" class="rule"/>
  </g>

  <g class="sans" aria-label="Four-stage evidence pipeline">
    <!-- Panel 1 -->
    <g role="group" aria-label="Stage one, mechanism-aware photophysical labels">
      <rect x="48" y="184" width="258" height="352" class="paper"/>
      <rect x="48" y="184" width="258" height="5" class="rust"/>
      <text x="68" y="214" class="panel-kicker rust">01 · PHOTOPHYSICS</text>
      <text x="68" y="241" class="panel-title ink">Mechanism-aware labels</text>

      <rect x="68" y="261" width="218" height="112" class="soft-rust" stroke="#d9c6c2" stroke-width="1"/>
      <text x="278" y="276" text-anchor="end" class="tiny rust">SCHEMATIC</text>
      <line x1="88" y1="294" x2="154" y2="294" class="rust-stroke"/>
      <line x1="198" y1="311" x2="264" y2="311" class="navy-stroke"/>
      <line x1="198" y1="348" x2="264" y2="348" class="navy-stroke"/>
      <text x="88" y="288" class="label rust">S1</text>
      <text x="198" y="305" class="label navy">Tn</text>
      <text x="198" y="342" class="label navy">T1</text>
      <path d="M154 294 C172 287 179 301 198 311" class="rust-stroke" stroke-dasharray="4 3" marker-end="url(#arrow-navy)"/>
      <path d="M231 317 L231 340" class="navy-stroke" stroke-dasharray="3 3" marker-end="url(#arrow-navy)"/>
      <text x="88" y="362" class="small muted">channel-resolved coupling</text>

      <circle cx="72" cy="401" r="3" class="rust"/>
      <text x="82" y="405" class="body ink">State identity: CT / LE / mixed</text>
      <circle cx="72" cy="432" r="3" class="rust"/>
      <text x="82" y="436" class="body ink">DSO · HT · spin–vibronic</text>
      <circle cx="72" cy="463" r="3" class="rust"/>
      <text x="82" y="467" class="body ink">S1, T1 and higher-triplet context</text>
      <rect x="68" y="491" width="218" height="25" fill="none" stroke="#9a514a" stroke-width="1"/>
      <text x="177" y="508" text-anchor="middle" class="tiny rust">NOT ΔE<tspan baseline-shift="sub" font-size="8">ST</tspan> ALONE</text>
    </g>

    <!-- Panel 2 -->
    <g role="group" aria-label="Stage two, density-functional and interaction evidence">
      <rect x="330" y="184" width="258" height="352" class="paper"/>
      <rect x="330" y="184" width="258" height="5" class="navy"/>
      <text x="350" y="214" class="panel-kicker navy">02 · DFT + INTERACTIONS</text>
      <text x="350" y="241" class="panel-title ink">Computational evidence</text>

      <rect x="350" y="261" width="218" height="112" fill="url(#micro-grid)" stroke="#c9c7bf" stroke-width="1"/>
      <path d="M375 334 C376 301 402 279 433 288 C450 266 497 274 500 306 C535 308 544 348 512 357 C484 365 459 345 442 351 C413 364 374 356 375 334 Z" fill="#e7ebf0" stroke="#344866" stroke-width="1.5"/>
      <path d="M395 331 C397 309 415 296 435 302 C451 287 481 291 485 313 C507 317 509 340 489 345 C467 350 456 335 441 340 C420 348 395 345 395 331 Z" fill="none" stroke="#55765d" stroke-width="1.4"/>
      <path d="M419 328 C420 315 431 309 442 313 C453 304 472 310 472 323 C486 327 484 337 472 339 C457 342 451 331 440 334 C428 339 419 337 419 328 Z" fill="none" stroke="#9a514a" stroke-width="1.2"/>
      <text x="558" y="276" text-anchor="end" class="tiny navy">DENSITY LAYER</text>

      <circle cx="354" cy="401" r="3" class="navy"/>
      <text x="364" y="405" class="body ink">Ground-state density and SCF</text>
      <circle cx="354" cy="432" r="3" class="navy"/>
      <text x="364" y="436" class="body ink">Excited states · NTO · SOC</text>
      <circle cx="354" cy="463" r="3" class="navy"/>
      <text x="364" y="467" class="body ink">Host–dopant dimer energetics</text>
      <rect x="350" y="491" width="218" height="25" fill="none" stroke="#344866" stroke-width="1"/>
      <text x="459" y="508" text-anchor="middle" class="tiny navy">VALIDATE BEFORE SCALE-UP</text>
    </g>

    <!-- Panel 3 -->
    <g role="group" aria-label="Stage three, uncertainty-aware machine-learning inverse design">
      <rect x="612" y="184" width="258" height="352" class="paper"/>
      <rect x="612" y="184" width="258" height="5" class="green"/>
      <text x="632" y="214" class="panel-kicker green">03 · ML DESIGN LOOP</text>
      <text x="632" y="241" class="panel-title ink">Search with uncertainty</text>

      <rect x="632" y="261" width="218" height="112" class="soft-green" stroke="#c7d4ca" stroke-width="1"/>
      <circle cx="686" cy="317" r="22" fill="#fffefa" stroke="#55765d" stroke-width="1.5"/>
      <circle cx="741" cy="286" r="22" fill="#fffefa" stroke="#55765d" stroke-width="1.5"/>
      <circle cx="796" cy="317" r="22" fill="#fffefa" stroke="#55765d" stroke-width="1.5"/>
      <circle cx="741" cy="348" r="22" fill="#fffefa" stroke="#55765d" stroke-width="1.5"/>
      <path d="M707 307 C716 297 720 294 723 292" class="green-stroke" marker-end="url(#arrow-gray)"/>
      <path d="M761 295 C771 299 778 305 783 310" class="green-stroke" marker-end="url(#arrow-gray)"/>
      <path d="M781 330 C771 338 765 342 761 344" class="green-stroke" marker-end="url(#arrow-gray)"/>
      <path d="M721 344 C708 338 701 332 699 327" class="green-stroke" marker-end="url(#arrow-gray)"/>
      <text x="686" y="321" text-anchor="middle" class="tiny green">LABEL</text>
      <text x="741" y="290" text-anchor="middle" class="tiny green">LEARN</text>
      <text x="796" y="321" text-anchor="middle" class="tiny green">PROPOSE</text>
      <text x="741" y="352" text-anchor="middle" class="tiny green">AUDIT</text>

      <circle cx="636" cy="401" r="3" class="green"/>
      <text x="646" y="405" class="body ink">Predict physical intermediates</text>
      <circle cx="636" cy="432" r="3" class="green"/>
      <text x="646" y="436" class="body ink">Scaffold-held-out evaluation</text>
      <circle cx="636" cy="463" r="3" class="green"/>
      <text x="646" y="467" class="body ink">Calibration + oracle disagreement</text>
      <rect x="632" y="491" width="218" height="25" fill="none" stroke="#55765d" stroke-width="1"/>
      <text x="741" y="508" text-anchor="middle" class="tiny green">CLOSED LOOP, OPEN AUDIT</text>
    </g>

    <!-- Panel 4 -->
    <g role="group" aria-label="Stage four, bounded quantum research components">
      <rect x="894" y="184" width="258" height="352" class="paper"/>
      <rect x="894" y="184" width="258" height="5" class="purple"/>
      <text x="914" y="214" class="panel-kicker purple">04 · QUANTUM COMPONENTS</text>
      <text x="914" y="241" class="panel-title ink">Bounded feasibility tests</text>

      <rect x="914" y="261" width="218" height="112" class="soft-purple" stroke="#d1cad7" stroke-width="1"/>
      <rect x="928" y="288" width="52" height="50" fill="#fffefa" stroke="#73657e" stroke-width="1.4"/>
      <rect x="996" y="288" width="52" height="50" fill="#fffefa" stroke="#73657e" stroke-width="1.4"/>
      <rect x="1064" y="288" width="52" height="50" fill="#fffefa" stroke="#73657e" stroke-width="1.4"/>
      <text x="954" y="308" text-anchor="middle" class="tiny purple">SPIN</text>
      <text x="954" y="323" text-anchor="middle" class="tiny purple">CSF</text>
      <text x="1022" y="308" text-anchor="middle" class="tiny purple">ACTIVE</text>
      <text x="1022" y="323" text-anchor="middle" class="tiny purple">H</text>
      <text x="1090" y="308" text-anchor="middle" class="tiny purple">ENERGY</text>
      <text x="1090" y="323" text-anchor="middle" class="tiny purple">TEST</text>
      <line x1="980" y1="313" x2="994" y2="313" class="purple-stroke" marker-end="url(#arrow-gray)"/>
      <line x1="1048" y1="313" x2="1062" y2="313" class="purple-stroke" marker-end="url(#arrow-gray)"/>
      <text x="1122" y="276" text-anchor="end" class="tiny purple">COMPONENT TEST</text>
      <text x="1023" y="360" text-anchor="middle" class="small muted">resource count before hardware</text>

      <circle cx="918" cy="401" r="3" class="purple"/>
      <text x="928" y="405" class="body ink">Spin-adapted initialization</text>
      <circle cx="918" cy="432" r="3" class="purple"/>
      <text x="928" y="436" class="body ink">Shot-aware VQE optimization</text>
      <circle cx="918" cy="463" r="3" class="purple"/>
      <text x="928" y="467" class="body ink">Small active-space benchmarks</text>
      <rect x="914" y="491" width="218" height="25" fill="none" stroke="#73657e" stroke-width="1"/>
      <text x="1023" y="508" text-anchor="middle" class="tiny purple">NO ADVANTAGE CLAIM</text>
    </g>

    <!-- Flow arrows -->
    <line x1="306" y1="348" x2="326" y2="348" stroke="#8b8a84" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
    <line x1="588" y1="348" x2="608" y2="348" stroke="#8b8a84" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
    <line x1="870" y1="348" x2="890" y2="348" stroke="#8b8a84" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  </g>

  <g class="sans" aria-label="Decision gate">
    <rect x="48" y="560" width="1104" height="74" fill="#f2f1ec" stroke="#c9c7bf" stroke-width="1.2"/>
    <text x="68" y="586" class="panel-kicker navy">DECISION GATE</text>
    <text x="68" y="612" class="body ink">Proceed only after mechanistic labels, uncertainty, and interaction context pass held-out validation.</text>
    <line x1="824" y1="574" x2="824" y2="620" class="rule"/>
    <rect x="846" y="579" width="128" height="26" class="soft-green" stroke="#55765d" stroke-width="1"/>
    <text x="910" y="596" text-anchor="middle" class="tiny green">CURRENT CORE</text>
    <text x="989" y="596" class="small ink">DFT + ML</text>
    <rect x="1046" y="579" width="86" height="26" class="soft-purple" stroke="#73657e" stroke-width="1"/>
    <text x="1089" y="596" text-anchor="middle" class="tiny purple">RESEARCH</text>
    <text x="1128" y="621" text-anchor="end" class="small muted">Quantum</text>
  </g>
</svg>
