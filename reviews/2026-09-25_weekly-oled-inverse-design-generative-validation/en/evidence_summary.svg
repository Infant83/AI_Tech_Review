<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Evidence summary for four selected studies</title>
  <desc id="desc">Four source-reported evidence cards compare latent molecular generation, a molecular design agent benchmark, substituent contribution learning, and VQE initialization. A footer states that none is a direct OLED device study.</desc>
  <rect width="1200" height="700" fill="#f7f8fa"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#13253b">What was actually demonstrated this week</text>
  <text x="70" y="108" font-family="Arial, sans-serif" font-size="18" fill="#536779">Source-reported results; categories and boundary notes are reviewer-constructed</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="145" width="510" height="205" rx="18" fill="#ffffff" stroke="#5aa9c8" stroke-width="3"/>
    <circle cx="110" cy="187" r="18" fill="#5aa9c8"/><text x="104" y="194" font-size="18" font-weight="700" fill="#fff">1</text>
    <text x="145" y="190" font-size="23" font-weight="700" fill="#173a55">Variable-size 3D latent flow · v3</text>
    <text x="102" y="232" font-size="20" fill="#173a55">87.9% verified novel/unique yield</text>
    <text x="102" y="264" font-size="20" fill="#173a55">DFT hit rate: 25.0% → 52.4%</text>
    <text x="102" y="296" font-size="17" fill="#536779">B3LYP/6-31G(d), single-point; 30% retained</text>
    <text x="102" y="326" font-size="17" fill="#a04b33">Not excited-state or OLED validation</text>

    <rect x="620" y="145" width="510" height="205" rx="18" fill="#ffffff" stroke="#d7a24b" stroke-width="3"/>
    <circle cx="660" cy="187" r="18" fill="#d7a24b"/><text x="654" y="194" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="695" y="190" font-size="23" font-weight="700" fill="#604316">Molecular-design agent benchmark</text>
    <text x="652" y="232" font-size="20" fill="#604316">2,000 scenarios · 17 chemistry tools</text>
    <text x="652" y="264" font-size="20" fill="#604316">Best success: 0.38 generation / 0.43 optimization</text>
    <text x="652" y="296" font-size="17" fill="#6f6046">5–10 properties per instance; 10% infeasible</text>
    <text x="652" y="326" font-size="17" fill="#a04b33">Computed properties; no wet-lab discovery</text>

    <rect x="70" y="382" width="510" height="205" rx="18" fill="#ffffff" stroke="#7d7bc4" stroke-width="3"/>
    <circle cx="110" cy="424" r="18" fill="#7d7bc4"/><text x="104" y="431" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="145" y="427" font-size="23" font-weight="700" fill="#37356c">Substituent-contribution learning</text>
    <text x="102" y="469" font-size="20" fill="#37356c">181,098 train · 1,541 disjoint benchmark</text>
    <text x="102" y="501" font-size="20" fill="#37356c">Direction accuracy: 0.923</text>
    <text x="102" y="533" font-size="17" fill="#5f5d82">Scaffold, substituent and molecule held out</text>
    <text x="102" y="563" font-size="17" fill="#a04b33">ChEMBL axes, not OLED excited states</text>

    <rect x="620" y="382" width="510" height="205" rx="18" fill="#ffffff" stroke="#3b8b7b" stroke-width="3"/>
    <circle cx="660" cy="424" r="18" fill="#3b8b7b"/><text x="654" y="431" font-size="18" font-weight="700" fill="#fff">4</text>
    <text x="695" y="427" font-size="23" font-weight="700" fill="#215d52">Chemically initialized UCCSD-VQE</text>
    <text x="652" y="469" font-size="20" fill="#215d52">H chains: 4–24 qubits</text>
    <text x="652" y="501" font-size="20" fill="#215d52">Local gradient decay: polynomial, not exponential</text>
    <text x="652" y="533" font-size="17" fill="#53756f">Exact classical landscape/gradient evaluation</text>
    <text x="652" y="563" font-size="17" fill="#a04b33">No QPU, shot noise or quantum advantage</text>

    <rect x="70" y="620" width="1060" height="48" rx="12" fill="#13253b"/>
    <text x="600" y="651" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Coverage boundary: no direct new TADF emitter, PhOLED host or OLED device paper</text>
  </g>
</svg>
