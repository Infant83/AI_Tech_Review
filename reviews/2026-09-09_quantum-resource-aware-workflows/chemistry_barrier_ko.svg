<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-labelledby="title desc"><title id="title">Cyclobutadiene: 기준 상태를 함께 유지한 효과</title><desc id="desc">Active space 4 electrons in 4 orbitals, cc-pVDZ. Reference barrier 8.96, NOQE 7.70, DS-NOCI 8.62 kcal/mol. Absolute errors 1.26 and 0.34. Classical numerical study, no actual QPU.</desc>
