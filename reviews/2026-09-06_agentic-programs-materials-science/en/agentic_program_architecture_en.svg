<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The boundary between judgment and deterministic computation in DeMARS</title>
  <desc id="desc">A flow from a disordered CIF through evidence extraction, bounded LLM judgment, enumeration and MLIP relaxation, physical gates and fresh-context review to certification or refusal</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1726"/><stop offset="1" stop-color="#17283a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#9eb5c9"/></marker>
    <style>
      .box{rx:22;stroke-width:3;filter:url(#shadow)} .det{fill:#163b51;stroke:#3fb9c5}.judge{fill:#412f5f;stroke:#b899eb}.gate{fill:#3f321d;stroke:#e3a43d}.review{fill:#263c31;stroke:#72c59a}.out{fill:#192738;stroke:#dbe8f2}.h{font:700 27px system-ui,sans-serif;fill:#f4f8fb}.p{font:500 20px system-ui,sans-serif;fill:#d6e0e8}.small{font:500 17px system-ui,sans-serif;fill:#c5d1dc}.lane{font:700 18px system-ui,sans-serif;letter-spacing:.08em}.arrow{stroke:#9eb5c9;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="74" class="h" font-size="38">Keep judgment flexible; make consequences computable</text>
  <text x="80" y="112" class="p">Reviewer reconstruction from the paper's Figure 3 and architecture description</text>
  <text x="80" y="171" class="lane" fill="#5dd0db">DETERMINISTIC CODE</text>
  <text x="544" y="171" class="lane" fill="#c9aff5">BOUNDED LLM JUDGMENT</text>
  <text x="1036" y="171" class="lane" fill="#f0b65b">PHYSICAL / STRUCTURAL GATES</text>
  <rect x="70" y="210" width="275" height="200" class="box det"/><text x="101" y="260" class="h">Disordered CIF</text><text x="101" y="304" class="p">Partial occupancy,</text><text x="101" y="338" class="p">composition, symmetry</text><text x="101" y="382" class="small">Extract an evidence bundle</text>
  <path d="M345 310 H440" class="arrow"/>
  <rect x="450" y="210" width="390" height="200" class="box judge"/><text x="483" y="260" class="h">Choose executable spec</text><text x="483" y="304" class="p">Supercell; merged/exclusive sites</text><text x="483" y="340" class="p">Charge targets; repair route</text><text x="483" y="382" class="small">Judge only underdetermined choices</text>
  <path d="M840 310 H935" class="arrow"/>
  <rect x="945" y="210" width="295" height="200" class="box det"/><text x="978" y="260" class="h">Enumerate &amp; relax</text><text x="978" y="304" class="p">Generate candidates</text><text x="978" y="340" class="p">SevenNet MLIP relaxation</text><text x="978" y="382" class="small">Code computes quantities</text>
  <path d="M1240 310 H1335" class="arrow"/>
  <rect x="1345" y="210" width="190" height="200" class="box gate"/><text x="1377" y="260" class="h">Gates</text><text x="1377" y="304" class="small">Charge neutrality</text><text x="1377" y="336" class="small">Occupancy fidelity</text><text x="1377" y="368" class="small">Connectivity</text>
  <path d="M1440 410 V504 H1160" class="arrow"/>
  <rect x="760" y="500" width="400" height="180" class="box judge"/><text x="793" y="550" class="h">Judge result distribution</text><text x="793" y="594" class="p">Accept or tighten and rerun</text><text x="793" y="634" class="small">Judgment becomes a testable hypothesis</text>
  <path d="M760 590 H665" class="arrow"/>
  <rect x="335" y="500" width="330" height="180" class="box review"/><text x="368" y="550" class="h">Fresh-context review</text><text x="368" y="594" class="p">Find missing freedoms</text><text x="368" y="628" class="p">and inconsistencies</text><text x="368" y="654" class="small">Avoid self-certification</text>
  <path d="M500 680 V760 H742" class="arrow"/>
  <rect x="752" y="718" width="355" height="120" class="box out"/><text x="785" y="766" class="h">Certified model or refusal</text><text x="785" y="806" class="p">Machine-readable evidence and diagnostics</text>
  <path d="M945 500 V455 H645 V410" class="arrow" stroke="#b899eb"/><text x="683" y="446" class="small">Repeat after gate failure or anomalous distribution</text>
  <rect x="82" y="736" width="535" height="105" rx="18" fill="#111d2a" stroke="#567186" stroke-width="2"/><text x="110" y="775" class="small">Core rule: the LLM neither creates quantitative</text><text x="110" y="807" class="small">evidence nor certifies its own result; it judges between code.</text>
</svg>
