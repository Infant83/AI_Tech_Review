<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">큐비트의 물리계와 부호화와 오류정정</title>
  <desc id="desc">물리계, 부호화, 연결, 오류정정이 결합해 논리 계산을 이룬다. 보소닉 부호화는 초전도와 광자에서 모두 쓸 수 있다. 각 층의 숫자는 서로 다른 자원을 센다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#66756e"/></marker></defs>
  <rect width="1000" height="700" rx="16" fill="#f3f5f0"/>
  <g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" fill="#172b26">
    <text x="40" y="48" font-size="26" font-weight="700">큐비트를 만드는 네 가지 선택</text>
    <text x="40" y="80" font-size="18" fill="#50665e">물리계의 수와 부호화된 논리 큐비트 수는 서로 다른 지표다</text>
    <g fill="#fff" stroke="#c7d5cd" stroke-width="1.5">
      <rect x="40" y="108" width="920" height="102" rx="10"/>
      <rect x="40" y="244" width="920" height="102" rx="10"/>
      <rect x="40" y="380" width="920" height="102" rx="10"/>
      <rect x="40" y="516" width="920" height="102" rx="10"/>
    </g>
    <g fill="#0e7566"><rect x="40" y="108" width="10" height="102" rx="3"/><rect x="40" y="244" width="10" height="102" rx="3"/><rect x="40" y="380" width="10" height="102" rx="3"/><rect x="40" y="516" width="10" height="102" rx="3"/></g>
    <g font-size="21" font-weight="700"><text x="70" y="144">1 물리계</text><text x="70" y="280">2 부호화</text><text x="70" y="416">3 연결과 연산</text><text x="70" y="552">4 오류정정</text></g>
    <g font-size="20"><text x="268" y="145">이온 · 중성원자 · 초전도 회로 · 스핀 · 광자</text><text x="268" y="280">내부 상태 · 에너지 준위 · 경로 · 진동자 상태</text><text x="268" y="416">공유 운동 · Rydberg · 전기 결합 · 이동 · 간섭</text><text x="268" y="552">surface · color · qLDPC · 반복 부호 등</text></g>
    <g font-size="17" fill="#50665e"><text x="268" y="179">무엇이 정보를 담는가</text><text x="268" y="314">보소닉 부호화는 초전도 공진기와 광학 모드에 모두 가능</text><text x="268" y="450">어떻게 얽히게 하고 측정하며 다시 준비하는가</text><text x="268" y="586">검출 · 후선택 · 반복 정정 · 논리 연산을 구분</text></g>
    <g stroke="#66756e" stroke-width="2" marker-end="url(#arrow)"><path d="M500 214V234"/><path d="M500 350V370"/><path d="M500 486V506"/></g>
    <text x="500" y="660" text-anchor="middle" font-size="21" font-weight="700">평가 대상  목표 정확도에서의 논리 연산과 전체 실행비용</text>
    <text x="960" y="686" text-anchor="end" font-size="12" fill="#50665e">AI Tech Review · 개념도 · 2026-10-19</text>
  </g>
</svg>
