<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">디지털 학습과 물리적 실행의 경계</title><desc id="desc">Two training targets feed a digital parameter-learning stage, followed by proposed coupling programming, thermal evolution and timed readout. Demonstrations were numerical.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#32776e" stroke-width="1.7"/></marker></defs><rect width="900" height="460" rx="8" fill="#f0f4ee"/><g font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" fill="#193d40"><text x="30" y="38" font-size="19" font-weight="700">학습 비용과 실행 비용을 따로 기록하기</text><rect x="25" y="65" width="850" height="165" rx="8" fill="#e5eee5" stroke="#c5d5ca"/><text x="45" y="92" font-size="16" font-weight="700">디지털 학습 · 논문의 수치 시연</text><rect x="45" y="110" width="295" height="42" rx="8" fill="#fff" stroke="#c5d5ca"/><text x="60" y="137" font-size="15" font-weight="400">생성: 역방향 noising 경로</text><rect x="45" y="166" width="295" height="42" rx="8" fill="#fff" stroke="#c5d5ca"/><text x="60" y="193" font-size="15" font-weight="400">분류: 교사 네트워크의 경로</text><path d="M340 131L505 157" fill="none" stroke="#32776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 187L505 157" fill="none" stroke="#32776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="510" y="126" width="325" height="67" rx="8" fill="#fff" stroke="#c5d5ca"/><text x="530" y="153" font-size="15" font-weight="700">경로 우도에 맞춰 매개변수 학습</text><text x="530" y="178" font-size="14" font-weight="400">디지털 최적화 비용 포함</text><path d="M672 194L672 246" fill="none" stroke="#32776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="250" width="850" height="160" rx="8" fill="#f7eee2" stroke="#c5d5ca"/><text x="45" y="280" font-size="16" font-weight="700">제안된 물리적 실행 · 실물 검증 단계는 별도</text><rect x="45" y="305" width="245" height="78" rx="8" fill="#fff" stroke="#c5d5ca"/><text x="60" y="334" font-size="17" font-weight="700">결합 설정</text><text x="60" y="361" font-size="14" font-weight="400">입력·초기화</text><rect x="325" y="305" width="245" height="78" rx="8" fill="#fff" stroke="#c5d5ca"/><text x="340" y="334" font-size="17" font-weight="700">열적 동역학</text><text x="340" y="361" font-size="14" font-weight="400">힘 + 열잡음</text><rect x="605" y="305" width="245" height="78" rx="8" fill="#fff" stroke="#c5d5ca"/><text x="620" y="334" font-size="17" font-weight="700">유한시간 읽기</text><text x="620" y="361" font-size="14" font-weight="400">측정·리셋</text><path d="M292 345L320 345" fill="none" stroke="#32776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M572 345L600 345" fill="none" stroke="#32776e" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="440" font-size="13" font-weight="400">고전 확률 계산 · 소자 전력 실측이나 범용 LLM 구현을 나타내는 도식이 아님</text></g></svg>