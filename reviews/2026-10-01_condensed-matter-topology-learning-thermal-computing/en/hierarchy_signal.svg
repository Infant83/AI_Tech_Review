<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Hierarchy and sampling noise</title><desc id="desc">A meaning-preserving hierarchy is shown beside a signal-to-noise criterion. This is not a data chart.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#32776e" stroke-width="1.7"/></marker></defs><rect width="900" height="460" rx="8" fill="#f0f4ee"/><g font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" fill="#193d40"><text x="30" y="38" font-size="19" font-weight="700">COMBINATIONS AND LEARNABLE RULES ARE DIFFERENT COUNTS</text><rect x="25" y="65" width="470" height="345" rx="8" fill="#fff" stroke="#c5d5ca"/><rect x="515" y="65" width="360" height="345" rx="8" fill="#fff" stroke="#c5d5ca"/><text x="45" y="96" font-size="17" font-weight="700">Meaning-preserving substitutions</text><rect x="190" y="116" width="140" height="45" rx="8" fill="#d8e9df" stroke="#c5d5ca"/><text x="210" y="145" font-size="16" font-weight="700">Category</text><path d="M260 161L135 210" fill="none" stroke="#32776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="212" width="110" height="44" rx="8" fill="#d8e9df" stroke="#c5d5ca"/><text x="105" y="240" font-size="16" font-weight="400">Form A</text><path d="M260 161L360 210" fill="none" stroke="#32776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="315" y="212" width="110" height="44" rx="8" fill="#d8e9df" stroke="#c5d5ca"/><text x="330" y="240" font-size="16" font-weight="400">Form B</text><path d="M145 257L95 300" fill="none" stroke="#32776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="305" width="75" height="40" rx="8" fill="#fff" stroke="#c5d5ca"/><text x="70" y="331" font-size="13" font-weight="400">Token 1</text><path d="M145 257L195 300" fill="none" stroke="#32776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="160" y="305" width="75" height="40" rx="8" fill="#fff" stroke="#c5d5ca"/><text x="170" y="331" font-size="13" font-weight="400">Token 2</text><path d="M370 257L320 300" fill="none" stroke="#32776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="285" y="305" width="75" height="40" rx="8" fill="#fff" stroke="#c5d5ca"/><text x="295" y="331" font-size="13" font-weight="400">Token 3</text><path d="M370 257L420 300" fill="none" stroke="#32776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="385" y="305" width="75" height="40" rx="8" fill="#fff" stroke="#c5d5ca"/><text x="395" y="331" font-size="13" font-weight="400">Token 4</text><text x="45" y="385" font-size="14" font-weight="400">Same colour: equivalent higher-level meaning</text><text x="540" y="96" font-size="17" font-weight="700">When structure becomes visible</text><text x="545" y="153" font-size="25" font-weight="400">C(r) ∝ r⁻ᵝ</text><text x="545" y="199" font-size="23" font-weight="400">noise ∝ P⁻¹ᐟ²</text><path d="M545 225L837 225" fill="none" stroke="#32776e" stroke-width="2"/><text x="545" y="267" font-size="23" font-weight="700">signal &gt; noise</text><text x="545" y="317" font-size="23" font-weight="400">r* ∝ P¹ᐟ⁽²ᵝ⁾</text><text x="545" y="375" font-size="14" font-weight="400">Depends on sampling/model assumptions</text><text x="30" y="440" font-size="13" font-weight="400">Explanatory model · not the paper’s exact production rules or a measured learning curve</text></g></svg>