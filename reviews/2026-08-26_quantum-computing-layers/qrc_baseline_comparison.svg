<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">QRC와 고전 Ridge-AR의 PDE 예측 RMSE 비교</title>
  <desc id="desc">Burgers와 Kuramoto-Sivashinsky 문제에서 QRC, QRC와 물리 보정기, Ridge-AR의 RMSE를 비교하며 낮을수록 좋은 결과임을 보여주는 두 패널 막대그래프</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.panel{fill:#fff;stroke:#d8d5cb;stroke-width:2}.head{font:700 34px 'Noto Sans KR','Segoe UI',sans-serif;fill:#17211d}.sub{font:400 18px 'Noto Sans KR','Segoe UI',sans-serif;fill:#5f6b65}.pt{font:700 23px 'Noto Sans KR','Segoe UI',sans-serif;fill:#25456f}.lab{font:600 18px 'Noto Sans KR','Segoe UI',sans-serif;fill:#3b4842}.val{font:700 18px 'Noto Sans KR','Segoe UI',sans-serif;fill:#17211d}.note{font:600 17px 'Noto Sans KR','Segoe UI',sans-serif;fill:#8a4c16}.grid{stroke:#e5e1d8;stroke-width:1}.axis{font:400 14px 'Noto Sans KR','Segoe UI',sans-serif;fill:#7a847f}
    </style>
  </defs>
  <rect class="bg" width="1200" height="650" rx="22"/>
  <text class="head" x="58" y="62">Physics corrector는 QRC를 개선했지만 고전 기준선이 더 낮았습니다</text>
  <text class="sub" x="58" y="96">RMSE, 낮을수록 좋음 · 서로 다른 두 문제의 축 범위는 각각 표시했습니다.</text>

  <g transform="translate(48 132)">
    <rect class="panel" width="532" height="448" rx="16"/>
    <text class="pt" x="28" y="44">Burgers</text>
    <line class="grid" x1="155" y1="76" x2="155" y2="366"/><line class="grid" x1="245" y1="76" x2="245" y2="366"/><line class="grid" x1="335" y1="76" x2="335" y2="366"/><line class="grid" x1="425" y1="76" x2="425" y2="366"/>
    <text class="axis" x="155" y="392" text-anchor="middle">0.0</text><text class="axis" x="245" y="392" text-anchor="middle">0.1</text><text class="axis" x="335" y="392" text-anchor="middle">0.2</text><text class="axis" x="425" y="392" text-anchor="middle">0.3</text><text class="axis" x="505" y="392" text-anchor="middle">0.4</text>
    <text class="lab" x="28" y="132">QRC</text><rect x="155" y="106" width="322" height="38" rx="5" fill="#607d6b"/><text class="val" x="484" y="132">0.3578</text>
    <text class="lab" x="28" y="222">QRC+PIC</text><rect x="155" y="196" width="311" height="38" rx="5" fill="#0f766e"/><text class="val" x="473" y="222">0.3458</text>
    <text class="lab" x="28" y="312">Ridge-AR</text><rect x="155" y="286" width="58" height="38" rx="5" fill="#2563eb"/><text class="val" x="220" y="312">0.0644</text>
    <text class="note" x="28" y="426">Ridge-AR가 QRC+PIC보다 약 5.4배 낮은 RMSE</text>
  </g>

  <g transform="translate(620 132)">
    <rect class="panel" width="532" height="448" rx="16"/>
    <text class="pt" x="28" y="44">Kuramoto-Sivashinsky</text>
    <line class="grid" x1="155" y1="76" x2="155" y2="366"/><line class="grid" x1="245" y1="76" x2="245" y2="366"/><line class="grid" x1="335" y1="76" x2="335" y2="366"/><line class="grid" x1="425" y1="76" x2="425" y2="366"/>
    <text class="axis" x="155" y="392" text-anchor="middle">0.0</text><text class="axis" x="245" y="392" text-anchor="middle">0.4</text><text class="axis" x="335" y="392" text-anchor="middle">0.8</text><text class="axis" x="425" y="392" text-anchor="middle">1.2</text><text class="axis" x="505" y="392" text-anchor="middle">1.3</text>
    <text class="lab" x="28" y="132">QRC</text><rect x="155" y="106" width="332" height="38" rx="5" fill="#607d6b"/><text class="val" x="435" y="98">1.1971</text>
    <text class="lab" x="28" y="222">QRC+PIC</text><rect x="155" y="196" width="329" height="38" rx="5" fill="#0f766e"/><text class="val" x="432" y="188">1.1897</text>
    <text class="lab" x="28" y="312">Ridge-AR</text><rect x="155" y="286" width="326" height="38" rx="5" fill="#2563eb"/><text class="val" x="429" y="278">1.1777</text>
    <text class="note" x="28" y="426">세 방법은 가깝지만 Ridge-AR가 가장 낮은 RMSE</text>
  </g>
</svg>
