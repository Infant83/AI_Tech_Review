<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">보안민감 조직의 생성형 AI 운영 모델</title>
  <desc id="desc">데이터 등급과 사용 경로를 나누어 외부 SaaS, 사내 게이트웨이, 격리형 환경으로 연결하는 운영 모델</desc>
  <defs>
    <style>
      .bg{fill:#f8f7f3}
      .lane{fill:#fff;stroke:#d8d3c5;stroke-width:2}
      .low{fill:#eef7f1;stroke:#4a8f61;stroke-width:2}
      .mid{fill:#fff8e8;stroke:#c28a1a;stroke-width:2}
      .high{fill:#fff2f4;stroke:#a50034;stroke-width:2}
      .node{fill:#fff;stroke:#b9b5aa;stroke-width:2}
      .line{stroke:#5c5c55;stroke-width:2.6;fill:none;marker-end:url(#arrow)}
      .redLine{stroke:#a50034;stroke-width:3;fill:none;marker-end:url(#arrowRed)}
      .h{font-family:'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;font-size:30px;font-weight:700;fill:#242424}
      .t{font-family:'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;font-size:21px;font-weight:700;fill:#252525}
      .s{font-family:'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;font-size:17px;fill:#4f4f49}
      .mini{font-family:'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;font-size:15px;fill:#66625b}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5c5c55"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#a50034"/>
    </marker>
  </defs>
  <rect width="1200" height="760" class="bg"/>
  <text x="70" y="70" class="h">해법은 “쓸 수 있는 경로”를 빠르게 만드는 데 있습니다</text>
  <text x="70" y="108" class="s">도구명 목록보다 데이터 등급, 사용 목적, 로그, 검증 책임이 먼저입니다.</text>

  <rect x="70" y="155" width="250" height="458" rx="22" class="lane"/>
  <text x="100" y="202" class="t">1. 업무와 데이터 분류</text>
  <rect x="100" y="242" width="190" height="74" rx="16" class="low"/>
  <text x="122" y="274" class="s">공개·저위험</text>
  <text x="122" y="297" class="mini">공개자료, 일반 초안</text>
  <rect x="100" y="350" width="190" height="74" rx="16" class="mid"/>
  <text x="122" y="382" class="s">사내 일반·중위험</text>
  <text x="122" y="405" class="mini">내부 문서, 코드 보조</text>
  <rect x="100" y="458" width="190" height="92" rx="16" class="high"/>
  <text x="122" y="490" class="s">고위험·핵심기술</text>
  <text x="122" y="513" class="mini">개인정보, 공정, 설계</text>
  <text x="122" y="536" class="mini">소스코드, 규제 데이터</text>

  <rect x="420" y="155" width="310" height="458" rx="22" class="lane"/>
  <text x="450" y="202" class="t">2. 승인된 AI 사용 경로</text>
  <rect x="450" y="242" width="250" height="74" rx="16" class="node"/>
  <text x="475" y="274" class="s">승인된 외부 SaaS</text>
  <text x="475" y="297" class="mini">비식별·공개자료 중심</text>
  <rect x="450" y="350" width="250" height="74" rx="16" class="node"/>
  <text x="475" y="382" class="s">사내 AI 게이트웨이</text>
  <text x="475" y="405" class="mini">SSO, DLP, 로그, 라우팅</text>
  <rect x="450" y="458" width="250" height="92" rx="16" class="node"/>
  <text x="475" y="490" class="s">격리형 LLM/RAG</text>
  <text x="475" y="513" class="mini">온프레미스, 권한통제,</text>
  <text x="475" y="536" class="mini">감사 가능한 샌드박스</text>

  <rect x="820" y="155" width="310" height="458" rx="22" class="lane"/>
  <text x="850" y="202" class="t">3. 운영 기록과 팀 관리</text>
  <rect x="850" y="242" width="250" height="74" rx="16" class="node"/>
  <text x="875" y="274" class="s">산출물 검증</text>
  <text x="875" y="297" class="mini">출처, 사실성, 보안, 품질</text>
  <rect x="850" y="350" width="250" height="74" rx="16" class="node"/>
  <text x="875" y="382" class="s">프롬프트·데이터 로그</text>
  <text x="875" y="405" class="mini">재현성, 감사, 사고 대응</text>
  <rect x="850" y="458" width="250" height="92" rx="16" class="node"/>
  <text x="875" y="490" class="s">실제 AI 업무시간</text>
  <text x="875" y="513" class="mini">탐색, 검증, 승인 대응,</text>
  <text x="875" y="536" class="mini">야간 작업 경계 관리</text>

  <path d="M290 279 L450 279" class="line"/>
  <path d="M290 387 L450 387" class="line"/>
  <path d="M290 504 L450 504" class="redLine"/>
  <path d="M700 279 L850 279" class="line"/>
  <path d="M700 387 L850 387" class="line"/>
  <path d="M700 504 L850 504" class="redLine"/>

  <rect x="150" y="655" width="900" height="54" rx="18" class="high"/>
  <text x="190" y="689" class="s">성공 조건: 공식 경로가 개인 우회보다 빠르고 명확해야 합니다.</text>
</svg>
