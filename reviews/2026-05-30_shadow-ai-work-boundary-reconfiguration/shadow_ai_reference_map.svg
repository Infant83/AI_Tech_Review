<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Shadow AI 리뷰 참고자료 맵</title>
  <desc id="desc">업무 변화, 조직 성과, 보안 위험, 번아웃, 한국 제도 자료가 리뷰의 어떤 판단을 뒷받침하는지 보여주는 지도</desc>
  <defs>
    <style>
      .bg{fill:#faf9f5}
      .center{fill:#a50034}
      .card{fill:#fff;stroke:#d8d3c6;stroke-width:2}
      .line{stroke:#88837a;stroke-width:2.4;fill:none}
      .h{font-family:'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;font-size:29px;font-weight:700;fill:#242424}
      .c{font-family:'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;font-size:22px;font-weight:700;fill:#fff}
      .t{font-family:'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;font-size:20px;font-weight:700;fill:#252525}
      .s{font-family:'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;font-size:16px;fill:#555}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text x="70" y="66" class="h">참고자료는 업무, 성과, 보안, 노동, 제도 맥락을 나누어 받칩니다</text>

  <circle cx="600" cy="325" r="96" class="center"/>
  <text x="545" y="310" class="c">AI 역량</text>
  <text x="530" y="342" class="c">흡수 격차</text>

  <path d="M520 270 L310 185" class="line"/>
  <path d="M680 270 L890 185" class="line"/>
  <path d="M512 365 L305 455" class="line"/>
  <path d="M688 365 L895 455" class="line"/>
  <path d="M600 229 L600 130" class="line"/>

  <rect x="80" y="126" width="300" height="118" rx="18" class="card"/>
  <text x="112" y="166" class="t">업무 변화</text>
  <text x="112" y="196" class="s">Microsoft Work Trend Index</text>
  <text x="112" y="220" class="s">AI 사용과 에이전트 도입 기대</text>

  <rect x="450" y="88" width="300" height="102" rx="18" class="card"/>
  <text x="482" y="128" class="t">성과 전환</text>
  <text x="482" y="158" class="s">McKinsey State of AI</text>
  <text x="482" y="182" class="s">도입률과 가치 실현의 간격</text>

  <rect x="820" y="126" width="300" height="118" rx="18" class="card"/>
  <text x="852" y="166" class="t">보안 위험</text>
  <text x="852" y="196" class="s">Netskope, NIST, NIS/PIPC</text>
  <text x="852" y="220" class="s">데이터 흐름과 책임 체계</text>

  <rect x="80" y="402" width="300" height="118" rx="18" class="card"/>
  <text x="112" y="442" class="t">노동 부하</text>
  <text x="112" y="472" class="s">Upwork, Microsoft Infinite Workday</text>
  <text x="112" y="496" class="s">업무량, 야간 경계, 번아웃</text>

  <rect x="820" y="402" width="300" height="118" rx="18" class="card"/>
  <text x="852" y="442" class="t">한국 맥락</text>
  <text x="852" y="472" class="s">AI 기본법, 범정부 AI 공통기반</text>
  <text x="852" y="496" class="s">막기보다 안전한 경로 만들기</text>
</svg>
