<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Evidence map for the eight selected papers</title>
  <desc id="desc">A reviewer-constructed map places papers by proximity to OLED inverse design and by validation level, from method-only simulation to physics-based calculation and experimental comparison.</desc>
  <rect width="1200" height="680" rx="28" fill="#f5f7fb"/>
  <text x="80" y="54" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17233d">Evidence map · reviewer-constructed</text>
  <line x1="120" y1="590" x2="1120" y2="590" stroke="#58657d" stroke-width="2"/>
  <line x1="120" y1="590" x2="120" y2="110" stroke="#58657d" stroke-width="2"/>
  <text x="560" y="640" font-family="Arial,sans-serif" font-size="18" fill="#33405a">Closer to an OLED inverse-design workflow →</text>
  <text transform="translate(40 470) rotate(-90)" font-family="Arial,sans-serif" font-size="18" fill="#33405a">Demonstrated validation level →</text>
  <g font-family="Arial,sans-serif" font-size="14" fill="#657089">
    <text x="130" y="614">generic method</text><text x="980" y="614">photoactive materials</text>
    <text x="82" y="575" text-anchor="end">simulation</text><text x="82" y="130" text-anchor="end">experiment-linked</text>
  </g>
  <g stroke="#ffffff" stroke-width="3">
    <circle cx="1000" cy="175" r="42" fill="#e69a3b"/><circle cx="930" cy="270" r="39" fill="#35a6a1"/>
    <circle cx="770" cy="305" r="38" fill="#4e73c2"/><circle cx="660" cy="390" r="38" fill="#6a5fb5"/>
    <circle cx="530" cy="330" r="37" fill="#4e73c2"/><circle cx="420" cy="440" r="37" fill="#6a5fb5"/>
    <circle cx="300" cy="285" r="38" fill="#35a6a1"/><circle cx="255" cy="505" r="38" fill="#9b5c86"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">
    <text x="1000" y="170"><tspan x="1000">Singlet</tspan><tspan x="1000" dy="17">fission</tspan></text>
    <text x="930" y="266"><tspan x="930">Triplet</tspan><tspan x="930" dy="17">coherence</tspan></text>
    <text x="770" y="301"><tspan x="770">DMRG</tspan><tspan x="770" dy="17">+ ML</tspan></text>
    <text x="660" y="386"><tspan x="660">QALPA</tspan><tspan x="660" dy="17">diffusion</tspan></text>
    <text x="530" y="326"><tspan x="530">MR-QC</tspan><tspan x="530" dy="17">agent</tspan></text>
    <text x="420" y="436"><tspan x="420">Fraglingo</tspan><tspan x="420" dy="17">retrieval</tspan></text>
    <text x="300" y="281"><tspan x="300">nonlocal</tspan><tspan x="300" dy="17">TDDFT</tspan></text>
    <text x="255" y="501"><tspan x="255">VQE</tspan><tspan x="255" dy="17">leakage</tspan></text>
  </g>
  <g font-family="Arial,sans-serif" font-size="13" fill="#33405a">
    <text x="908" y="225">TDDFT sample, no synthesis/device</text>
    <text x="804" y="325">first-principles host–guest model</text>
    <text x="644" y="352">large-D reference, classical</text>
    <text x="530" y="437">DFTB3+MBD labels</text>
    <text x="409" y="283">558-transition benchmark</text>
    <text x="290" y="482">property benchmark only</text>
    <text x="170" y="235">experimental spectra</text>
    <text x="145" y="555">noiseless statevector</text>
  </g>
</svg>
