<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Placing a bounded quantum kernel in an OLED and materials workflow</title>
  <desc id="desc">A workflow that narrows chemical space with a validated classical backbone and considers a quantum kernel only for a residual bottleneck</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#66847d"/></marker>
    <style>
      .bg{fill:#fbfaf7}.title{font:700 29px Arial,sans-serif;fill:#17211d}.sub{font:400 16px Arial,sans-serif;fill:#5f6b65}.lane{font:700 15px Arial,sans-serif;fill:#0f766e}.box{fill:#fff;stroke:#d8d5cb;stroke-width:1.5}.qbox{fill:#e9eef5;stroke:#8ca5c5;stroke-width:1.5}.decision{fill:#e9f3ef;stroke:#82b6aa;stroke-width:1.5}.head{font:700 17px Arial,sans-serif;fill:#17211d}.body{font:400 14px Arial,sans-serif;fill:#43514b}.small{font:400 13px Arial,sans-serif;fill:#5f6b65}.anchor{fill:#f6eee2;stroke:#d9b987}.anchorhead{font:700 15px Arial,sans-serif;fill:#a35a16}.arrow{stroke:#66847d;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.gate{stroke:#a35a16;stroke-width:2;stroke-dasharray:6 5}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="55" y="55">A bounded quantum kernel in an OLED and materials workflow</text>
  <text class="sub" x="55" y="84">A quantum module is a testable candidate for a residual bottleneck—not a replacement for the entire pipeline.</text>

  <rect class="anchor" x="55" y="112" rx="10" width="505" height="82"/>
  <text class="anchorhead" x="77" y="140">CLASSICAL ANCHOR · KS-FNO</text>
  <text class="body" x="77" y="165">8,504 systems · max. 82,500 valence electrons · 1×B300</text>
  <text class="small" x="77" y="184">Ground-state-density evidence; not S1/T1, SOC, or rate constants.</text>
  <rect class="anchor" x="585" y="112" rx="10" width="560" height="82"/>
  <text class="anchorhead" x="607" y="140">CIRCUIT ANCHOR · Classiq phase oracle</text>
  <text class="body" x="607" y="165">12 address qubits · 1,097 marked coordinates · depth → CX</text>
  <text class="small" x="607" y="184">Oracle synthesis case; not an OLED calculation or QPU result.</text>

  <text class="lane" x="55" y="244">CLASSICAL BACKBONE</text>
  <rect class="box" x="55" y="262" rx="10" width="170" height="92"/>
  <text class="head" x="140" y="292" text-anchor="middle">Chemical space</text>
  <text class="body" x="140" y="318" text-anchor="middle">Structure, synthesis</text>
  <text class="body" x="140" y="339" text-anchor="middle">host/dopant candidates</text>
  <path class="arrow" d="M225 308 H262"/>
  <rect class="box" x="265" y="262" rx="10" width="200" height="92"/>
  <text class="head" x="365" y="292" text-anchor="middle">DFT/TDDFT/ML</text>
  <text class="body" x="365" y="318" text-anchor="middle">S1, T1, ΔEST, SOC</text>
  <text class="body" x="365" y="339" text-anchor="middle">kr, knr, stability</text>
  <path class="arrow" d="M465 308 H502"/>
  <rect class="box" x="505" y="262" rx="10" width="190" height="92"/>
  <text class="head" x="600" y="292" text-anchor="middle">Validated baseline</text>
  <text class="body" x="600" y="318" text-anchor="middle">Error and wall-clock</text>
  <text class="body" x="600" y="339" text-anchor="middle">Versioned data/code</text>
  <path class="arrow" d="M695 308 H732"/>
  <rect class="decision" x="735" y="250" rx="10" width="195" height="116"/>
  <text class="head" x="832" y="284" text-anchor="middle">Residual bottleneck?</text>
  <text class="body" x="832" y="312" text-anchor="middle">Strong-correlation space</text>
  <text class="body" x="832" y="333" text-anchor="middle">State selection/sampling</text>
  <text class="body" x="832" y="354" text-anchor="middle">Combinatorial search</text>
  <path class="arrow" d="M930 308 H972"/>
  <rect class="box" x="975" y="262" rx="10" width="170" height="92"/>
  <text class="head" x="1060" y="292" text-anchor="middle">Material decision</text>
  <text class="body" x="1060" y="318" text-anchor="middle">Ranking and selection</text>
  <text class="body" x="1060" y="339" text-anchor="middle">Experimental validation</text>

  <line class="gate" x1="832" y1="366" x2="832" y2="412"/>
  <text class="lane" x="55" y="442">BOUNDED QUANTUM BRANCH · ONLY AFTER THE RESIDUAL IS DEFINED</text>
  <rect class="qbox" x="140" y="462" rx="10" width="190" height="100"/>
  <text class="head" x="235" y="493" text-anchor="middle">Bound the problem</text>
  <text class="body" x="235" y="519" text-anchor="middle">Active space / oracle</text>
  <text class="body" x="235" y="541" text-anchor="middle">Fix error tolerance</text>
  <path class="arrow" d="M330 512 H372"/>
  <rect class="qbox" x="375" y="462" rx="10" width="190" height="100"/>
  <text class="head" x="470" y="493" text-anchor="middle">Encode and prepare</text>
  <text class="body" x="470" y="519" text-anchor="middle">Data-loading cost</text>
  <text class="body" x="470" y="541" text-anchor="middle">Ancilla/success rate</text>
  <path class="arrow" d="M565 512 H607"/>
  <rect class="qbox" x="610" y="462" rx="10" width="190" height="100"/>
  <text class="head" x="705" y="493" text-anchor="middle">Synthesize and run</text>
  <text class="body" x="705" y="519" text-anchor="middle">2Q depth/SWAP</text>
  <text class="body" x="705" y="541" text-anchor="middle">Shots/queue time</text>
  <path class="arrow" d="M800 512 H842"/>
  <rect class="qbox" x="845" y="462" rx="10" width="190" height="100"/>
  <text class="head" x="940" y="493" text-anchor="middle">Read and postprocess</text>
  <text class="body" x="940" y="519" text-anchor="middle">Assignment error</text>
  <text class="body" x="940" y="541" text-anchor="middle">Mitigation/postselection</text>

  <path class="arrow" d="M940 562 V610 H1060 V578"/>
  <rect class="decision" x="655" y="612" rx="10" width="490" height="98"/>
  <text class="head" x="680" y="642">END-TO-END VERDICT</text>
  <text class="body" x="680" y="668">Matched scientific accuracy · wall-clock · shots/readout/mitigation</text>
  <text class="body" x="680" y="691">Total cost/energy · uncertainty/reproducibility · classical baseline</text>
  <text class="small" x="55" y="725">Quantum advantage requires a matched comparison including encoding, preprocessing, measurement, and postprocessing.</text>
</svg>
