<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Evidence map for the 28 August to 3 September 2026 OLED inverse-design literature window</title>
  <desc id="desc">Eight preprints are arranged from direct OLED relevance to enabling-method relevance, with badges distinguishing source-reported simulations, classical calculations, and actual QPU execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#101c35"/></linearGradient>
    <style>
      .t{font:700 34px Arial,sans-serif;fill:#f7fafc}.s{font:20px Arial,sans-serif;fill:#b9c8df}.h{font:700 19px Arial,sans-serif;fill:#f7fafc}.b{font:16px Arial,sans-serif;fill:#d8e2f0}.n{font:700 19px Arial,sans-serif;fill:#081426}.k{font:700 14px Arial,sans-serif;fill:#081426}.axis{font:700 17px Arial,sans-serif;fill:#9fb2ce}
    </style>
  </defs>
  <rect width="1440" height="810" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" class="t">Evidence proximity and execution boundary</text>
  <text x="70" y="105" class="s">Reviewer-constructed map; placement is qualitative, while badges report the source's actual execution setting.</text>
  <line x1="110" y1="690" x2="1330" y2="690" stroke="#47617e" stroke-width="3"/>
  <text x="110" y="730" class="axis">General enabling method</text><text x="1120" y="730" class="axis">Closer to OLED workflow</text>
  <path d="M1080 690 L1330 690 L1312 678 M1330 690 L1312 702" fill="none" stroke="#7dd3fc" stroke-width="3"/>

  <g transform="translate(1030 180)"><rect width="320" height="168" rx="22" fill="#143754" stroke="#67e8f9" stroke-width="3"/><circle cx="34" cy="35" r="20" fill="#67e8f9"/><text x="28" y="42" class="n">1</text><text x="66" y="38" class="h">LUSH</text><text x="24" y="75" class="b">Latent multi-state Hamiltonian</text><text x="24" y="103" class="b">Excited energies + oscillator strength</text><rect x="24" y="124" width="190" height="26" rx="13" fill="#67e8f9"/><text x="39" y="142" class="k">CLASSICAL ML / TDDFT DATA</text></g>
  <g transform="translate(690 150)"><rect width="300" height="150" rx="22" fill="#1f3156" stroke="#a78bfa" stroke-width="2"/><circle cx="34" cy="35" r="20" fill="#a78bfa"/><text x="28" y="42" class="n">2</text><text x="66" y="38" class="h">QED-GW/BSE</text><text x="24" y="75" class="b">Cavity quasiparticles and excitons</text><rect x="24" y="106" width="160" height="26" rx="13" fill="#a78bfa"/><text x="39" y="124" class="k">CLASSICAL THEORY</text></g>
  <g transform="translate(760 360)"><rect width="300" height="150" rx="22" fill="#1a3b4d" stroke="#5eead4" stroke-width="2"/><circle cx="34" cy="35" r="20" fill="#5eead4"/><text x="28" y="42" class="n">3</text><text x="66" y="38" class="h">AdaptNTK</text><text x="24" y="75" class="b">Single-model uncertainty + selection</text><rect x="24" y="106" width="160" height="26" rx="13" fill="#5eead4"/><text x="39" y="124" class="k">CLASSICAL ML</text></g>
  <g transform="translate(410 330)"><rect width="300" height="150" rx="22" fill="#3c2c1c" stroke="#fbbf24" stroke-width="2"/><circle cx="34" cy="35" r="20" fill="#fbbf24"/><text x="28" y="42" class="n">4</text><text x="66" y="38" class="h">MAELLE</text><text x="24" y="75" class="b">Electron-occupation reaction flow</text><rect x="24" y="106" width="170" height="26" rx="13" fill="#fbbf24"/><text x="39" y="124" class="k">CLASSICAL GENERATION</text></g>
  <g transform="translate(350 520)"><rect width="300" height="140" rx="22" fill="#293a52" stroke="#93c5fd" stroke-width="2"/><circle cx="34" cy="35" r="20" fill="#93c5fd"/><text x="28" y="42" class="n">5</text><text x="66" y="38" class="h">HiPoly</text><text x="24" y="75" class="b">Hierarchical generation + MD check</text><rect x="24" y="100" width="160" height="26" rx="13" fill="#93c5fd"/><text x="39" y="118" class="k">CLASSICAL ML / MD</text></g>
  <g transform="translate(80 500)"><rect width="250" height="150" rx="22" fill="#31294d" stroke="#c4b5fd" stroke-width="2"/><circle cx="34" cy="35" r="20" fill="#c4b5fd"/><text x="28" y="42" class="n">6</text><text x="66" y="38" class="h">LiFT</text><text x="24" y="75" class="b">Language-conditioned 3D flow</text><rect x="24" y="106" width="148" height="26" rx="13" fill="#c4b5fd"/><text x="39" y="124" class="k">CLASSICAL ML</text></g>
  <g transform="translate(80 200)"><rect width="270" height="170" rx="22" fill="#3c2c31" stroke="#fb7185" stroke-width="2"/><circle cx="34" cy="35" r="20" fill="#fb7185"/><text x="28" y="42" class="n">7</text><text x="66" y="38" class="h">D-Wave t-VMC</text><text x="24" y="75" class="b">Classical emulation of annealing</text><text x="24" y="101" class="b">N=72: about 7.6% correlation error</text><rect x="24" y="126" width="206" height="26" rx="13" fill="#fb7185"/><text x="39" y="144" class="k">CLASSICAL GPU SIMULATION</text></g>
  <g transform="translate(390 130)"><rect width="260" height="160" rx="22" fill="#29344d" stroke="#60a5fa" stroke-width="2"/><circle cx="34" cy="35" r="20" fill="#60a5fa"/><text x="28" y="42" class="n">8</text><text x="66" y="38" class="h">Torsion VQE</text><text x="24" y="75" class="b">6 logical qubits; 600 QPU jobs</text><text x="24" y="101" class="b">Warm-started, no QPU optimization</text><rect x="24" y="120" width="150" height="26" rx="13" fill="#60a5fa"/><text x="39" y="138" class="k">ACTUAL QPU SAMPLING</text></g>
  <rect x="1060" y="540" width="290" height="90" rx="18" fill="#102942" stroke="#47617e"/><text x="1084" y="573" class="h">Direct OLED papers</text><text x="1084" y="605" class="b">None met this week's cutoff.</text>
</svg>
