<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">전문화의 설계 선택과 평가 조건</title><desc id="desc">연산 정밀도, 데이터 위치, 실행 통신의 세 선택을 병렬로 설명한다. CPU에서 QPU로 올라가는 효율 순위나 측정 곡선을 제시하지 않는다.</desc>
<defs><style>
.bg{fill:#fbfcfd}.panel{fill:#fff;stroke:#d8e0e6;stroke-width:2}
.title{font:700 40px Arial,sans-serif;fill:#20252b}.deck{font:400 27px Arial,sans-serif;fill:#56616d}
.name{font:700 36px Arial,sans-serif;fill:#20252b}.body{font:400 26px Arial,sans-serif;fill:#30363d}
.label{font:700 23px Arial,sans-serif;fill:#a50034}.note{font:400 25px Arial,sans-serif;fill:#56616d}
.rule{stroke:#d8e0e6;stroke-width:2}.accent{fill:#a50034}
</style></defs>
<rect class="bg" width="1600" height="1000"/>
<text x="70" y="95" class="title">전문화의 이득은 작업 조건과 함께 읽습니다</text>
<text x="70" y="145" class="deck">서로 다른 설계는 다른 비용을 줄입니다. 그 이득은 같은 작업과 품질 목표에서 비교해야 합니다.</text>
<rect class="panel" x="70" y="210" width="460" height="600" rx="20"/>
<rect class="accent" x="98" y="240" width="48" height="5" rx="2"/>
<text x="98" y="300" class="name">연산과 정밀도</text>
<text x="98" y="360" class="label">설계 선택</text>
<text x="98" y="408" class="body">행렬·벡터 연산에 맞춘 배열</text>
<text x="98" y="451" class="body">낮은 정밀도의 수 표현</text>
<line class="rule" x1="98" y1="480" x2="502" y2="480"/>
<text x="98" y="530" class="label">기대하는 변화</text>
<text x="98" y="576" class="body">연산 처리 효율·전송량 개선</text>
<line class="rule" x1="98" y1="615" x2="502" y2="615"/>
<text x="98" y="665" class="label">평가할 조건</text>
<text x="98" y="713" class="body">목표 품질·지원 연산</text>
<text x="98" y="756" class="body">정밀도와 양자화 오차</text>
<rect class="panel" x="570" y="210" width="460" height="600" rx="20"/>
<rect class="accent" x="598" y="240" width="48" height="5" rx="2"/>
<text x="598" y="300" class="name">데이터의 위치</text>
<text x="598" y="360" class="label">설계 선택</text>
<text x="598" y="408" class="body">SRAM·HBM·캐시의 배치</text>
<text x="598" y="451" class="body">가까운 메모리와 데이터 재사용</text>
<line class="rule" x1="598" y1="480" x2="1002" y2="480"/>
<text x="598" y="530" class="label">기대하는 변화</text>
<text x="598" y="576" class="body">대기·데이터 이동 부담 감소</text>
<line class="rule" x1="598" y1="615" x2="1002" y2="615"/>
<text x="598" y="665" class="label">평가할 조건</text>
<text x="598" y="713" class="body">모델 크기·메모리 용량</text>
<text x="598" y="756" class="body">대역폭·데이터 재사용률</text>
<rect class="panel" x="1070" y="210" width="460" height="600" rx="20"/>
<rect class="accent" x="1098" y="240" width="48" height="5" rx="2"/>
<text x="1098" y="300" class="name">실행과 통신</text>
<text x="1098" y="360" class="label">설계 선택</text>
<text x="1098" y="408" class="body">컴파일·스케줄·라우팅</text>
<text x="1098" y="451" class="body">칩과 노드 사이의 연결</text>
<line class="rule" x1="1098" y1="480" x2="1502" y2="480"/>
<text x="1098" y="530" class="label">기대하는 변화</text>
<text x="1098" y="576" class="body">사용률·응답 지연 개선</text>
<line class="rule" x1="1098" y1="615" x2="1502" y2="615"/>
<text x="1098" y="665" class="label">평가할 조건</text>
<text x="1098" y="713" class="body">요청 패턴·모델 변경</text>
<text x="1098" y="756" class="body">통신량·개발·운영 비용</text>
<text x="70" y="890" class="deck">비교량: 전체 지연 · 처리량/전력 · 사용률 · 비용/토큰 · 목표 품질</text>
<text x="70" y="942" class="note">개념 도식 · 칩 종류별 보편적 효율 순위나 저자 측정값이 아닙니다. QPU 등은 해당 알고리즘의 별도 자원·검증이 필요합니다.</text>
</svg>
