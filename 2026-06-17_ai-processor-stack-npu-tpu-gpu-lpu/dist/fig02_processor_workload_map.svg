<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
<title id="title">AI 처리장치의 역할과 검토 조건</title><desc id="desc">여덟 처리장치의 역할을 같은 크기의 카드로 병치한다. 배치에는 성능 순위나 수치 축이 없다.</desc>
<defs><style>
.bg{fill:#fbfcfd}.panel{fill:#fff;stroke:#d8e0e6;stroke-width:2}
.title{font:700 40px Arial,sans-serif;fill:#20252b}.deck{font:400 27px Arial,sans-serif;fill:#56616d}
.name{font:700 36px Arial,sans-serif;fill:#20252b}.body{font:400 26px Arial,sans-serif;fill:#30363d}
.label{font:700 23px Arial,sans-serif;fill:#a50034}.note{font:400 25px Arial,sans-serif;fill:#56616d}
.rule{stroke:#d8e0e6;stroke-width:2}.accent{fill:#a50034}
</style></defs>
<rect class="bg" width="1600" height="1080"/>
<text x="70" y="95" class="title">계산과 데이터의 경로에 맞춰 역할이 나뉩니다</text>
<text x="70" y="145" class="deck">한 시스템이 여러 역할을 조합합니다. 카드의 위치와 크기는 성능을 나타내지 않습니다.</text>
<rect class="panel" x="70" y="200" width="345" height="350" rx="18"/>
<rect class="accent" x="94" y="228" width="42" height="5" rx="2"/>
<text x="94" y="284" class="name">CPU</text>
<text x="94" y="340" class="body">분기·예외·운영체제</text>
<text x="94" y="382" class="body">데이터 준비와 작업 조율</text>
<line class="rule" x1="94" y1="420" x2="391" y2="420"/>
<text x="94" y="464" class="label">함께 살필 조건</text>
<text x="94" y="508" class="note">제어 흐름과 데이터 위치</text>
<rect class="panel" x="445" y="200" width="345" height="350" rx="18"/>
<rect class="accent" x="469" y="228" width="42" height="5" rx="2"/>
<text x="469" y="284" class="name">GPU</text>
<text x="469" y="340" class="body">행렬·텐서 대량 병렬</text>
<text x="469" y="382" class="body">학습·추론·과학 계산</text>
<line class="rule" x1="469" y1="420" x2="766" y2="420"/>
<text x="469" y="464" class="label">함께 살필 조건</text>
<text x="469" y="508" class="note">사용률·메모리·통신</text>
<rect class="panel" x="820" y="200" width="345" height="350" rx="18"/>
<rect class="accent" x="844" y="228" width="42" height="5" rx="2"/>
<text x="844" y="284" class="name">TPU</text>
<text x="844" y="340" class="body">행렬 데이터플로</text>
<text x="844" y="382" class="body">클라우드 ML 학습·추론</text>
<line class="rule" x1="844" y1="420" x2="1141" y2="420"/>
<text x="844" y="464" class="label">함께 살필 조건</text>
<text x="844" y="508" class="note">모델 연산과 컴파일 경로</text>
<rect class="panel" x="1195" y="200" width="345" height="350" rx="18"/>
<rect class="accent" x="1219" y="228" width="42" height="5" rx="2"/>
<text x="1219" y="284" class="name">NPU</text>
<text x="1219" y="340" class="body">작은 전력 예산의 추론</text>
<text x="1219" y="382" class="body">센서·모바일·PC의 로컬 AI</text>
<line class="rule" x1="1219" y1="420" x2="1516" y2="420"/>
<text x="1219" y="464" class="label">함께 살필 조건</text>
<text x="1219" y="508" class="note">지원 연산·전력·발열</text>
<rect class="panel" x="70" y="590" width="345" height="350" rx="18"/>
<rect class="accent" x="94" y="618" width="42" height="5" rx="2"/>
<text x="94" y="674" class="name">LPU</text>
<text x="94" y="730" class="body">언어모델 토큰 처리</text>
<text x="94" y="772" class="body">정적 스케줄·SRAM</text>
<line class="rule" x1="94" y1="810" x2="391" y2="810"/>
<text x="94" y="854" class="label">함께 살필 조건</text>
<text x="94" y="898" class="note">모델 적합성·서비스 지연</text>
<rect class="panel" x="445" y="590" width="345" height="350" rx="18"/>
<rect class="accent" x="469" y="618" width="42" height="5" rx="2"/>
<text x="469" y="674" class="name">DPU</text>
<text x="469" y="730" class="body">네트워크·스토리지</text>
<text x="469" y="772" class="body">보안·가상화 오프로드</text>
<line class="rule" x1="469" y1="810" x2="766" y2="810"/>
<text x="469" y="854" class="label">함께 살필 조건</text>
<text x="469" y="898" class="note">호스트 연결·격리</text>
<rect class="panel" x="820" y="590" width="345" height="350" rx="18"/>
<rect class="accent" x="844" y="618" width="42" height="5" rx="2"/>
<text x="844" y="674" class="name">FPGA</text>
<text x="844" y="730" class="body">재구성 가능한 회로</text>
<text x="844" y="772" class="body">신호처리·ML 연산</text>
<line class="rule" x1="844" y1="810" x2="1141" y2="810"/>
<text x="844" y="854" class="label">함께 살필 조건</text>
<text x="844" y="898" class="note">설계·타이밍·재구성 비용</text>
<rect class="panel" x="1195" y="590" width="345" height="350" rx="18"/>
<rect class="accent" x="1219" y="618" width="42" height="5" rx="2"/>
<text x="1219" y="674" class="name">QPU</text>
<text x="1219" y="730" class="body">양자 상태·측정</text>
<text x="1219" y="772" class="body">알고리즘·오류정정</text>
<line class="rule" x1="1219" y1="810" x2="1516" y2="810"/>
<text x="1219" y="854" class="label">함께 살필 조건</text>
<text x="1219" y="898" class="note">논리·물리 자원·검증 비용</text>
<text x="70" y="1010" class="note">개념 도식 · 실제 효율·지연은 모델·정밀도·데이터 위치와 소프트웨어 조건에서 평가합니다.</text>
</svg>
