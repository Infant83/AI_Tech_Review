<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img"><title>Classical and quantum Hamiltonian blocks</title><rect width="760" height="400" fill="#fff"/><g font-family="Arial, Noto Sans KR, sans-serif" fill="#17211d"><text x="204" y="47" text-anchor="middle" font-size="22">C</text><text x="125" y="102" text-anchor="middle" font-size="22">C</text><text x="292" y="47" text-anchor="middle" font-size="22">q₁</text><text x="125" y="172" text-anchor="middle" font-size="22">q₁</text><text x="380" y="47" text-anchor="middle" font-size="22">q₂</text><text x="125" y="242" text-anchor="middle" font-size="22">q₂</text><rect x="162" y="61" width="84" height="66" fill="#25456f"/><text x="204" y="103" font-size="23" text-anchor="middle" fill="white">E꜀</text><rect x="250" y="61" width="84" height="66" fill="#dceee7"/><text x="292" y="103" font-size="23" text-anchor="middle" fill="#0f5d55">V₁</text><rect x="338" y="61" width="84" height="66" fill="#dceee7"/><text x="380" y="103" font-size="23" text-anchor="middle" fill="#0f5d55">V₂</text><rect x="162" y="131" width="84" height="66" fill="#dceee7"/><text x="204" y="173" font-size="23" text-anchor="middle" fill="#0f5d55">V₁*</text><rect x="250" y="131" width="84" height="66" fill="#dceee7"/><text x="292" y="173" font-size="23" text-anchor="middle" fill="#0f5d55">H₁₁</text><rect x="338" y="131" width="84" height="66" fill="#dceee7"/><text x="380" y="173" font-size="23" text-anchor="middle" fill="#0f5d55">H₁₂</text><rect x="162" y="201" width="84" height="66" fill="#dceee7"/><text x="204" y="243" font-size="23" text-anchor="middle" fill="#0f5d55">V₂*</text><rect x="250" y="201" width="84" height="66" fill="#dceee7"/><text x="292" y="243" font-size="23" text-anchor="middle" fill="#0f5d55">H₂₁</text><rect x="338" y="201" width="84" height="66" fill="#dceee7"/><text x="380" y="243" font-size="23" text-anchor="middle" fill="#0f5d55">H₂₂</text><rect x="466" y="88" width="15" height="15" fill="#25456f"/><text x="493" y="101" font-size="16">Classically known block</text><rect x="466" y="150" width="15" height="15" fill="#dceee7" stroke="#0f766e"/><text x="493" y="163" font-size="16">Quantum-measured entries</text><text x="466" y="221" font-size="18">⟨C|qᵢ⟩ = 0;  ⟨qᵢ|qⱼ⟩ = δᵢⱼ</text><line x1="48" y1="297" x2="712" y2="297" stroke="#d8d5cb"/><text x="380" y="331" text-anchor="middle" font-size="18">Zero overlap does not mean zero Hamiltonian coupling</text><text x="380" y="367" text-anchor="middle" fill="#5f6b65" font-size="16">Classical diagonalization gives coefficients and energies</text></g></svg>