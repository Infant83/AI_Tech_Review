<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="2035" viewBox="0 0 720 2035" role="img" aria-labelledby="title desc"><title id="title">연구 의도를 다시 실행할 수 있는 계산으로</title><desc id="desc">사람이 정한 물성과 기준을 에이전트의 그래프 또는 맞춤 코드 기획에 연결하고 검증된 수치 도구, 결과와 실패 기록으로 이어지는 일반화한 설계.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#566c70" stroke-width="1.3"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#223c44}.muted{fill:#566c70}.bold{font-weight:700}.teal{fill:#236366}.coral{fill:#9a4e33}</style>
<rect x="0" y="0" width="720" height="2035" rx="0" fill="#f7f5ef" stroke="none"/>
<text x="36" y="49" font-size="21" class="bold teal" text-anchor="start">05</text>
<text x="84" y="49" font-size="30" class="bold" text-anchor="start">의도에서 결과, 다시 쓸 절차까지</text>
<text x="36" y="94" font-size="24" class="muted" text-anchor="start">한 결정의 진동 계산으로 읽는 일반화한 설계</text>
<circle cx="50" cy="169" r="14" fill="#223c44" stroke="none" stroke-width="1.5"/>
