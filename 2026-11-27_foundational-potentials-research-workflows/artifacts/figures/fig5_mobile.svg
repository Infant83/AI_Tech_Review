<text x="36" y="243" font-size="25" class="bold" text-anchor="start">“이 결정의 진동을 검증해 달라”</text>
<text x="36" y="281" font-size="25" class="bold" text-anchor="start">구조·전자 상태·모델·변위·허용 오차</text>
