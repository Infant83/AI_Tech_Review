<text x="150" y="790" font-size="22" class="bold stage-1" text-anchor="middle">이완과 입력 검사</text>
<text x="439" y="756" font-size="22" class="bold stage-2" text-anchor="middle">F(R±δ)</text>
<text x="439" y="790" font-size="22" class="bold stage-2" text-anchor="middle">힘의 독립 참조 검증</text>
