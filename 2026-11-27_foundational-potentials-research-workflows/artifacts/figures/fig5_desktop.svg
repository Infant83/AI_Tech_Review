<text x="94" y="926" font-size="23" class="bold" text-anchor="start">구조 · 힘 · 힘상수 · 진동수</text>
<text x="94" y="961" font-size="23" class="bold" text-anchor="start">모델·입력·코드·단위·검증 이력</text>
<text x="663" y="932" font-size="35" class="bold coral" text-anchor="start">×</text>
<text x="708" y="926" font-size="23" class="" text-anchor="start">실패 단계 · 입력 · 재시도 조건</text>
<text x="708" y="961" font-size="23" class="" text-anchor="start">추가 참조 자료와 절차 개선으로 환류</text>
<path d="M1110 1007 V1047 H106 V1008" stroke="#387a7d" stroke-width="2" fill="none"/>
<text x="598" y="1096" font-size="24" class="bold teal" text-anchor="middle">다음 연구에서 재사용: 검증한 함수 + 판본이 묶인 결과 + 개선한 절차</text>
<text x="44" y="1140" font-size="21" class="muted" text-anchor="start">개념 설계 · Potente의 역할 분리를 참고해 진동 계산을 구체화했다.</text>
