<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc"><title id="title">연구 의도를 다시 실행할 수 있는 계산으로</title><desc id="desc">사람이 정한 물성과 기준을 에이전트의 그래프 또는 맞춤 코드 기획에 연결하고 검증된 수치 도구, 결과와 실패 기록으로 이어지는 일반화한 설계.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#566c70" stroke-width="1.3"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#223c44}.muted{fill:#566c70}.bold{font-weight:700}.teal{fill:#236366}.coral{fill:#9a4e33}</style>
<rect x="0" y="0" width="1200" height="1160" rx="0" fill="#f7f5ef" stroke="none"/>
<text x="44" y="49" font-size="21" class="bold teal" text-anchor="start">05</text>
<text x="92" y="49" font-size="33" class="bold" text-anchor="start">의도에서 결과, 다시 쓸 절차까지</text>
<text x="44" y="94" font-size="24" class="muted" text-anchor="start">사람의 물리적 판단 + 에이전트 기획 + 검증한 수치 실행</text>
<circle cx="58" cy="156" r="14" fill="#223c44" stroke="none" stroke-width="1.5"/>
<text x="58" y="162" font-size="18" class="bold" text-anchor="middle" style="fill:#f7f5ef">A</text>
<text x="86" y="165" font-size="26" class="bold" text-anchor="start">사람이 질문과 물리적 기준을 정한다</text>
<line x1="44" y1="185" x2="1156" y2="185" stroke="#ccd5d1" stroke-width="1.5"/>
<text x="44" y="233" font-size="25" class="bold" text-anchor="start">“이 결정의 진동을 검증해 달라”</text>
<text x="44" y="271" font-size="25" class="bold" text-anchor="start">구조 · 전자 상태 · 모델 · 변위 · 허용 오차</text>
<line x1="610" y1="251" x2="668" y2="251" stroke="#566c70" stroke-width="2" marker-end="url(#arrow)"/>
<text x="714" y="231" font-size="25" class="bold teal" text-anchor="start">에이전트: 기획과 분기</text>
<text x="714" y="269" font-size="25" class="bold teal" text-anchor="start">정형 그래프 또는 맞춤 코드</text>
<circle cx="58" cy="360" r="14" fill="#223c44" stroke="none" stroke-width="1.5"/>
<text x="58" y="366" font-size="18" class="bold" text-anchor="middle" style="fill:#f7f5ef">B</text>
<text x="86" y="369" font-size="26" class="bold" text-anchor="start">서로 보완하는 두 진입 경로</text>
<line x1="44" y1="389" x2="1156" y2="389" stroke="#ccd5d1" stroke-width="1.5"/>
<text x="44" y="435" font-size="24" class="bold" text-anchor="start">정형 실행 그래프</text>
<text x="44" y="470" font-size="24" class="bold" text-anchor="start">입출력 자료형과 의존성</text>
<text x="654" y="435" font-size="24" class="bold" text-anchor="start">맞춤 코드</text>
<text x="654" y="470" font-size="24" class="bold" text-anchor="start">새 절차를 작성하고 기존 함수를 호출</text>
