<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>자료 목록 · ATRL 로컬 관리</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#results">목록으로 건너뛰기</a>
  <main>
    <header class="page-header">
      <p class="eyebrow">ATRL · 로컬 관리</p>
      <h1>자료 목록</h1>
      <p>등록 원장과 확인한 공개 묶음을 읽은 목록입니다. 등록·공개 소속·내용 비교·입력 검토를 각각 표시합니다.</p>
      <p class="note">이 목록은 로컬 후보이며 저장·발행·삭제 기능이 없습니다. 링크의 개별 HTTPS 재확인은 수행하지 않았습니다.</p>
    </header>
    <section aria-labelledby="snapshot-heading" class="panel">
      <h2 id="snapshot-heading">확인 기준</h2>
      <div id="totals" class="totals"></div>
      <dl id="snapshot" class="snapshot"></dl>
    </section>
    <section aria-labelledby="filter-heading" class="panel">
      <h2 id="filter-heading">찾기</h2>
      <fieldset id="filters" disabled>
        <legend class="visually-hidden">자료 검색과 필터</legend>
        <div class="search-field">
          <label for="search">제목·ID·태그</label>
          <input id="search" type="search" autocomplete="off" aria-describedby="search-hint">
          <p id="search-hint" class="hint">검색어는 200자까지 입력할 수 있습니다.</p>
        </div>
        <div class="filter-grid">
          <label>종류<select id="kind"></select></label>
          <label>분류<select id="category"></select></label>
          <label>시리즈<select id="series"></select></label>
          <label>언어<select id="language"></select></label>
          <label>공개 근거<select id="evidence"></select></label>
          <label>한 페이지<select id="page-size"><option value="50">50개</option><option value="100">100개</option></select></label>
        </div>
        <button id="reset" type="button" class="secondary">필터 초기화</button>
      </fieldset>
    </section>
    <section id="results" aria-labelledby="results-heading" tabindex="-1">
      <div class="results-header"><h2 id="results-heading">목록</h2><p id="result-count"></p></div>
      <p id="status" role="status" aria-live="polite">목록을 읽고 있습니다.</p>
      <ol id="items" class="item-list"></ol>
      <nav id="pagination" class="pagination" aria-label="목록 페이지" hidden>
        <button id="previous" type="button">이전</button>
        <span id="page-status" aria-live="polite"></span>
        <button id="next" type="button">다음</button>
      </nav>
    </section>
    <footer><p>공개 묶음에 있다는 근거와 현재 입력이 일치한다는 근거는 다릅니다. 미확인 항목은 확인된 사실로 채우지 않습니다.</p></footer>
  </main>
</body>
</html>
