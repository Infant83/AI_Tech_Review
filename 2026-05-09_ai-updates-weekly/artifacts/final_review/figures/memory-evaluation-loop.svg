<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">장기 작업 에이전트를 위한 기억 선별과 평가 하네스</title>
  <desc id="desc">기억 선별, 에이전트 실행, 평가 기준, 사람 승인, 재시도 계획이 분리되어 작동하는 장기 작업 하네스 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2f514b"/>
    </marker>
    <marker id="orange-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#b76a1f"/>
    </marker>
    <filter id="shadow" x="-16%" y="-16%" width="132%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2b403b" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #fbfaf6; }
      .panel { fill: #fffefa; stroke: #d8ded8; stroke-width: 2; filter: url(#shadow); }
      .node { fill: #f7f9f6; stroke: #526a64; stroke-width: 2.5; }
      .agent { fill: #ebf7f4; stroke: #0f766e; stroke-width: 3.2; }
      .memory { fill: #fff6e7; stroke: #b76a1f; stroke-width: 2.7; }
      .retry { fill: #fffdf8; stroke: #526a64; stroke-width: 2.5; }
      .title { font: 700 33px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #17221f; }
      .subtitle { font: 400 20px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #475d57; }
      .label { font: 700 28px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #17221f; }
      .small { font: 400 20px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #4f615b; }
      .tag { font: 700 17px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #46615a; }
      .arrow { fill: none; stroke: #2f514b; stroke-width: 4; marker-end: url(#arrow); }
      .memory-arrow { fill: none; stroke: #b76a1f; stroke-width: 3.4; marker-end: url(#orange-arrow); stroke-dasharray: 9 9; }
      .guide { fill: #f3f2ec; stroke: #ddd7c8; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="620"/>
  <rect class="panel" x="58" y="58" width="1084" height="504" rx="28"/>

  <text class="title" x="100" y="116">장기 작업에는 기억을 고르고 평가하는 하네스가 필요합니다</text>
  <text class="subtitle" x="102" y="151">모든 기록을 들고 가는 대신, 다음 작업에 쓸 기억과 재시도 기준을 분리해 둡니다.</text>

  <rect class="memory" x="92" y="250" width="230" height="124" rx="23"/>
  <text class="label" x="207" y="300" text-anchor="middle">기억 선별</text>
  <text class="small" x="207" y="333" text-anchor="middle">다음 작업에 쓸 기록</text>

  <rect class="agent" x="370" y="250" width="230" height="124" rx="23"/>
  <text class="label" x="485" y="300" text-anchor="middle">에이전트 실행</text>
  <text class="small" x="485" y="333" text-anchor="middle">문서 · 코드 · 분석 작업</text>

  <rect class="node" x="650" y="250" width="230" height="124" rx="23"/>
  <text class="label" x="765" y="300" text-anchor="middle">평가 기준</text>
  <text class="small" x="765" y="333" text-anchor="middle">성공 조건과 채점표</text>

  <rect class="node" x="930" y="250" width="190" height="124" rx="23"/>
  <text class="label" x="1025" y="300" text-anchor="middle">사람 승인</text>
  <text class="small" x="1025" y="333" text-anchor="middle">반영 전 검토</text>

  <rect class="retry" x="465" y="438" width="310" height="92" rx="22"/>
  <text class="label" x="620" y="475" text-anchor="middle">재시도 계획</text>
  <text class="small" x="620" y="508" text-anchor="middle">부족한 부분만 다시 실행</text>

  <path class="arrow" d="M322 312 H370"/>

  <path class="arrow" d="M600 312 H650"/>

  <path class="arrow" d="M880 312 H930"/>

  <path class="arrow" d="M765 374 V438"/>
  <text class="tag" x="790" y="411">부족하면</text>

  <path class="arrow" d="M465 484 C405 484 392 402 430 374"/>

  <path class="memory-arrow" d="M485 250 C438 200 268 200 207 250"/>

  <rect class="guide" x="92" y="438" width="230" height="92" rx="18"/>
  <text class="small" x="207" y="474" text-anchor="middle">읽는 법</text>
  <text class="tag" x="207" y="504" text-anchor="middle">실선은 실행, 점선은 기록</text>
</svg>
