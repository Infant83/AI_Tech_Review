  <text x="600" y="386" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="27" font-weight="780" fill="#0f766e">하네스 설계가</text>
  <text x="600" y="422" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="27" font-weight="780" fill="#0f766e">중요해짐</text>

  <g stroke="#6b756f" stroke-width="2.8" fill="none" marker-end="url(#arrow)">
