<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 하네스 참고자료 맵</title>
  <desc id="desc">논문, 기업 발표, 커넥터 문서, 오픈소스 하네스, 개발자 도구, 도메인 안전 사례가 하네스 설계라는 중심 주제로 연결되는 지도.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#6b756f"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#fbfaf7"/>
  <rect x="38" y="38" width="1124" height="644" rx="18" fill="#fffdf9" stroke="#d8d5cb" stroke-width="2"/>
  <text x="78" y="96" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="31" font-weight="760" fill="#17211d">참고자료 맵</text>
  <text x="78" y="132" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif" font-size="19" fill="#5f6b65">각 자료는 서로 다른 영역을 보지만, 모두 모델 주변의 실행 구조를 더 중요하게 다룹니다.</text>

  <circle cx="600" cy="372" r="128" fill="#e7f2ee" stroke="#0f766e" stroke-width="4"/>
