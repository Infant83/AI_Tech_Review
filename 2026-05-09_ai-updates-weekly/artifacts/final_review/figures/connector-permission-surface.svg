<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Connector는 편의 기능이면서 권한 제어점입니다</title>
  <desc id="desc">메일, 일정, 문서 저장소 connector가 사용자에게는 편의 기능으로, 관리자에게는 권한과 감사 제어점으로 작동하는 구조</desc>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#31524b"/>
    </marker>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#28423b" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #fbfaf6; }
      .panel { fill: #ffffff; stroke: #d9ded8; stroke-width: 2; filter: url(#shadow3); }
      .box { fill: #f7f8f5; stroke: #65756f; stroke-width: 2; }
      .agent { fill: #eef8f5; stroke: #0f766e; stroke-width: 3; }
      .gate { fill: #fff6ea; stroke: #b86b1d; stroke-width: 2.5; }
      .title { font: 700 32px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #17221f; }
      .label { font: 700 23px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #17221f; }
      .small { font: 400 17px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #4f615b; }
      .tiny { font: 400 15px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #5d6b66; }
      .arrow { fill: none; stroke: #31524b; stroke-width: 3; marker-end: url(#arrow3); }
      .policy { fill: none; stroke: #b86b1d; stroke-width: 2.4; stroke-dasharray: 7 8; marker-end: url(#arrow3); }
      .icon { fill: #ffffff; stroke: #506761; stroke-width: 2; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="560"/>
  <rect class="panel" x="58" y="54" width="1084" height="452" rx="28"/>
  <text class="title" x="96" y="113">Connector는 업무 데이터로 들어가는 손잡이입니다</text>
  <text class="small" x="98" y="148">사용자에게는 메일과 문서를 읽어주는 기능처럼 보입니다.</text>
  <text class="small" x="98" y="174">운영자에게는 권한 범위와 감사 기록을 정해야 하는 제어점입니다.</text>

  <rect class="box" x="104" y="222" width="230" height="190" rx="24"/>
  <text class="label" x="219" y="264" text-anchor="middle">업무 데이터</text>
  <circle class="icon" cx="156" cy="316" r="28"/>
  <path d="M138 310h36v24h-36z M138 310l18 14 18-14" fill="none" stroke="#506761" stroke-width="2"/>
  <circle class="icon" cx="219" cy="316" r="28"/>
  <path d="M205 302h28v30h-28z M210 310h18 M210 319h18" fill="none" stroke="#506761" stroke-width="2"/>
  <circle class="icon" cx="282" cy="316" r="28"/>
  <path d="M268 304h28v28h-28z M268 312h28 M276 296v16 M288 296v16" fill="none" stroke="#506761" stroke-width="2"/>
  <text class="small" x="219" y="379" text-anchor="middle">메일 · 문서 · 일정</text>

  <rect class="gate" x="426" y="216" width="220" height="202" rx="24"/>
  <text class="label" x="536" y="260" text-anchor="middle">권한 게이트</text>
  <text class="small" x="536" y="295" text-anchor="middle">읽기 범위</text>
  <text class="small" x="536" y="326" text-anchor="middle">민감 정보 정책</text>
  <text class="small" x="536" y="357" text-anchor="middle">감사 로그</text>

  <rect class="agent" x="740" y="222" width="230" height="190" rx="24"/>
  <text class="label" x="855" y="268" text-anchor="middle">AI 작업면</text>
  <text class="small" x="855" y="303" text-anchor="middle">요약 · 검색 · 초안</text>
  <text class="small" x="855" y="334" text-anchor="middle">다음 액션 정리</text>
  <text class="small" x="855" y="365" text-anchor="middle">업무 문맥 유지</text>

  <rect class="box" x="1002" y="248" width="112" height="138" rx="20"/>
  <text class="label" x="1058" y="300" text-anchor="middle">산출물</text>
  <text class="small" x="1058" y="330" text-anchor="middle">보고</text>
  <text class="small" x="1058" y="358" text-anchor="middle">결정</text>

  <path class="arrow" d="M334 317 C372 317 389 317 426 317"/>
  <path class="arrow" d="M646 317 C684 317 702 317 740 317"/>
  <path class="arrow" d="M970 317 C984 317 991 317 1002 317"/>
  <path class="policy" d="M536 418 C537 462 860 474 858 412"/>
  <text class="tiny" x="160" y="454">좋은 connector는 필요한 만큼 연결하고</text>
  <text class="tiny" x="160" y="478">호출 기록을 남기는 구조입니다.</text>
</svg>
