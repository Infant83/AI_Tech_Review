        - generic [ref=e163]:
          - strong [ref=e164]: 그림 4.
          - text: 분자 계산값, 소자 실험 라벨, recipe와 검사 특징량은 서로 다른 형식에서 출발하지만, 후보 순위화나 품질 검증 위험 점수처럼 다음 행동을 정하는 지점에서는 표와 체크리스트로 만납니다.
      - heading "소자 실험과 공정 품질 예측으로 확장하는 방식" [level=2] [ref=e165]
      - paragraph [ref=e166]:
        - text: 소자 실험에서는 분자 하나보다 조합과 조건이 중요합니다. Host, dopant, sensitizer, transport layer, layer thickness, doping concentration, measurement condition을 같이 읽어야 η
        - subscript [ref=e167]: EQE
        - text: ", 구동 전압(V), CIE 색좌표, efficiency roll-off, LT"
        - subscript [ref=e168]: "95"
        - text: 를 설명할 수 있습니다. TabPFN은 이 표에서 빠른 기준 모델을 만들고, 어떤 조건 조합을 다음 실험으로 보낼지 가르는 데 쓸 수 있습니다.
      - paragraph [ref=e169]: 파일럿 라인에서는 recipe condition과 inline measurement가 더 직접적인 입력이 됩니다. 증착 rate, chamber pressure, mask 상태, substrate lot, encapsulation condition, spectral measurement, particle count, image-derived defect feature가 품질 target과 연결됩니다. 검사 이미지는 vision model이 먼저 처리하고, 그 결과로 나온 defect count, morphology descriptor, location feature, intensity statistic을 TabPFN이 읽는 식의 역할 분담도 가능합니다.
      - paragraph [ref=e170]:
        - text: 제조 foundation model이라는 표현은 여기서 좁게 쓰는 편이 좋습니다. TabPFN 하나가 OLED 제조 전체를 대표하는 모델이 된다는 뜻이 아닙니다. 대신 분자 graph, 계산 결과, 소자 실험표, recipe, 검사 특징량이 만나는 표 데이터 접점마다 재사용 가능한 predictor를 세울 수 있습니다.
        - link "steel property prediction 논문" [ref=e171] [cursor=pointer]:
          - /url: https://arxiv.org/abs/2603.22738
        - text: 은 이런 방향을 제조 데이터에서 보여주는 참고 사례입니다. 이 연구는 TabPFN의 single-target 구조를 hot rolling 공정의 multitask property prediction으로 확장해, chemical composition, process parameter, microstructure, mechanical property 사이의 관계를 다루었습니다.
      - paragraph [ref=e172]:
        - text: OLED에서도 같은 질문을 던질 수 있습니다. η
        - subscript [ref=e173]: EQE
        - text: ", 구동 전압, roll-off, CIE 색좌표, lifetime은 서로 독립된 target이 아닙니다. TabPFN을 그대로 하나의 target 예측기로만 쓰면 trade-off를 놓치기 쉽습니다. 여러 target의 긴장을 보존하려면 label 설계, multi-target 확장, 후처리 순위화, 불확실성 보고가 필요합니다."
      - heading "활용 전에 확인할 조건" [level=2] [ref=e174]
      - paragraph [ref=e175]: TabPFN을 실제 OLED 데이터에 적용하기 전에 먼저 확인할 조건이 있습니다.
      - paragraph [ref=e176]:
        - text: 첫째, 라벨 정의입니다. 같은 LT
        - subscript [ref=e177]: "95"
        - text: 라도 초기 휘도 L
        - subscript [ref=e178]: "0"
        - text: (cd m
        - superscript [ref=e179]: "-2"
        - text: ), 온도, device area, encapsulation, measurement protocol이 다르면 같은 라벨로 묶기 어렵습니다. η
        - subscript [ref=e180]: EQE
        - text: 나 roll-off도 측정 조건과 stack 구성이 빠지면 모델이 잘못된 상관관계를 배울 수 있습니다.
      - paragraph [ref=e181]: 둘째, 검증 분할입니다. Random split은 같은 scaffold, 같은 project family, 같은 batch가 train/test에 섞이기 쉽습니다. 역설계에서는 scaffold split이 필요하고, 제조에서는 time split과 lot split이 필요합니다. 새 분자군, 새 장비, 새 lot에서 성능이 유지되는지를 보지 않으면 실험실 안의 반복 패턴만 잘 맞힌 모델이 될 수 있습니다.
      - paragraph [ref=e182]: 셋째, 속도와 배포 조건입니다. 평균 정확도가 좋아도 예측 지연시간이 길면 interactive screening UI나 공정 dashboard에는 맞지 않을 수 있습니다. 이 때문에 TabPFN-2.5 계열에서 distillation engine이 강조됩니다. 큰 모델로 후보를 잘 고른 뒤, 운영 환경에서는 더 빠른 모델로 옮기는 전략이 필요할 수 있습니다.
      - paragraph [ref=e183]:
        - text: 넷째, 라이선스입니다.
        - link "Prior Labs 모델 문서" [ref=e184] [cursor=pointer]:
          - /url: https://docs.priorlabs.ai/models
        - text: 는 기업 내부의 preliminary assessment와 비즈니스 의사결정에 영향을 주는 사용을 구분합니다. Production workflow, vendor evaluation, product integration, commercial decision에 연결되는 사용에는 commercial license나 API agreement가 필요합니다.
      - complementary [ref=e185]:
        - paragraph [ref=e186]: Operator note
        - paragraph [ref=e187]: OLED 팀에서 TabPFN PoC를 시작한다면 모델부터 고르기보다 표 하나를 먼저 고르는 편이 좋습니다. 예를 들어 “DFT 후보 500개 중 다음 계산으로 넘길 50개를 고르는 표”, “소자 실험 조건 200개 중 다음 batch 후보를 고르는 표”, “recipe 변경 직후 품질 위험을 빠르게 보는 표”처럼 다음 행동이 분명한 표가 좋습니다.
      - figure "그림 5. TabPFN은 소표본 후보 압축에서는 먼저 검토할 만하지만, 다중 모달 제조 판단과 양산 의사결정에서는 보조 계층과 검증 장치가 필요합니다." [ref=e188]:
        - img "TabPFN 활용 전략의 경계" [ref=e189]
        - generic [ref=e190]:
          - strong [ref=e191]: 그림 5.
          - text: TabPFN은 소표본 후보 압축에서는 먼저 검토할 만하지만, 다중 모달 제조 판단과 양산 의사결정에서는 보조 계층과 검증 장치가 필요합니다.
      - heading "OLED 분야에서 기대할 수 있는 응용" [level=2] [ref=e192]
      - paragraph [ref=e193]: TabPFN을 OLED 분야에 적용한다면 가장 먼저 떠올릴 수 있는 용도는 세 가지입니다.
      - paragraph [ref=e194]:
        - text: 첫째는 소재 후보 screening입니다. 생성 모델이나 fragment enumeration이 만든 후보를 곧장 고비용 계산이나 합성으로 넘기지 않고, descriptor와 저비용 계산값으로 먼저 줄입니다. 이때 TabPFN은 T
        - subscript [ref=e195]: "1"
        - text: margin, HOMO/LUMO offset, ΔE
        - subscript [ref=e196]: ST
        - text: ", BDE, 재배열 에너지 λ, synthetic feasibility tag를 같이 읽는 선별기가 됩니다."
      - paragraph [ref=e197]:
        - text: 둘째는 소자 실험 조건 순위화입니다. Host/dopant 조합, layer thickness, doping concentration, measurement condition을 함께 넣어 η
        - subscript [ref=e198]: EQE
        - text: ", 구동 전압, roll-off, CIE 색좌표, LT"
        - subscript [ref=e199]: "95"
        - text: 를 예측합니다. 이 결과를 단일 최고점으로만 쓰기보다, trade-off를 보면서 다음 실험 후보를 고르는 데 쓰는 편이 안전합니다.
      - paragraph [ref=e200]: 셋째는 제조 AX의 빠른 baseline입니다. Recipe 변경, 장비 상태 변화, 신규 material batch, line transfer 직후처럼 라벨이 많지 않은 구간에서 빠른 품질 예측 후보를 세울 수 있습니다. 이때 검사 이미지는 vision model이 처리하고, image-derived feature와 공정 기록을 TabPFN이 읽는 방식이 현실적입니다.
      - paragraph [ref=e201]: TabPFN은 OLED 연구자나 공정 엔지니어의 판단을 대신하지 않습니다. 잘 정리된 표에서 반복 튜닝 부담을 줄이고, 비싼 다음 단계를 어디에 쓸지 빠르게 좁혀주는 모델입니다. OLED처럼 신뢰할 수 있는 라벨이 늦고 비싼 분야에서는 그 정도의 역할만으로도 충분히 의미가 있습니다.
