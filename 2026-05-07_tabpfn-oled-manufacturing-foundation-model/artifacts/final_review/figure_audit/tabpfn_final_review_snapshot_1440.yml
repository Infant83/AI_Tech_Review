      - heading "제조 데이터는 TabPFN이 겨냥한 조건을 많이 갖고 있습니다" [level=2] [ref=e125]
      - paragraph [ref=e126]: 제조 데이터는 전형적인 표 데이터입니다. 장비 센서, recipe, 검사 특징량, lot 이력, 작업 조건, 품질 판정이 데이터베이스와 CSV 안에 남습니다. 동시에 제조 데이터는 모델이 다루기 까다로운 데이터이기도 합니다. 결측이 많고, 공정 조건이 바뀌며, 라벨이 늦게 나오고, 새 제품이나 새 장비에서는 과거 데이터가 충분하지 않습니다.
      - paragraph [ref=e127]:
        - link "Prior Labs industrial page" [ref=e128] [cursor=pointer]:
          - /url: https://priorlabs.ai/industries/industrials
        - text: 는 predictive maintenance, quality control, defect detection, production line optimization을 TabPFN의 산업 적용 예로 제시합니다. 같은 페이지는 messy data, mixed data types, limited data availability를 처리한다는 메시지를 강조합니다. 이 내용은 공급사 claim이므로 성능 결론의 중심 근거로 쓰기보다는, TabPFN이 겨냥하는 문제 영역을 보여주는 자료로 보는 편이 좋습니다.
      - paragraph [ref=e129]:
        - text: OLED에서는 세 데이터 층이 뚜렷하게 갈립니다. 분자와 재료 층에는 SMILES, fragment, molecular fingerprint, DFT 계산값, excited-state 계산값, 열 안정성 proxy가 들어갑니다. 소자와 stack 층에는 host, dopant, layer thickness, doping concentration, η
        - subscript [ref=e130]: EQE
        - text: ", 구동 전압(V), CIE 색좌표, efficiency roll-off, LT"
        - subscript [ref=e131]: "95"
        - text: 가 붙습니다. 제조와 품질 층에는 증착 rate, chamber 상태, substrate lot, encapsulation 조건, inline inspection feature, defect class, yield가 들어갑니다.
      - paragraph [ref=e132]: TabPFN이 강해질 수 있는 자리는 이 세 층이 표로 만나는 접점입니다. 예를 들어 후보 분자의 계산 특징량과 실험 라벨을 묶어 DFT 우선순위를 정하거나, 소자 stack 조건과 측정 결과를 묶어 다음 실험 조건을 고르거나, recipe 변경 직후의 inline measurement와 품질 판정을 묶어 위험 점수를 만들 수 있습니다. 이때 모델은 OLED 전체를 이해하는 것이 아니라, 잘 정의된 표 안에서 다음 행동을 바꾸는 예측을 합니다.
      - heading "OLED 소재 역설계에서는 생성 뒤의 선별이 중요합니다" [level=2] [ref=e133]
      - paragraph [ref=e134]:
        - text: OLED 분자 역설계는 원하는 성질을 먼저 정하고 거기에 맞는 구조를 찾는 문제입니다. Blue phosphorescent OLED host라면 높은 T
        - subscript [ref=e135]: "1"
        - text: ", 적절한 HOMO/LUMO alignment, 안정성, 합성 가능성을 같이 봐야 합니다. 생성 모델이나 fragment enumeration은 후보를 많이 만들 수 있습니다. 그러나 후보가 많아졌다고 문제가 끝나지는 않습니다. 합성 가능한지, DFT에서 살아남는지, host/dopant 조합에서 물리적으로 맞는지 다시 걸러야 합니다."
      - paragraph [ref=e136]:
        - link "2018년 npj Computational Materials 논문" [ref=e137] [cursor=pointer]:
          - /url: https://www.nature.com/articles/s41524-018-0128-1
        - text: 은 이 흐름을 잘 보여주는 OLED host 역설계 사례입니다. 저자들은 blue phosphorescent OLED host를 대상으로 DFT-labeled library와 SMILES 기반 생성 모델을 연결했습니다. T
        - subscript [ref=e138]: "1"
        - text: ≥ 3.00 eV 조건을 만족한 후보 비율은 training library의 36.2%에서 targeted inverse design의 58.7%로 높아졌고, 일부 후보는 합성과 실험 characterization까지 진행되었습니다.
      - figure "그림 3. OLED 역설계에서 TabPFN은 generated molecule을 직접 만드는 위치보다, descriptor와 저비용 계산값을 읽고 DFT·소자 실험으로 넘길 후보를 줄이는 위치에 놓기 쉽습니다." [ref=e139]:
        - img "OLED 역설계에서 TabPFN 후보 압축 흐름" [ref=e140]
        - generic [ref=e141]:
          - strong [ref=e142]: 그림 3.
          - text: OLED 역설계에서 TabPFN은 generated molecule을 직접 만드는 위치보다, descriptor와 저비용 계산값을 읽고 DFT·소자 실험으로 넘길 후보를 줄이는 위치에 놓기 쉽습니다.
      - paragraph [ref=e143]:
        - text: TabPFN은 이 흐름에서 생성기 뒤의 선별기로 들어갈 수 있습니다. 분자 fingerprint, graph embedding, 저비용 계산값, known fragment tag, synthetic route tag, host/dopant compatibility feature를 표로 정리하면 후보가 다음 계산과 실험에서 살아남을 가능성을 빠르게 추정할 수 있습니다. 여기서 “살아남는다”는 말은 단일 물성 하나를 통과한다는 뜻이 아닙니다. T
        - subscript [ref=e144]: "1"
        - text: margin, HOMO/LUMO offset, stability proxy, rigidity, packing risk처럼 다음 단계의 탈락 요인을 동시에 본다는 뜻입니다.
      - heading "OLED 논문에서 확인되는 물성과 소자 성능의 간격" [level=2] [ref=e145]
      - paragraph [ref=e146]: TabPFN을 OLED에 적용할 때 가장 조심해야 할 부분은 분자 물성과 소자 성능 사이의 거리입니다. 분자 계산값이 좋아도 실제 소자에서 좋은 결과가 나오지 않을 수 있습니다. Host와 dopant의 에너지 정렬, charge balance, morphology, exciton confinement, degradation pathway가 같이 움직이기 때문입니다.
      - paragraph [ref=e147]:
        - link "Rapid Multiscale Computational Screening for OLED Host Materials" [ref=e148] [cursor=pointer]:
          - /url: https://www.osti.gov/servlets/purl/1735840
        - text: 는 이 간격을 잘 다룬 연구입니다. 연구진은 높은 T
        - subscript [ref=e149]: "1"
        - text: ", HOMO/LUMO alignment, balanced carrier transport, robust molecular structure를 blue OLED host의 설계 기준으로 두고 tiered screening을 수행했습니다. 논문은 single-molecule quantum mechanical data만으로 성공적인 OLED host를 확정하기는 어렵지만, 낮은 S"
        - subscript [ref=e150]: "1"
        - text: /T
        - subscript [ref=e151]: "1"
        - text: 에너지나 부적절한 frontier orbital energy 때문에 실패할 후보를 걸러내는 데는 유용하다고 결론냅니다.
      - paragraph [ref=e152]:
        - text: 2026년
        - link "JACS exciplex host 연구" [ref=e153] [cursor=pointer]:
          - /url: https://snu.elsevierpure.com/en/publications/machine-learning-guided-discovery-of-sterically-protected-high-tr/
        - text: 는 한 단계 더 나아갑니다. 이 연구는 OLED material ML이 device-level performance로 이어지기 어렵다는 문제에서 출발해, 높은 T
        - subscript [ref=e154]: "1"
        - text: ", LUMO alignment, BDE, reorganization energy를 exciton dynamics와 device stability에 연결했습니다. 그 결과 green PSF OLED에서 외부양자효율(η"
        - subscript [ref=e155]: EQE
        - text: )이 최대 39.4%, L
        - subscript [ref=e156]: "90"
        - text: "> 100,000 cd m"
        - superscript [ref=e157]: "-2"
        - text: ", LT"
        - subscript [ref=e158]: "95"
        - text: = 134.4 h at 5000 cd m
        - superscript [ref=e159]: "-2"
        - text: 로 보고되었습니다.
      - paragraph [ref=e160]: 이 두 사례는 TabPFN 활용 전략에도 직접적인 힌트를 줍니다. 입력 표를 단순한 분자 descriptor 묶음으로 만들면 모델은 분자 수준의 상관관계만 배웁니다. OLED 응용에서 더 유용한 표는 물리적으로 의미 있는 margin feature, pair feature, host/dopant compatibility feature, 측정 조건, 실패 사유를 넣어야 합니다. TabPFN은 그런 표에서 후보를 줄이는 일을 도울 수 있습니다.
