      - paragraph [ref=e19]:
        - text: 새로운 OLED 소재를 찾는 일은 대개 넓은 후보 공간에서 시작합니다. 분자 구조를 조금만 바꾸어도 전선 궤도 에너지인 HOMO/LUMO, 삼중항 에너지(T
        - subscript [ref=e20]: "1"
        - text: ), 단일항-삼중항 에너지 차이(ΔE
        - subscript [ref=e21]: ST
        - text: ), 결합 해리 에너지(BDE), 재배열 에너지(λ)가 달라집니다. 계산으로 후보를 줄일 수는 있지만 DFT도 공짜가 아니고, 소자 제작과 수명시험은 훨씬 더 비쌉니다. 공정 쪽으로 내려가면 recipe, 장비 상태, 검사 특징량, lot 이력이 더해집니다. OLED 데이터는 표처럼 보이지만, 그 안에는 계산 조건, 실험 조건, 장비 조건이 같이 들어 있습니다.
      - paragraph [ref=e22]: TabPFN은 이런 상황에서 검토할 만한 표 데이터 파운데이션 모델입니다. 새 데이터셋마다 XGBoost나 CatBoost를 오래 튜닝하는 방식과 달리, 미리 학습된 transformer가 주어진 표의 학습 행과 예측 행을 한 번에 읽고 바로 예측을 냅니다. 데이터가 작고 라벨이 비싼 영역에서는 이 차이가 큽니다. OLED 연구에서는 DFT와 합성 사이, 소자 실험과 수명시험 사이, 파일럿 공정과 품질 판정 사이에서 “다음 후보를 어디로 보낼 것인가”라는 판단이 반복되기 때문입니다.
