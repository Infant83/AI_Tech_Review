          - row "data leakage와 split scikit-learn common pitfalls은 예측 시점에 사용할 수 없는 정보가 모델 구축에 들어가면 data leakage가 생긴다고 설명합니다. DeepChem ScaffoldSplitter 문서는 작은 분자를 scaffold 기준으로 나누는 split을 제공합니다. OLED에서는 같은 scaffold, 같은 프로젝트, 같은 lot가 train/test에 섞이면 성능이 과대평가될 수 있습니다. 역설계는 scaffold split, 제조는 time split과 lot split을 나란히 검토해야 합니다." [ref=e119]:
