          - text: TabPFN의 장점은 OLED 물리를 대신 이해한다는 데 있지 않습니다. 장점은
          - strong [ref=e26]: 작고 비싼 표 데이터에서 빠르게 강한 기준 모델을 세우고, 다음 계산·실험·공정 검증으로 넘길 후보를 줄이는 데
          - text: 있습니다.
      - heading "TabPFN은 표 데이터에서 튜닝 시간을 줄이는 모델입니다" [level=2] [ref=e27]
      - paragraph [ref=e28]: 표 데이터는 기업과 연구소에서 가장 흔한 데이터 형식입니다. 그런데 딥러닝이 이미지와 언어에서 보인 압도적인 성과가 표 데이터에서는 그대로 반복되지 않았습니다. 행과 열은 단순해 보이지만, 열 하나의 의미가 데이터셋마다 다르고 결측, 범주형 변수, 측정 조건, 선택 편향이 자주 섞이기 때문입니다. 그래서 실제 현장에서는 XGBoost, LightGBM, CatBoost 같은 gradient boosting 계열이 오래 강했습니다.
      - paragraph [ref=e29]:
        - link "Nature 2025 TabPFN 논문" [ref=e30] [cursor=pointer]:
          - /url: https://www.nature.com/articles/s41586-024-08328-6
        - text: 은 이 구도에서 다른 선택지를 제시했습니다. TabPFN v2는 여러 합성 표 데이터 과제로 미리 학습한 transformer를 사용합니다. 새 데이터셋이 들어오면 별도의 긴 학습 과정 없이, 학습 행과 예측 행을 하나의 문맥처럼 넣어 예측합니다. 논문은 10,000개 샘플, 500개 특징 이하의 소·중규모 데이터셋에서 분류는 평균 2.8초, 회귀는 평균 4.8초에 실행됐고, 4시간 튜닝한 강한 기준 앙상블보다 나은 성능을 냈다고 보고했습니다.
      - paragraph [ref=e31]:
        - text: 2026년 5월 11일 확인한
        - link "Prior Labs 모델 문서" [ref=e32] [cursor=pointer]:
          - /url: https://docs.priorlabs.ai/models
        - text: 는 TabPFN-2.6을 오픈소스 패키지의 기본 모델로 설명하고, TabPFN-2.5-Plus를 API 전용 모델로 구분합니다. 문서상 TabPFN-2.5와 2.6의 권장 범위는 100,000개 행, 2,000개 특징입니다.
        - link "TabPFN-2.5 technical report" [ref=e33] [cursor=pointer]:
          - /url: https://arxiv.org/abs/2511.08667
        - text: 는 50,000개 데이터 포인트, 2,000개 특징, TabArena 성능, distillation engine을 주요 발전점으로 설명합니다. 제품 페이지도 TabPFN-2.5가 TabArena에서 튜닝된 tree-based model을 앞서고 AutoGluon 1.4와 비슷한 정확도를 보였다고 주장합니다.
      - complementary [ref=e34]:
        - paragraph [ref=e35]: Evidence note
        - paragraph [ref=e36]: TabPFN을 “튜닝이 필요 없는 만능 모델”로 취급해서는 안 됩니다. 공식 문서와 논문은 권장 데이터 크기, 라이선스, 지연시간, 큰 데이터와 비매끄러운 회귀 문제에서의 한계를 나란히 제시합니다. OLED 적용에서도 평균 정확도보다 데이터 분할 방식, 라벨 정의, 다음 실험 비용 절감 여부를 같이 봐야 합니다.
      - figure "그림 2. TabPFN은 표 안의 학습 행과 예측 행을 동시에 읽습니다. OLED에서는 후보 분자, DFT 계산값, 소자 조건, 공정 recipe를 같은 표로 정리한 뒤 라벨이 비어 있는 후보의 예측값이나 순위를 얻는 방식으로 이해하면 쉽습니다." [ref=e37]:
