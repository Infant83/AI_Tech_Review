<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">OLED 데이터 세 층과 TabPFN의 접점</title>
  <desc id="desc">분자 물성, 소자 실험, 제조 품질 데이터가 서로 다른 표로 존재하고 TabPFN은 잘 정의된 접점에서 후보를 압축한다는 구조도</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}
      .panel{fill:#fff;stroke:#d8d5cb;stroke-width:2}
      .title{font:700 30px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#17211d}
      .subtitle{font:400 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#5f6b65}
      .h{font:700 24px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#17211d}
      .body{font:400 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#31433c}
      .small{font:400 15px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#5f6b65}
      .chip{fill:#f2f0ea;stroke:#d8d5cb;stroke-width:1.4}
      .accent1{fill:#0f766e}
      .accent2{fill:#25456f}
      .accent3{fill:#8b3a3a}
      .line{stroke:#b8c0bb;stroke-width:3;fill:none}
      .dash{stroke:#a35a16;stroke-width:3;stroke-dasharray:9 9;fill:none}
      .junction{fill:#e9f3ef;stroke:#0f766e;stroke-width:2.5}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c7772"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="700"/>
  <text class="title" x="68" y="70">OLED 데이터는 한 장의 표가 아니라 서로 다른 세 층의 기록입니다</text>
  <text class="subtitle" x="68" y="104">모든 데이터를 한 모델에 넣기보다,</text>
  <text class="subtitle" x="68" y="130">실험 판단을 바꾸는 접점의 표를 먼저 봅니다.</text>

  <rect class="panel" x="70" y="155" rx="14" width="310" height="310"/>
  <circle class="accent1" cx="116" cy="204" r="18"/>
  <text class="h" x="148" y="212">분자·재료 층</text>
  <rect class="chip" x="105" y="252" rx="12" width="230" height="44"/>
  <text class="body" x="126" y="280">SMILES / fingerprint</text>
  <rect class="chip" x="105" y="310" rx="12" width="230" height="44"/>
  <text class="body" x="126" y="338">HOMO · LUMO · S1 · T1</text>
  <rect class="chip" x="105" y="368" rx="12" width="230" height="44"/>
  <text class="body" x="126" y="396">DFT label · stability proxy</text>
  <text class="small" x="105" y="439">좋은 후보보다 먼저 실패 후보를</text>
  <text class="small" x="105" y="462">줄이는 표가 만들어집니다.</text>

  <rect class="panel" x="445" y="155" rx="14" width="310" height="310"/>
  <circle class="accent2" cx="491" cy="204" r="18"/>
  <text class="h" x="523" y="212">소자·스택 층</text>
  <rect class="chip" x="480" y="252" rx="12" width="230" height="44"/>
  <text class="body" x="501" y="280">host / dopant / layer</text>
  <rect class="chip" x="480" y="310" rx="12" width="230" height="44"/>
  <text class="body" x="501" y="338">EQE · voltage · roll-off</text>
  <rect class="chip" x="480" y="368" rx="12" width="230" height="44"/>
  <text class="body" x="501" y="396">LT95 · CIE · measurement</text>
  <text class="small" x="480" y="439">분자 성질과 실험 조건이</text>
  <text class="small" x="480" y="462">같은 표 안에서 만납니다.</text>

  <rect class="panel" x="820" y="155" rx="14" width="310" height="310"/>
  <circle class="accent3" cx="866" cy="204" r="18"/>
  <text class="h" x="898" y="212">공정·품질 층</text>
  <rect class="chip" x="855" y="252" rx="12" width="230" height="44"/>
  <text class="body" x="876" y="280">recipe · chamber · lot</text>
  <rect class="chip" x="855" y="310" rx="12" width="230" height="44"/>
  <text class="body" x="876" y="338">inline metrology</text>
  <rect class="chip" x="855" y="368" rx="12" width="230" height="44"/>
  <text class="body" x="876" y="396">defect feature · yield</text>
  <text class="small" x="855" y="439">이미지와 센서는 먼저 특징량으로</text>
  <text class="small" x="855" y="462">정리될 때 표 모델이 읽습니다.</text>

  <path class="line" d="M 380 310 C 410 310 415 310 445 310" marker-end="url(#arrow)"/>
  <path class="line" d="M 755 310 C 785 310 790 310 820 310" marker-end="url(#arrow)"/>

  <rect class="junction" x="230" y="540" rx="18" width="740" height="92"/>
  <text class="h" x="285" y="581">TabPFN 검토의 실제 출발점: 잘 정의된 table junction</text>
  <text class="body" x="285" y="613">후보 압축, 실험 우선순위, 공정 위험 점수처럼 다음 행동을 바꾸는 표부터 작게 검증합니다.</text>
  <path class="dash" d="M 225 540 C 185 505 165 488 142 466" marker-end="url(#arrow)"/>
  <path class="dash" d="M 600 540 C 600 505 600 493 600 466" marker-end="url(#arrow)"/>
  <path class="dash" d="M 975 540 C 1015 505 1035 488 1058 466" marker-end="url(#arrow)"/>
</svg>
