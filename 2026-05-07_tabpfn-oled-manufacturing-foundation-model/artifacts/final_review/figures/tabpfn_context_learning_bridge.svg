<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Language context and TabPFN table context analogy</title>
  <desc id="desc">A hybrid editorial figure comparing next-word prediction from sentence context with TabPFN prediction of a missing table label from labelled rows and context columns.</desc>
  <defs>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1f2f36" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315e66"/>
    </marker>
    <style>
      .ink { fill: #1f2a30; font-family: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif; }
      .muted { fill: #5f6d74; font-family: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif; }
      .white { fill: #ffffff; font-family: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif; }
      .title { font-size: 42px; font-weight: 800; letter-spacing: 0; }
      .label { font-size: 30px; font-weight: 800; letter-spacing: 0; }
      .body { font-size: 25px; letter-spacing: 0; }
      .small { font-size: 22px; letter-spacing: 0; }
      .pill { fill: rgba(255,255,255,0.86); stroke: #d8d0c1; stroke-width: 1.2; filter: url(#softShadow); }
      .callout { fill: rgba(33,52,60,0.92); filter: url(#softShadow); }
      .bridge { stroke: #315e66; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .blank { fill: #fff6df; stroke: #b8843e; stroke-width: 2; }
    </style>
  </defs>

  <image href="tabpfn_context_learning_bridge_base.png" x="0" y="0" width="1536" height="1024" preserveAspectRatio="xMidYMid slice"/>

  <rect x="54" y="52" width="630" height="110" rx="22" class="pill"/>
  <text x="84" y="100" class="ink label">LLM: 문장 문맥에서 다음 말을 예측</text>
  <text x="84" y="135" class="muted small">“나는 오늘 자장면을 [먹을 거야]”가 자연스러운 이유</text>

  <rect x="852" y="52" width="630" height="110" rx="22" class="pill"/>
  <text x="882" y="100" class="ink label">TabPFN: 표 문맥에서 빈 라벨을 예측</text>
  <text x="882" y="135" class="muted small">라벨 있는 행과 예측할 행을 한 번에 읽습니다</text>

  <rect x="612" y="430" width="312" height="92" rx="22" fill="rgba(49,94,102,0.88)" filter="url(#softShadow)"/>
  <text x="650" y="468" class="white label">사전학습된 prior</text>
  <text x="650" y="502" class="white small">문맥 안 예시 관계를 읽는 모델</text>

  <path class="bridge" d="M 360 622 C 520 640, 600 650, 720 650"/>
  <path class="bridge" d="M 820 650 C 950 650, 1070 635, 1210 610"/>

  <rect x="63" y="720" width="1410" height="122" rx="22" class="callout"/>
  <text x="95" y="765" class="white label">XGBoost식 접근과 다른 지점</text>
  <text x="95" y="803" class="white body">XGBoost: 데이터셋마다 fit</text>
  <text x="470" y="803" class="white body">TabPFN: 사전학습된 prior로 표 문맥 예측</text>
  <text x="95" y="834" class="white body">암묵지는 조건과 사례로 표에 들어올 때 문맥이 됩니다.</text>

  <rect x="64" y="875" width="432" height="72" rx="18" class="pill"/>
  <text x="90" y="920" class="ink body">1. 행의 의미를 정합니다</text>

  <rect x="552" y="875" width="432" height="72" rx="18" class="pill"/>
  <text x="578" y="920" class="ink body">2. 필요한 조건만 column으로 둡니다</text>

  <rect x="1040" y="875" width="432" height="72" rx="18" class="pill"/>
  <text x="1066" y="920" class="ink body">3. 예측값과 불확실성을 같이 봅니다</text>
</svg>
