<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Same Chern number, different particle-entanglement counting</title>
<desc id="desc">Recounting the authors' source data gives 1088 particle-entanglement levels below the gap for the first valence and third conduction bands, versus 168 for the second conduction band. Each has Chern number minus one and one-third filling; the many-body model uses the flat-band limit.</desc>
<rect width="1200" height="660" fill="#f8fafc"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d}.title{font-size:32px;font-weight:700}.subtitle{font-size:22px}.label{font-size:25px;font-weight:700}.small,.tick{font-size:19px}.number{font-size:30px;font-weight:700}.note{font-size:20px}</style>
<text x="48" y="59" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#14263d">Same Chern number, different many-body counting</text>
<text x="48" y="104" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#14263d">C = −1 · ν = 1/3 · Nuc = 24 · Ne = 8 · NA = 3 · flat-band-limit model</text>
<text x="350" y="157" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#14263d">PES levels below the entanglement gap</text>
<line x1="350.00" y1="180" x2="350.00" y2="435" stroke="#d7dfea"/><text x="350.00" y="470" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#14263d">0</text><line x1="525.00" y1="180" x2="525.00" y2="435" stroke="#d7dfea"/><text x="525.00" y="470" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#14263d">300</text><line x1="700.00" y1="180" x2="700.00" y2="435" stroke="#d7dfea"/><text x="700.00" y="470" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#14263d">600</text><line x1="875.00" y1="180" x2="875.00" y2="435" stroke="#d7dfea"/><text x="875.00" y="470" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#14263d">900</text><line x1="1050.00" y1="180" x2="1050.00" y2="435" stroke="#d7dfea"/><text x="1050.00" y="470" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#14263d">1200</text><text x="48" y="237" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#14263d">VB and 3rd CB</text><text x="48" y="267" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#14263d">Laughlin-type counting</text><rect x="350" y="215" width="634.67" height="62" rx="5" fill="#155e75"/><text x="1000.67" y="256" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#14263d">1,088</text><text x="48" y="372" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#14263d">2nd CB</text><text x="48" y="402" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#14263d">Threefold CDW counting</text><rect x="350" y="350" width="98.00" height="62" rx="5" fill="#a14b21"/><text x="464.00" y="391" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#14263d">168</text>
<text x="48" y="525" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#14263d">1088 = 24/18 × binom(18, 3); 168 = 3 × binom(8, 3)</text>
<text x="48" y="570" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#14263d">Same flat dispersion and Chern number do not identify the correlated phase.</text>
<text x="48" y="607" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#14263d">Independent recount of authors' data; no new ED or PES calculation.</text>
<text x="48" y="637" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#14263d">Bao et al., Communications Physics (2026), Fig. 4 · Source: Zenodo 10.5281/zenodo.21199721</text>
</svg>