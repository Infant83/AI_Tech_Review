<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="910" viewBox="0 0 1420 910" role="img" aria-labelledby="title desc"><title id="title">What is learned, and what is evaluated explicitly?</title><desc id="desc">Four differentiable energy terms sum to total energy. Fixed NLH repulsion is distinct from network-predicted energy, charge and dispersion properties; forces include their coordinate dependence.</desc>
<style>text{font-family:ReviewFigure,sans-serif;fill:#253b42}.label{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:20px}.wire{fill:none;stroke:#748c91;stroke-width:2.5;stroke-linejoin:round}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#748c91" stroke-width="1.4"/></marker></defs>
<rect width="1420" height="910" fill="#fbfaf6"/>
<text x="48" y="49" class="label" text-anchor="start">What is learned, and what is evaluated explicitly?</text>
<text x="48" y="82" class="small" text-anchor="start">Energy construction and force evaluation in SO3LR Tauri</text>
<rect x="48" y="111" width="1324" height="96" rx="12" fill="#edf2ee" stroke="#b5c5c3" stroke-width="2"/>
<text x="710" y="148" class="label" text-anchor="middle">Inputs: atomic positions R · elements Z · total charge Q · spin multiplicity S</text>
<text x="710" y="182" class="small" text-anchor="middle">Z, Q and S are held fixed when differentiating positions</text>
<path d="M198 207 V250" class="wire" marker-end="url(#arrow)"/>
<path d="M886 207 V250" class="wire" marker-end="url(#arrow)"/>
<rect x="48" y="253" width="300" height="142" rx="12" fill="#f6eee1" stroke="#bd8542" stroke-width="2"/>
<rect x="392" y="253" width="980" height="142" rx="12" fill="#eaf0f3" stroke="#426a79" stroke-width="2"/>
<text x="198" y="297" class="label" text-anchor="middle">Fixed NLH repulsion</text>
<text x="198" y="332" class="small" text-anchor="middle">Pair terms fitted to DFT</text>
<text x="198" y="366" class="small" text-anchor="middle">Fixed during ML training</text>
<text x="882" y="298" class="label" text-anchor="middle">SO3krates neural network</text>
<text x="882" y="334" class="body" text-anchor="middle">Learned outputs: atomic energy · charges q · polarizability α · dispersion C₆</text>
<text x="882" y="368" class="small" text-anchor="middle">The predicted values change with the atomic environment</text>
<path d="M198 395 V450" class="wire" marker-end="url(#arrow)"/>
<path d="M542 395 V450" class="wire" marker-end="url(#arrow)"/>
<path d="M886 395 V450" class="wire" marker-end="url(#arrow)"/>
<path d="M1222 395 V450" class="wire" marker-end="url(#arrow)"/>
<rect x="48" y="454" width="300" height="135" rx="12" fill="#fff" stroke="#bd8542" stroke-width="2"/>
<text x="198" y="490" class="label" text-anchor="middle">Erep</text>
<text x="198" y="526" class="body" text-anchor="middle">Short-range repulsion</text>
<text x="198" y="562" class="small" text-anchor="middle">Steep close-contact repulsion</text>
<path d="M198 589 V631" class="wire"/>
<rect x="392" y="454" width="300" height="135" rx="12" fill="#fff" stroke="#426a79" stroke-width="2"/>
<text x="542" y="490" class="label" text-anchor="middle">ESO3k</text>
<text x="542" y="526" class="body" text-anchor="middle">Semi-local energy</text>
<text x="542" y="562" class="small" text-anchor="middle">Energy learned by the network</text>
<path d="M542 589 V631" class="wire"/>
<rect x="736" y="454" width="300" height="135" rx="12" fill="#fff" stroke="#638776" stroke-width="2"/>
<text x="886" y="490" class="label" text-anchor="middle">Eelec</text>
<text x="886" y="526" class="body" text-anchor="middle">Electrostatic energy</text>
<text x="886" y="562" class="small" text-anchor="middle">Predicted q in Coulomb terms</text>
<path d="M886 589 V631" class="wire"/>
<rect x="1072" y="454" width="300" height="135" rx="12" fill="#fff" stroke="#a96678" stroke-width="2"/>
<text x="1222" y="490" class="label" text-anchor="middle">Edisp</text>
<text x="1222" y="526" class="body" text-anchor="middle">Dispersion energy</text>
<text x="1222" y="562" class="small" text-anchor="middle">Pair terms from predicted α, C₆</text>
<path d="M1222 589 V631" class="wire"/>
<path d="M198 631 H1222" class="wire"/>
<path d="M710 631 V664" class="wire" marker-end="url(#arrow)"/>
<rect x="266" y="668" width="888" height="78" rx="12" fill="#edf2ee" stroke="#638776" stroke-width="2"/>
<text x="710" y="714" class="label" text-anchor="middle">Etotal = Erep + ESO3k + Eelec + Edisp</text>
<path d="M710 746 V789" class="wire" marker-end="url(#arrow)"/>
<text x="710" y="825" class="label" text-anchor="middle">Forces F = −∇R Etotal</text>
<text x="710" y="862" class="body" text-anchor="middle">Differentiate both distances and the predicted properties</text>
<text x="48" y="894" class="small" text-anchor="start">Conceptual diagram · lengths and colors do not encode data</text>
</svg>
