<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1300" viewBox="0 0 640 1300" role="img"><title>Coherent input to Near-vacuum readout</title><style>text{font-family:ReviewSans,ReviewSymbols,ReviewMath,sans-serif}</style><rect width="100%" height="100%" fill="#faf8f1"/><text x="30" y="42" font-size="28" fill="#18384a" text-anchor="start" font-weight="700">Two lenses: prepare → perturb → read</text><text x="30" y="78" font-size="21" fill="#566975" text-anchor="start" font-weight="400">One microwave mode + an ancilla qubit</text><rect x="30" y="110" width="580" height="155" rx="10" fill="white" stroke="#cbd8d8"/><text x="48" y="144" font-size="20" fill="#267678" text-anchor="start" font-weight="700">01</text><text x="93" y="144" font-size="24" fill="#18384a" text-anchor="start" font-weight="700">Coherent input</text><text x="52" y="187" font-size="23" fill="#18384a" text-anchor="start" font-weight="400">D(α) |0〉</text><text x="52" y="220" font-size="19" fill="#566975" text-anchor="start" font-weight="400">Broad number distribution</text><rect x="30" y="294" width="580" height="155" rx="10" fill="white" stroke="#cbd8d8"/><text x="48" y="328" font-size="20" fill="#267678" text-anchor="start" font-weight="700">02</text><text x="93" y="328" font-size="24" fill="#18384a" text-anchor="start" font-weight="700">Kerr waiting</text><text x="52" y="371" font-size="23" fill="#18384a" text-anchor="start" font-weight="400">Phase φ(n−N̄)²</text><text x="52" y="404" font-size="19" fill="#566975" text-anchor="start" font-weight="400">Number probabilities unchanged</text><rect x="30" y="478" width="580" height="155" rx="10" fill="white" stroke="#cbd8d8"/><text x="48" y="512" font-size="20" fill="#267678" text-anchor="start" font-weight="700">03</text><text x="93" y="512" font-size="24" fill="#18384a" text-anchor="start" font-weight="700">Coherent drive</text><text x="52" y="555" font-size="23" fill="#18384a" text-anchor="start" font-weight="400">Duration T<tspan baseline-shift="sub" font-size="75%">F</tspan></text><text x="52" y="588" font-size="19" fill="#566975" text-anchor="start" font-weight="400">Number-focused probe</text><rect x="30" y="662" width="580" height="155" rx="10" fill="white" stroke="#cbd8d8"/><text x="48" y="696" font-size="20" fill="#267678" text-anchor="start" font-weight="700">04</text><text x="93" y="696" font-size="24" fill="#18384a" text-anchor="start" font-weight="700">Signal at the focus</text><text x="52" y="739" font-size="23" fill="#18384a" text-anchor="start" font-weight="400">Small D(β)</text><text x="52" y="772" font-size="19" fill="#566975" text-anchor="start" font-weight="400">Chosen signal quadrature</text><rect x="30" y="846" width="580" height="155" rx="10" fill="white" stroke="#cbd8d8"/><text x="48" y="880" font-size="20" fill="#267678" text-anchor="start" font-weight="700">05</text><text x="93" y="880" font-size="24" fill="#18384a" text-anchor="start" font-weight="700">Second control</text><text x="52" y="923" font-size="23" fill="#18384a" text-anchor="start" font-weight="400">Drive T<tspan baseline-shift="sub" font-size="75%">F</tspan> → Kerr waiting</text><text x="52" y="956" font-size="19" fill="#566975" text-anchor="start" font-weight="400">Approximate return</text><rect x="30" y="1030" width="580" height="155" rx="10" fill="white" stroke="#cbd8d8"/><text x="48" y="1064" font-size="20" fill="#267678" text-anchor="start" font-weight="700">06</text><text x="93" y="1064" font-size="24" fill="#18384a" text-anchor="start" font-weight="700">Near-vacuum readout</text><text x="52" y="1107" font-size="23" fill="#18384a" text-anchor="start" font-weight="400">D(−γ) → ancilla</text><text x="52" y="1140" font-size="19" fill="#566975" text-anchor="start" font-weight="400">Calibrated mean voltage → Pₑ</text><path d="M320.0,271 L320.0,288" fill="none" stroke="#267678" stroke-width="3"/><path d="M320.0,288 L314.78041359066526,277.1946347717679 L325.21958640933474,277.1946347717679 Z" fill="#267678"/><path d="M320.0,455 L320.0,472" fill="none" stroke="#267678" stroke-width="3"/><path d="M320.0,472 L314.78041359066526,461.1946347717679 L325.21958640933474,461.1946347717679 Z" fill="#267678"/><path d="M320.0,639 L320.0,656" fill="none" stroke="#267678" stroke-width="3"/><path d="M320.0,656 L314.78041359066526,645.1946347717678 L325.21958640933474,645.1946347717678 Z" fill="#267678"/><path d="M320.0,823 L320.0,840" fill="none" stroke="#267678" stroke-width="3"/><path d="M320.0,840 L314.78041359066526,829.1946347717678 L325.21958640933474,829.1946347717678 Z" fill="#267678"/><path d="M320.0,1007 L320.0,1024" fill="none" stroke="#267678" stroke-width="3"/><path d="M320.0,1024 L314.78041359066526,1013.1946347717678 L325.21958640933474,1013.1946347717678 Z" fill="#267678"/><text x="30" y="1254" font-size="19" fill="#566975" text-anchor="start" font-weight="400">Conceptual sequence; distributions are schematic, not data.</text><text x="30" y="1282" font-size="17" fill="#566975" text-anchor="start" font-weight="400">Hua et al. (2026), SI I B &amp; IV · DOI:10.1038/s41586-026-11353-2</text></svg>