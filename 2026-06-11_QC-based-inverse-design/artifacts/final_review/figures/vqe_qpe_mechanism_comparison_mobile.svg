<svg xmlns="http://www.w3.org/2000/svg" width="620" height="2700" viewBox="0 0 620 2700" role="img" aria-labelledby="title desc">
  <title id="title">모바일용 VQE와 QPE의 실행 메커니즘과 지배 비용 비교</title>
  <desc id="desc">VQE의 기준 상태, 매개변수 회로, 묶음 Pauli 측정, 에너지 계산, 고전 최적화 반복과 QPE의 중첩 초기 상태, 제어 시간 진화, 역 QFT 위상 판독, 에너지 결과를 세로로 비교한다. VQE는 많은 샷, QPE는 긴 오류정정 회로가 지배 비용이고 QFT는 DFT 대체물이 아님을 명시한다.</desc>
  <defs>
    <style>
      .bg{fill:#faf8f2}.eyebrow{font:700 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:1.2px;fill:#684790}.title{font:700 35px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.subtitle{font:400 21px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#566172}.panel{stroke-width:3}.vqe{fill:#eef4fb;stroke:#416b9a}.qpe{fill:#f3eef9;stroke:#74519a}.tag{font:800 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:1px}.panelhead{font:700 28px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.formula{font:600 17px Consolas,'Segoe UI Symbol',monospace;fill:#293548}.body{font:400 19px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#4b5565}.box{fill:#fff;stroke-width:2}.boxhead{font:700 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.boxbody{font:400 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#4b5565}.flowb{stroke:#416b9a;stroke-width:4;fill:none}.flowp{stroke:#74519a;stroke-width:4;fill:none}.loop{stroke:#a44343;stroke-width:4;stroke-dasharray:10 8;fill:none}.looplabel{font:700 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#a44343}.ledger{fill:#fff;stroke:#c8ced8;stroke-width:2.5}.lhead{font:800 21px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.lbody{font:400 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#4b5565}.cost{font:800 19px 'Segoe UI','Noto Sans KR',Arial,sans-serif}.warn{fill:#fff4e5;stroke:#aa681f;stroke-width:2.5}.warnhead{font:800 21px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#8c571c}.warnbody{font:600 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#5f4a31}.footer{font:700 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#354052}
    </style>
    <marker id="bluearrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#416b9a"/></marker>
    <marker id="purplearrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#74519a"/></marker>
    <marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a44343"/></marker>
  </defs>
  <rect class="bg" width="620" height="2700"/>

  <text class="eyebrow" x="42" y="48">VQE vs QPE · QPU EXECUTION</text>
  <text class="title" x="42" y="94">같은 해밀토니안,</text>
  <text class="title" x="42" y="136">다른 비용 구조</text>
  <text class="subtitle" x="42" y="177">VQE는 측정 반복, QPE는 긴 진화를 설계합니다.</text>

  <rect class="panel vqe" x="42" y="215" rx="24" width="536" height="910"/>
  <text class="tag" x="74" y="255" fill="#416b9a">VARIATIONAL · VQE</text>
  <text class="panelhead" x="74" y="298">짧은 회로 × 많은 shots</text>
  <text class="formula" x="74" y="337">min<tspan baseline-shift="sub" font-size="12">θ</tspan> E(θ)=Σ c<tspan baseline-shift="sub" font-size="12">j</tspan>〈ψ(θ)|P<tspan baseline-shift="sub" font-size="12">j</tspan>|ψ(θ)〉</text>

  <rect class="box" x="74" y="372" rx="15" width="472" height="105" stroke="#416b9a"/>
  <text class="boxhead" x="96" y="406">① 기준 상태 · |φ<tspan baseline-shift="sub" font-size="13">ref</tspan>〉</text>
  <text class="boxbody" x="96" y="439">HF 또는 multi-reference 초기 상태</text>
  <path class="flowb" d="M310 477 L310 509" marker-end="url(#bluearrow)"/>

  <rect class="box" x="74" y="522" rx="15" width="472" height="105" stroke="#416b9a"/>
  <text class="boxhead" x="96" y="556">② U(θ) · ansatz 회로</text>
  <text class="boxbody" x="96" y="589">얕은 depth · 표현력 · 초기화</text>
  <path class="flowb" d="M310 627 L310 659" marker-end="url(#bluearrow)"/>

  <rect class="box" x="74" y="672" rx="15" width="472" height="120" stroke="#416b9a"/>
  <text class="boxhead" x="96" y="706">③ grouped Pauli measurements</text>
  <text class="boxbody" x="96" y="739">commuting group × shots</text>
  <text class="boxbody" x="96" y="768">분산 · 통계 오차 · noise</text>
  <path class="flowb" d="M310 792 L310 824" marker-end="url(#bluearrow)"/>

  <rect class="box" x="74" y="837" rx="15" width="472" height="92" stroke="#416b9a"/>
  <text class="boxhead" x="96" y="871">④ E(θ) 추정</text>
  <text class="boxbody" x="96" y="902">그룹별 표본 평균을 합산</text>

  <rect class="box" x="155" y="965" rx="16" width="310" height="92" stroke="#a44343"/>
  <text class="boxhead" x="179" y="999">고전 optimizer</text>
  <text class="boxbody" x="179" y="1030">E(θ) → θ 갱신 → 다시 U(θ)</text>
  <path class="loop" d="M310 929 L310 957" marker-end="url(#redarrow)"/>
  <path class="loop" d="M155 1011 C52 1011 52 575 74 575" marker-end="url(#redarrow)"/>
  <text class="looplabel" x="74" y="1094">지배 비용 = groups × shots × iterations</text>

  <rect class="panel qpe" x="42" y="1160" rx="24" width="536" height="895"/>
  <text class="tag" x="74" y="1200" fill="#74519a">FAULT-TOLERANT · QPE</text>
  <text class="panelhead" x="74" y="1243">긴 결맞음 회로 + 오류정정</text>
  <text class="formula" x="74" y="1282">|ψ<tspan baseline-shift="sub" font-size="12">0</tspan>〉=Σ α<tspan baseline-shift="sub" font-size="12">k</tspan>|ψ<tspan baseline-shift="sub" font-size="12">k</tspan>〉</text>

  <rect class="box" x="74" y="1317" rx="15" width="472" height="115" stroke="#74519a"/>
  <text class="boxhead" x="96" y="1351">① overlap-bearing 초기 상태</text>
  <text class="boxbody" x="96" y="1384">목표 고유상태 중첩 α<tspan baseline-shift="sub" font-size="12">k</tspan></text>
  <text class="boxbody" x="96" y="1413">상태 준비 비용을 포함</text>
  <path class="flowp" d="M310 1432 L310 1464" marker-end="url(#purplearrow)"/>

  <rect class="box" x="74" y="1477" rx="15" width="472" height="125" stroke="#74519a"/>
  <text class="boxhead" x="96" y="1511">② controlled exp(−iHt·2<tspan baseline-shift="super" font-size="13">j</tspan>)</text>
  <text class="boxbody" x="96" y="1544">에너지 정보를 phase register로 kickback</text>
  <text class="boxbody" x="96" y="1573">긴 logical depth · Hamiltonian simulation</text>
  <path class="flowp" d="M310 1602 L310 1634" marker-end="url(#purplearrow)"/>

  <rect class="box" x="74" y="1647" rx="15" width="472" height="115" stroke="#74519a"/>
  <text class="boxhead" x="96" y="1681">③ 역 QFT · 위상 판독</text>
  <text class="boxbody" x="96" y="1714">위상 레지스터를 bitstring으로 변환</text>
  <text class="boxbody" x="96" y="1743">QFT는 이 readout 단계에만 위치</text>
  <path class="flowp" d="M310 1762 L310 1794" marker-end="url(#purplearrow)"/>

  <rect class="box" x="74" y="1807" rx="15" width="472" height="125" stroke="#74519a"/>
  <text class="boxhead" x="96" y="1841">④ E<tspan baseline-shift="sub" font-size="13">k</tspan> · 성공확률 |α<tspan baseline-shift="sub" font-size="13">k</tspan>|²</text>
  <text class="boxbody" x="96" y="1874">원하는 고유상태가 나오지 않으면 반복</text>
  <text class="boxbody" x="96" y="1903">정확도 ε에 따라 진화시간 증가</text>

  <rect class="box" x="74" y="1960" rx="15" width="472" height="62" stroke="#74519a"/>
  <text class="boxbody" x="96" y="1998">지배 비용 = state prep × simulation × QEC</text>

  <rect class="ledger" x="42" y="2090" rx="22" width="536" height="310"/>
  <text class="lhead" x="72" y="2132">지배 비용 비교</text>
  <line x1="72" y1="2155" x2="548" y2="2155" stroke="#d4d9e0" stroke-width="2"/>
  <text class="cost" x="72" y="2190" fill="#416b9a">VQE</text>
  <text class="lbody" x="142" y="2190">짧은 circuit depth</text>
  <text class="lbody" x="72" y="2222">측정 그룹 × shots × optimizer iterations</text>
  <text class="lbody" x="72" y="2254">정확도·분산·noise·관측량 수에 민감</text>
  <line x1="72" y1="2280" x2="548" y2="2280" stroke="#d4d9e0" stroke-width="2"/>
  <text class="cost" x="72" y="2315" fill="#74519a">QPE</text>
  <text class="lbody" x="142" y="2315">긴 coherent logical circuit</text>
  <text class="lbody" x="72" y="2347">상태 준비 × simulation queries × 오류정정</text>
  <text class="lbody" x="72" y="2379">overlap·ε·logical T-count에 민감</text>

  <rect class="warn" x="42" y="2435" rx="20" width="536" height="145"/>
  <text class="warnhead" x="72" y="2477">QFT는 위상 판독 수단입니다.</text>
  <text class="warnbody" x="72" y="2515">DFT·SCF·전자밀도 계산을 통째로 대체하는</text>
  <text class="warnbody" x="72" y="2546">별도의 전자구조 알고리즘이 아닙니다.</text>
  <text class="footer" x="42" y="2648">선택 기준 · 정확도 · overlap · 관측량 · 총자원</text>
</svg>
