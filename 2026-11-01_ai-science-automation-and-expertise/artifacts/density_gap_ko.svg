<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc"><title id="title">같은 점유 상태, 다른 빈 준위</title><desc id="desc">A teaching comparison of two predicted matrices in a fixed orthonormal basis of two spatial orbitals. Two noninteracting electrons of opposite spin occupy the lower spatial orbital. H0 diag(-1,+1) eV, H1 diag(-1,+2) eV. Holding the occupied orbital and its occupation fixed preserves the density while changing the empty level changes the one-particle gap from 2 to 3 eV.</desc><metadata>{&quot;type&quot;: &quot;review teaching model&quot;, &quot;basis&quot;: &quot;fixed orthonormal spatial orbitals phi0, phi1&quot;, &quot;electrons&quot;: 2, &quot;spin&quot;: &quot;opposite spins in the same lower spatial orbital&quot;, &quot;H0_eV&quot;: [[-1, 0], [0, 1]], &quot;H1_eV&quot;: [[-1, 0], [0, 2]], &quot;construction&quot;: &quot;two predicted fixed-basis matrices; occupied orbital and occupation held fixed&quot;}</metadata><style>text{font-family:ReviewFigure,NanumGothic,sans-serif;fill:#18323c}.muted{fill:#566971}.teal{fill:#116a73}.rust{fill:#a8512b}</style>
<rect width="1120" height="740" rx="16" fill="#fffefa"/>
<text x="30" y="45" font-size="28" font-weight="700" text-anchor="start" style="fill:#18323c">같은 점유 상태, 다른 빈 준위</text>
<text x="30" y="79" font-size="19" font-weight="400" text-anchor="start" style="fill:#566971">고정된 직교 기저 φ₀, φ₁ · 상호작용 없는 전자 2개</text>
<rect x="30" y="120" width="510" height="340" rx="8" fill="#f0f5f2" stroke="#d4dfda"/>
<text x="55" y="158" font-size="25" font-weight="700" text-anchor="start" style="fill:#18323c">H0 = diag(−1, +1) eV</text>
<line x1="115.00" y1="395.00" x2="445.00" y2="395.00" stroke="#116a73" stroke-width="4"/>
<line x1="115.00" y1="291.00" x2="445.00" y2="291.00" stroke="#a8512b" stroke-width="3"/>
<text x="50" y="401" font-size="18" font-weight="400" text-anchor="start" style="fill:#116a73">−1</text>
<text x="50" y="297" font-size="18" font-weight="400" text-anchor="start" style="fill:#a8512b">+1</text>
<text x="460" y="401" font-size="22" font-weight="400" text-anchor="start" style="fill:#116a73">φ₀</text>
<text x="460" y="297" font-size="22" font-weight="400" text-anchor="start" style="fill:#a8512b">φ₁</text>
<circle cx="268.000" cy="395.000" r="7" fill="#116a73" stroke="#116a73" stroke-width="2"/>
<circle cx="292.000" cy="395.000" r="7" fill="#116a73" stroke="#116a73" stroke-width="2"/>
<text x="280.0" y="429" font-size="17" font-weight="400" text-anchor="middle" style="fill:#116a73">점유 전자 2개</text>
<text x="280.0" y="277" font-size="17" font-weight="400" text-anchor="middle" style="fill:#a8512b">비점유</text>
<line x1="421.00" y1="300.00" x2="421.00" y2="386.00" stroke="#566971" stroke-width="2"/>
<line x1="415.00" y1="300.00" x2="427.00" y2="300.00" stroke="#566971" stroke-width="2"/>
<line x1="415.00" y1="386.00" x2="427.00" y2="386.00" stroke="#566971" stroke-width="2"/>
<text x="407" y="349.0" font-size="18" font-weight="400" text-anchor="end" style="fill:#566971">Δ = 2 eV</text>
<rect x="580" y="120" width="510" height="340" rx="8" fill="#f0f5f2" stroke="#d4dfda"/>
<text x="605" y="158" font-size="25" font-weight="700" text-anchor="start" style="fill:#18323c">H1 = diag(−1, +2) eV</text>
<line x1="665.00" y1="395.00" x2="995.00" y2="395.00" stroke="#116a73" stroke-width="4"/>
<line x1="665.00" y1="239.00" x2="995.00" y2="239.00" stroke="#a8512b" stroke-width="3"/>
<text x="600" y="401" font-size="18" font-weight="400" text-anchor="start" style="fill:#116a73">−1</text>
<text x="600" y="245" font-size="18" font-weight="400" text-anchor="start" style="fill:#a8512b">+2</text>
<text x="1010" y="401" font-size="22" font-weight="400" text-anchor="start" style="fill:#116a73">φ₀</text>
<text x="1010" y="245" font-size="22" font-weight="400" text-anchor="start" style="fill:#a8512b">φ₁</text>
<circle cx="818.000" cy="395.000" r="7" fill="#116a73" stroke="#116a73" stroke-width="2"/>
<circle cx="842.000" cy="395.000" r="7" fill="#116a73" stroke="#116a73" stroke-width="2"/>
<text x="830.0" y="429" font-size="17" font-weight="400" text-anchor="middle" style="fill:#116a73">점유 전자 2개</text>
<text x="830.0" y="225" font-size="17" font-weight="400" text-anchor="middle" style="fill:#a8512b">비점유</text>
<line x1="971.00" y1="248.00" x2="971.00" y2="386.00" stroke="#566971" stroke-width="2"/>
<line x1="965.00" y1="248.00" x2="977.00" y2="248.00" stroke="#566971" stroke-width="2"/>
<line x1="965.00" y1="386.00" x2="977.00" y2="386.00" stroke="#566971" stroke-width="2"/>
<text x="957" y="323.0" font-size="18" font-weight="400" text-anchor="end" style="fill:#566971">Δ = 3 eV</text>
<rect x="30" y="495" width="1060" height="118" rx="8" fill="#e6f0ed" stroke="#116a73"/>
<text x="560.0" y="531" font-size="23" font-weight="700" text-anchor="middle" style="fill:#116a73">점유 궤도는 그대로 → 밀도도 그대로</text>
<text x="560.0" y="576" font-size="28" font-weight="700" text-anchor="middle" style="fill:#116a73">n₀(r) = n₁(r) = 2 |φ₀(r)|²</text>
<text x="30" y="660" font-size="17" font-weight="400" text-anchor="start" style="fill:#566971">고정된 기저와 점유를 유지한 두 예측 행렬의 비교.</text>
<text x="30" y="689" font-size="17" font-weight="400" text-anchor="start" style="fill:#566971">비점유 준위의 에너지만 바꾸어 밀도와 궤도 간격을 살핀 교육 모형.</text>
</svg>
