<text x="539.4" y="260" font-size="24" font-weight="700" text-anchor="middle" style="fill:#116a73">84% [78, 90]</text>
<text x="30" y="320" font-size="24" font-weight="700" text-anchor="start" style="fill:#a8512b">일반 논문 (n = 50)</text>
<line x1="432.40" y1="365.00" x2="560.80" y2="365.00" stroke="#a8512b" stroke-width="4"/>
