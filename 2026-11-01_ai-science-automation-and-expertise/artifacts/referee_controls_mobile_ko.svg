<text x="496.6" y="405" font-size="24" font-weight="700" text-anchor="middle" style="fill:#a8512b">76% [64, 88]</text>
<rect x="30" y="560" width="620" height="112" rx="8" fill="#f0f5f2" stroke="#d4dfda"/>
<text x="50" y="594" font-size="24" font-weight="400" text-anchor="start" style="fill:#566971">점: 보고 비율 · 선: 95% bootstrap 구간</text>
<text x="50" y="626" font-size="24" font-weight="400" text-anchor="start" style="fill:#566971">AI 심사자의 판단이며</text>
<text x="50" y="658" font-size="24" font-weight="400" text-anchor="start" style="fill:#566971">사람이 확정한 오류율은 아니다.</text>
<text x="30" y="730" font-size="24" font-weight="400" text-anchor="start" style="fill:#566971">출처: JCCM 동결 공개 집계</text>
<text x="30" y="762" font-size="24" font-weight="400" text-anchor="start" style="fill:#566971">표시값은 정수로 반올림</text>
