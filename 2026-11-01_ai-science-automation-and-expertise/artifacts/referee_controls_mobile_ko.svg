<text x="197.0" y="465" font-size="24" font-weight="400" text-anchor="middle" style="fill:#566971">20%</text>
<line x1="304.00" y1="185.00" x2="304.00" y2="435.00" stroke="#d4dfda" stroke-width="1"/>
<text x="304.0" y="465" font-size="24" font-weight="400" text-anchor="middle" style="fill:#566971">40%</text>
<line x1="411.00" y1="185.00" x2="411.00" y2="435.00" stroke="#d4dfda" stroke-width="1"/>
<text x="411.0" y="465" font-size="24" font-weight="400" text-anchor="middle" style="fill:#566971">60%</text>
<line x1="518.00" y1="185.00" x2="518.00" y2="435.00" stroke="#d4dfda" stroke-width="1"/>
<text x="518.0" y="465" font-size="24" font-weight="400" text-anchor="middle" style="fill:#566971">80%</text>
<line x1="625.00" y1="185.00" x2="625.00" y2="435.00" stroke="#d4dfda" stroke-width="1"/>
<text x="625.0" y="465" font-size="24" font-weight="400" text-anchor="middle" style="fill:#566971">100%</text>
<text x="30" y="175" font-size="24" font-weight="700" text-anchor="start" style="fill:#116a73">AI 논문 (n = 130)</text>
<line x1="507.30" y1="220.00" x2="571.50" y2="220.00" stroke="#116a73" stroke-width="4"/>
<line x1="507.30" y1="210.00" x2="507.30" y2="230.00" stroke="#116a73" stroke-width="3"/>
<line x1="571.50" y1="210.00" x2="571.50" y2="230.00" stroke="#116a73" stroke-width="3"/>
