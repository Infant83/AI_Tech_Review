<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1040" viewBox="0 0 680 1040" role="img" aria-labelledby="title desc"><title id="title">같은 점유 상태, 다른 빈 준위</title><desc id="desc">A teaching comparison of two predicted matrices in a fixed orthonormal basis of two spatial orbitals. Two noninteracting electrons of opposite spin occupy the lower spatial orbital. H0 diag(-1,+1) eV, H1 diag(-1,+2) eV. Holding the occupied orbital and its occupation fixed preserves the density while changing the empty level changes the one-particle gap from 2 to 3 eV.</desc><metadata>{&quot;type&quot;: &quot;review teaching model&quot;, &quot;basis&quot;: &quot;fixed orthonormal spatial orbitals phi0, phi1&quot;, &quot;electrons&quot;: 2, &quot;spin&quot;: &quot;opposite spins in the same lower spatial orbital&quot;, &quot;H0_eV&quot;: [[-1, 0], [0, 1]], &quot;H1_eV&quot;: [[-1, 0], [0, 2]], &quot;construction&quot;: &quot;two predicted fixed-basis matrices; occupied orbital and occupation held fixed&quot;}</metadata><style>text{font-family:ReviewFigure,NanumGothic,sans-serif;fill:#18323c}.muted{fill:#566971}.teal{fill:#116a73}.rust{fill:#a8512b}</style>
<rect width="680" height="1040" rx="16" fill="#fffefa"/>
<text x="30" y="45" font-size="28" font-weight="700" text-anchor="start" style="fill:#18323c">같은 점유 상태, 다른 빈 준위</text>
<text x="30" y="79" font-size="24" font-weight="400" text-anchor="start" style="fill:#566971">직교 기저 φ₀, φ₁ 고정 · 비상호작용 전자 2개</text>
<rect x="30" y="115" width="620" height="280" rx="8" fill="#f0f5f2" stroke="#d4dfda"/>
<text x="55" y="153" font-size="25" font-weight="700" text-anchor="start" style="fill:#18323c">H0 = diag(−1, +1) eV</text>
<line x1="115.00" y1="330.00" x2="555.00" y2="330.00" stroke="#116a73" stroke-width="4"/>
<line x1="115.00" y1="244.00" x2="555.00" y2="244.00" stroke="#a8512b" stroke-width="3"/>
<text x="50" y="336" font-size="24" font-weight="400" text-anchor="start" style="fill:#116a73">−1</text>
<text x="50" y="250" font-size="24" font-weight="400" text-anchor="start" style="fill:#a8512b">+1</text>
<text x="570" y="336" font-size="24" font-weight="400" text-anchor="start" style="fill:#116a73">φ₀</text>
<text x="570" y="250" font-size="24" font-weight="400" text-anchor="start" style="fill:#a8512b">φ₁</text>
<circle cx="323.000" cy="330.000" r="7" fill="#116a73" stroke="#116a73" stroke-width="2"/>
<circle cx="347.000" cy="330.000" r="7" fill="#116a73" stroke="#116a73" stroke-width="2"/>
<text x="335.0" y="364" font-size="24" font-weight="400" text-anchor="middle" style="fill:#116a73">점유 전자 2개</text>
<text x="335.0" y="230" font-size="24" font-weight="400" text-anchor="middle" style="fill:#a8512b">비점유</text>
<line x1="531.00" y1="253.00" x2="531.00" y2="321.00" stroke="#566971" stroke-width="2"/>
<line x1="525.00" y1="253.00" x2="537.00" y2="253.00" stroke="#566971" stroke-width="2"/>
<line x1="525.00" y1="321.00" x2="537.00" y2="321.00" stroke="#566971" stroke-width="2"/>
<text x="517" y="293.0" font-size="24" font-weight="400" text-anchor="end" style="fill:#566971">Δ = 2 eV</text>
<rect x="30" y="420" width="620" height="280" rx="8" fill="#f0f5f2" stroke="#d4dfda"/>
<text x="55" y="458" font-size="25" font-weight="700" text-anchor="start" style="fill:#18323c">H1 = diag(−1, +2) eV</text>
<line x1="115.00" y1="635.00" x2="555.00" y2="635.00" stroke="#116a73" stroke-width="4"/>
<line x1="115.00" y1="506.00" x2="555.00" y2="506.00" stroke="#a8512b" stroke-width="3"/>
<text x="50" y="641" font-size="24" font-weight="400" text-anchor="start" style="fill:#116a73">−1</text>
<text x="50" y="512" font-size="24" font-weight="400" text-anchor="start" style="fill:#a8512b">+2</text>
<text x="570" y="641" font-size="24" font-weight="400" text-anchor="start" style="fill:#116a73">φ₀</text>
<text x="570" y="512" font-size="24" font-weight="400" text-anchor="start" style="fill:#a8512b">φ₁</text>
<circle cx="323.000" cy="635.000" r="7" fill="#116a73" stroke="#116a73" stroke-width="2"/>
<circle cx="347.000" cy="635.000" r="7" fill="#116a73" stroke="#116a73" stroke-width="2"/>
<text x="335.0" y="669" font-size="24" font-weight="400" text-anchor="middle" style="fill:#116a73">점유 전자 2개</text>
<text x="335.0" y="492" font-size="24" font-weight="400" text-anchor="middle" style="fill:#a8512b">비점유</text>
<line x1="531.00" y1="515.00" x2="531.00" y2="626.00" stroke="#566971" stroke-width="2"/>
<line x1="525.00" y1="515.00" x2="537.00" y2="515.00" stroke="#566971" stroke-width="2"/>
<line x1="525.00" y1="626.00" x2="537.00" y2="626.00" stroke="#566971" stroke-width="2"/>
<text x="517" y="576.5" font-size="24" font-weight="400" text-anchor="end" style="fill:#566971">Δ = 3 eV</text>
<rect x="30" y="735" width="620" height="118" rx="8" fill="#e6f0ed" stroke="#116a73"/>
<text x="340.0" y="771" font-size="24" font-weight="700" text-anchor="middle" style="fill:#116a73">점유 궤도는 그대로 → 밀도도 그대로</text>
<text x="340.0" y="816" font-size="28" font-weight="700" text-anchor="middle" style="fill:#116a73">n₀(r) = n₁(r) = 2 |φ₀(r)|²</text>
<text x="30" y="925" font-size="24" font-weight="400" text-anchor="start" style="fill:#566971">고정된 기저와 점유를 유지한 예측 행렬.</text>
<text x="30" y="960" font-size="24" font-weight="400" text-anchor="start" style="fill:#566971">비점유 준위의 에너지만 바꾸어</text>
<text x="30" y="995" font-size="24" font-weight="400" text-anchor="start" style="fill:#566971">밀도와 궤도 간격을 비교한 교육 모형.</text>
</svg>
