<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><title id="title">AI 심사자가 지적한 주요 문제</title><desc id="desc">Matched-field comparison: 130 AI papers, rounded 84 percent with 95 percent bootstrap CI 78-90; 50 control papers, 76 percent, CI 64-88. AI referee judgments, not independent human verdicts. Selected sample, not all scientific work.</desc><metadata>{&quot;source&quot;: &quot;https://github.com/akhmerov/papers-to-end-all-papers/blob/0b55e3424559c12f98718185cca87ba42424ddbd/review/data/aggregates.json&quot;, &quot;type&quot;: &quot;reported data redraw&quot;, &quot;AI_n&quot;: 130, &quot;AI_percent&quot;: 83.8, &quot;AI_95CI&quot;: [77.7, 90.0], &quot;control_n&quot;: 50, &quot;control_percent&quot;: 76, &quot;control_95CI&quot;: [64, 88], &quot;display&quot;: &quot;whole-percent rounding&quot;, &quot;difference_control_minus_AI_percentage_points&quot;: -7.8, &quot;difference_95CI&quot;: [-21.5, 4.9]}</metadata><style>text{font-family:ReviewFigure,NanumGothic,sans-serif;fill:#18323c}.muted{fill:#566971}.teal{fill:#116a73}.rust{fill:#a8512b}</style>
<rect width="1120" height="700" rx="16" fill="#fffefa"/>
<text x="30" y="45" font-size="28" font-weight="700" text-anchor="start" style="fill:#18323c">AI 심사자가 지적한 주요 문제</text>
<text x="30" y="80" font-size="19" font-weight="400" text-anchor="start" style="fill:#566971">같은 주분야(cond-mat/quant-ph)의 논문을 비교</text>
<text x="30" y="110" font-size="19" font-weight="400" text-anchor="start" style="fill:#566971">적어도 하나의 major issue를 지적한 비율</text>
