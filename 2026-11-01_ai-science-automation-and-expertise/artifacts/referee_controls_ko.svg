<rect x="30" y="500" width="1060" height="112" rx="8" fill="#f0f5f2" stroke="#d4dfda"/>
<text x="50" y="534" font-size="18" font-weight="400" text-anchor="start" style="fill:#566971">점: 보고 비율 · 선: 95% bootstrap 신뢰구간</text>
<text x="50" y="565" font-size="18" font-weight="400" text-anchor="start" style="fill:#566971">이 비율은 AI 심사자의 판단이며 사람의 확정 오류율이 아니다.</text>
<text x="30" y="676" font-size="16" font-weight="400" text-anchor="start" style="fill:#566971">출처: JCCM 동결 공개 집계 · 표시값은 정수로 반올림</text>
