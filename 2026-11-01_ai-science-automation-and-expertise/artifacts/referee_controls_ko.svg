<text x="915.0" y="445" font-size="18" font-weight="400" text-anchor="middle" style="fill:#566971">80%</text>
<line x1="1065.00" y1="165.00" x2="1065.00" y2="415.00" stroke="#d4dfda" stroke-width="1"/>
<text x="1065.0" y="445" font-size="18" font-weight="400" text-anchor="middle" style="fill:#566971">100%</text>
<text x="30" y="207" font-size="21" font-weight="700" text-anchor="start" style="fill:#116a73">AI 논문 (n = 130)</text>
<line x1="900.00" y1="200.00" x2="990.00" y2="200.00" stroke="#116a73" stroke-width="4"/>
<line x1="900.00" y1="190.00" x2="900.00" y2="210.00" stroke="#116a73" stroke-width="3"/>
