<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Reviewer-proposed validation loop for OLED excited-state inverse design</title>
  <desc id="desc">A proposed workflow connects candidate generation, reaction feasibility, a multi-state latent Hamiltonian, uncertainty-aware acquisition, TDDFT and spin-orbit validation, and held-out decision gates.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/></marker><style>.t{font:700 34px Arial,sans-serif;fill:#f8fafc}.s{font:18px Arial,sans-serif;fill:#bfd0e6}.h{font:700 20px Arial,sans-serif;fill:#f8fafc}.b{font:16px Arial,sans-serif;fill:#dce7f4}.tag{font:700 14px Arial,sans-serif;fill:#071426}</style></defs>
  <rect width="1440" height="760" rx="28" fill="#091628"/>
  <text x="70" y="70" class="t">Proposed validation loop: structured states before scalar ranking</text>
  <text x="70" y="104" class="s">Reviewer proposal. No source paper executed this end-to-end OLED workflow.</text>
  <g transform="translate(60 200)"><rect width="220" height="145" rx="20" fill="#182c46" stroke="#64748b"/><text x="24" y="40" class="h">1. Candidate pool</text><text x="24" y="75" class="b">graph / SELFIES /</text><text x="24" y="100" class="b">literature seeds</text></g>
  <g transform="translate(330 200)"><rect width="230" height="145" rx="20" fill="#3b2b19" stroke="#fbbf24"/><text x="24" y="40" class="h">2. Reaction gate</text><text x="24" y="75" class="b">MAELLE-like feasibility</text><text x="24" y="100" class="b">as veto + reranker</text></g>
  <g transform="translate(610 165)"><rect width="300" height="215" rx="20" fill="#123a54" stroke="#67e8f9" stroke-width="3"/><text x="24" y="40" class="h">3. Multi-state model</text><text x="24" y="78" class="b">latent symmetric Hamiltonian</text><text x="24" y="105" class="b">S₀/S₁/T₁/Tₙ + buffer states</text><text x="24" y="132" class="b">transition operators; proposed SOC head</text><rect x="24" y="160" width="210" height="28" rx="14" fill="#67e8f9"/><text x="42" y="180" class="tag">LUSH-INSPIRED, NOT TESTED</text></g>
  <g transform="translate(960 200)"><rect width="220" height="145" rx="20" fill="#143d42" stroke="#5eead4"/><text x="24" y="40" class="h">4. Acquisition</text><text x="24" y="75" class="b">AdaptNTK / ensemble</text><text x="24" y="100" class="b">diverse uncertain points</text></g>
  <g transform="translate(1210 200)"><rect width="180" height="145" rx="20" fill="#282c4d" stroke="#a78bfa"/><text x="20" y="40" class="h">5. Labels</text><text x="20" y="75" class="b">TDDFT/TDA</text><text x="20" y="100" class="b">SOC + conformers</text></g>
  <path d="M280 272H322" stroke="#60a5fa" stroke-width="4" marker-end="url(#a)"/><path d="M560 272H602" stroke="#60a5fa" stroke-width="4" marker-end="url(#a)"/><path d="M910 272H952" stroke="#60a5fa" stroke-width="4" marker-end="url(#a)"/><path d="M1180 272H1202" stroke="#60a5fa" stroke-width="4" marker-end="url(#a)"/>
  <path d="M1300 355 C1300 500 775 515 775 390" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/>
  <g transform="translate(260 510)"><rect width="920" height="145" rx="22" fill="#13233a" stroke="#60a5fa"/><text x="28" y="40" class="h">Decision gate on held-out chemistry</text><text x="28" y="76" class="b">scaffold-held-out and torsion-held-out errors · state-order swaps · oscillator-strength error</text><text x="28" y="104" class="b">uncertainty calibration · selected-batch diversity · TDDFT wall time · isomer-ranking stability</text><text x="28" y="130" class="b">Advance only if structured outputs reduce catastrophic ranking errors against fixed baselines.</text></g>
</svg>
