<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="690" viewBox="0 0 1180 690" role="img" aria-labelledby="title desc">
<title id="title">어느 관측량을 고르느냐가 확률 배분을 바꾼다</title><desc id="desc">Exact averaged qDRIFT channels for H=Z+0.2X+0.2Y, same initial state, T=0.4,N=4. Exact-oracle toy distributions minimize MSE for 200 trajectories. Not the StateDRIFT allocation algorithm. No measurement shot noise.</desc>
<rect width="100%" height="100%" fill="#fffdf8"/>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#23333d} .title{font-size:25px;font-weight:700} .small{font-size:14px} .label{font-size:17px} .tick{font-size:13px}</style>
<text x="46" y="40" class="title">어느 관측량을 고르느냐가 확률 배분을 바꾼다</text>
<text x="46" y="73" class="small">H = Z + 0.2X + 0.2Y; T = 0.4; N = 4; M = 200 trajectories.</text>
<text x="82" y="119" class="label">Z: 평균제곱오차 = 편향² + trajectory 분산/M</text>
<text x="82" y="157" class="small">계수 기반 qDRIFT</text>
<rect x="82" y="167" width="97.440" height="25" fill="#bd5939"/>
<rect x="179.440" y="167" width="12.798" height="25" fill="#247f79"/>
<text x="82" y="214" class="small">bias=-0.03660; MSE=0.001516</text>
<text x="82" y="244" class="small">Z 목표의 교육 최적화</text>
<rect x="82" y="254" width="51.118" height="25" fill="#bd5939"/>
<rect x="133.118" y="254" width="6.265" height="25" fill="#247f79"/>
<text x="82" y="301" class="small">bias=-0.02651; MSE=0.000789</text>
<text x="82" y="331" class="small">X 목표의 교육 최적화</text>
<rect x="82" y="341" width="341.867" height="25" fill="#bd5939"/>
<rect x="423.867" y="341" width="11.378" height="25" fill="#247f79"/>
<text x="82" y="388" class="small">bias=-0.06856; MSE=0.004857</text>
<line x1="82" y1="413" x2="482" y2="413" stroke="#9aa8ad"/>
<text x="82.00" y="433" text-anchor="middle" class="tick">0</text>
<text x="154.73" y="433" text-anchor="middle" class="tick">0.001</text>
<text x="227.45" y="433" text-anchor="middle" class="tick">0.002</text>
<text x="300.18" y="433" text-anchor="middle" class="tick">0.003</text>
<text x="372.91" y="433" text-anchor="middle" class="tick">0.004</text>
<text x="445.64" y="433" text-anchor="middle" class="tick">0.005</text>
<text x="647" y="119" class="label">X: 평균제곱오차 = 편향² + trajectory 분산/M</text>
<text x="647" y="157" class="small">계수 기반 qDRIFT</text>
<rect x="647" y="167" width="70.344" height="25" fill="#bd5939"/>
<rect x="717.344" y="167" width="22.324" height="25" fill="#247f79"/>
<text x="647" y="214" class="small">bias=-0.03110; MSE=0.001274</text>
<text x="647" y="244" class="small">Z 목표의 교육 최적화</text>
<rect x="647" y="254" width="265.816" height="25" fill="#bd5939"/>
<rect x="912.816" y="254" width="72.083" height="25" fill="#247f79"/>
<text x="647" y="301" class="small">bias=-0.06046; MSE=0.004646</text>
<text x="647" y="331" class="small">X 목표의 교육 최적화</text>
<rect x="647" y="341" width="41.194" height="25" fill="#bd5939"/>
<rect x="688.194" y="341" width="20.588" height="25" fill="#247f79"/>
<text x="647" y="388" class="small">bias=-0.02380; MSE=0.000849</text>
<line x1="647" y1="413" x2="1047" y2="413" stroke="#9aa8ad"/>
<text x="647.00" y="433" text-anchor="middle" class="tick">0</text>
<text x="719.73" y="433" text-anchor="middle" class="tick">0.001</text>
<text x="792.45" y="433" text-anchor="middle" class="tick">0.002</text>
<text x="865.18" y="433" text-anchor="middle" class="tick">0.003</text>
<text x="937.91" y="433" text-anchor="middle" class="tick">0.004</text>
<text x="1010.64" y="433" text-anchor="middle" class="tick">0.005</text>
<rect x="80" y="455" width="19" height="19" fill="#bd5939"/><text x="110" y="471" class="small">편향²</text>
<rect x="290" y="455" width="19" height="19" fill="#247f79"/><text x="320" y="471" class="small">trajectory 분산 / M</text>
<text x="80" y="517" class="small">계수 기반 qDRIFT: q(Z,X,Y) = 0.7143, 0.1429, 0.1429.</text>
<text x="80" y="545" class="small">Z 목표의 교육 최적화: q(Z,X,Y) = 0.3155, 0.3543, 0.3302.</text>
<text x="80" y="573" class="small">X 목표의 교육 최적화: q(Z,X,Y) = 0.7762, 0.0413, 0.1825.</text>
<text x="46" y="638" class="small">정확한 평균·분산으로 최적화한 교육 예제이며 StateDRIFT 구현·분자 결과 재현이 아니다.</text>
<text x="46" y="663" class="small">표시한 분산은 회로 선택 trajectory의 변동이다. 최종 양자 측정 샷 잡음은 포함하지 않았다.</text>
</svg>