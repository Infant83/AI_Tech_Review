<text x="46" y="548" class="label">Both bandwidths W are zero, while ||H(k)||2=A, and A can be arbitrarily large.</text>
<text x="46" y="586" class="label">At k=pi/4 the Z and X components are equal; their commutator norm is A squared.</text>
<text x="46" y="624" class="label">An algebraic counterexample, not a material calculation or electronic-to-qubit mapping.</text>
