<title id="title">A flat band does not imply a small Hamiltonian norm</title><desc id="desc">Algebraic two-band counterexample H(k)=A[cos(k) Z+sin(k) X], eigenvalues +A and -A, hence zero bandwidth. Spectral norm A; component commutator norm A squared at k=pi/4. Not a material simulation.</desc>
