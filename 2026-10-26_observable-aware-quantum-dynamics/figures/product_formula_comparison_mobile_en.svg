<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" width="600" height="1368" viewBox="0 0 600 1368" role="img">
  <title id="title">Dominant half steps do not make a full second-order formula</title>
  <desc id="desc">Exact one-qubit educational calculation H=Z+0.2X+0.2Y, T=1; not a molecular or QPU reproduction. Left: state-l2 error versus N. Right: propagator spectral-norm error versus alpha at fixed N=64.</desc>
  <rect width="100%" height="100%" fill="#fffdf8" />
  <style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#23333d}.title{font-size:26px;font-weight:700}.small{font-size:20px}.label{font-size:22px}.tick{font-size:19px}</style>
  <text class="title" x="30" y="37" font-size="26" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d" font-weight="700">Dominant half steps do not make a full</text>
  <text class="title" x="30" y="71" font-size="26" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d" font-weight="700">second-order formula</text>
  <text class="small" x="30" y="107" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">H = Z + αX + αY; T = 1; ħ = 1. Exact classical 2 × 2</text>
  <text class="small" x="30" y="136" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">calculation.</text>
