<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc"><title id="title">같고 다름에 위상을 남기는 세 연산</title><desc id="desc">Coherent basis-state tracking for CX(a to b), Rz(theta) on b, then CX(a to b), in |ab&gt; basis order. The target stores a XOR b during the middle rotation; final basis bits are restored. The net phases are the RZZ(theta) diagonal entries.</desc><metadata>{&quot;basis_order&quot;: [&quot;00&quot;, &quot;01&quot;, &quot;10&quot;, &quot;11&quot;], &quot;control&quot;: &quot;a&quot;, &quot;target&quot;: &quot;b&quot;, &quot;theta_unit&quot;: &quot;rad&quot;, &quot;phases&quot;: [&quot;-theta/2&quot;, &quot;+theta/2&quot;, &quot;+theta/2&quot;, &quot;-theta/2&quot;], &quot;source&quot;: &quot;https://quantum.cloud.ibm.com/docs/en/api/qiskit/qiskit.circuit.library.RZZGate&quot;}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:ReviewFigure,sans-serif;letter-spacing:0}path,circle,rect,ellipse{vector-effect:non-scaling-stroke}</style><rect width="720" height="1120" rx="16" fill="#faf9f5"/><text x="32" y="48" font-size="30" fill="#183643" font-weight="700" text-anchor="start">같고 다름에 위상을 남기는 세 연산</text><text x="32" y="91" font-size="28" fill="#087b89" font-weight="700" text-anchor="start">CX → Rz(θ) → CX  =  RZZ(θ)</text><text x="63" y="160" font-size="25" fill="#183643" font-weight="700" text-anchor="start">a</text><text x="63" y="232" font-size="25" fill="#183643" font-weight="700" text-anchor="start">b</text><path d="M130,153 L665,153" fill="none" stroke="#586e78" stroke-width="2"/><path d="M130,225 L665,225" fill="none" stroke="#586e78" stroke-width="2"/><path d="M226.3,153 L226.3,225" fill="none" stroke="#183643" stroke-width="2"/><circle cx="226.3" cy="153" r="8" fill="#183643"/><circle cx="226.3" cy="225" r="16" fill="#faf9f5" stroke="#183643" stroke-width="2"/><path d="M214.3,225 L238.3,225" fill="none" stroke="#183643" stroke-width="2"/><path d="M226.3,213 L226.3,237" fill="none" stroke="#183643" stroke-width="2"/><path d="M568.7,153 L568.7,225" fill="none" stroke="#183643" stroke-width="2"/><circle cx="568.7" cy="153" r="8" fill="#183643"/><circle cx="568.7" cy="225" r="16" fill="#faf9f5" stroke="#183643" stroke-width="2"/><path d="M556.7,225 L580.7,225" fill="none" stroke="#183643" stroke-width="2"/><path d="M568.7,213 L568.7,237" fill="none" stroke="#183643" stroke-width="2"/><rect x="344.5" y="197" width="106" height="56" rx="6" fill="white" stroke="#087b89"/><text x="397.5" y="233" font-size="25" fill="#087b89" font-weight="700" text-anchor="middle">Rz(θ)</text><text x="32" y="292" font-size="22" fill="#586e78" font-weight="400" text-anchor="start">중첩의 각 성분에 적용하는 가역 패리티 계산</text><rect x="24" y="328" width="672" height="133" rx="12" fill="#edf3ef" stroke="none"/><text x="46" y="365" font-size="23" fill="#087b89" font-weight="700" text-anchor="start">같은 비트</text><text x="46" y="414" font-size="29" fill="#183643" font-weight="700" text-anchor="start">|00⟩ → |00⟩</text><text x="320" y="414" font-size="29" fill="#087b89" font-weight="700" text-anchor="start">−θ/2</text><text x="502" y="414" font-size="29" fill="#183643" font-weight="700" text-anchor="start">→ |00⟩</text><text x="46" y="444" font-size="18" fill="#586e78" font-weight="400" text-anchor="start">입력 → 첫 CX 뒤       위상각(rad)         최종 비트</text><rect x="24" y="479" width="672" height="133" rx="12" fill="#edf3ef" stroke="none"/><text x="46" y="516" font-size="23" fill="#b9582f" font-weight="700" text-anchor="start">다른 비트</text><text x="46" y="565" font-size="29" fill="#183643" font-weight="700" text-anchor="start">|01⟩ → |01⟩</text><text x="320" y="565" font-size="29" fill="#b9582f" font-weight="700" text-anchor="start">+θ/2</text><text x="502" y="565" font-size="29" fill="#183643" font-weight="700" text-anchor="start">→ |01⟩</text><text x="46" y="595" font-size="18" fill="#586e78" font-weight="400" text-anchor="start">입력 → 첫 CX 뒤       위상각(rad)         최종 비트</text><rect x="24" y="630" width="672" height="133" rx="12" fill="#edf3ef" stroke="none"/><text x="46" y="667" font-size="23" fill="#b9582f" font-weight="700" text-anchor="start">다른 비트</text><text x="46" y="716" font-size="29" fill="#183643" font-weight="700" text-anchor="start">|10⟩ → |11⟩</text><text x="320" y="716" font-size="29" fill="#b9582f" font-weight="700" text-anchor="start">+θ/2</text><text x="502" y="716" font-size="29" fill="#183643" font-weight="700" text-anchor="start">→ |10⟩</text><text x="46" y="746" font-size="18" fill="#586e78" font-weight="400" text-anchor="start">입력 → 첫 CX 뒤       위상각(rad)         최종 비트</text><rect x="24" y="781" width="672" height="133" rx="12" fill="#edf3ef" stroke="none"/><text x="46" y="818" font-size="23" fill="#087b89" font-weight="700" text-anchor="start">같은 비트</text><text x="46" y="867" font-size="29" fill="#183643" font-weight="700" text-anchor="start">|11⟩ → |10⟩</text><text x="320" y="867" font-size="29" fill="#087b89" font-weight="700" text-anchor="start">−θ/2</text><text x="502" y="867" font-size="29" fill="#183643" font-weight="700" text-anchor="start">→ |11⟩</text><text x="46" y="897" font-size="18" fill="#586e78" font-weight="400" text-anchor="start">입력 → 첫 CX 뒤       위상각(rad)         최종 비트</text><text x="32" y="1000" font-size="26" fill="#087b89" font-weight="700" text-anchor="start">같음: exp(−iθ/2)   다름: exp(+iθ/2)</text><text x="32" y="1038" font-size="23" fill="#586e78" font-weight="400" text-anchor="start">비트 배열은 복원되고 상대위상은 남는다</text><text x="32" y="1070" font-size="23" fill="#586e78" font-weight="400" text-anchor="start">RZZ(θ) = exp(−iθ ZaZb / 2)</text></svg>
