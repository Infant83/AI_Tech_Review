<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">문제의 점수에서 답의 확률까지</title><desc id="desc">Review ideal two-qubit, one-edge MaxCut statevector calculation. Basis order 00,01,10,11. Uniform initial state; cost phases exp(-i gamma C); local X mixers exp(-i beta (Xa+Xb)). gamma=pi/2 and beta=pi/8 radians yield probabilities 0,1/2,1/2,0. Arrows preserve the calculated common phase.</desc><metadata>{&quot;calculation&quot;: &quot;Review ideal statevector educational calculation&quot;, &quot;basis_order&quot;: [&quot;00&quot;, &quot;01&quot;, &quot;10&quot;, &quot;11&quot;], &quot;scores&quot;: [0, 1, 1, 0], &quot;gamma_rad&quot;: 1.5707963267948966, &quot;beta_rad&quot;: 0.39269908169872414, &quot;probabilities&quot;: [[0.25, 0.25, 0.25, 0.25], [0.25, 0.25, 0.25, 0.25], [3.550162843101408e-33, 0.4999999999999999, 0.4999999999999999, 3.550162843101408e-33]], &quot;source&quot;: &quot;https://arxiv.org/abs/1411.4028v1&quot;}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:ReviewFigure,sans-serif;letter-spacing:0}path,circle,rect,ellipse{vector-effect:non-scaling-stroke}</style><rect width="1200" height="900" rx="16" fill="#faf9f5"/><text x="32" y="48" font-size="34" fill="#183643" font-weight="700" text-anchor="start">문제의 점수에서 답의 확률까지</text><text x="32" y="91" font-size="25" fill="#087b89" font-weight="700" text-anchor="start">γ = π/2 rad    β = π/8 rad</text><path d="M85,157 L220,157" fill="none" stroke="#183643" stroke-width="3"/><circle cx="85" cy="157" r="27" fill="white" stroke="#087b89" stroke-width="2"/><text x="85" y="166" font-size="25" fill="#087b89" font-weight="700" text-anchor="middle">a</text><circle cx="220" cy="157" r="27" fill="white" stroke="#087b89" stroke-width="2"/><text x="220" y="166" font-size="25" fill="#087b89" font-weight="700" text-anchor="middle">b</text><text x="284" y="145" font-size="23" fill="#183643" font-weight="400" text-anchor="start">다른 비트에 1점</text><text x="284" y="181" font-size="23" fill="#183643" font-weight="400" text-anchor="start">C = (I − ZaZb) / 2</text><text x="32" y="226" font-size="22" fill="#586e78" font-weight="400" text-anchor="start">화살표는 복소 진폭 · 막대는 측정 확률</text><rect x="24" y="264" width="370" height="485" rx="12" fill="#edf3ef" stroke="none"/><text x="45" y="304" font-size="25" fill="#183643" font-weight="700" text-anchor="start">1  처음 |++⟩</text><text x="44" y="373" font-size="23" fill="#183643" font-weight="700" text-anchor="start">|00⟩</text><path d="M108,365 L164,365" fill="none" stroke="#c8d7d7" stroke-width="2"/><path d="M136,393 L136,337" fill="none" stroke="#c8d7d7" stroke-width="2"/><circle cx="136" cy="365" r="24" fill="none" stroke="#c8d7d7" stroke-dasharray="3 4"/><path d="M136,365 L148,365" fill="none" stroke="#087b89" stroke-width="5" marker-end="url(#arrow)"/><rect x="181" y="352" width="137" height="25" rx="3" fill="#dce7e2" stroke="none"/><rect x="181" y="352" width="34.25" height="25" rx="3" fill="#087b89" stroke="none"/><text x="327" y="372" font-size="22" fill="#087b89" font-weight="700" text-anchor="start">25%</text><text x="44" y="443" font-size="23" fill="#183643" font-weight="700" text-anchor="start">|01⟩</text><path d="M108,435 L164,435" fill="none" stroke="#c8d7d7" stroke-width="2"/><path d="M136,463 L136,407" fill="none" stroke="#c8d7d7" stroke-width="2"/><circle cx="136" cy="435" r="24" fill="none" stroke="#c8d7d7" stroke-dasharray="3 4"/><path d="M136,435 L148,435" fill="none" stroke="#b9582f" stroke-width="5" marker-end="url(#arrow)"/><rect x="181" y="422" width="137" height="25" rx="3" fill="#dce7e2" stroke="none"/><rect x="181" y="422" width="34.25" height="25" rx="3" fill="#b9582f" stroke="none"/><text x="327" y="442" font-size="22" fill="#b9582f" font-weight="700" text-anchor="st