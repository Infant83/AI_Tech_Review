e-width="2"/><path d="M530,603 L530,547" fill="none" stroke="#c8d7d7" stroke-width="2"/><circle cx="530" cy="575" r="24" fill="none" stroke="#c8d7d7" stroke-dasharray="3 4"/><path d="M530,575 L542,575" fill="none" stroke="#087b89" stroke-width="5" marker-end="url(#arrow)"/><rect x="575" y="562" width="137" height="25" rx="3" fill="#dce7e2" stroke="none"/><rect x="575" y="562" width="34.25" height="25" rx="3" fill="#087b89" stroke="none"/><text x="721" y="582" font-size="22" fill="#087b89" font-weight="700" text-anchor="start">25%</text><text x="438" y="704" font-size="25" fill="#087b89" font-weight="700" text-anchor="start">기댓점수 = 0.5</text><rect x="812" y="264" width="370" height="485" rx="12" fill="#edf3ef" stroke="none"/><text x="833" y="304" font-size="25" fill="#183643" font-weight="700" text-anchor="start">3  X 혼합층 뒤</text><text x="832" y="373" font-size="23" fill="#183643" font-weight="700" text-anchor="start">|00⟩</text><path d="M896,365 L952,365" fill="none" stroke="#c8d7d7" stroke-width="2"/><path d="M924,393 L924,337" fill="none" stroke="#c8d7d7" stroke-width="2"/><circle cx="924" cy="365" r="24" fill="none" stroke="#c8d7d7" stroke-dasharray="3 4"/><circle cx="924" cy="365" r="4" fill="#087b89"/><rect x="969" y="352" width="137" height="25" rx="3" fill="#dce7e2" stroke="none"/><text x="1115" y="372" font-size="22" fill="#087b89" font-weight="700" text-anchor="start">0%</text><text x="832" y="443" font-size="23" fill="#183643" font-weight="700" text-anchor="start">|01⟩</text><path d="M896,435 L952,435" fill="none" stroke="#c8d7d7" stroke-width="2"/><path d="M924,463 L924,407" fill="none" stroke="#c8d7d7" stroke-width="2"/><circle cx="924" cy="435" r="24" fill="none" stroke="#c8d7d7" stroke-dasharray="3 4"/><path d="M924,435 L924,451.971" fill="none" stroke="#b9582f" stroke-width="5" marker-end="url(#arrow)"/><rect x="969" y="422" width="137" height="25" rx="3" fill="#dce7e2" stroke="none"/><rect x="969" y="422" width="68.5" height="25" rx="3" fill="#b9582f" stroke="none"/><text x="1115" y="442" font-size="22" fill="#b9582f" font-weight="700" text-anchor="start">50%</text><text x="832" y="513" font-size="23" fill="#183643" font-weight="700" text-anchor="start">|10⟩</text><path d="M896,505 L952,505" fill="none" stroke="#c8d7d7" stroke-width="2"/><path d="M924,533 L924,477" fill="none" stroke="#c8d7d7" stroke-width="2"/><circle cx="924" cy="505" r="24" fill="none" stroke="#c8d7d7" stroke-dasharray="3 4"/><path d="M924,505 L924,521.971" fill="none" stroke="#b9582f" stroke-width="5" marker-end="url(#arrow)"/><rect x="969" y="492" width="137" height="25" rx="3" fill="#dce7e2" stroke="none"/><rect x="969" y="492" width="68.5" height="25" rx="3" fill="#b9582f" stroke="none"/><text x="1115" y="512" font-size="22" fill="#b9582f" font-weight="700" text-anchor="start">50%</text><text x="832" y="583" font-size="23" fill="#183643" font-weight="700" text-anchor="start">|11⟩</text><path d="M896,575 L952,575" fill="none" stroke="#c8d7d7" stroke-width="2"/><path d="M924,603 L924,547" fill="none" stroke="#c8d7d7" stroke-width="2"/><circle cx="924" cy="575" r="24" fill="none" stroke="#c8d7d7" stroke-dasharray="3 4"/><circle cx="924" cy="575" r="4" fill="#087b89"/><rect x="969" y="562" width="137" height="25" rx="3" fill="#dce7e2" stroke="none"/><text x="1115" y="582" font-size="22" fill="#087b89" font-weight="700" text-anchor="start">0%</text><text x="832" y="704" font-size="25" fill="#087b89" font-weight="700" text-anchor="start">기댓점수 = 1</text><text x="32" y="805" font-size="22" fill="#087b89" font-weight="700" text-anchor="start">Re →   Im ↑    막대 길이 = |진폭|²</text><text x="32" y="839" font-size="20" fill="#586e78" font-weight="400" text-anchor="start">문제 위상은 방향을 바꾸고, 혼합 연산은 확률을 바꾼다</text><text x="32" y="871" font-size="20" fill="#586e78" font-weight="400" text-anchor="start">리뷰의 이상적 교육 계산 · 2노드·1간선</text></svg>
