<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1560" viewBox="0 0 720 1560" role="img" aria-labelledby="title desc"><title id="title">위상차를 확률로 읽는 한 큐비트</title><desc id="desc">Ideal one-qubit H–Rz(pi)–H calculation. Complex amplitudes, Bloch vectors and Z-measurement probabilities are shown after each gate. The Bloch sphere is a state representation.</desc><metadata>{&quot;calculation&quot;: &quot;Review ideal statevector calculation&quot;, &quot;phi_rad&quot;: 3.141592653589793, &quot;sources&quot;: [&quot;https://quantum.cloud.ibm.com/docs/en/api/qiskit/qiskit.circuit.library.RZGate&quot;], &quot;stages&quot;: [&quot;H&quot;, &quot;Rz(phi)&quot;, &quot;H&quot;], &quot;amplitude_scale&quot;: &quot;Arrow radius corresponds to amplitude magnitude 1; real right, imaginary up.&quot;}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:ReviewFigure,sans-serif;letter-spacing:0}path,circle,rect,ellipse{vector-effect:non-scaling-stroke}</style><rect width="720" height="1560" rx="16" fill="#faf9f5"/><text x="32" y="48" font-size="31" fill="#183643" font-weight="700" text-anchor="start">위상차를 확률로 읽는 한 큐비트</text><text x="32" y="87" font-size="25" fill="#087b89" font-weight="700" text-anchor="start">|0⟩ → H → Rz(φ) → H     φ = π rad</text><text x="32" y="126" font-size="21" fill="#586e78" font-weight="400" text-anchor="start">화살표: 복소 진폭  ·  막대: Z 측정 확률</text><rect x="24" y="170" width="672" height="396" rx="12" fill="#edf3ef" stroke="none"/><text x="46" y="210" font-size="26" fill="#183643" font-weight="700" text-anchor="start">1  첫 H 뒤</text><circle cx="139" cy="335" r="75" fill="white" stroke="#c8d7d7"/><ellipse cx="139" cy="335" rx="75" ry="22.5" fill="none" stroke="#c8d7d7"/><path d="M139,335 L214,335" fill="none" stroke="#c8d7d7" stroke-width="2"/><text x="220" y="329" font-size="19" fill="#58