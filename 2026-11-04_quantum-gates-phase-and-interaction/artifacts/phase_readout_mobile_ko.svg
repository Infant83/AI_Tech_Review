,1150" fill="none" stroke="#c8d7d7" stroke-width="2"/><path d="M364,1202 L364,1098" fill="none" stroke="#c8d7d7" stroke-width="2"/><circle cx="364" cy="1150" r="48" fill="none" stroke="#c8d7d7" stroke-dasharray="3 4"/><circle cx="364" cy="1150" r="4" fill="#087b89"/><text x="364" y="1230" font-size="23" fill="#183643" font-weight="400" text-anchor="middle">|0⟩: 0</text><path d="M497,1150 L601,1150" fill="none" stroke="#c8d7d7" stroke-width="2"/><path d="M549,1202 L549,1098" fill="none" stroke="#c8d7d7" stroke-width="2"/><circle cx="549" cy="1150" r="48" fill="none" stroke="#c8d7d7" stroke-dasharray="3 4"/><path d="M549,1150 L549,1198" fill="none" stroke="#b9582f" stroke-width="5" marker-end="url(#arrow)"/><text x="549" y="1230" font-size="23" fill="#183643" font-weight="400" text-anchor="middle">|1⟩: −i</text><text x="68" y="1324" font-size="22" fill="#183643" font-weight="400" text-anchor="start">|0⟩</text><rect x="126" y="1305" width="420" height="26" rx="3" fill="#dfe8e5" stroke="none"/><text x="558" y="1326" font-size="22" fill="#087b89" font-weight="700" text-anchor="start">0%</text><text x="68" y="1367" font-size="22" fill="#183643" font-weight="400" text-anchor="start">|1⟩</text><rect x="126" y="1348" width="420" height="26" rx="3" fill="#dfe8e5" stroke="none"/><rect x="126" y="1348" width="420" height="26" rx="3" fill="#b9582f" stroke="none"/><text x="558" y="1369" font-size="22" fill="#b9582f" font-weight="700" text-anchor="start">100%</text><text x="32" y="1453" font-size="23" fill="#087b89" font-weight="700" text-anchor="start">Re →   Im ↑   |진폭|² = 확률</text><text x="32" y="1488" font-size="20" fill="#586e78" font-weight="400" text-anchor="start">Bloch 구: 양자 상태를 나타내는 공간</text><text x="32" y="1520" font-size="20" fill="#586e78" font-weight="400" text-anchor="start">리뷰의 이상적 교육 계산 · 각도 단위 rad</text></svg>
