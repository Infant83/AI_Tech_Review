<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Three operations leave a parity-dependent phase</title><desc id="desc">Coherent basis-state tracking for CX(a to b), Rz(theta) on b, then CX(a to b), in |ab&gt; basis order. The target stores a XOR b during the middle rotation; final basis bits are restored. The net phases are the RZZ(theta) diagonal entries.</desc><metadata>{&quot;basis_order&quot;: [&quot;00&quot;, &quot;01&quot;, &quot;10&quot;, &quot;11&quot;], &quot;control&quot;: &quot;a&quot;, &quot;target&quot;: &quot;b&quot;, &quot;theta_unit&quot;: &quot;rad&quot;, &quot;phases&quot;: [&quot;-theta/2&quot;, &quot;+theta/2&quot;, &quot;+theta/2&quot;, &quot;-theta/2&quot;], &quot;source&quot;: &quot;https://quantum.cloud.ibm.com/docs/en/api/qiskit/qiskit.circuit.library.RZZGate&quot;}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:ReviewFigure,sans-serif;letter-spacing:0}path,circle,rect,ellipse{vector-effect:non-scaling-stroke}</style><rect width="1200" height="820" rx="16" fill="#faf9f5"/><text x="32" y="48" font-size="34" fill="#183643" font-weight="700" text-anchor="start">Three operations leave a parity-dependent phase</text><text x="32" y="91" font-size="28" fill="#087b89" font-weight="700" text-anchor="start">CX → Rz(θ) → CX  =  RZZ(θ)</text><text x="223" y="160" font-size="25" fill="#183643" font-weight="700" text-anchor="start">a</text><text x="223" y="232" font-size="25" fill="#183643" font-weight="700" text-anchor="start">b</text><path d="M290,153 L1105,153" fill="none" stroke="#586e78" stroke-width="2"/><path d="M290,225 L1105,225" fill="none" stroke="#586e78" stroke-width="2"/><path d="M436.7,153 L436.7,225" fill="none" stroke="#183643" stroke-width="2"/><circle cx="436.7" cy="153" r="8" fill="#183643"/><circle cx="436.7" cy="225" r="16" fill="#faf9f5" stroke="#183643" stroke-width="2"/><path d="M424.7,225 L448.7,225" fill="none" stroke="#183643" stroke-width="2"/><path d="M436.7,213 L436.7,237" fill="none" stroke="#183643" stroke-width="2"/><path d="M958.3,153 L958.3,225" fill="none" stroke="#183643" stroke-width="2"/><circle cx="958.3" cy="153" r="8" fill="#183643"/><circle cx="958.3" cy="225" r="16" fill="#faf9f5" stroke="#183643" stroke-width="2"/><path d="M946.3,225 L970.3,225" fill="none" stroke="#183643" stroke-width="2"/><path d="M958.3,213 L958.3,237" fill="none" stroke="#183643" stroke-width="2"/><rect x="644.5" y="197" width="106" height="56" rx="6" fill="white" stroke="#087b89"/><text x="697.5" y="233" font-size="25" fill="#087b89" font-weight="700" text-anchor="middle">Rz(θ)</text><text x="32" y="292" font-size="22" fill="#586e78" font-weight="400" text-anchor="start">Reversible parity computation on every basis component</text><text x="83" y="350" font-size="24" fill="#183643" font-weight="700" text-anchor="start">Input |ab⟩</text><text x="348" y="350" font-size="24" fill="#183643" font-weight="700" text-anchor="start">After first CX</text><text x="661" y="350" font-size="24" fill="#183643" font-weight="700" text-anchor="start">Rz phase angle (rad)</text><text x="962" y="350" font-size="24" fill="#183643" font-weight="700" text-anchor="start">After final CX</text><rect x="30" y="381" width="1140" height="61" rx="5" fill="#e5efec" stroke="none"/><text x="83" y="422" font-size="29" fill="#087b89" font-weight="700" text-anchor="start">|00⟩</text><text x="348" y="422" font-size="29" fill="#087b89" font-weight="700" text-anchor="start">|00⟩</text><text x="661" y="422" font-size="29" fill="#087b89" font-weight="700" text-anchor="start">−θ/2</text><text x="962" y="422" font-size="29" fill="#087b89" font-weight="700" text-anchor="start">|00⟩</text><rect x="30" y="454" width="1140" height="61" rx="5" fill="#edf3ef" stroke="none"/><text x="83" y="495" font-size="29" fill="#b9582f" font-weight="700" text-anchor="start">|01⟩</text><text x="348" y="495" font-size="29" fill="#b9582f" font-weight="700" text-anchor="start">|01⟩</text><text x="661" y="495" font-size="29" fill="#b9582f" font-weight="700" text-anchor="start">+θ/2</text><text x="962" y="495" font-size="29" fill="#b9582f" font-weight="700" text-anchor="start">|01⟩</text><rect x="30" y="527" width="1140" height="61" rx="5" fill="#edf3ef" stroke="none"/><text x="83" y="568" font-size="29" fill="#b9582f" font-weight="700" text-anchor="start">|10⟩</text><text x="348" y="568" font-size="29" fill="#b9582f" font-weight="700" text-anchor="start">|11⟩</text><text x="661" y="568" font-size="29" fill="#b9582f" font-weight="700" text-anchor="start">+θ/2</text><text x="962" y="568" font-size="29" fill="#b9582f" font-weight="700" text-anchor="start">|10⟩</text><rect x="30" y="600" width="1140" height="61" rx="5" fill="#e5efec" stroke="none"/><text x="83" y="641" font-size="29" fill="#087b89" font-weight="700" text-anchor="start">|11⟩</text><text x="348" y="641" font-size="29" fill="#087b89" font-weight="700" text-anchor="start">|10⟩</text><text x="661" y="641" font-size="29" fill="#087b89" font-weight="700" text-anchor="start">−θ/2</text><text x="962" y="641" font-size="29" fill="#087b89" font-weight="700" text-anchor="start">|11⟩</text><text x="32" y="731" font-size="26" fill="#087b89" font-weight="700" text-anchor="start">Equal: exp(−iθ/2)   Different: exp(+iθ/2)</text><text x="32" y="769" font-size="23" fill="#586e78" font-weight="400" text-anchor="start">Basis bits are restored; relative phases remain</text><text x="32" y="801" font-size="23" fill="#586e78" font-weight="400" text-anchor="start">RZZ(θ) = exp(−iθ ZaZb / 2)</text></svg>
