<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1660" viewBox="0 0 720 1660" role="img" aria-labelledby="title desc"><title id="title">From a problem score to answer probabilities</title><desc id="desc">Review ideal two-qubit, one-edge MaxCut statevector calculation. Basis order 00,01,10,11. Uniform initial state; cost phases exp(-i gamma C); local X mixers exp(-i beta (Xa+Xb)). gamma=pi/2 and beta=pi/8 radians yield probabilities 0,1/2,1/2,0. Arrows preserve the calculated common phase.</desc><metadata>{&quot;calculation&quot;: &quot;Review ideal statevector educational calculation&quot;, &quot;basis_order&quot;: [&quot;00&quot;, &quot;01&quot;, &quot;10&quot;, &quot;11&quot;], &quot;scores&quot;: [0, 1, 1, 0], &quot;gamma_rad&quot;: 1.5707963267948966, &quot;beta_rad&quot;: 0.39269908169872414, &quot;probabilities&quot;: [[0.25, 0.25, 0.25, 0.25], [0.25, 0.25, 0.25, 0.25], [3.550162843101408e-33, 0.4999999999999999, 0.4999999999999999, 3.550162843101408e-33]], &quot;source&quot;: &quot;https://arxiv.org/abs/1411.4028v1&quot;}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:ReviewFigure,sans-serif;letter-spacing:0}path,circle,rect,ellipse{vector-effect:non-scaling-stroke}</style><rect width="720" height="1660" rx="16" fill="#faf9f5"/><text x="32" y="48" font-size="30" fill="#183643" font-weight="700" text-anchor="start">From a problem score to answer probabilities</text><text x="32" y="91" font-size="25" fill="#087b89" font-weight="700" text-anchor="start">γ = π/2 rad    β = π/8 rad</text><path d="M85,157 L220,157" fill="none" stroke="#183643" stroke-width="3"/><circle cx="85" cy="157" r="27" fill="white" stroke="#087b89" stroke-width="2"/><text x="85" y="166" font-size="25" fill="#087b89" font-weight="700" text-anchor="middle">a</text><circle cx="220" cy="157" r="27" fill="white" 