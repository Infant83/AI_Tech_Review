name: Publish public report hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned build-only image dependency
        run: python3 -m pip install -r scripts/requirements-listing-images.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check publication, search and preservation rules
        run: python3 -m unittest discover -s tests
      - name: Check multilingual search ranking
        run: node --test tests/site_search.test.cjs
      - name: Check the existing lecture reader and storage races
        run: node --test .automation/lecture-reader/*.test.mjs
      - name: Read the deployed source revision and extract its immutable baseline
        run: python3 scripts/publication_release.py baseline --output output/release-baseline
      - name: Build an independent candidate from the combined source registrations
        run: python3 scripts/prepare_publication.py --output output/publication --revision "$GITHUB_SHA" --baseline-snapshot output/release-baseline/snapshot.json
      - name: Reject missing identities and undeclared article or PDF changes
        run: python3 scripts/publication_release.py check --baseline-snapshot output/release-baseline/snapshot.json --site output/publication/site --output output/publication/release-check.json
      - name: Enforce initial payload and deferred search budgets
        run: python3 scripts/site_payload_budget.py --site output/publication/site --baseline-payload output/release-baseline/payload.json --output output/publication/payload-check.json
      - name: Package the continuity snapshot with the exact deployable artifact
        run: python3 scripts/publication_release.py seal --site output/publication/site --revision "$GITHUB_SHA" --payload-report output/publication/payload-check.json
      - name: Validate the complete sealed public artifact
        run: python3 scripts/reader_engagement_publish.py validate --site-dir output/publication/site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: output/publication/site
      - name: Preserve the exact catalog packaged with Pages
        uses: actions/upload-artifact@v4
        with:
          name: reader-publication-catalog
          path: output/publication/site/reader-publications.json
          retention-days: 7
      - name: Preserve release verification summaries
        uses: actions/upload-artifact@v4
        with:
          name: publication-validation
          path: |
            output/publication/report.json
            output/publication/release-check.json
            output/publication/payload-check.json
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    outputs:
      current: ${{ steps.guard.outputs.current }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Do not redeploy an older main revision
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::notice::This source revision has been superseded; Pages deployment and notification sync are withheld."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the verified Pages artifact
        if: steps.guard.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

  notify-readers:
    # A branch push or a green build does not prove that an article is public.
    needs: [build, deploy]
    if: needs.deploy.result == 'success' && needs.deploy.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check publication notification setup
        id: setup
        env:
          ENABLED: ${{ vars.READER_NOTIFICATIONS_ENABLED }}
          PUBLISH_TOKEN: ${{ secrets.READER_PUBLISH_TOKEN }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "::notice::Reader sync is disabled. After backend setup, set READER_PUBLISH_TOKEN and READER_NOTIFICATIONS_ENABLED=true."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::READER_NOTIFICATIONS_ENABLED=true requires the READER_PUBLISH_TOKEN repository secret."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.setup.outputs.enabled == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: steps.setup.outputs.enabled == 'true'
        with:
          name: reader-publication-catalog
          path: .reader-publication-output
      - name: Verify live HTTPS articles, then register publications
        if: steps.setup.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          READER_PUBLISH_TOKEN: ${{ secrets.READER_PUBLISH_TOKEN }}
        run: python3 scripts/reader_engagement_publish.py sync --catalog .reader-publication-output/reader-publications.json
