<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
<title id="title">자원 조건을 실행에 연결하는 거버넌스 제안</title><desc id="desc">근거를 검증하는 리뷰 작성 사례의 설계 제안이다. 사람이 목적과 품질 및 총예산을 정하고, 하네스가 도구와 기억 및 반복을 조절한다. 독립 판정을 거친 결과를 기록한다. 예산이 부족하거나 진전이 없으면 확보한 근거와 미완료 상태를 인계한다. 실패와 검증 비용을 포함한 관찰을 다음 정책 검토에 연결한다.</desc>
<defs><marker id="info" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#316a67" stroke-width="1.5"/></marker><marker id="power" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 Z" fill="#b66c54"/></marker><marker id="muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#657471" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#293d42}.serif{font-family:Georgia,"Times New Roman",serif}.muted{fill:#657471}.teal{fill:#316a67}.clay{fill:#b66c54}</style>
<rect x="0" y="0" width="1400" height="1040" rx="0" fill="#f7f4eb"/>
<text x="58" y="57" font-size="21" font-weight="700" text-anchor="start" class="" style="fill:#316a67">05</text>
<text x="108" y="59" font-size="34" font-weight="700" text-anchor="start" class="" style="fill:#293d42">자원 조건을 실행 규칙에 연결하기</text>
<text x="58" y="106" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">설계 제안 · 근거를 검증하는 리뷰 작성의 경우</text>
<line x1="58" y1="132" x2="1342" y2="132" stroke="#cdd2c7" stroke-width="1.5"/>
<text x="58" y="187" font-size="29" font-weight="700" text-anchor="start" class="" style="fill:#293d42">기획자가 정하는 조건</text>
<text x="58" y="239" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#316a67">목적</text>
<text x="58" y="276" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#293d42">확인할 주장과 독자의 질문</text>
<text x="505" y="239" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#316a67">품질</text>
<text x="505" y="276" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#293d42">출처·계산·오류 기준</text>
<text x="950" y="239" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#316a67">예산</text>
<text x="950" y="276" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#293d42">작업 한도와 기간별 총량</text>
<line x1="58" y1="304" x2="1342" y2="304" stroke="#cdd2c7" stroke-width="1.5"/>
<path d="M272 311 V367 H438" fill="none" stroke="#316a67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#info)"/>
<rect x="466" y="341" width="524" height="315" rx="0" fill="none" stroke="#316a67" stroke-width="1.7"/>
<text x="493" y="386" font-size="29" font-weight="700" text-anchor="start" class="" style="fill:#293d42">실행을 조절하는 하네스</text>
<text x="493" y="438" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#293d42">자료·모델 선택</text>
<text x="493" y="471" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">필요한 증거와 계산 강도</text>
<text x="493" y="503" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#293d42">기억·도구 사용</text>
<text x="493" y="536" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">검증 기록 검색·수식 계산</text>
<text x="493" y="568" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#293d42">진전·반복 확인</text>
<text x="493" y="601" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">같은 탐색의 반복을 감지</text>
<text x="58" y="430" font-size="27" font-weight="700" text-anchor="start" class="" style="fill:#316a67">입력 자료</text>
<path d="M68 453 H118 L138 473 V551 H68 Z M118 453 V473 H138" fill="none" stroke="#316a67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="81" y1="493" x2="113" y2="493" stroke="#316a67" stroke-width="2"/>
<line x1="81" y1="509" x2="108" y2="509" stroke="#316a67" stroke-width="2"/>
<line x1="81" y1="525" x2="99" y2="525" stroke="#316a67" stroke-width="2"/>
<path d="M167 472 H217 L237 492 V570 H167 Z M217 472 V492 H237" fill="none" stroke="#316a67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="180" y1="512" x2="212" y2="512" stroke="#316a67" stroke-width="2"/>
<line x1="180" y1="528" x2="207" y2="528" stroke="#316a67" stroke-width="2"/>
<line x1="180" y1="544" x2="198" y2="544" stroke="#316a67" stroke-width="2"/>
<text x="58" y="613" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">논문·검증 기록</text>
<line x1="264" y1="505" x2="439" y2="505" stroke="#316a67" stroke-width="2" marker-end="url(#info)"/>
<line x1="990" y1="494" x2="1092" y2="494" stroke="#316a67" stroke-width="2" marker-end="url(#info)"/>
<text x="1208" y="458" font-size="29" font-weight="700" text-anchor="middle" class="" style="fill:#293d42">독립 판정</text>
<text x="1208" y="500" font-size="27" font-weight="400" text-anchor="middle" class="" style="fill:#293d42">품질 확인</text>
<line x1="1208" y1="519" x2="1208" y2="575" stroke="#316a67" stroke-width="2" marker-end="url(#info)"/>
<path d="M1173 589 H1225 L1245 609 V683 H1173 Z M1225 589 V609 H1245" fill="none" stroke="#316a67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="1186" y1="629" x2="1220" y2="629" stroke="#316a67" stroke-width="2"/>
<line x1="1186" y1="645" x2="1215" y2="645" stroke="#316a67" stroke-width="2"/>
<line x1="1186" y1="661" x2="1206" y2="661" stroke="#316a67" stroke-width="2"/>
<text x="1208" y="720" font-size="27" font-weight="700" text-anchor="middle" class="" style="fill:#316a67">완료한 결과</text>
<text x="1208" y="755" font-size="24" font-weight="400" text-anchor="middle" class="" style="fill:#657471">다음 작업에 재사용</text>
<path d="M1210 407 V354 H1017" fill="none" stroke="#316a67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#info)"/>
<text x="1191" y="330" font-size="24" font-weight="400" text-anchor="middle" class="" style="fill:#316a67">추가 근거가 있으면 수정</text>
<path d="M466 619 H400 V650 H80 V663" fill="none" stroke="#657471" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#muted)"/>
<text x="274" y="639" font-size="22" font-weight="400" text-anchor="middle" class="" style="fill:#657471">예산 부족·진전 없음</text>
<path d="M58 676 H83 L103 696 V735 H58 Z M83 676 V696 H103" fill="none" stroke="#657471" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="71" y1="716" x2="78" y2="716" stroke="#657471" stroke-width="2"/>
<text x="127" y="699" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#293d42">미완료 상태를 인계</text>
<text x="127" y="738" font-size="23" font-weight="400" text-anchor="start" class="" style="fill:#657471">확보 근거·남은 작업·중단 이유</text>
<line x1="58" y1="798" x2="1342" y2="798" stroke="#cdd2c7" stroke-width="1.5"/>
<text x="58" y="845" font-size="27" font-weight="700" text-anchor="start" class="" style="fill:#b66c54">관찰</text>
<text x="171" y="845" font-size="26" font-weight="400" text-anchor="start" class="" style="fill:#293d42">실패·재시도·검증을 포함한 토큰·에너지·시간·오류</text>
<path d="M970 667 V707 H1035 V886 H990" fill="none" stroke="#b66c54" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#power)"/>
<text x="58" y="929" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">주기적 검토</text>
<text x="276" y="929" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#293d42">측정 범위와 추정 방법 · 품질 조건 · 에너지·탄소·물의 기간별 총량</text>
<path d="M58 889 H29 V185 H39" fill="none" stroke="#657471" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#muted)"/>
<text x="58" y="1011" font-size="21" font-weight="400" text-anchor="start" class="" style="fill:#657471">평가 결과를 다음 규칙 개정에 연결하는 설계 제안</text>
</svg>
