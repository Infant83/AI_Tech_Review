<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">한 비트 초기화의 엔트로피 장부</title><desc id="desc">등확률 두 논리 상태를 한 상태로 초기화하는 표준 등온 모형. 메모리 엔트로피 감소는 환경의 엔트로피 증가와 함께 읽는다. 준정적 이상 한계에서 전체 엔트로피 생성은 영에 접근할 수 있다.</desc>
<defs><marker id="info" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#316a67" stroke-width="1.5"/></marker><marker id="power" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 Z" fill="#b66c54"/></marker><marker id="muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#657471" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#293d42}.serif{font-family:Georgia,"Times New Roman",serif}.muted{fill:#657471}.teal{fill:#316a67}.clay{fill:#b66c54}</style>
<rect x="0" y="0" width="1400" height="820" rx="0" fill="#f7f4eb"/>
<text x="58" y="57" font-size="21" font-weight="700" text-anchor="start" class="" style="fill:#316a67">02</text>
<text x="108" y="59" font-size="34" font-weight="700" text-anchor="start" class="" style="fill:#293d42">한 비트를 비우는 물리적 과정</text>
<text x="58" y="106" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">대칭인 두 논리 상태 · 단일 온도 T의 환경</text>
<line x1="58" y1="132" x2="1342" y2="132" stroke="#cdd2c7" stroke-width="1.5"/>
<text x="247" y="190" font-size="29" font-weight="700" text-anchor="middle" class="" style="fill:#293d42">초기 분포</text>
<text x="1040" y="190" font-size="29" font-weight="700" text-anchor="middle" class="" style="fill:#293d42">최종 분포</text>
<path d="M73 292 C106.6 395.2 157.0 395.2 193.0 292 C226.6 203.2 261.4 203.2 295.0 292 C329.8 395.2 381.4 395.2 415.0 292" fill="none" stroke="#316a67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M864 292 C897.6 395.2 948.0 395.2 984.0 292 C1017.6 203.2 1052.4 203.2 1086.0 292 C1120.8 395.2 1172.4 395.2 1206.0 292" fill="none" stroke="#316a67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="133" cy="346" r="15" fill="#316a67"/>
<circle cx="356" cy="346" r="15" fill="#316a67"/>
<circle cx="924" cy="346" r="21" fill="#316a67"/>
<text x="133" y="404" font-size="26" font-weight="400" text-anchor="middle" class="" style="fill:#293d42">0 · 50%</text>
<text x="356" y="404" font-size="26" font-weight="400" text-anchor="middle" class="" style="fill:#293d42">1 · 50%</text>
<text x="924" y="404" font-size="26" font-weight="400" text-anchor="middle" class="" style="fill:#293d42">0 · 100%</text>
<text x="1147" y="404" font-size="26" font-weight="400" text-anchor="middle" class="" style="fill:#293d42">1 · 0%</text>
<text x="247" y="453" font-size="29" font-weight="400" text-anchor="middle" class="" style="fill:#293d42">H = 1 bit</text>
<text x="1040" y="453" font-size="29" font-weight="400" text-anchor="middle" class="" style="fill:#293d42">H = 0 bit</text>
<line x1="492" y1="302" x2="749" y2="302" stroke="#316a67" stroke-width="2" marker-end="url(#info)"/>
<text x="620" y="275" font-size="27" font-weight="400" text-anchor="middle" class="" style="fill:#316a67">초기화</text>
<line x1="58" y1="500" x2="1342" y2="500" stroke="#cdd2c7" stroke-width="1.5"/>
<text x="58" y="548" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#316a67">메모리</text>
<text x="58" y="604" font-size="32" font-weight="500" text-anchor="start" class="" style="fill:#316a67">ΔS = −kB ln 2</text>
<text x="58" y="649" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">논리 상태의 불확실성 감소</text>
<text x="530" y="548" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#b66c54">환경</text>
<text x="530" y="604" font-size="32" font-weight="500" text-anchor="start" class="" style="fill:#b66c54">Q환경 ≥ kBT ln 2</text>
<text x="530" y="649" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">ΔS환경 ≥ kB ln 2</text>
<text x="1044" y="548" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#293d42">전체</text>
<text x="1044" y="604" font-size="32" font-weight="500" text-anchor="start" class="" style="fill:#293d42">Σ ≥ 0</text>
<text x="1044" y="649" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">엔트로피 생성</text>
<line x1="58" y1="691" x2="1342" y2="691" stroke="#cdd2c7" stroke-width="1.5"/>
<text x="58" y="735" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">이상적인 준정적 한계에서는 환경의 증가가 메모리의 감소를 상쇄해 Σ → 0</text>
<text x="58" y="791" font-size="21" font-weight="400" text-anchor="start" class="" style="fill:#657471">교육 모형 · T는 절대온도, kB는 Boltzmann 상수 · 대칭 메모리의 등온 초기화</text>
</svg>
