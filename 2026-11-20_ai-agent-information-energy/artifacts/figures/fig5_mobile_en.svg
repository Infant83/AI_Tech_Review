<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1600" viewBox="0 0 700 1600" role="img" aria-labelledby="title desc">
<title id="title">A proposed governance loop for resource-aware execution</title><desc id="desc">A planner defines purpose, quality and budgets. The harness controls tools, memory and repetition. Independent checks precede recorded results. Unfinished work and evidence are handed over when budget or progress is inadequate. Observations feed the next policy review.</desc>
<defs><marker id="info" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#316a67" stroke-width="1.5" /></marker><marker id="power" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 Z" fill="#b66c54" /></marker><marker id="muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#657471" stroke-width="1.5" /></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#293d42}.serif{font-family:Georgia,"Times New Roman",serif}.muted{fill:#657471}.teal{fill:#316a67}.clay{fill:#b66c54}</style>
<rect x="0" y="0" width="700" height="1600" rx="0" fill="#f7f4eb" />
<text x="40" y="52" font-size="24" font-weight="700" text-anchor="start" class="" style="fill:#316a67">05</text>
<text x="90" y="53" font-size="30" font-weight="700" text-anchor="start" class="" style="fill:#293d42">Connect resources to execution rules</text>
<text x="40" y="97" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">Proposed design · Writing an evidence-checked review</text>
<line x1="40" y1="121" x2="660" y2="121" stroke="#cdd2c7" stroke-width="1.5" />
<text x="40" y="176" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">Conditions defined by the planner</text>
<text x="40" y="229" font-size="25" font-weight="700" text-anchor="start" class="" style="fill:#316a67">Purpose</text>
<text x="174" y="229" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#293d42">Claims and reader questions</text>
<text x="40" y="278" font-size="25" font-weight="700" text-anchor="start" class="" style="fill:#316a67">Quality</text>
<text x="147" y="278" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#293d42">Source, calculation and error criteria</text>
<text x="40" y="327" font-size="25" font-weight="700" text-anchor="start" class="" style="fill:#316a67">Budget</text>
<text x="147" y="327" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#293d42">Task limits and period totals</text>
<line x1="350" y1="350" x2="350" y2="394" stroke="#316a67" stroke-width="2" marker-end="url(#info)" />
<rect x="40" y="411" width="620" height="330" rx="0" fill="none" stroke="#316a67" stroke-width="1.7" />
<text x="62" y="456" font-size="29" font-weight="700" text-anchor="start" class="" style="fill:#293d42">Harness controlling execution</text>
<text x="62" y="509" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#293d42">Select sources and models</text>
<text x="62" y="543" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">Evidence needs and compute effort</text>
<text x="62" y="573" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#293d42">Use memory and tools</text>
<text x="62" y="607" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">Retrieve records · calculate</text>
<text x="62" y="637" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#293d42">Check progress and repetition</text>
<text x="62" y="671" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">Detect repeated searches</text>
<line x1="350" y1="742" x2="350" y2="791" stroke="#316a67" stroke-width="2" marker-end="url(#info)" />
<text x="350" y="834" font-size="29" font-weight="700" text-anchor="middle" class="" style="fill:#293d42">Independent quality check</text>
<line x1="350" y1="852" x2="350" y2="903" stroke="#316a67" stroke-width="2" marker-end="url(#info)" />
<path d="M72 926 H118 L138 946 V1014 H72 Z M118 926 V946 H138" fill="none" stroke="#316a67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<line x1="85" y1="966" x2="113" y2="966" stroke="#316a67" stroke-width="2" />
<line x1="85" y1="982" x2="108" y2="982" stroke="#316a67" stroke-width="2" />
<line x1="85" y1="998" x2="99" y2="998" stroke="#316a67" stroke-width="2" />
<text x="178" y="956" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#316a67">Completed result and checks</text>
<text x="178" y="997" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">Retain conditions and versions for reuse</text>
<path d="M594 829 H650 V386 H584" fill="none" stroke="#316a67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#info)" />
<rect x="459" y="747" width="185" height="43" rx="0" fill="#f7f4eb" />
<text x="551" y="776" font-size="24" font-weight="400" text-anchor="middle" class="" style="fill:#316a67">Revise with evidence</text>
<path d="M40 703 H15 V1103 H55" fill="none" stroke="#657471" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#muted)" />
<text x="178" y="1050" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">If budget or progress is insufficient</text>
<path d="M72 1070 H102 L122 1090 V1137 H72 Z M102 1070 V1090 H122" fill="none" stroke="#657471" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<line x1="85" y1="1110" x2="97" y2="1110" stroke="#657471" stroke-width="2" />
<line x1="85" y1="1126" x2="92" y2="1126" stroke="#657471" stroke-width="2" />
<text x="178" y="1097" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">Hand over unfinished work</text>
<text x="178" y="1134" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">Evidence · remaining work · reason to stop</text>
<line x1="40" y1="1173" x2="660" y2="1173" stroke="#cdd2c7" stroke-width="1.5" />
<text x="40" y="1224" font-size="27" font-weight="700" text-anchor="start" class="" style="fill:#293d42">Observe failures and verification too</text>
<text x="40" y="1274" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">Tokens · energy · time · errors · retries</text>
<text x="40" y="1312" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">Record boundaries and methods</text>
<path d="M350 1340 V1385 H88 V1442" fill="none" stroke="#b66c54" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#power)" />
<text x="189" y="1410" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#b66c54">Review cycle</text>
<text x="40" y="1484" font-size="29" font-weight="700" text-anchor="start" class="" style="fill:#293d42">Revise rules and assess totals</text>
<text x="40" y="1526" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">Check quality, energy, carbon and water limits</text>
<text x="40" y="1571" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">Proposed feedback from evaluation to design</text>
</svg>