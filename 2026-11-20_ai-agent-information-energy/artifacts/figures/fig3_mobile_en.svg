<title id="title">Different distributions of runs and token use</title><desc id="desc">Author-reported values: 78 of 1,200 runs were stopped at 300 turns and used 65.6 percent of all output tokens. Separately, about 80 percent of successful-run output tokens came from calls that did not change goal progress.</desc>
