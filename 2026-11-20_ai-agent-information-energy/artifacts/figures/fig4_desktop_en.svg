<title id="title">The operational energy boundary</title><desc id="desc">Google reported 0.24 Wh for a median Gemini Apps text prompt in May 2025: active accelerators 0.14 Wh, CPU and DRAM 0.06 Wh, idle capacity 0.02 Wh and data-centre overhead 0.02 Wh.</desc>
