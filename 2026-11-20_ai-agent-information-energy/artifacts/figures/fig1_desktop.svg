<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">정보 처리와 에너지 전달의 두 흐름</title><desc id="desc">위쪽은 프롬프트·학습된 모델·검색 증거가 도구와 기억 및 검증을 거쳐 출력에 연결되는 개념도다. 아래쪽은 계산과 냉각에 전력이 들어가고 열이 환경으로 전달되는 별도의 물리 흐름이다.</desc>
<defs><marker id="info" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#316a67" stroke-width="1.5"/></marker><marker id="power" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 Z" fill="#b66c54"/></marker><marker id="muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#657471" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#293d42}.serif{font-family:Georgia,"Times New Roman",serif}.muted{fill:#657471}.teal{fill:#316a67}.clay{fill:#b66c54}</style>
<rect x="0" y="0" width="1400" height="900" rx="0" fill="#f7f4eb"/>
<text x="58" y="57" font-size="21" font-weight="700" text-anchor="start" class="" style="fill:#316a67">01</text>
<text x="108" y="59" font-size="34" font-weight="700" text-anchor="start" class="" style="fill:#293d42">정보와 에너지를 함께 따라가기</text>
<text x="58" y="106" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">서로 다른 화살표로 읽는 하나의 에이전트 실행</text>
<line x1="58" y1="132" x2="1342" y2="132" stroke="#cdd2c7" stroke-width="1.5"/>
<text x="58" y="180" font-size="25" font-weight="700" text-anchor="start" class="" style="fill:#316a67">정보 흐름</text>
<text x="58" y="233" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">프롬프트</text>
<text x="58" y="264" font-size="23" font-weight="400" text-anchor="start" class="" style="fill:#657471">작업의 목적과 입력</text>
