<text x="58" y="303" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">학습된 모델</text>
<text x="58" y="334" font-size="23" font-weight="400" text-anchor="start" class="" style="fill:#657471">매개변수에 담긴 관계</text>
<line x1="285" y1="294" x2="408" y2="290" stroke="#316a67" stroke-width="1.7" marker-end="url(#info)"/>
<text x="58" y="373" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">검색한 증거</text>
<text x="58" y="404" font-size="23" font-weight="400" text-anchor="start" class="" style="fill:#657471">문헌·도구의 새 관찰</text>
<line x1="285" y1="364" x2="408" y2="290" stroke="#316a67" stroke-width="1.7" marker-end="url(#info)"/>
<rect x="435" y="201" width="570" height="225" rx="0" fill="none" stroke="#316a67" stroke-width="2"/>
