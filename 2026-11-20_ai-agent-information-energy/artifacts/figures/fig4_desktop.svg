<title id="title">운영 에너지의 측정 경계</title><desc id="desc">Google이 2025년5월 Gemini Apps 중앙값 텍스트 프롬프트에 대해 보고한 운영 에너지를 재도표했다. 활성 가속기0.14, CPU와DRAM0.06, 대기 용량0.02, 데이터센터 부대설비0.02 Wh를 합해0.24 Wh이다.</desc>
