<text x="58" y="276" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#293d42">Claims and reader questions</text>
<text x="505" y="239" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#316a67">Quality</text>
<text x="505" y="276" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#293d42">Sources · calculations · error criteria</text>
