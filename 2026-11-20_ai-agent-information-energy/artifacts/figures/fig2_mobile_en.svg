<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1190" viewBox="0 0 700 1190" role="img" aria-labelledby="title desc">
<title id="title">The entropy balance of one-bit reset</title><desc id="desc">An equally probable symmetric two-state memory is reset isothermally. The memory entropy decrease accompanies an environmental increase. Total entropy production approaches zero in the ideal quasistatic limit.</desc>
<defs><marker id="info" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#316a67" stroke-width="1.5" /></marker><marker id="power" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 Z" fill="#b66c54" /></marker><marker id="muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#657471" stroke-width="1.5" /></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#293d42}.serif{font-family:Georgia,"Times New Roman",serif}.muted{fill:#657471}.teal{fill:#316a67}.clay{fill:#b66c54}</style>
<rect x="0" y="0" width="700" height="1190" rx="0" fill="#f7f4eb" />
<text x="40" y="52" font-size="24" font-weight="700" text-anchor="start" class="" style="fill:#316a67">02</text>
<text x="90" y="53" font-size="30" font-weight="700" text-anchor="start" class="" style="fill:#293d42">The physical process of resetting a bit</text>
<text x="40" y="97" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">Symmetric states · One environment at T</text>
<line x1="40" y1="121" x2="660" y2="121" stroke="#cdd2c7" stroke-width="1.5" />
<text x="40" y="169" font-size="27" font-weight="700" text-anchor="start" class="" style="fill:#293d42">Initial distribution</text>
<text x="660" y="169" font-size="27" font-weight="400" text-anchor="end" class="" style="fill:#293d42">H = 1 bit</text>
<path d="M135 252 C177.0 381.0 240.0 381.0 285.0 252 C327.0 141.0 370.5 141.0 412.5 252 C456.0 381.0 520.5 381.0 562.5 252" fill="none" stroke="#316a67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="210" cy="320" r="15" fill="#316a67" />
<circle cx="485" cy="320" r="15" fill="#316a67" />
<text x="210" y="381" font-size="26" font-weight="400" text-anchor="middle" class="" style="fill:#293d42">0 · 50%</text>
<text x="485" y="381" font-size="26" font-weight="400" text-anchor="middle" class="" style="fill:#293d42">1 · 50%</text>
<line x1="345" y1="416" x2="345" y2="469" stroke="#316a67" stroke-width="2" marker-end="url(#info)" />
<text x="379" y="454" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#316a67">Reset</text>
<text x="40" y="515" font-size="27" font-weight="700" text-anchor="start" class="" style="fill:#293d42">Final distribution</text>
<text x="660" y="515" font-size="27" font-weight="400" text-anchor="end" class="" style="fill:#293d42">H = 0 bit</text>
<path d="M135 590 C177.0 719.0 240.0 719.0 285.0 590 C327.0 479.0 370.5 479.0 412.5 590 C456.0 719.0 520.5 719.0 562.5 590" fill="none" stroke="#316a67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="210" cy="658" r="21" fill="#316a67" />
<text x="210" y="719" font-size="26" font-weight="400" text-anchor="middle" class="" style="fill:#293d42">0 · 100%</text>
<text x="485" y="719" font-size="26" font-weight="400" text-anchor="middle" class="" style="fill:#293d42">1 · 0%</text>
<line x1="40" y1="763" x2="660" y2="763" stroke="#cdd2c7" stroke-width="1.5" />
<text x="40" y="810" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#316a67">Memory</text>
<text x="660" y="810" font-size="31" font-weight="400" text-anchor="end" class="" style="fill:#293d42">ΔS = −kB ln 2</text>
<text x="40" y="871" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#b66c54">Environment</text>
<text x="660" y="871" font-size="30" font-weight="400" text-anchor="end" class="" style="fill:#293d42">Qenv ≥ kBT ln 2</text>
<text x="660" y="920" font-size="28" font-weight="400" text-anchor="end" class="" style="fill:#b66c54">ΔSenv ≥ kB ln 2</text>
<line x1="40" y1="949" x2="660" y2="949" stroke="#cdd2c7" stroke-width="1.5" />
<text x="40" y="997" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#293d42">Total entropy production</text>
<text x="660" y="997" font-size="34" font-weight="400" text-anchor="end" class="" style="fill:#293d42">Σ ≥ 0</text>
<text x="40" y="1055" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">Ideal quasistatic limit: Σ → 0</text>
<text x="40" y="1094" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">T: absolute temperature · kB: Boltzmann constant</text>
<text x="40" y="1161" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">Model · Symmetric isothermal reset</text>
</svg>