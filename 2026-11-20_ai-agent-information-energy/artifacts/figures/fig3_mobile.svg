<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1210" viewBox="0 0 700 1210" role="img" aria-labelledby="title desc">
<title id="title">실행 수와 토큰 사용의 다른 분포</title><desc id="desc">저자 보고값을 재도표했다. 1200회 중 78회가 300턴에서 중단되었으며 전체 출력 토큰의 65.6퍼센트를 사용했다. 별도로 성공 실행 출력 토큰의 약80퍼센트는 목표 진행 비율을 바꾸지 않는 호출에서 생성되었다.</desc>
<defs><marker id="info" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#316a67" stroke-width="1.5"/></marker><marker id="power" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 Z" fill="#b66c54"/></marker><marker id="muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#657471" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#293d42}.serif{font-family:Georgia,"Times New Roman",serif}.muted{fill:#657471}.teal{fill:#316a67}.clay{fill:#b66c54}</style>
<rect x="0" y="0" width="700" height="1210" rx="0" fill="#f7f4eb"/>
<text x="40" y="52" font-size="24" font-weight="700" text-anchor="start" class="" style="fill:#316a67">03</text>
<text x="90" y="53" font-size="30" font-weight="700" text-anchor="start" class="" style="fill:#293d42">성공 뒤에 가려진 토큰의 비용</text>
<text x="40" y="97" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">실행 수와 토큰 수는 서로 다른 분모다</text>
<line x1="40" y1="121" x2="660" y2="121" stroke="#cdd2c7" stroke-width="1.5"/>
<text x="40" y="173" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">A  전체 실행 1,200회</text>
<rect x="40" y="203" width="573.5" height="60" rx="0" fill="#316a67"/>
<rect x="613.5" y="203" width="5.683333333333334" height="60" rx="0" fill="#ddbb7b"/>
<rect x="619.1833333333333" y="203" width="40.300000000000004" height="60" rx="0" fill="#b66c54"/>
<rect x="659.4833333333332" y="203" width="0.5166666666666667" height="60" rx="0" fill="#293d42"/>
<text x="40" y="313" font-size="52" font-weight="700" text-anchor="start" class="" style="fill:#316a67">1,110</text>
<text x="226" y="312" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#316a67">성공</text>
<text x="40" y="356" font-size="27" font-weight="700" text-anchor="start" class="" style="fill:#b66c54">78회 제한 중단  ·  전체 실행의 6.5%</text>
<text x="40" y="399" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">11회 목표 미달 종료  ·  1회 판정 불가</text>
<line x1="40" y1="441" x2="660" y2="441" stroke="#cdd2c7" stroke-width="1.5"/>
<text x="40" y="493" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">B  전체 출력 토큰의 사용처</text>
<rect x="40" y="530" width="406.72" height="72" rx="0" fill="#b66c54"/>
<rect x="446.72" y="530" width="213.27999999999997" height="72" rx="0" fill="#e3e7df"/>
<text x="60" y="578" font-size="33" font-weight="700" text-anchor="start" class="" style="fill:#f7f4eb">65.6%</text>
<text x="640" y="578" font-size="28" font-weight="700" text-anchor="end" class="" style="fill:#293d42">34.4%</text>
<text x="40" y="654" font-size="27" font-weight="700" text-anchor="start" class="" style="fill:#b66c54">78회의 제한 중단 실행이</text>
<text x="40" y="693" font-size="27" font-weight="700" text-anchor="start" class="" style="fill:#b66c54">전체 출력 토큰의 약 3분의 2 사용</text>
<text x="40" y="750" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">나머지 1,122회의 실행</text>
<line x1="40" y1="791" x2="660" y2="791" stroke="#cdd2c7" stroke-width="1.5"/>
<text x="40" y="842" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">C  성공 실행의 출력 토큰 분류</text>
<rect x="40" y="879" width="496.0" height="72" rx="0" fill="#ddbb7b"/>
<rect x="536.0" y="879" width="124.0" height="72" rx="0" fill="#316a67"/>
<text x="60" y="927" font-size="32" font-weight="700" text-anchor="start" class="" style="fill:#293d42">약 80%</text>
<text x="646" y="926" font-size="25" font-weight="700" text-anchor="end" class="" style="fill:#f7f4eb">약 20%</text>
<text x="40" y="1004" font-size="26" font-weight="400" text-anchor="start" class="" style="fill:#293d42">목표 진행 q가 그대로인 호출: heat</text>
<text x="40" y="1042" font-size="26" font-weight="400" text-anchor="start" class="" style="fill:#293d42">읽기·검색·테스트 등을 포함</text>
<text x="40" y="1104" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">q가 변한 호출: work</text>
<text x="40" y="1142" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">분류 단위는 호출이며 비용은 출력 토큰</text>
<text x="40" y="1181" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">저자 보고값 재도표 · arXiv:2611.23375v1</text>
