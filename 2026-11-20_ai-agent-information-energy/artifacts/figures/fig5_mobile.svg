<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1600" viewBox="0 0 700 1600" role="img" aria-labelledby="title desc">
<title id="title">자원 조건을 실행에 연결하는 거버넌스 제안</title><desc id="desc">근거를 검증하는 리뷰 작성 사례의 설계 제안이다. 사람이 목적과 품질 및 총예산을 정하고, 하네스가 도구와 기억 및 반복을 조절한다. 독립 판정을 거친 결과를 기록한다. 예산이 부족하거나 진전이 없으면 확보한 근거와 미완료 상태를 인계한다. 실패와 검증 비용을 포함한 관찰을 다음 정책 검토에 연결한다.</desc>
<defs><marker id="info" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#316a67" stroke-width="1.5"/></marker><marker id="power" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 Z" fill="#b66c54"/></marker><marker id="muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#657471" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#293d42}.serif{font-family:Georgia,"Times New Roman",serif}.muted{fill:#657471}.teal{fill:#316a67}.clay{fill:#b66c54}</style>
<rect x="0" y="0" width="700" height="1600" rx="0" fill="#f7f4eb"/>
<text x="40" y="52" font-size="24" font-weight="700" text-anchor="start" class="" style="fill:#316a67">05</text>
<text x="90" y="53" font-size="30" font-weight="700" text-anchor="start" class="" style="fill:#293d42">자원 조건을 실행 규칙에 연결하기</text>
<text x="40" y="97" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">설계 제안 · 근거를 검증하는 리뷰 작성의 경우</text>
<line x1="40" y1="121" x2="660" y2="121" stroke="#cdd2c7" stroke-width="1.5"/>
<text x="40" y="176" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">기획자가 정하는 조건</text>
<text x="40" y="229" font-size="25" font-weight="700" text-anchor="start" class="" style="fill:#316a67">목적</text>
<text x="147" y="229" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#293d42">확인할 주장과 독자의 질문</text>
<text x="40" y="278" font-size="25" font-weight="700" text-anchor="start" class="" style="fill:#316a67">품질</text>
<text x="147" y="278" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#293d42">출처 대조·계산·오류 기준</text>
<text x="40" y="327" font-size="25" font-weight="700" text-anchor="start" class="" style="fill:#316a67">예산</text>
<text x="147" y="327" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#293d42">작업별 한도와 기간별 총량</text>
<line x1="350" y1="350" x2="350" y2="394" stroke="#316a67" stroke-width="2" marker-end="url(#info)"/>
<rect x="40" y="411" width="620" height="330" rx="0" fill="none" stroke="#316a67" stroke-width="1.7"/>
<text x="62" y="456" font-size="29" font-weight="700" text-anchor="start" class="" style="fill:#293d42">실행을 조절하는 하네스</text>
<text x="62" y="509" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#293d42">자료·모델 선택</text>
<text x="62" y="543" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">필요한 증거와 계산 강도</text>
<text x="62" y="573" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#293d42">기억·도구 사용</text>
<text x="62" y="607" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">검증 기록 검색·수식 계산</text>
<text x="62" y="637" font-size="26" font-weight="700" text-anchor="start" class="" style="fill:#293d42">진전·반복 확인</text>
<text x="62" y="671" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">같은 탐색의 반복을 감지</text>
<line x1="350" y1="742" x2="350" y2="791" stroke="#316a67" stroke-width="2" marker-end="url(#info)"/>
<text x="350" y="834" font-size="29" font-weight="700" text-anchor="middle" class="" style="fill:#293d42">독립 판정으로 품질 확인</text>
<line x1="350" y1="852" x2="350" y2="903" stroke="#316a67" stroke-width="2" marker-end="url(#info)"/>
<path d="M72 926 H118 L138 946 V1014 H72 Z M118 926 V946 H138" fill="none" stroke="#316a67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="85" y1="966" x2="113" y2="966" stroke="#316a67" stroke-width="2"/>
<line x1="85" y1="982" x2="108" y2="982" stroke="#316a67" stroke-width="2"/>
<line x1="85" y1="998" x2="99" y2="998" stroke="#316a67" stroke-width="2"/>
<text x="178" y="956" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#316a67">완료한 결과와 검증 기록</text>
<text x="178" y="997" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">조건·판본을 남겨 다음 작업에 재사용</text>
<path d="M594 829 H650 V386 H584" fill="none" stroke="#316a67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#info)"/>
<rect x="459" y="747" width="185" height="43" rx="0" fill="#f7f4eb"/>
<text x="551" y="776" font-size="24" font-weight="400" text-anchor="middle" class="" style="fill:#316a67">근거 있으면 수정</text>
<path d="M40 703 H15 V1103 H55" fill="none" stroke="#657471" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#muted)"/>
<text x="178" y="1050" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">예산이 부족하거나 진전이 없으면</text>
<path d="M72 1070 H102 L122 1090 V1137 H72 Z M102 1070 V1090 H122" fill="none" stroke="#657471" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="85" y1="1110" x2="97" y2="1110" stroke="#657471" stroke-width="2"/>
<line x1="85" y1="1126" x2="92" y2="1126" stroke="#657471" stroke-width="2"/>
<text x="178" y="1097" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">미완료 상태를 인계</text>
<text x="178" y="1134" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">확보 근거·남은 작업·중단 이유</text>
<line x1="40" y1="1173" x2="660" y2="1173" stroke="#cdd2c7" stroke-width="1.5"/>
<text x="40" y="1224" font-size="27" font-weight="700" text-anchor="start" class="" style="fill:#293d42">실패와 검증 비용도 관찰에 포함</text>
<text x="40" y="1274" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">토큰·에너지·시간·오류와 재시도</text>
<text x="40" y="1312" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">측정 범위와 추정 방법을 함께 기록</text>
<path d="M350 1340 V1385 H88 V1442" fill="none" stroke="#b66c54" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#power)"/>
<text x="189" y="1410" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#b66c54">주기적 검토</text>
<text x="40" y="1484" font-size="29" font-weight="700" text-anchor="start" class="" style="fill:#293d42">규칙 개정과 기간별 총량 평가</text>
<text x="40" y="1526" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">품질·에너지·탄소·물의 제약을 함께 확인</text>
<text x="40" y="1571" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">평가 결과에 따라 설계를 갱신하는 제안 구조</text>
</svg>
