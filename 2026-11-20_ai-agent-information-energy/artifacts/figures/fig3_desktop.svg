<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910" role="img" aria-labelledby="title desc">
<title id="title">실행 수와 토큰 사용의 다른 분포</title><desc id="desc">저자 보고값을 재도표했다. 1200회 중 78회가 300턴에서 중단되었으며 전체 출력 토큰의 65.6퍼센트를 사용했다. 별도로 성공 실행 출력 토큰의 약80퍼센트는 목표 진행 비율을 바꾸지 않는 호출에서 생성되었다.</desc>
<defs><marker id="info" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#316a67" stroke-width="1.5"/></marker><marker id="power" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 Z" fill="#b66c54"/></marker><marker id="muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#657471" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#293d42}.serif{font-family:Georgia,"Times New Roman",serif}.muted{fill:#657471}.teal{fill:#316a67}.clay{fill:#b66c54}</style>
<rect x="0" y="0" width="1400" height="910" rx="0" fill="#f7f4eb"/>
<text x="58" y="57" font-size="21" font-weight="700" text-anchor="start" class="" style="fill:#316a67">03</text>
<text x="108" y="59" font-size="34" font-weight="700" text-anchor="start" class="" style="fill:#293d42">성공 뒤에 가려진 토큰의 비용</text>
<text x="58" y="106" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">실행 수와 토큰 수는 서로 다른 분모다</text>
<line x1="58" y1="132" x2="1342" y2="132" stroke="#cdd2c7" stroke-width="1.5"/>
<text x="58" y="188" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">A  전체 실행 1,200회</text>
<rect x="58" y="221" width="1187.7" height="59" rx="0" fill="#316a67"/>
<rect x="1245.7" y="221" width="11.77" height="59" rx="0" fill="#ddbb7b"/>
<rect x="1257.47" y="221" width="83.46000000000001" height="59" rx="0" fill="#b66c54"/>
<rect x="1340.93" y="221" width="1.07" height="59" rx="0" fill="#293d42"/>
<text x="58" y="328" font-size="30" font-weight="700" text-anchor="start" class="" style="fill:#316a67">1,110회 성공</text>
<text x="527" y="328" font-size="30" font-weight="700" text-anchor="start" class="" style="fill:#b66c54">78회 제한 중단 · 6.5%</text>
<text x="58" y="371" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">11회 목표 미달 종료 · 1회 판정 불가</text>
<line x1="58" y1="406" x2="1342" y2="406" stroke="#cdd2c7" stroke-width="1.5"/>
<text x="58" y="453" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">B  전체 출력 토큰</text>
<rect x="58" y="484" width="842.3040000000001" height="69" rx="0" fill="#b66c54"/>
<rect x="900.3040000000001" y="484" width="441.69599999999997" height="69" rx="0" fill="#e3e7df"/>
<text x="80" y="532" font-size="31" font-weight="700" text-anchor="start" class="" style="fill:#f7f4eb">65.6% — 78회의 제한 중단 실행</text>
<text x="1320" y="532" font-size="27" font-weight="700" text-anchor="end" class="" style="fill:#293d42">34.4% — 나머지 실행</text>
<text x="58" y="596" font-size="26" font-weight="400" text-anchor="start" class="" style="fill:#657471">적은 수의 중단 실행이 전체 출력 토큰의 약 3분의 2를 사용했다.</text>
<line x1="58" y1="630" x2="1342" y2="630" stroke="#cdd2c7" stroke-width="1.5"/>
<text x="58" y="678" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">C  성공 실행의 출력 토큰</text>
<rect x="58" y="710" width="1027.2" height="62" rx="0" fill="#ddbb7b"/>
<rect x="1085.2" y="710" width="256.8" height="62" rx="0" fill="#316a67"/>
<text x="80" y="751" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">약 80%  heat — 목표 진행 q가 그대로인 호출</text>
<text x="1320" y="751" font-size="26" font-weight="700" text-anchor="end" class="" style="fill:#f7f4eb">약 20%  work</text>
<text x="58" y="819" font-size="25" font-weight="400" text-anchor="start" class="" style="fill:#657471">heat에는 읽기·검색·테스트가 포함된다. 분류 단위는 호출이며 비용은 출력 토큰이다.</text>
<text x="58" y="881" font-size="21" font-weight="400" text-anchor="start" class="" style="fill:#657471">저자 보고값 재도표 · arXiv:2611.23375v1 · 입력 토큰은 비용 분모에서 제외</text>
</svg>
