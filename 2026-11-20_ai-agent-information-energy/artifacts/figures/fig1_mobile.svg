<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1330" viewBox="0 0 700 1330" role="img" aria-labelledby="title desc">
<title id="title">정보 처리와 에너지 전달의 두 흐름</title><desc id="desc">위쪽은 프롬프트·학습된 모델·검색 증거가 도구와 기억 및 검증을 거쳐 출력에 연결되는 개념도다. 아래쪽은 계산과 냉각에 전력이 들어가고 열이 환경으로 전달되는 별도의 물리 흐름이다.</desc>
<defs><marker id="info" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#316a67" stroke-width="1.5"/></marker><marker id="power" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 Z" fill="#b66c54"/></marker><marker id="muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#657471" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#293d42}.serif{font-family:Georgia,"Times New Roman",serif}.muted{fill:#657471}.teal{fill:#316a67}.clay{fill:#b66c54}</style>
<rect x="0" y="0" width="700" height="1330" rx="0" fill="#f7f4eb"/>
<text x="40" y="52" font-size="24" font-weight="700" text-anchor="start" class="" style="fill:#316a67">01</text>
<text x="90" y="53" font-size="30" font-weight="700" text-anchor="start" class="" style="fill:#293d42">정보와 에너지를 함께 따라가기</text>
<text x="40" y="97" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">서로 다른 화살표로 읽는 하나의 에이전트 실행</text>
<line x1="40" y1="121" x2="660" y2="121" stroke="#cdd2c7" stroke-width="1.5"/>
<text x="40" y="166" font-size="25" font-weight="700" text-anchor="start" class="" style="fill:#316a67">정보 흐름</text>
<text x="40" y="213" font-size="25" font-weight="700" text-anchor="start" class="" style="fill:#293d42">프롬프트</text>
<text x="254" y="213" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">작업의 목적과 입력</text>
<text x="40" y="275" font-size="25" font-weight="700" text-anchor="start" class="" style="fill:#293d42">학습된 모델</text>
<text x="254" y="275" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">매개변수에 담긴 관계</text>
<text x="40" y="337" font-size="25" font-weight="700" text-anchor="start" class="" style="fill:#293d42">검색한 증거</text>
<text x="254" y="337" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">문헌·도구의 새 관찰</text>
<line x1="345" y1="354" x2="345" y2="395" stroke="#316a67" stroke-width="2" marker-end="url(#info)"/>
<rect x="40" y="406" width="620" height="242" rx="0" fill="none" stroke="#316a67" stroke-width="2"/>
<text x="66" y="446" font-size="27" font-weight="700" text-anchor="start" class="" style="fill:#293d42">추론과 행동을 이어 주는 하네스</text>
<text x="76" y="500" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">추론</text>
<text x="76" y="538" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">다음 행동</text>
<text x="270" y="500" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">도구</text>
<text x="270" y="538" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">검색·계산</text>
<text x="470" y="500" font-size="28" font-weight="700" text-anchor="start" class="" style="fill:#293d42">기억</text>
<text x="470" y="538" font-size="24" font-weight="400" text-anchor="start" class="" style="fill:#657471">관찰 보존</text>
