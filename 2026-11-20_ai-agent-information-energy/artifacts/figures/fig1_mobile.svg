<text x="529" y="1120" font-size="26" font-weight="700" text-anchor="middle" class="" style="fill:#293d42">냉각과 열 전달</text>
<path d="M80 922 V1108 H388" fill="none" stroke="#b66c54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#power)"/>
