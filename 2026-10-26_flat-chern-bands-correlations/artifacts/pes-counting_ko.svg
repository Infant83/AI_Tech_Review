<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">같은 Chern 수, 다른 입자 얽힘 계수</title>
<desc id="desc">저자 원자료의 얽힘 gap 아래 준위 수는 첫 가전자대와 세 번째 전도대에서 1088, 두 번째 전도대에서 168이다. Chern 수는 모두 −1, 채움은 1/3이며 다체 모형은 flat-band limit를 사용한다.</desc>
<rect width="1200" height="660" fill="#f8fafc"/>
<style>text{font-family:Arial,"Noto Sans CJK KR",sans-serif;fill:#14263d}.title{font-size:32px;font-weight:700}.subtitle{font-size:22px}.label{font-size:25px;font-weight:700}.small,.tick{font-size:19px}.number{font-size:30px;font-weight:700}.note{font-size:20px}</style>
<text x="48" y="59" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="32" font-weight="700" fill="#14263d">같은 Chern 수, 다른 다체 상태 계수</text>
<text x="48" y="104" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="22" font-weight="400" fill="#14263d">C = −1 · ν = 1/3 · Nuc = 24 · Ne = 8 · NA = 3 · flat-band-limit 모형</text>
<text x="350" y="157" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="400" fill="#14263d">입자 얽힘 gap 아래의 PES 준위 수</text>
<line x1="350.00" y1="180" x2="350.00" y2="435" stroke="#d7dfea"/><text x="350.00" y="470" text-anchor="middle" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="400" fill="#14263d">0</text><line x1="525.00" y1="180" x2="525.00" y2="435" stroke="#d7dfea"/><text x="525.00" y="470" text-anchor="middle" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="400" fill="#14263d">300</text><line x1="700.00" y1="180" x2="700.00" y2="435" stroke="#d7dfea"/><text x="700.00" y="470" text-anchor="middle" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="400" fill="#14263d">600</text><line x1="875.00" y1="180" x2="875.00" y2="435" stroke="#d7dfea"/><text x="875.00" y="470" text-anchor="middle" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="400" fill="#14263d">900</text><line x1="1050.00" y1="180" x2="1050.00" y2="435" stroke="#d7dfea"/><text x="1050.00" y="470" text-anchor="middle" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="400" fill="#14263d">1200</text><text x="48" y="237" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="25" font-weight="700" fill="#14263d">VB · 세 번째 CB</text><text x="48" y="267" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="400" fill="#14263d">Laughlin형 계수</text><rect x="350" y="215" width="634.67" height="62" rx="5" fill="#155e75"/><text x="1000.67" y="256" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="30" font-weight="700" fill="#14263d">1,088</text><text x="48" y="372" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="25" font-weight="700" fill="#14263d">두 번째 CB</text><text x="48" y="402" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="400" fill="#14263d">세 배치 CDW 계수</text><rect x="350" y="350" width="98.00" height="62" rx="5" fill="#a14b21"/><text x="464.00" y="391" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="30" font-weight="700" fill="#14263d">168</text>
<text x="48" y="525" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="20" font-weight="400" fill="#14263d">1088 = 24/18 × binom(18, 3); 168 = 3 × binom(8, 3)</text>
<text x="48" y="570" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="20" font-weight="400" fill="#14263d">평탄한 분산과 Chern 수가 같아도 상관 상태가 같지는 않다.</text>
<text x="48" y="607" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="400" fill="#14263d">저자 원자료의 독립 계수 대조 · 새로운 ED·PES 계산이 아님</text>
<text x="48" y="637" font-family="Arial,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="400" fill="#14263d">Bao 등, Communications Physics (2026), 그림 4 · 원자료: Zenodo 10.5281/zenodo.21199721</text>
</svg>