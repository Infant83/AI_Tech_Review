<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" role="img" aria-labelledby="title desc">
<title id="title">Same Chern number, different PES counting</title>
<desc id="desc">Authors source data recounted: 1088 low PES levels in the VB and third CB, 168 in the second CB, at C=-1 and one-third filling in the flat-band limit. No new ED or PES calculation.</desc>
<rect width="600" height="850" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans CJK KR, sans-serif" fill="#14263d">
<text x="35" y="45" font-size="27" font-weight="700">Same Chern number, different</text>
<text x="35" y="80" font-size="27" font-weight="700">PES counting</text>
<text x="35" y="119" font-size="23">C = −1 · ν = 1/3 · flat-band limit</text>
<text x="35" y="154" font-size="23">Nuc = 24 · Ne = 8 · NA = 3</text>
<text x="35" y="200" font-size="22">PES levels below the entanglement gap</text>
<text x="60" y="252" font-size="26" font-weight="700">VB and 3rd CB</text>
<text x="60" y="283" font-size="22">Laughlin-type counting</text>
<rect x="60" y="302" width="389.87" height="55" rx="4" fill="#155e75"/>
<text x="465" y="340" font-size="26" font-weight="700">1,088</text>
<text x="60" y="410" font-size="26" font-weight="700">2nd CB</text>
<text x="60" y="441" font-size="22">Threefold CDW counting</text>
<rect x="60" y="460" width="60.20" height="55" rx="4" fill="#a14b21"/>
<text x="137" y="498" font-size="26" font-weight="700">168</text>
<path d="M60 540H490" stroke="#aebbc7" fill="none"/>
<path d="M60.0 540V547" stroke="#aebbc7"/>
<text x="60.0" y="575" text-anchor="middle" font-size="19">0</text>
<path d="M167.5 540V547" stroke="#aebbc7"/>
<text x="167.5" y="575" text-anchor="middle" font-size="19">300</text>
<path d="M275.0 540V547" stroke="#aebbc7"/>
<text x="275.0" y="575" text-anchor="middle" font-size="19">600</text>
<path d="M382.5 540V547" stroke="#aebbc7"/>
<text x="382.5" y="575" text-anchor="middle" font-size="19">900</text>
<path d="M490.0 540V547" stroke="#aebbc7"/>
<text x="490.0" y="575" text-anchor="middle" font-size="19">1200</text>
<text x="35" y="626" font-size="22">1088 = 24/18 × binom(18, 3)</text>
<text x="35" y="659" font-size="22">168 = 3 × binom(8, 3)</text>
<text x="35" y="704" font-size="21">Same flat dispersion and C do not identify the phase.</text>
<text x="35" y="742" font-size="21">Independent recount; no new ED or PES calculation.</text>
<text x="35" y="786" font-size="20">Bao et al. (2026), Fig. 4 · source: Zenodo</text>
<text x="35" y="820" font-size="20">10.5281/zenodo.21199721</text>
</g></svg>