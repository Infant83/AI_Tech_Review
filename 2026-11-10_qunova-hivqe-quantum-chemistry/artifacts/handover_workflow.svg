<text x="795" y="338" font-size="22" font-weight="700">Cumulative subspace Ω<tspan baseline-shift="sub" font-size="16">t</tspan></text>
<text x="795" y="375" font-size="21">Diagonalize → reported energy</text>
<text x="795" y="407" font-size="18">Retain selected earlier configurations</text>
