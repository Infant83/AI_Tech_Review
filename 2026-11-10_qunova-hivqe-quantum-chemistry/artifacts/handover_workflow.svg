<rect x="375" y="150" width="335" height="245" rx="16" fill="#edf1ee" stroke="#86a696" stroke-width="2"/>
<text x="399" y="188" font-size="23" font-weight="700">Classical processing</text>
<text x="399" y="235" font-size="21">Recover valid occupations</text>
<text x="399" y="273" font-size="21">Recombine spin configurations</text>
<text x="399" y="311" font-size="21">Expand and screen candidates</text>
<text x="399" y="359" font-size="18" fill="#617275">Optional steps depend on the run</text>
<path d="M710 270H752" fill="none" stroke="#6c8587" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="770" y="135" width="390" height="132" rx="14" fill="#e4eeeb" stroke="#679885" stroke-width="2"/>
<text x="795" y="173" font-size="22" font-weight="700">Current-iteration subspace S<tspan baseline-shift="sub" font-size="16">t</tspan></text>
<text x="795" y="210" font-size="21">Diagonalize → training energy</text>
