<text x="400" y="516" font-size="22" font-weight="700">Electronic integrals define the projected Hamiltonian</text>
<text x="400" y="555" font-size="24">(H<tspan baseline-shift="sub" font-size="16">S</tspan>)<tspan baseline-shift="sub" font-size="16">ij</tspan> = ⟨D<tspan baseline-shift="sub" font-size="16">i</tspan>|H|D<tspan baseline-shift="sub" font-size="16">j</tspan>⟩</text>
<text x="795" y="555" font-size="24">H<tspan baseline-shift="sub" font-size="16">S</tspan> c = E<tspan baseline-shift="sub" font-size="16">S</tspan> c</text>
<text x="400" y="584" font-size="18">The solver returns coefficients and energy in the chosen subspace.</text>
