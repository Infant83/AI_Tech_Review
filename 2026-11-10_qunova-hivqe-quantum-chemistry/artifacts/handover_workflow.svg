<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">HI-VQE: sampling and classical diagonalization</title>
<desc id="desc">The QPU proposes occupation strings. Classical recovery, recombination and expansion create candidate configurations. Current-iteration and cumulative subspaces are diagonalized separately. The current subspace trains the circuit; the cumulative subspace supplies the reported energy. Known electronic integrals define both projected Hamiltonians.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6c8587"/></marker></defs>
<rect width="1200" height="660" rx="18" fill="#fcfaf5"/>
<g font-family="Arial, sans-serif" fill="#243d45">
<text x="40" y="48" font-size="27" font-weight="700">A QPU proposes configurations; a classical solver sets their coefficients</text>
<text x="40" y="83" font-size="19" fill="#617275">Explanatory workflow for the 2026 HI-VQE formulation</text>
<rect x="40" y="150" width="275" height="245" rx="16" fill="#f4e6ce" stroke="#bb9868" stroke-width="2"/>
<text x="64" y="188" font-size="23" font-weight="700">Quantum sampling</text>
<text x="64" y="231" font-size="22">Prepare U(θ)|HF⟩</text>
