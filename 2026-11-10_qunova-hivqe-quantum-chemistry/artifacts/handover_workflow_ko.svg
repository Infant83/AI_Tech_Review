<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">양자 장치는 배치를 제안하고 고전 계산은 계수를 정한다</title>
<desc id="desc">양자 장치가 점유 비트열을 제안한다. 고전적 회복·스핀 조합·확장으로 후보 배치를 구성한다. 현재 부분공간은 회로 학습의 피드백을 제공한다. 선별된 배치는 누적 부분공간에 보존되며 누적 공간은 보고 에너지를 제공한다. 두 투영 해밀토니안은 알려진 전자 적분으로 구성한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6c8587"/></marker><marker id="feedback-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#679885"/></marker></defs>
<rect width="1200" height="660" rx="18" fill="#fcfaf5"/>
<g font-family="ReviewFigure,ReviewFigureSymbols,ReviewFigureMath,'Noto Sans KR',sans-serif" fill="#243d45">
<text x="40" y="48" font-size="27" font-weight="700" fill="#243d45" >양자 장치는 배치를 제안하고 고전 계산은 계수를 정한다</text>
<text x="40" y="83" font-size="19" font-weight="400" fill="#617275" >2026년 HI-VQE의 표본·부분공간·에너지 계산</text>
<rect x="40" y="150" width="275" height="245" rx="16" fill="#f4e6ce" stroke="#bb9868" stroke-width="2"/>
<text x="64" y="188" font-size="23" font-weight="700" fill="#243d45" >양자 샘플링</text>
<text x="64" y="231" font-size="22" font-weight="400" fill="#243d45" >U(θ)|HF⟩ 준비</text>
<text x="65" y="281" font-size="21" font-weight="400" fill="#7c5c31" >1010…   0101…</text>
<text x="65" y="315" font-size="21" font-weight="400" fill="#7c5c31" >1001…   1010…</text>
<text x="64" y="359" font-size="17" font-weight="400" fill="#243d45" >계산 기저에서 반복 측정</text>
<path d="M315 270H361" fill="none" stroke="#6c8587" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="375" y="150" width="335" height="245" rx="16" fill="#edf1ee" stroke="#86a696" stroke-width="2"/>
<text x="399" y="188" font-size="23" font-weight="700" fill="#243d45" >고전적 후보 처리</text>
<text x="399" y="235" font-size="20" font-weight="400" fill="#243d45" >유효한 점유수로 회복</text>
<text x="399" y="273" font-size="20" font-weight="400" fill="#243d45" >스핀별 배치를 다시 조합</text>
<text x="399" y="311" font-size="20" font-weight="400" fill="#243d45" >후보를 확장하고 선별</text>
<text x="399" y="359" font-size="18" font-weight="400" fill="#617275" >설정에 따라 선택적으로 적용</text>
<path d="M710 270H742" fill="none" stroke="#6c8587" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="770" y="135" width="390" height="132" rx="14" fill="#e4eeeb" stroke="#679885" stroke-width="2"/>
<text x="795" y="173" font-size="22" font-weight="700" fill="#243d45">현재 반복의 부분공간 S<tspan baseline-shift="sub" font-size="16">t</tspan></text>
<text x="795" y="210" font-size="21" font-weight="400" fill="#243d45" >대각화 → 학습용 에너지</text>
<text x="795" y="242" font-size="18" font-weight="400" fill="#243d45" >이 경로로 회로를 갱신</text>
<rect x="770" y="300" width="390" height="132" rx="14" fill="#e9eef4" stroke="#8a9eb7" stroke-width="2"/>
<text x="795" y="338" font-size="22" font-weight="700" fill="#243d45">누적 부분공간 Ω<tspan baseline-shift="sub" font-size="16">t</tspan></text>
<text x="795" y="375" font-size="21" font-weight="400" fill="#243d45" >대각화 → 보고 에너지</text>
<text x="795" y="407" font-size="18" font-weight="400" fill="#243d45" >이전 반복의 선별 배치도 보존</text>
<path d="M742 270V201H765" fill="none" stroke="#6c8587" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M742 270V366H765" fill="none" stroke="#6c8587" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1130 270V296" fill="none" stroke="#6c8587" stroke-width="2" marker-end="url(#arrow)"/>
<text x="806" y="290" font-size="16" font-weight="400" fill="#617275" >선별한 배치를 보존</text>
<path d="M960 135V108H178V145" fill="none" stroke="#679885" stroke-width="2.5" marker-end="url(#feedback-arrow)"/>
<rect x="436" y="94" width="277" height="29" fill="#fcfaf5"/>
<text x="445" y="115" font-size="18" font-weight="400" fill="#446f5e" >회로 매개변수 θ 갱신</text>
<rect x="375" y="479" width="785" height="120" rx="14" fill="#f2f0e9" stroke="#b9b7aa" stroke-width="2"/>
<text x="400" y="516" font-size="22" font-weight="700" fill="#243d45" >전자 적분으로 투영 해밀토니안을 구성</text>
<text x="400" y="555" font-size="24" font-weight="400" fill="#243d45">(H<tspan baseline-shift="sub" font-size="16">S</tspan>)<tspan baseline-shift="sub" font-size="16">ij</tspan> = ⟨D<tspan baseline-shift="sub" font-size="16">i</tspan>|H|D<tspan baseline-shift="sub" font-size="16">j</tspan>⟩</text>
<text x="795" y="555" font-size="24" font-weight="400" fill="#243d45">H<tspan baseline-shift="sub" font-size="16">S</tspan> c = E<tspan baseline-shift="sub" font-size="16">S</tspan> c</text>
<text x="400" y="584" font-size="18" font-weight="400" fill="#243d45" >선택한 부분공간의 계수와 에너지를 구한다.</text>
<path d="M1020 479V439" fill="none" stroke="#6c8587" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="634" font-size="17" font-weight="400" fill="#617275" >리뷰가 작성한 개념도. 화살표는 정보의 흐름을 나타낸다.</text>
</g></svg>
