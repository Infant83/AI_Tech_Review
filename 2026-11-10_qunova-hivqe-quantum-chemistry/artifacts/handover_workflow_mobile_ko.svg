<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1300" viewBox="0 0 480 1300" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">양자 장치는 배치를 제안하고 고전 계산은 계수를 정한다</title>
<desc id="desc">양자 장치가 점유 비트열을 제안한다. 고전적 회복·스핀 조합·확장으로 후보 배치를 구성한다. 현재 부분공간은 회로 학습의 피드백을 제공한다. 선별된 배치는 누적 부분공간에 보존되며 누적 공간은 보고 에너지를 제공한다. 두 투영 해밀토니안은 알려진 전자 적분으로 구성한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6c8587"/></marker><marker id="feedback-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#679885"/></marker></defs>
<rect width="480" height="1300" rx="18" fill="#fcfaf5"/>
<g font-family="ReviewFigure,ReviewFigureSymbols,ReviewFigureMath,'Noto Sans KR',sans-serif" fill="#243d45">
<text x="24" y="43" font-size="25" font-weight="700" fill="#243d45" >양자는 배치를 제안하고</text>
<text x="24" y="78" font-size="25" font-weight="700" fill="#243d45" >고전 계산은 계수를 정한다</text>
<text x="24" y="111" font-size="18" font-weight="400" fill="#617275" >HI-VQE: 표본에서 부분공간으로</text>
<rect x="72" y="149" width="384" height="184" rx="16" fill="#f4e6ce" stroke="#bb9868" stroke-width="2"/>
<text x="96" y="186" font-size="25" font-weight="700" fill="#243d45" >양자 샘플링</text>
<text x="96" y="226" font-size="23" font-weight="400" fill="#243d45" >U(θ)|HF⟩ 준비</text>
<text x="96" y="268" font-size="22" font-weight="400" fill="#7c5c31" >1010…  0101…  1001…</text>
<text x="96" y="309" font-size="20" font-weight="400" fill="#243d45" >계산 기저에서 반복 측정</text>
<path d="M264 336V373" fill="none" stroke="#6c8587" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="72" y="380" width="384" height="216" rx="16" fill="#edf1ee" stroke="#86a696" stroke-width="2"/>
<text x="96" y="419" font-size="25" font-weight="700" fill="#243d45" >고전적 후보 처리</text>
<text x="96" y="461" font-size="22" font-weight="400" fill="#243d45" >유효한 점유수로 회복</text>
<text x="96" y="497" font-size="22" font-weight="400" fill="#243d45" >스핀별 배치를 다시 조합</text>
<text x="96" y="533" font-size="22" font-weight="400" fill="#243d45" >후보를 확장하고 선별</text>
<text x="96" y="574" font-size="18" font-weight="400" fill="#617275" >설정에 따라 선택적으로 적용</text>
<path d="M264 599V644" fill="none" stroke="#6c8587" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="72" y="652" width="384" height="144" rx="14" fill="#e4eeeb" stroke="#679885" stroke-width="2"/>
<text x="96" y="690" font-size="23" font-weight="700" fill="#243d45">현재 반복의 공간 S<tspan baseline-shift="sub" font-size="16">t</tspan></text>
<text x="96" y="731" font-size="22" font-weight="400" fill="#243d45" >대각화 → 학습용 에너지</text>
<text x="96" y="769" font-size="20" font-weight="400" fill="#243d45" >이 경로로 회로를 갱신</text>
<path d="M72 724H36V226H65" fill="none" stroke="#679885" stroke-width="2.5" marker-end="url(#feedback-arrow)"/>
<text x="22" y="522" font-size="18" font-weight="400" fill="#446f5e" transform="rotate(-90 22 522)" text-anchor="middle">θ 갱신</text>
<path d="M422 799V864" fill="none" stroke="#6c8587" stroke-width="2" marker-end="url(#arrow)"/>
<text x="96" y="838" font-size="19" font-weight="400" fill="#617275" >선별한 배치를 보존</text>
<rect x="72" y="872" width="384" height="144" rx="14" fill="#e9eef4" stroke="#8a9eb7" stroke-width="2"/>
<text x="96" y="910" font-size="23" font-weight="700" fill="#243d45">누적 공간 Ω<tspan baseline-shift="sub" font-size="16">t</tspan></text>
<text x="96" y="951" font-size="22" font-weight="400" fill="#243d45" >대각화 → 보고 에너지</text>
<text x="96" y="989" font-size="18" font-weight="400" fill="#243d45" >이전 반복의 선별 배치도 보존</text>
<rect x="72" y="1064" width="384" height="150" rx="14" fill="#f2f0e9" stroke="#b9b7aa" stroke-width="2"/>
<text x="96" y="1102" font-size="20" font-weight="700" fill="#243d45" >전자 적분으로 투영 행렬 구성</text>
<text x="96" y="1142" font-size="24" font-weight="400" fill="#243d45">(H<tspan baseline-shift="sub" font-size="16">S</tspan>)<tspan baseline-shift="sub" font-size="16">ij</tspan> = ⟨D<tspan baseline-shift="sub" font-size="16">i</tspan>|H|D<tspan baseline-shift="sub" font-size="16">j</tspan>⟩</text>
<text x="96" y="1176" font-size="23" font-weight="400" fill="#243d45">H<tspan baseline-shift="sub" font-size="16">S</tspan> c = E<tspan baseline-shift="sub" font-size="16">S</tspan> c</text>
<text x="96" y="1201" font-size="17" font-weight="400" fill="#243d45" >두 공간 모두 같은 전자 적분을 사용</text>
<text x="24" y="1250" font-size="17" font-weight="400" fill="#617275" >리뷰가 작성한 개념도.</text>
<text x="24" y="1277" font-size="17" font-weight="400" fill="#617275" >화살표는 정보의 흐름을 나타낸다.</text>
</g></svg>
