<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1300" viewBox="0 0 480 1300" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">A QPU proposes configurations; a classical solver sets their coefficients</title>
<desc id="desc">The QPU proposes occupation strings. Classical recovery, spin recombination and expansion create candidate configurations. The current subspace supplies circuit-training feedback. Selected configurations are retained in the cumulative subspace, which supplies the reported energy. Both projected Hamiltonians use known electronic integrals.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6c8587"/></marker><marker id="feedback-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#679885"/></marker></defs>
<rect width="480" height="1300" rx="18" fill="#fcfaf5"/>
<g font-family="ReviewFigure,ReviewFigureSymbols,ReviewFigureMath,'Noto Sans KR',sans-serif" fill="#243d45">
<text x="24" y="43" font-size="25" font-weight="700" fill="#243d45" >A QPU proposes configurations;</text>
<text x="24" y="78" font-size="25" font-weight="700" fill="#243d45" >a classical solver sets coefficients</text>
<text x="24" y="111" font-size="18" font-weight="400" fill="#617275" >HI-VQE: from samples to selected subspaces</text>
<rect x="72" y="149" width="384" height="184" rx="16" fill="#f4e6ce" stroke="#bb9868" stroke-width="2"/>
<text x="96" y="186" font-size="25" font-weight="700" fill="#243d45" >Quantum sampling</text>
<text x="96" y="226" font-size="23" font-weight="400" fill="#243d45" >Prepare U(θ)|HF⟩</text>
<text x="96" y="268" font-size="22" font-weight="400" fill="#7c5c31" >1010…  0101…  1001…</text>
<text x="96" y="309" font-size="20" font-weight="400" fill="#243d45" >Computational-basis samples</text>
<path d="M264 336V373" fill="none" stroke="#6c8587" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="72" y="380" width="384" height="216" rx="16" fill="#edf1ee" stroke="#86a696" stroke-width="2"/>
<text x="96" y="419" font-size="25" font-weight="700" fill="#243d45" >Classical processing</text>
<text x="96" y="461" font-size="22" font-weight="400" fill="#243d45" >Recover valid occupations</text>
<text x="96" y="497" font-size="22" font-weight="400" fill="#243d45" >Recombine spin configurations</text>
<text x="96" y="533" font-size="22" font-weight="400" fill="#243d45" >Expand and screen candidates</text>
<text x="96" y="574" font-size="18" font-weight="400" fill="#617275" >Optional steps depend on the run</text>
<path d="M264 599V644" fill="none" stroke="#6c8587" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="72" y="652" width="384" height="144" rx="14" fill="#e4eeeb" stroke="#679885" stroke-width="2"/>
<text x="96" y="690" font-size="23" font-weight="700" fill="#243d45">Current subspace S<tspan baseline-shift="sub" font-size="16">t</tspan></text>
<text x="96" y="731" font-size="22" font-weight="400" fill="#243d45" >Diagonalize → training energy</text>
<text x="96" y="769" font-size="20" font-weight="400" fill="#243d45" >Circuit update uses this track</text>
<path d="M72 724H36V226H65" fill="none" stroke="#679885" stroke-width="2.5" marker-end="url(#feedback-arrow)"/>
<text x="22" y="522" font-size="18" font-weight="400" fill="#446f5e" transform="rotate(-90 22 522)" text-anchor="middle">Update θ</text>
<path d="M422 799V864" fill="none" stroke="#6c8587" stroke-width="2" marker-end="url(#arrow)"/>
<text x="96" y="838" font-size="19" font-weight="400" fill="#617275" >Retain selected configurations</text>
<rect x="72" y="872" width="384" height="144" rx="14" fill="#e9eef4" stroke="#8a9eb7" stroke-width="2"/>
<text x="96" y="910" font-size="23" font-weight="700" fill="#243d45">Cumulative subspace Ω<tspan baseline-shift="sub" font-size="16">t</tspan></text>
<text x="96" y="951" font-size="22" font-weight="400" fill="#243d45" >Diagonalize → reported energy</text>
<text x="96" y="989" font-size="18" font-weight="400" fill="#243d45" >Retain selected earlier configurations</text>
<rect x="72" y="1064" width="384" height="150" rx="14" fill="#f2f0e9" stroke="#b9b7aa" stroke-width="2"/>
<text x="96" y="1102" font-size="20" font-weight="700" fill="#243d45" >Electronic integrals define H</text>
<text x="96" y="1142" font-size="24" font-weight="400" fill="#243d45">(H<tspan baseline-shift="sub" font-size="16">S</tspan>)<tspan baseline-shift="sub" font-size="16">ij</tspan> = ⟨D<tspan baseline-shift="sub" font-size="16">i</tspan>|H|D<tspan baseline-shift="sub" font-size="16">j</tspan>⟩</text>
<text x="96" y="1176" font-size="23" font-weight="400" fill="#243d45">H<tspan baseline-shift="sub" font-size="16">S</tspan> c = E<tspan baseline-shift="sub" font-size="16">S</tspan> c</text>
<text x="96" y="1201" font-size="17" font-weight="400" fill="#243d45" >Both spaces use the same integrals.</text>
<text x="24" y="1250" font-size="17" font-weight="400" fill="#617275" >Conceptual workflow.</text>
<text x="24" y="1277" font-size="17" font-weight="400" fill="#617275" >Arrows show information flow.</text>
</g></svg>
