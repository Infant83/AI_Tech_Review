<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="970" viewBox="0 0 1120 970" role="img" aria-labelledby="title desc"><title id="title">자가촉매의 증가와 조성 증폭</title><desc id="desc">A dimensionless Frank-type closed-batch educational model compares kappa0 and4 from a=1,r=.0505,s=.0495,d=0. Autocatalysis alone preserves initial ee1%; mutual inhibition amplifies the free active-pool imbalance. The lower plot records free r+s. Exactly symmetric deterministic input retains ee0.</desc><metadata>{&quot;kind&quot;: &quot;review educational Frank-type closed-batch ODE&quot;, &quot;equations&quot;: [&quot;a_prime=-a*(r+s)&quot;, &quot;r_prime=a*r-kappa*r*s&quot;, &quot;s_prime=a*s-kappa*r*s&quot;, &quot;d_prime=kappa*r*s&quot;], &quot;time&quot;: &quot;tau=k*[A]_0*t&quot;, &quot;concentrations&quot;: &quot;normalized to initial substrate [A]_0&quot;, &quot;initial&quot;: {&quot;a&quot;: 1, &quot;r&quot;: 0.0505, &quot;s&quot;: 0.0495, &quot;d&quot;: 0, &quot;ee&quot;: 0.01}, &quot;kappa&quot;: [0, 4], &quot;dt&quot;: 0.005, &quot;step_halving_max_abs_error&quot;: {&quot;0&quot;: 1.2962964035523328e-12, &quot;4&quot;: 2.177147351289932e-12}, &quot;conservation&quot;: &quot;a+r+s+2d=1.1&quot;, &quot;theory_reference&quot;: &quot;https://doi.org/10.1016/0006-3002(53)90082-1&quot;}</metadata><style>text{font-family:ReviewFigure,NanumGothic,sans-serif;fill:#173442}</style>
