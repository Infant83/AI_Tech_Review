<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1540" viewBox="0 0 680 1540" role="img" aria-labelledby="title desc"><title id="title">작은 혼합 차이와 활성 집단</title><desc id="desc">Educational independent two-site pairing: R:S=75:25; RR=56.25%, RS+SR=37.5%, SS=6.25%. With inactive heterochiral pairs and equally active homochiral pairs, the active fraction is62.5%; its RR:SS composition is90:10 and ee80%. The curve is active-pool ee, E(e)=2e/(1+e^2).</desc><metadata>{&quot;kind&quot;: &quot;review educational pairing model&quot;, &quot;assumptions&quot;: [&quot;independent random pairing&quot;, &quot;heterochiral pairs inactive&quot;, &quot;homochiral pairs equally active&quot;], &quot;fractions&quot;: {&quot;RR&quot;: 0.5625, &quot;RS_plus_SR&quot;: 0.375, &quot;SS&quot;: 0.0625, &quot;active&quot;: 0.625}, &quot;active_pool&quot;: {&quot;RR&quot;: 0.9, &quot;SS&quot;: 0.1, &quot;ee&quot;: 0.8}, &quot;equation&quot;: &quot;E(e)=2e/(1+e^2)&quot;, &quot;background_reference&quot;: &quot;https://doi.org/10.1021/ja00269a036&quot;, &quot;derivation&quot;: &quot;independent algebra under the specified educational assumptions&quot;}</metadata><style>text{font-family:ReviewFigure,NanumGothic,sans-serif;fill:#173442}</style>
