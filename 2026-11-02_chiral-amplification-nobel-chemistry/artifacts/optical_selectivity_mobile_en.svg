<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1480" viewBox="0 0 680 1480" role="img" aria-labelledby="title desc"><title id="title">From chain ordering to circular optical transitions</title><desc id="desc">Conceptual chain arrangement and computational workflow based on PRL128,046401(2022): collective CDW ordering, a glide operation consisting of reflection plus translation, momentum matrix elements Pplus/minus=&lt;psi_nk|px plus/minus i py|psi_mk&gt;, and the normalized difference of their squared magnitudes for a chosen valence-to-conduction transition.</desc><metadata>{&quot;kind&quot;: &quot;review explanatory chain-arrangement and computation diagram&quot;, &quot;primary_reference&quot;: &quot;https://doi.org/10.1103/PhysRevLett.128.046401&quot;, &quot;operators&quot;: &quot;momentum px plus/minus i py, as in the paper&quot;, &quot;bands&quot;: &quot;m valence to n conduction&quot;, &quot;channels&quot;: &quot;plus/minus; no viewing-direction assignment&quot;, &quot;eta&quot;: &quot;(abs(Pplus)^2-abs(Pminus)^2)/(abs(Pplus)^2+abs(Pminus)^2)&quot;, &quot;domain&quot;: &quot;positive denominator&quot;}</metadata><style>text{font-family:ReviewFigure,NanumGothic,sans-serif;fill:#173442}</style>
