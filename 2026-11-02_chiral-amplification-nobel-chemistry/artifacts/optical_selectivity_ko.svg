<text x="809.125" y="386.55" font-size="18" font-weight="400" text-anchor="middle" style="fill:#5e7078">일정 거리 이동</text>
<text x="585" y="416" font-size="17" font-weight="400" text-anchor="start" style="fill:#5e7078">동작 뒤 전체 배열과 겹치는지 확인</text>
<rect x="30" y="500" width="640" height="275" rx="7" fill="#edf3ef" stroke="#d1deda"/>
<text x="50" y="538" font-size="23" font-weight="700" text-anchor="start" style="fill:#173442">3  DFT 상태에서 전이를 계산한다</text>
<text x="50" y="583" font-size="19" font-weight="400" text-anchor="start" style="fill:#5e7078">m: 가전자 상태 → n: 전도 상태</text>
<text x="50" y="629" font-size="23" font-weight="700">P±(k) = ⟨ψ<tspan baseline-shift="sub" font-size="70%">nk</tspan> | p<tspan baseline-shift="sub" font-size="70%">x</tspan> ± i p<tspan baseline-shift="sub" font-size="70%">y</tspan> | ψ<tspan baseline-shift="sub" font-size="70%">mk</tspan>⟩</text>
<text x="50" y="677" font-size="21" font-weight="400" text-anchor="start" style="fill:#173442">두 채널의 전이 강도: |P₊|², |P₋|²</text>
<text x="50" y="755" font-size="16" font-weight="400" text-anchor="start" style="fill:#5e7078">+ / − 채널: 원논문의 운동량 연산자 정의</text>
<rect x="710" y="500" width="380" height="275" rx="7" fill="#edf3ef" stroke="#d1deda"/>
<text x="730" y="538" font-size="23" font-weight="700" text-anchor="start" style="fill:#173442">4  k별 선택성을 비교한다</text>
<text x="730" y="605" font-size="26" font-weight="700" text-anchor="start" style="fill:#173442">η(k) =</text>
<text x="968.4000000000001" y="586" font-size="23" font-weight="700" text-anchor="middle" style="fill:#173442">|P₊|² − |P₋|²</text>
<line x1="863.400" y1="598.000" x2="1073.400" y2="598.000" stroke="#173442" stroke-width="1.6"/>
<text x="968.4000000000001" y="633" font-size="23" font-weight="700" text-anchor="middle" style="fill:#173442">|P₊|² + |P₋|²</text>
<text x="730" y="690" font-size="19" font-weight="400" text-anchor="start" style="fill:#5e7078">η &gt; 0: + 채널이 더 강함</text>
<text x="730" y="722" font-size="19" font-weight="400" text-anchor="start" style="fill:#5e7078">분모가 양수인 전이에서 정의</text>
