<text x="318.29999999999995" y="681.8" font-size="24" font-weight="400" text-anchor="middle" style="fill:#5e7078">일정 거리 이동</text>
<text x="50" y="711" font-size="24" font-weight="400" text-anchor="start" style="fill:#5e7078">동작 뒤 전체 배열과 겹치는지 확인</text>
<rect x="30" y="780" width="620" height="250" rx="7" fill="#edf3ef" stroke="#d1deda"/>
<text x="50" y="818" font-size="24" font-weight="700" text-anchor="start" style="fill:#173442">3  DFT 상태에서 전이를 계산한다</text>
<text x="50" y="863" font-size="24" font-weight="400" text-anchor="start" style="fill:#5e7078">m: 가전자 상태 → n: 전도 상태</text>
<text x="50" y="909" font-size="24" font-weight="700">P±(k) = ⟨ψ<tspan baseline-shift="sub" font-size="70%">nk</tspan> | p<tspan baseline-shift="sub" font-size="70%">x</tspan> ± i p<tspan baseline-shift="sub" font-size="70%">y</tspan> | ψ<tspan baseline-shift="sub" font-size="70%">mk</tspan>⟩</text>
<text x="50" y="948" font-size="24" font-weight="400" text-anchor="start" style="fill:#173442">두 채널의 전이 강도: |P₊|², |P₋|²</text>
<text x="50" y="1010" font-size="24" font-weight="400" text-anchor="start" style="fill:#5e7078">+ / − 채널: 원논문의 운동량 연산자 정의</text>
