<text x="50" y="1118" font-size="24" font-weight="700" text-anchor="start" style="fill:#173442">4  k별 선택성을 비교한다</text>
<text x="50" y="1185" font-size="26" font-weight="700" text-anchor="start" style="fill:#173442">η(k) =</text>
<text x="451.6" y="1166" font-size="24" font-weight="700" text-anchor="middle" style="fill:#173442">|P₊|² − |P₋|²</text>
<line x1="296.600" y1="1178.000" x2="606.600" y2="1178.000" stroke="#173442" stroke-width="1.6"/>
<text x="451.6" y="1213" font-size="24" font-weight="700" text-anchor="middle" style="fill:#173442">|P₊|² + |P₋|²</text>
<text x="50" y="1270" font-size="24" font-weight="400" text-anchor="start" style="fill:#5e7078">η &gt; 0: + 채널이 더 강함</text>
