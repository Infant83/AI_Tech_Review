<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">신뢰를 만드는 엔지니어링 하네스</title>
  <desc id="desc">모델 주변의 검색, 도구 권한, 평가, 사람 검토, 롤백이 실제 신뢰를 만드는 구조</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf6}
      .core{fill:#24313f}
      .box{fill:#fff;stroke:#d8d2c6;stroke-width:2}
      .arrow{stroke:#2f6f73;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24313f}
      .white{fill:#fff}
      .title{font-size:25px;font-weight:700}
      .label{font-size:20px;font-weight:700}
      .body{font-size:16px}
      .note{font-size:15px;fill:#5d6670}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2f6f73"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="520" rx="22"/>
  <text x="48" y="54" class="text title">모델의 실제 성격은 하네스 안에서 결정됩니다</text>
  <text x="48" y="84" class="text note">같은 모델도 검색, 도구 권한, 평가, 승인 규칙에 따라 전혀 다른 작업자가 됩니다.</text>
  <circle cx="480" cy="270" r="86" class="core"/>
  <text x="480" y="262" class="white label" text-anchor="middle">GPT-5.5</text>
  <text x="480" y="292" class="white body" text-anchor="middle">추론과 작업 수행</text>
  <g transform="translate(78 142)">
    <rect class="box" width="190" height="92" rx="16"/>
    <text x="24" y="38" class="text label">검색과 인용</text>
    <text x="24" y="68" class="text body">근거 위치를 남김</text>
  </g>
  <g transform="translate(692 142)">
    <rect class="box" width="190" height="92" rx="16"/>
    <text x="24" y="38" class="text label">도구 권한</text>
    <text x="24" y="68" class="text body">실행 범위를 제한</text>
  </g>
  <g transform="translate(78 326)">
    <rect class="box" width="190" height="92" rx="16"/>
    <text x="24" y="38" class="text label">평가와 테스트</text>
    <text x="24" y="68" class="text body">성공 조건 확인</text>
  </g>
  <g transform="translate(692 326)">
    <rect class="box" width="190" height="92" rx="16"/>
    <text x="24" y="38" class="text label">승인과 롤백</text>
    <text x="24" y="68" class="text body">책임 경계를 둠</text>
  </g>
  <path class="arrow" d="M268 188 C340 188, 372 224, 405 246"/>
  <path class="arrow" d="M692 188 C620 188, 588 224, 555 246"/>
  <path class="arrow" d="M268 372 C342 360, 374 328, 405 296"/>
  <path class="arrow" d="M692 372 C618 360, 586 328, 555 296"/>
  <text x="480" y="462" class="text note" text-anchor="middle">신뢰는 모델 내부의 숫자만으로 정해지지 않습니다. 주변 절차가 모델 행동을 실제 업무에 맞게 좁힙니다.</text>
</svg>
