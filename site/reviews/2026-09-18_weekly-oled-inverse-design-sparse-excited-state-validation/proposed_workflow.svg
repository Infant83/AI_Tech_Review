<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Proposed multifidelity OLED inverse-design workflow</title>
  <desc id="desc">Reaction-compatible generation is filtered by low-cost joint properties, common-protocol excited-state calculations, higher-level escalation, host environment checks, and synthesis review.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#54627b"/></marker></defs>
  <rect width="1200" height="520" rx="28" fill="#f6f8fb"/>
  <text x="60" y="56" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#16243e">Proposed multifidelity validation loop</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(55 120)"><rect width="185" height="105" rx="18" fill="#e8eefb" stroke="#4e73c2" stroke-width="2"/><text x="92" y="39" text-anchor="middle" font-size="17" font-weight="700" fill="#233c78">1 · Generate</text><text x="92" y="66" text-anchor="middle" font-size="14" fill="#33405a">reaction-compatible</text><text x="92" y="86" text-anchor="middle" font-size="14" fill="#33405a">fragment attachments</text></g>
    <g transform="translate(295 120)"><rect width="185" height="105" rx="18" fill="#e9f6f4" stroke="#35a6a1" stroke-width="2"/><text x="92" y="39" text-anchor="middle" font-size="17" font-weight="700" fill="#176763">2 · Cheap gate</text><text x="92" y="66" text-anchor="middle" font-size="14" fill="#33405a">geometry + calibrated</text><text x="92" y="86" text-anchor="middle" font-size="14" fill="#33405a">joint-property surrogate</text></g>
    <g transform="translate(535 120)"><rect width="185" height="105" rx="18" fill="#fff3df" stroke="#e69a3b" stroke-width="2"/><text x="92" y="39" text-anchor="middle" font-size="17" font-weight="700" fill="#8a5210">3 · Recalculate</text><text x="92" y="66" text-anchor="middle" font-size="14" fill="#33405a">common conformers</text><text x="92" y="86" text-anchor="middle" font-size="14" fill="#33405a">TDDFT/TDA protocol</text></g>
    <g transform="translate(775 120)"><rect width="185" height="105" rx="18" fill="#f1ebf9" stroke="#6a5fb5" stroke-width="2"/><text x="92" y="39" text-anchor="middle" font-size="17" font-weight="700" fill="#4d428f">4 · Escalate</text><text x="92" y="66" text-anchor="middle" font-size="14" fill="#33405a">uncertain/state-swap cases</text><text x="92" y="86" text-anchor="middle" font-size="14" fill="#33405a">DMRG or multireference</text></g>
    <g transform="translate(1015 120)"><rect width="135" height="105" rx="18" fill="#f8eaf1" stroke="#9b5c86" stroke-width="2"/><text x="67" y="39" text-anchor="middle" font-size="17" font-weight="700" fill="#723a62">5 · Host</text><text x="67" y="66" text-anchor="middle" font-size="14" fill="#33405a">pair/packing</text><text x="67" y="86" text-anchor="middle" font-size="14" fill="#33405a">spin proxies</text></g>
  </g>
  <g stroke="#54627b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M240 172 H290"/><path d="M480 172 H530"/><path d="M720 172 H770"/><path d="M960 172 H1010"/></g>
  <rect x="190" y="310" width="820" height="125" rx="22" fill="#ffffff" stroke="#cfd7e6" stroke-width="2"/>
  <text x="600" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17233d">Independent evidence ledger at every gate</text>
  <g font-family="Arial,sans-serif" font-size="15" fill="#33405a">
    <text x="230" y="380">• survival rate &amp; OOD score</text><text x="230" y="408">• failed calculations retained</text>
    <text x="505" y="380">• state identity &amp; uncertainty</text><text x="505" y="408">• host/conformer provenance</text>
    <text x="785" y="380">• plausible synthesis route</text><text x="785" y="408">• cost and classical baseline</text>
  </g>
  <path d="M1080 230 C1080 470 245 485 145 232" stroke="#7b879d" stroke-width="2.5" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#657089">Reviewer proposal · not an end-to-end workflow demonstrated by any selected paper</text>
</svg>
