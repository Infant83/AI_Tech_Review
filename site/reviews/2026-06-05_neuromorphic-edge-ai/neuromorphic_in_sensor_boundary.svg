<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">센서-연산 경계 이동</title>
  <desc id="desc">기존 카메라 경로와 in-sensor neuromorphic vision 경로를 비교해 계산 위치가 센서 쪽으로 이동하는 것을 설명하는 도식</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf6; }
      .title { font: 700 34px "Segoe UI", "Malgun Gothic", sans-serif; fill: #141414; }
      .subtitle { font: 400 18px "Segoe UI", "Malgun Gothic", sans-serif; fill: #4c4c4c; }
      .section { font: 700 24px "Segoe UI", "Malgun Gothic", sans-serif; fill: #171717; }
      .label { font: 700 20px "Segoe UI", "Malgun Gothic", sans-serif; fill: #161616; }
      .body { font: 400 16px "Segoe UI", "Malgun Gothic", sans-serif; fill: #333; }
      .small { font: 400 14px "Segoe UI", "Malgun Gothic", sans-serif; fill: #595959; }
      .badge { font: 700 14px "Segoe UI", "Malgun Gothic", sans-serif; fill: #fff; }
      .panel { fill: #fff; stroke: #deded6; stroke-width: 1.6; rx: 20; }
      .old { fill: #eef1f3; stroke: #8b959d; stroke-width: 2; rx: 14; }
      .new { fill: #fff1df; stroke: #c8781e; stroke-width: 2; rx: 14; }
      .sensor { fill: #e6f3ee; stroke: #318675; stroke-width: 2; rx: 14; }
      .compute { fill: #eaf0fb; stroke: #4a70ad; stroke-width: 2; rx: 14; }
      .syn { fill: #eee6f6; stroke: #7b519a; stroke-width: 2; rx: 14; }
      .note { fill: #f7e7e7; stroke: #ad5656; stroke-width: 1.8; rx: 14; }
      .arrow { stroke: #2f2f2f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrowSoft { stroke: #8a8a8a; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrowSoft); }
      .event { fill: #df7d20; opacity: .92; }
      .raw { fill: #9aa3aa; opacity: .9; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2f2f2f" />
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#8a8a8a" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <text x="72" y="72" class="title">계산 위치가 센서 쪽으로 당겨집니다</text>
  <text x="72" y="106" class="subtitle">Wang et al. 논문에서 중요한 변화는 빛을 받은 자리에서 spike 변환이 시작된다는 점입니다.</text>
  <text x="72" y="132" class="subtitle">카메라 뒤쪽으로 밀려 있던 연산의 일부가 센서 쪽으로 당겨집니다.</text>

  <rect x="70" y="145" width="1140" height="235" class="panel"/>
  <text x="100" y="188" class="section">기존 카메라 경로</text>
  <rect x="110" y="225" width="180" height="90" class="old"/>
  <text x="134" y="260" class="label">빛 감지</text>
  <text x="134" y="288" class="body">frame 생성</text>
  <g>
    <circle cx="330" cy="270" r="5" class="raw"/>
    <circle cx="350" cy="270" r="5" class="raw"/>
    <circle cx="370" cy="270" r="5" class="raw"/>
    <circle cx="390" cy="270" r="5" class="raw"/>
    <circle cx="410" cy="270" r="5" class="raw"/>
    <circle cx="430" cy="270" r="5" class="raw"/>
  </g>
  <line x1="290" y1="270" x2="470" y2="270" class="arrowSoft"/>
  <rect x="470" y="225" width="220" height="90" class="old"/>
  <text x="494" y="260" class="label">메모리 이동</text>
  <text x="494" y="288" class="body">raw frame 저장·전송</text>
  <line x1="690" y1="270" x2="770" y2="270" class="arrowSoft"/>
  <rect x="770" y="225" width="220" height="90" class="compute"/>
  <text x="794" y="260" class="label">외부 프로세서</text>
  <text x="794" y="288" class="body">NPU/GPU inference</text>
  <rect x="1010" y="220" width="150" height="100" class="note"/>
  <text x="1032" y="255" class="label">비용</text>
  <text x="1032" y="282" class="body">전송·메모리</text>
  <text x="1032" y="306" class="body">지연·전력</text>

  <rect x="70" y="420" width="1140" height="245" class="panel"/>
  <text x="100" y="463" class="section">in-sensor neuromorphic vision 경로</text>
  <rect x="110" y="500" width="190" height="95" class="sensor"/>
  <text x="134" y="535" class="label">빛 감지 위치</text>
  <text x="134" y="563" class="body">MoS2 neuron</text>
  <g>
    <circle cx="340" cy="548" r="4" class="event"/>
    <circle cx="361" cy="548" r="4" class="event"/>
    <circle cx="383" cy="548" r="4" class="event"/>
    <circle cx="411" cy="548" r="4" class="event"/>
  </g>
  <line x1="300" y1="548" x2="458" y2="548" class="arrow"/>
  <rect x="458" y="500" width="205" height="95" class="new"/>
  <text x="482" y="535" class="label">spike 변환</text>
  <text x="482" y="563" class="body">rate / TTFS coding</text>
  <line x1="663" y1="548" x2="735" y2="548" class="arrow"/>
  <rect x="735" y="500" width="205" height="95" class="syn"/>
  <text x="759" y="535" class="label">시냅스 저장</text>
  <text x="759" y="563" class="body">HZO/MoS2 FeFET</text>
  <line x1="940" y1="548" x2="1010" y2="548" class="arrow"/>
  <rect x="1010" y="500" width="150" height="95" class="note"/>
  <text x="1032" y="535" class="label">출력</text>
  <text x="1032" y="563" class="body">작은 event</text>
  <text x="1032" y="587" class="body">분류 신호</text>

  <text x="100" y="704" class="label">그림의 메시지</text>
  <text x="250" y="704" class="body">뉴로모픽 비전의 핵심은 “더 멋진 카메라”보다 센서, 메모리, 연산의 거리를 줄이는 설계입니다.</text>
</svg>
