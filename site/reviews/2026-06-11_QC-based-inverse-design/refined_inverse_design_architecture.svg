<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" role="img" aria-labelledby="title desc">
  <title id="title">검증 우선형 청색 PhOLED 역설계의 네 단계</title>
  <desc id="desc">donor host, acceptor host, 별도 dopant와 소자 조건을 데이터로 묶고, 대리모델과 제한된 후보 선택을 거쳐 고정밀 계산과 소자 검증으로 이어지는 순환 구조</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}.card{fill:#fff;stroke-width:3}.c1{stroke:#416b9a}.c2{stroke:#28745a}.c3{stroke:#aa681f}.c4{stroke:#a54646}.k{font:700 22px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:1px}.h{font:700 39px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.b{font:400 29px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#344054}.note{font:600 27px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#684790}.arrow{stroke:#657083;stroke-width:5;fill:none}.feedback{stroke:#a54646;stroke-width:5;stroke-dasharray:12 10;fill:none}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657083"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a54646"/></marker>
  </defs>
  <rect class="bg" width="1080" height="900"/>

  <rect class="card c1" x="65" y="55" rx="26" width="430" height="300"/>
  <text class="k" x="100" y="105" fill="#416b9a">01 · DATA CONTRACT</text>
  <text class="h" x="100" y="160">누가 함께 빛나는가</text>
  <text class="b" x="100" y="215">donor host · acceptor host</text>
  <text class="b" x="100" y="258">별도 dopant · 소자 조건</text>
  <text class="b" x="100" y="301">계산법 · 실패 사유 · 계보</text>

  <rect class="card c2" x="585" y="55" rx="26" width="430" height="300"/>
  <text class="k" x="620" y="105" fill="#28745a">02 · SURROGATE</text>
  <text class="h" x="620" y="160">쌍과 소자를 예측</text>
  <text class="b" x="620" y="215">고전 기준선 · pair-GNN</text>
  <text class="b" x="620" y="258">CT · T1 · BDE · packing</text>
  <text class="b" x="620" y="301">불확실성 · 적용 가능 영역</text>

  <rect class="card c3" x="585" y="505" rx="26" width="430" height="300"/>
  <text class="k" x="620" y="555" fill="#aa681f">03 · CANDIDATE SELECTION</text>
  <text class="h" x="620" y="610">같은 문제를 탐색</text>
  <text class="b" x="620" y="665">CP-SAT · GA/BO · SA/Tabu</text>
  <text class="note" x="620" y="710">QA는 제한된 이진 선택만</text>
  <text class="b" x="620" y="755">동일 목적함수 · 동일 예산</text>

  <rect class="card c4" x="65" y="505" rx="26" width="430" height="300"/>
  <text class="k" x="100" y="555" fill="#a54646">04 · MATERIAL EVIDENCE</text>
  <text class="h" x="100" y="610">물질에서 다시 확인</text>
  <text class="b" x="100" y="665">고정밀 DFT/TDDFT</text>
  <text class="b" x="100" y="708">전문가 검토 · 합성 · 소자</text>
  <text class="b" x="100" y="751">성공과 실패를 모두 환류</text>

  <path class="arrow" d="M495 205 L585 205" marker-end="url(#arrow)"/>
  <path class="arrow" d="M800 355 L800 505" marker-end="url(#arrow)"/>
  <path class="arrow" d="M585 655 L495 655" marker-end="url(#arrow)"/>
  <path class="feedback" d="M280 505 C280 430 280 430 280 355" marker-end="url(#red)"/>
  <text class="k" x="320" y="444" fill="#a54646">검증 결과 환류</text>
  <text class="k" x="680" y="860" fill="#5b6473">QA가 빠져도 01 · 02 · 04는 그대로 남습니다</text>
</svg>
