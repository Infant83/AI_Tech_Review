<svg xmlns="http://www.w3.org/2000/svg" width="620" height="2680" viewBox="0 0 620 2680" role="img" aria-labelledby="title desc">
  <title id="title">모바일용 재료 인포매틱스 파이프라인의 네 가지 선택형 양자 삽입점</title>
  <desc id="desc">데이터 계약에서 시작해 전자구조, 속성 예측, 생성과 샘플링, 이산 최적화를 차례로 배치하고 각 고전 모듈 위에 독립적인 선택형 양자 소켓을 놓는다. QFT는 QPE의 위상 판독 서브루틴이며, 마지막 검증 결과는 데이터로 환류된다.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}.eyebrow{font:700 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:1.4px;fill:#684790}.title{font:700 35px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.subtitle{font:400 22px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#566172}.socket{fill:#fff;stroke-width:3}.s1{stroke:#416b9a}.s2{stroke:#28745a}.s3{stroke:#aa681f}.s4{stroke:#74519a}.tag{font:700 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:1px}.head{font:700 29px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.method{font:700 23px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#344054}.body{font:400 21px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#4b5565}.small{font:600 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#684790}.baseline{fill:#edf0f4;stroke:#c9d0da;stroke-width:2}.basehead{font:700 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:.6px;fill:#5b6473}.basebody{font:600 21px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#293548}.data{fill:#eef4fb;stroke:#416b9a;stroke-width:3}.verify{fill:#edf7f1;stroke:#28745a;stroke-width:3}.flow{stroke:#697486;stroke-width:5;fill:none}.plug{stroke:#74519a;stroke-width:4;stroke-dasharray:9 7;fill:none}.loop{stroke:#a44343;stroke-width:4;stroke-dasharray:10 8;fill:none}.feedback{font:700 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#a44343}.footer{font:700 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#354052}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#697486"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#74519a"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a44343"/></marker>
  </defs>
  <rect class="bg" width="620" height="2680"/>

  <text class="eyebrow" x="42" y="48">MODULAR QUANTUM INSERTION MAP</text>
  <text class="title" x="42" y="94">양자컴퓨팅은</text>
  <text class="title" x="42" y="136">네 곳에서 따로 시험합니다</text>
  <text class="subtitle" x="42" y="178">하나의 엔진이 아닌 독립적인 선택형 모듈입니다.</text>

  <rect class="data" x="42" y="215" rx="22" width="536" height="150"/>
  <text class="tag" x="76" y="254" fill="#416b9a">COMMON INPUT</text>
  <text class="head" x="76" y="298">데이터 계약 · 표현 · 계보</text>
  <text class="body" x="76" y="332">성공·실패·계산 조건을 같은 스키마로 묶습니다</text>
  <path class="flow" d="M310 365 L310 415" marker-end="url(#arrow)"/>

  <rect class="socket s1" x="42" y="430" rx="24" width="536" height="280"/>
  <text class="tag" x="76" y="470" fill="#416b9a">OPTIONAL SOCKET 01</text>
  <text class="head" x="76" y="517">전자구조 · 정밀 라벨</text>
  <text class="method" x="76" y="558">VQE · QPE</text>
  <text class="body" x="76" y="598">바닥상태·여기상태 에너지</text>
  <text class="body" x="76" y="633">강상관 active space 보완</text>
  <rect x="72" y="655" rx="13" width="476" height="38" fill="#f3eef9"/>
  <text class="small" x="90" y="681">QPE 안의 QFT = 위상 판독 서브루틴</text>
  <path class="plug" d="M310 710 L310 752" marker-end="url(#purple)"/>

  <rect class="baseline" x="42" y="765" rx="20" width="536" height="150"/>
  <text class="basehead" x="76" y="805">01 · CLASSICAL ELECTRONIC STRUCTURE</text>
  <text class="basebody" x="76" y="846">DFT · TDDFT · post-HF</text>
  <text class="body" x="76" y="882">계산 비용·오차·계보 기록</text>
  <path class="flow" d="M310 915 L310 965" marker-end="url(#arrow)"/>

  <rect class="socket s2" x="42" y="980" rx="24" width="536" height="250"/>
  <text class="tag" x="76" y="1020" fill="#28745a">OPTIONAL SOCKET 02</text>
  <text class="head" x="76" y="1067">속성 예측</text>
  <text class="method" x="76" y="1108">quantum kernel · QNN</text>
  <text class="body" x="76" y="1148">구조 → 물성 회귀·분류</text>
  <text class="small" x="76" y="1191" fill="#28745a">데이터 로딩 비용까지 고전 기준선과 비교</text>
  <path class="plug" d="M310 1230 L310 1272" marker-end="url(#purple)"/>

  <rect class="baseline" x="42" y="1285" rx="20" width="536" height="150"/>
  <text class="basehead" x="76" y="1325">02 · CLASSICAL SURROGATE</text>
  <text class="basebody" x="76" y="1366">GNN · GP · tree ensemble</text>
  <text class="body" x="76" y="1402">불확실성·적용 영역·보정 평가</text>
  <path class="flow" d="M310 1435 L310 1485" marker-end="url(#arrow)"/>

  <rect class="socket s3" x="42" y="1500" rx="24" width="536" height="250"/>
  <text class="tag" x="76" y="1540" fill="#aa681f">OPTIONAL SOCKET 03</text>
  <text class="head" x="76" y="1587">생성 · 분포 샘플링</text>
  <text class="method" x="76" y="1628">quantum Born model</text>
  <text class="body" x="76" y="1668">후보 분포 학습 · 샘플 생성</text>
  <text class="small" x="76" y="1711" fill="#8c571c">샘플링 ≠ 최적화</text>
  <path class="plug" d="M310 1750 L310 1792" marker-end="url(#purple)"/>

  <rect class="baseline" x="42" y="1805" rx="20" width="536" height="150"/>
  <text class="basehead" x="76" y="1845">03 · CLASSICAL GENERATION</text>
  <text class="basebody" x="76" y="1886">VAE · diffusion · MCMC</text>
  <text class="body" x="76" y="1922">화학 제약·중복·다양성 점검</text>
  <path class="flow" d="M310 1955 L310 2005" marker-end="url(#arrow)"/>

  <rect class="socket s4" x="42" y="2020" rx="24" width="536" height="250"/>
  <text class="tag" x="76" y="2060" fill="#74519a">OPTIONAL SOCKET 04</text>
  <text class="head" x="76" y="2107">이산 후보 선택</text>
  <text class="method" x="76" y="2148">QUBO → QA · QAOA</text>
  <text class="body" x="76" y="2188">QUBO는 문제 표현 · QA/QAOA는 풀이 계열</text>
  <text class="small" x="76" y="2231">동일 목적함수·예산으로 비교</text>
  <path class="plug" d="M310 2270 L310 2312" marker-end="url(#purple)"/>

  <rect class="baseline" x="42" y="2325" rx="20" width="536" height="150"/>
  <text class="basehead" x="76" y="2365">04 · CLASSICAL OPTIMIZATION</text>
  <text class="basebody" x="76" y="2406">CP-SAT · GA/BO · SA/Tabu</text>
  <text class="body" x="76" y="2442">실행시간·해 품질·분산 비교</text>
  <path class="flow" d="M310 2475 L310 2515" marker-end="url(#arrow)"/>

  <rect class="verify" x="42" y="2528" rx="22" width="536" height="105"/>
  <text class="tag" x="76" y="2566" fill="#28745a">MATERIAL VALIDATION</text>
  <text class="head" x="76" y="2608">고정밀 계산 · 합성 · 소자</text>
  <path class="loop" d="M42 2582 C14 2582 14 290 42 290" marker-end="url(#red)"/>
  <text class="feedback" x="94" y="2662">검증 결과와 실패 원인을 데이터로 환류</text>
</svg>
