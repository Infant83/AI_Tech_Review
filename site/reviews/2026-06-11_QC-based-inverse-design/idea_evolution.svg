<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">개인 분자 역설계 아이디어의 발전 과정</title>
  <desc id="desc">2024년 DFT와 GNN 기반 blue TADF 공개 연구에서 2026년 양자 중심 PhOLED 제안, 2026년 7월 검증 우선형 하이브리드 PoC로 발전한 과정</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d9d6ce;stroke-width:2}.verified{fill:#eaf6ef;stroke:#26755b;stroke-width:2.5}.proposal{fill:#fff4e8;stroke:#b36a1e;stroke-width:2.5}.recommended{fill:#edf3ff;stroke:#3e6495;stroke-width:2.5}.title{font:700 32px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#1b2533}.sub{font:400 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#5e6875}.year{font:700 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#fff}.h{font:700 23px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#1b2533}.body{font:400 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#374151}.small{font:400 14px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#5e6875}.line{stroke:#7c8490;stroke-width:4;fill:none}.dot{fill:#fff;stroke:#344054;stroke-width:5}.badge1{fill:#26755b}.badge2{fill:#b36a1e}.badge3{fill:#3e6495}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c8490"/></marker>
  </defs>
  <rect class="bg" width="1400" height="720"/>
  <text class="title" x="70" y="65">연구 경험은 확인됐고, 양자 단계는 검증을 앞두고 있습니다</text>
  <text class="sub" x="70" y="98">공개 논문, 개인 제안, 권장 PoC의 증거 강도를 분리했습니다.</text>
  <path class="line" d="M170 180 L1230 180" marker-end="url(#arrow)"/>
  <circle class="dot" cx="260" cy="180" r="13"/><circle class="dot" cx="700" cy="180" r="13"/><circle class="dot" cx="1140" cy="180" r="13"/>

  <rect class="verified" x="90" y="235" rx="20" width="340" height="355"/>
  <rect class="badge1" x="120" y="215" rx="18" width="120" height="40"/><text class="year" x="148" y="242">2024</text>
  <text class="h" x="125" y="300">검증된 공개 연구</text>
  <text class="body" x="125" y="344">blue TADF emitter</text>
  <text class="body" x="125" y="375">DFT excited-state labels</text>
  <text class="body" x="125" y="406">GNN property prediction</text>
  <text class="body" x="125" y="437">SID 논문 · 공동 제1저자</text>
  <line x1="125" y1="470" x2="395" y2="470" stroke="#b8d8c9" stroke-width="2"/>
  <text class="small" x="125" y="505">확인된 것</text>
  <text class="body" x="125" y="535">계산화학 → ML → 소재 판단</text>
  <text class="small" x="125" y="567">PhOLED QA 구현을 뜻하지는 않습니다.</text>

  <rect class="proposal" x="530" y="235" rx="20" width="340" height="355"/>
  <rect class="badge2" x="560" y="215" rx="18" width="150" height="40"/><text class="year" x="580" y="242">2026.06</text>
  <text class="h" x="565" y="300">개인 연구 제안</text>
  <text class="body" x="565" y="344">blue PhOLED exciplex pair</text>
  <text class="body" x="565" y="375">SELFIES · GNN · TabPFN</text>
  <text class="body" x="565" y="406">CRBM · QUBO · D-Wave</text>
  <text class="body" x="565" y="437">계산·실험 feedback</text>
  <line x1="565" y1="470" x2="835" y2="470" stroke="#ead0ae" stroke-width="2"/>
  <text class="small" x="565" y="505">확인된 것</text>
  <text class="body" x="565" y="535">PPTX · 제안서 · 포털 임시저장</text>
  <text class="small" x="565" y="567">code · data · 실험 결과는 없습니다.</text>

  <rect class="recommended" x="970" y="235" rx="20" width="340" height="355"/>
  <rect class="badge3" x="1000" y="215" rx="18" width="150" height="40"/><text class="year" x="1020" y="242">2026.07</text>
  <text class="h" x="1005" y="300">권장 검증형 PoC</text>
  <text class="body" x="1005" y="344">pair / substituent 문제 고정</text>
  <text class="body" x="1005" y="375">classical baseline 우선</text>
  <text class="body" x="1005" y="406">QA sampling·optimization 분리</text>
  <text class="body" x="1005" y="437">동일 검증예산 value gate</text>
  <line x1="1005" y1="470" x2="1275" y2="470" stroke="#bdcce0" stroke-width="2"/>
  <text class="small" x="1005" y="505">성과 기준</text>
  <text class="body" x="1005" y="535">실제 target hit · 정보가치</text>
  <text class="small" x="1005" y="567">양자 우위가 아니라 역할 판별</text>

  <rect class="card" x="260" y="630" rx="16" width="880" height="58"/>
  <text class="body" x="300" y="666">연구 명제: 같은 고정밀 계산·실험 예산에서 더 좋은 feasible candidate를 찾는가?</text>
</svg>
