<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">청색 OLED 분자 역설계 아이디어의 독창성 경계</title>
  <desc id="desc">이미 알려진 선행기술, 연구 기회가 남은 응용 결합, 아직 입증되지 않은 주장을 세 열로 비교한 도식</desc>
  <defs>
    <style>
      .bg{fill:#f8f8f6}.col1{fill:#f1f3f5;stroke:#7a838f;stroke-width:2}.col2{fill:#ecf6f0;stroke:#2f765e;stroke-width:2.5}.col3{fill:#fff0ef;stroke:#a44343;stroke-width:2.5}.title{font:700 32px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.sub{font:400 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#5a6575}.h{font:700 23px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.item{font:400 17px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#344054}.note{font:700 16px 'Segoe UI','Noto Sans KR',Arial,sans-serif}.dot1{fill:#7a838f}.dot2{fill:#2f765e}.dot3{fill:#a44343}.foot{fill:#fff;stroke:#d9dde4;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1400" height="760"/>
  <text class="title" x="70" y="65">독창성은 알고리즘 이름보다 문제와 검증 방식에 남아 있습니다</text>
  <text class="sub" x="70" y="100">선행기술, 연구 가설, 미입증 주장을 분리했습니다.</text>

  <rect class="col1" x="70" y="145" rx="22" width="390" height="485"/>
  <text class="h" x="105" y="195">이미 알려진 구성요소</text>
  <circle class="dot1" cx="112" cy="245" r="6"/><text class="item" x="132" y="251">blue OLED host inverse design</text>
  <circle class="dot1" cx="112" cy="292" r="6"/><text class="item" x="132" y="298">DFT label · GNN · HTVS</text>
  <circle class="dot1" cx="112" cy="339" r="6"/><text class="item" x="132" y="345">SELFIES · graph · fingerprint</text>
  <circle class="dot1" cx="112" cy="386" r="6"/><text class="item" x="132" y="392">CRBM / Boltzmann model</text>
  <circle class="dot1" cx="112" cy="433" r="6"/><text class="item" x="132" y="439">QUBO · D-Wave molecular design</text>
  <circle class="dot1" cx="112" cy="480" r="6"/><text class="item" x="132" y="486">fixed latent representation + QA</text>
  <circle class="dot1" cx="112" cy="527" r="6"/><text class="item" x="132" y="533">closed-loop / active learning</text>
  <text class="note" x="105" y="590" fill="#59636f">개별 요소의 novelty 주장 불가</text>

  <rect class="col2" x="505" y="145" rx="22" width="390" height="485"/>
  <text class="h" x="540" y="195">응용 차별성 후보</text>
  <circle class="dot2" cx="547" cy="245" r="6"/><text class="item" x="567" y="251">blue PhOLED exciplex pair co-design</text>
  <circle class="dot2" cx="547" cy="292" r="6"/><text class="item" x="567" y="298">CT · T1 · BDE · packing 통합</text>
  <circle class="dot2" cx="547" cy="339" r="6"/><text class="item" x="567" y="345">device-level stability labels</text>
  <circle class="dot2" cx="547" cy="386" r="6"/><text class="item" x="567" y="392">multi-fidelity provenance contract</text>
  <circle class="dot2" cx="547" cy="433" r="6"/><text class="item" x="567" y="439">QA sampling / optimization 분리</text>
  <circle class="dot2" cx="547" cy="480" r="6"/><text class="item" x="567" y="486">strong classical baseline arena</text>
  <circle class="dot2" cx="547" cy="527" r="6"/><text class="item" x="567" y="533">동일 검증예산 stop rule</text>
  <text class="note" x="540" y="590" fill="#26755b">PoC와 실험으로 입증할 연구 가설</text>

  <rect class="col3" x="940" y="145" rx="22" width="390" height="485"/>
  <text class="h" x="975" y="195">아직 입증되지 않은 주장</text>
  <circle class="dot3" cx="982" cy="245" r="6"/><text class="item" x="1002" y="251">quantum advantage</text>
  <circle class="dot3" cx="982" cy="292" r="6"/><text class="item" x="1002" y="298">OLED 후보 생성 완료</text>
  <circle class="dot3" cx="982" cy="339" r="6"/><text class="item" x="1002" y="345">CRBM / QUBO / QA 구현</text>
  <circle class="dot3" cx="982" cy="386" r="6"/><text class="item" x="1002" y="392">VQE 기반 label production</text>
  <circle class="dot3" cx="982" cy="433" r="6"/><text class="item" x="1002" y="439">closed-loop synthesis lab</text>
  <circle class="dot3" cx="982" cy="480" r="6"/><text class="item" x="1002" y="486">기업 quantum PoC 성과</text>
  <circle class="dot3" cx="982" cy="527" r="6"/><text class="item" x="1002" y="533">소자 lifetime 개선</text>
  <text class="note" x="975" y="590" fill="#a44343">future-work 또는 금지 표현</text>

  <rect class="foot" x="215" y="665" rx="18" width="970" height="62"/>
  <text class="item" x="255" y="703">좋은 연구 질문은 “양자를 썼는가”가 아니라 “어느 병목에서 검증 비용을 줄였는가”입니다.</text>
</svg>
