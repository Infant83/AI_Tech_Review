<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1260" viewBox="0 0 620 1260" role="img" aria-labelledby="title desc">
  <title id="title">모바일용 재료 역설계 양자 파이프라인 네 단계</title>
  <desc id="desc">데이터 계약, 대리모델, 제한된 후보 선택, 물질 검증을 세로로 배열하고 검증 결과가 데이터로 돌아가는 구조</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}.card{fill:#fff;stroke-width:3}.c1{stroke:#416b9a}.c2{stroke:#28745a}.c3{stroke:#aa681f}.c4{stroke:#a54646}.k{font:700 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:.8px}.h{font:700 34px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.b{font:400 26px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#344054}.note{font:700 24px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#684790}.arrow{stroke:#657083;stroke-width:5;fill:none}.feedback{stroke:#a54646;stroke-width:4;stroke-dasharray:10 8;fill:none}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657083"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a54646"/></marker>
  </defs>
  <rect class="bg" width="620" height="1260"/>

  <rect class="card c1" x="55" y="35" rx="24" width="510" height="245"/>
  <text class="k" x="90" y="80" fill="#416b9a">01 · DATA CONTRACT</text>
  <text class="h" x="90" y="130">누가 함께 빛나는가</text>
  <text class="b" x="90" y="178">donor · acceptor · 별도 dopant</text>
  <text class="b" x="90" y="218">소자 조건 · 계산법 · 실패 계보</text>

  <path class="arrow" d="M310 280 L310 325" marker-end="url(#arrow)"/>
  <rect class="card c2" x="55" y="335" rx="24" width="510" height="245"/>
  <text class="k" x="90" y="380" fill="#28745a">02 · SURROGATE</text>
  <text class="h" x="90" y="430">쌍과 소자를 예측</text>
  <text class="b" x="90" y="478">고전 기준선 · pair-GNN</text>
  <text class="b" x="90" y="518">CT · T1 · BDE · packing</text>

  <path class="arrow" d="M310 580 L310 625" marker-end="url(#arrow)"/>
  <rect class="card c3" x="55" y="635" rx="24" width="510" height="245"/>
  <text class="k" x="90" y="680" fill="#aa681f">03 · CANDIDATE SELECTION</text>
  <text class="h" x="90" y="730">같은 문제를 탐색</text>
  <text class="b" x="90" y="778">CP-SAT · GA/BO · SA/Tabu</text>
  <text class="note" x="90" y="820">QA는 제한된 이진 선택만</text>

  <path class="arrow" d="M310 880 L310 925" marker-end="url(#arrow)"/>
  <rect class="card c4" x="55" y="935" rx="24" width="510" height="245"/>
  <text class="k" x="90" y="980" fill="#a54646">04 · MATERIAL EVIDENCE</text>
  <text class="h" x="90" y="1030">물질에서 다시 확인</text>
  <text class="b" x="90" y="1078">고정밀 계산 · 전문가 검토</text>
  <text class="b" x="90" y="1118">합성 · 소자 · 성공/실패 환류</text>

  <path class="feedback" d="M55 1058 C20 1058 20 155 55 155" marker-end="url(#red)"/>
  <text class="k" x="70" y="1225" fill="#5b6473">QA가 빠져도 데이터 · 예측 · 검증은 남습니다</text>
</svg>
