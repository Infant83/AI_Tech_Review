<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="title desc">
  <title id="title">재료 인포매틱스 파이프라인의 네 가지 선택형 양자 삽입점</title>
  <desc id="desc">고전 재료 인포매틱스 백본 위에 전자구조 계산, 속성 예측, 생성과 샘플링, 이산 최적화를 위한 네 개의 독립적인 양자 소켓을 배치하고, 고정밀 계산과 실험 검증 결과가 데이터 계약으로 되돌아가는 구조를 보여준다. QFT는 QPE 내부의 위상 판독 서브루틴으로 표시된다.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}.eyebrow{font:700 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:2.2px;fill:#684790}.title{font:700 42px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.subtitle{font:400 24px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#566172}.socket{fill:#fff;stroke-width:3}.s1{stroke:#416b9a}.s2{stroke:#28745a}.s3{stroke:#aa681f}.s4{stroke:#74519a}.tag{font:700 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:1.2px}.head{font:700 29px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.method{font:700 24px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#344054}.body{font:400 21px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#4b5565}.small{font:600 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#684790}.baseline{fill:#edf0f4;stroke:#c9d0da;stroke-width:2}.basehead{font:700 19px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:.7px;fill:#5b6473}.basebody{font:600 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#293548}.data{fill:#eef4fb;stroke:#416b9a;stroke-width:3}.verify{fill:#edf7f1;stroke:#28745a;stroke-width:3}.feedback{font:700 19px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#a44343}.flow{stroke:#697486;stroke-width:5;fill:none}.plug{stroke:#74519a;stroke-width:4;stroke-dasharray:10 8;fill:none}.loop{stroke:#a44343;stroke-width:5;stroke-dasharray:12 9;fill:none}.footer{font:700 21px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#354052}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#697486"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#74519a"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a44343"/></marker>
  </defs>
  <rect class="bg" width="1440" height="1010"/>

  <text class="eyebrow" x="55" y="50">MODULAR QUANTUM INSERTION MAP</text>
  <text class="title" x="55" y="99">양자컴퓨팅은 네 곳에서 따로 시험할 수 있습니다</text>
  <text class="subtitle" x="55" y="132">
    <tspan x="55" dy="0">하나의 양자 엔진이 아니라,</tspan>
    <tspan x="55" dy="31">고전 Materials Informatics 백본에 꽂는 독립적인 선택형 모듈입니다.</tspan>
  </text>

  <rect class="socket s1" x="50" y="180" rx="24" width="305" height="300"/>
  <text class="tag" x="78" y="218" fill="#416b9a">OPTIONAL SOCKET 01</text>
  <text class="head" x="78" y="265">전자구조 · 정밀 라벨</text>
  <text class="method" x="78" y="308">VQE · QPE</text>
  <text class="body" x="78" y="350">바닥상태·여기상태 에너지</text>
  <text class="body" x="78" y="382">강상관 active space 보완</text>
  <rect x="74" y="405" rx="13" width="257" height="50" fill="#f3eef9"/>
  <text class="small" x="88" y="426">QPE 안의 QFT:</text>
  <text class="small" x="88" y="447">위상 판독 서브루틴</text>

  <rect class="socket s2" x="395" y="180" rx="24" width="305" height="300"/>
  <text class="tag" x="423" y="218" fill="#28745a">OPTIONAL SOCKET 02</text>
  <text class="head" x="423" y="265">속성 예측</text>
  <text class="method" x="423" y="308">quantum kernel · QNN</text>
  <text class="body" x="423" y="350">구조 → 물성 회귀·분류</text>
  <text class="body" x="423" y="382">불확실성·적용 영역 확인</text>
  <rect x="419" y="405" rx="13" width="257" height="50" fill="#edf7f1"/>
  <text class="small" x="433" y="436" fill="#28745a">데이터 로딩 비용까지 비교</text>

  <rect class="socket s3" x="740" y="180" rx="24" width="305" height="300"/>
  <text class="tag" x="768" y="218" fill="#aa681f">OPTIONAL SOCKET 03</text>
  <text class="head" x="768" y="265">생성 · 분포 샘플링</text>
  <text class="method" x="768" y="308">quantum Born model</text>
  <text class="body" x="768" y="350">후보 분포 학습·샘플 생성</text>
  <text class="body" x="768" y="382">다양성·유효성·신규성 측정</text>
  <rect x="764" y="405" rx="13" width="257" height="50" fill="#fff4e5"/>
  <text class="small" x="778" y="436" fill="#8c571c">샘플링 ≠ 최적화</text>

  <rect class="socket s4" x="1085" y="180" rx="24" width="305" height="300"/>
  <text class="tag" x="1113" y="218" fill="#74519a">OPTIONAL SOCKET 04</text>
  <text class="head" x="1113" y="265">이산 후보 선택</text>
  <text class="method" x="1113" y="308">QUBO → QA · QAOA</text>
  <text class="body" x="1113" y="350">QUBO는 문제 표현</text>
  <text class="body" x="1113" y="382">QA·QAOA는 풀이 계열</text>
  <rect x="1109" y="405" rx="13" width="257" height="50" fill="#f3eef9"/>
  <text class="small" x="1123" y="436">동일 목적함수·예산 비교</text>

  <text class="eyebrow" x="50" y="526" fill="#5b6473">CLASSICAL MATERIALS INFORMATICS BACKBONE · 항상 남는 경로</text>
  <path class="plug" d="M202 480 L202 548" marker-end="url(#purple)"/>
  <path class="plug" d="M547 480 L547 548" marker-end="url(#purple)"/>
  <path class="plug" d="M892 480 L892 548" marker-end="url(#purple)"/>
  <path class="plug" d="M1237 480 L1237 548" marker-end="url(#purple)"/>

  <rect class="baseline" x="50" y="560" rx="20" width="305" height="155"/>
  <text class="basehead" x="78" y="596">01 · ELECTRONIC STRUCTURE</text>
  <text class="basebody" x="78" y="635">DFT · TDDFT · post-HF</text>
  <text class="body" x="78" y="674">계산 비용·오차·계보 기록</text>

  <rect class="baseline" x="395" y="560" rx="20" width="305" height="155"/>
  <text class="basehead" x="423" y="596">02 · SURROGATE</text>
  <text class="basebody" x="423" y="635">GNN · GP · tree ensemble</text>
  <text class="body" x="423" y="674">고전 기준선과 보정 평가</text>

  <rect class="baseline" x="740" y="560" rx="20" width="305" height="155"/>
  <text class="basehead" x="768" y="596">03 · GENERATION</text>
  <text class="basebody" x="768" y="635">VAE · diffusion · MCMC</text>
  <text class="body" x="768" y="674">화학 제약·중복·다양성 점검</text>

  <rect class="baseline" x="1085" y="560" rx="20" width="305" height="155"/>
  <text class="basehead" x="1113" y="596">04 · OPTIMIZATION</text>
  <text class="basebody" x="1113" y="635">CP-SAT · GA/BO · SA/Tabu</text>
  <text class="body" x="1113" y="674">실행시간·해 품질·분산 비교</text>

  <path class="flow" d="M355 637 L388 637" marker-end="url(#arrow)"/>
  <path class="flow" d="M700 637 L733 637" marker-end="url(#arrow)"/>
  <path class="flow" d="M1045 637 L1078 637" marker-end="url(#arrow)"/>

  <rect class="data" x="50" y="785" rx="22" width="430" height="135"/>
  <text class="tag" x="82" y="824" fill="#416b9a">COMMON INPUT</text>
  <text class="head" x="82" y="864">데이터 계약 · 표현 · 계보</text>
  <text class="body" x="82" y="897">성공·실패·계산 조건을 같은 스키마로 묶습니다</text>
  <path class="flow" d="M265 785 C265 750 202 750 202 715" marker-end="url(#arrow)"/>

  <rect class="verify" x="960" y="785" rx="22" width="430" height="135"/>
  <text class="tag" x="992" y="824" fill="#28745a">MATERIAL VALIDATION</text>
  <text class="head" x="992" y="864">고정밀 계산 · 합성 · 소자</text>
  <text class="body" x="992" y="897">validated hit와 실패 원인을 함께 남깁니다</text>
  <path class="flow" d="M1237 715 C1237 750 1175 750 1175 785" marker-end="url(#arrow)"/>

  <path class="loop" d="M960 852 C815 852 780 952 480 852" marker-end="url(#red)"/>
  <text class="feedback" x="554" y="914">실험 결과 · 실패 원인 · 적용 가능 영역 환류</text>
  <text class="footer" x="50" y="976">읽는 법: 네 socket은 서로를 전제하지 않습니다. 고전 기준선을 이긴 모듈만 독립적으로 남깁니다.</text>
</svg>
