<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1090" viewBox="0 0 620 1090" role="img" aria-labelledby="title desc">
  <title id="title">모바일용 양자 어닐링 가치 판별 세 단계</title>
  <desc id="desc">상류 오류를 통제하고 같은 solver arena에서 비교한 뒤 고정밀 물질 검증으로 채택이나 중단을 결정하는 세로형 도식</desc>
  <defs>
    <style>
      .bg{fill:#faf8f2}.stage{fill:#fff;stroke:#354052;stroke-width:3}.arena{fill:#f3eef9;stroke:#74519a;stroke-width:3}.verify{fill:#edf7f1;stroke:#28745a;stroke-width:3}.stop{fill:#fff0ef;stroke:#a44343;stroke-width:3}.k{font:700 20px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:.7px}.h{font:700 34px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.b{font:400 25px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#344054}.d{font:700 23px 'Segoe UI','Noto Sans KR',Arial,sans-serif}.arrow{stroke:#687386;stroke-width:6;fill:none}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#687386"/></marker>
  </defs>
  <rect class="bg" width="620" height="1090"/>

  <rect class="stage" x="45" y="35" rx="24" width="530" height="260"/>
  <text class="k" x="80" y="78" fill="#416b9a">01 · CONTROL UPSTREAM ERROR</text>
  <text class="h" x="80" y="130">solver보다 먼저 확인</text>
  <text class="b" x="80" y="178">데이터 누수 · 예측기 보정</text>
  <text class="b" x="80" y="216">decoder · QUBO 근사 오차</text>
  <rect class="stop" x="328" y="230" rx="15" width="215" height="48"/>
  <text class="d" x="354" y="262" fill="#983b3b">오차가 크면 중단</text>

  <path class="arrow" d="M310 295 L310 350" marker-end="url(#arrow)"/>
  <rect class="arena" x="45" y="365" rx="24" width="530" height="275"/>
  <text class="k" x="80" y="408" fill="#74519a">02 · SAME SOLVER ARENA</text>
  <text class="h" x="80" y="460">같은 문제 · 같은 예산</text>
  <text class="b" x="80" y="508">CP-SAT · GA/BO · SA/Tabu/SQA</text>
  <text class="b" x="80" y="548">D-Wave QPU · 반복 job</text>
  <text class="b" x="80" y="588">동일 검증 예산 · 신뢰구간</text>

  <path class="arrow" d="M310 640 L310 695" marker-end="url(#arrow)"/>
  <rect class="verify" x="45" y="710" rx="24" width="530" height="300"/>
  <text class="k" x="80" y="753" fill="#28745a">03 · MATERIAL VALIDATION</text>
  <text class="h" x="80" y="805">고정밀 평가 1회당</text>
  <text class="h" x="80" y="850">validated hit</text>
  <text class="b" x="80" y="902">개선 유지: 채택</text>
  <text class="b" x="80" y="940">다른 basin: 역할 축소</text>
  <text class="b" x="80" y="978">개선 소멸: 중단</text>
  <text class="k" x="226" y="1050" fill="#5b6473">성공과 중단 모두 연구결과</text>
</svg>
