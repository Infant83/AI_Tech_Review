<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="980" viewBox="0 0 1080 980" role="img" aria-labelledby="title desc">
  <title id="title">양자 어닐링의 가치를 판별하는 세 단계</title>
  <desc id="desc">상류 오류 통제, 동일한 solver arena, 고정밀 재검증을 거쳐 양자 어닐링 채택, 역할 축소 또는 중단을 결정하는 도식</desc>
  <defs>
    <style>
      .bg{fill:#faf8f2}.stage{fill:#fff;stroke:#354052;stroke-width:3}.arena{fill:#f3eef9;stroke:#74519a;stroke-width:3}.verify{fill:#edf7f1;stroke:#28745a;stroke-width:3}.stop{fill:#fff0ef;stroke:#a44343;stroke-width:3}.k{font:700 22px 'Segoe UI','Noto Sans KR',Arial,sans-serif;letter-spacing:1px}.h{font:700 40px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.b{font:400 30px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#344054}.decision{font:700 30px 'Segoe UI','Noto Sans KR',Arial,sans-serif}.arrow{stroke:#687386;stroke-width:6;fill:none}.fail{stroke:#a44343;stroke-width:5;stroke-dasharray:10 9;fill:none}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#687386"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a44343"/></marker>
  </defs>
  <rect class="bg" width="1080" height="980"/>

  <rect class="stage" x="100" y="55" rx="28" width="690" height="235"/>
  <text class="k" x="145" y="105" fill="#416b9a">01 · CONTROL UPSTREAM ERROR</text>
  <text class="h" x="145" y="165">solver보다 먼저 확인</text>
  <text class="b" x="145" y="215">데이터 누수 · 예측기 보정</text>
  <text class="b" x="145" y="258">decoder · QUBO 근사 오차</text>

  <rect class="stop" x="830" y="92" rx="22" width="200" height="160"/>
  <text class="k" x="872" y="139" fill="#a44343">STOP</text>
  <text class="decision" x="864" y="188" fill="#983b3b">오차가 크면</text>
  <text class="decision" x="884" y="226" fill="#983b3b">비교 중단</text>
  <path class="fail" d="M790 172 L830 172" marker-end="url(#red)"/>

  <path class="arrow" d="M445 290 L445 355" marker-end="url(#arrow)"/>

  <rect class="arena" x="100" y="370" rx="28" width="880" height="260"/>
  <text class="k" x="145" y="420" fill="#74519a">02 · SAME SOLVER ARENA</text>
  <text class="h" x="145" y="480">같은 문제 · 같은 검증 예산</text>
  <text class="b" x="145" y="535">CP-SAT · GA/BO · SA/Tabu/SQA</text>
  <text class="b" x="145" y="580">D-Wave QPU · 반복 job · 신뢰구간</text>

  <path class="arrow" d="M540 630 L540 695" marker-end="url(#arrow)"/>

  <rect class="verify" x="100" y="710" rx="28" width="880" height="205"/>
  <text class="k" x="145" y="760" fill="#28745a">03 · MATERIAL VALIDATION</text>
  <text class="h" x="145" y="820">고정밀 평가 1회당 validated hit</text>
  <text class="b" x="145" y="870">개선 유지: 채택 · 다른 basin: 역할 축소 · 개선 소멸: 중단</text>
  <text class="k" x="705" y="955" fill="#5b6473">성공과 중단 모두 연구결과</text>
</svg>
