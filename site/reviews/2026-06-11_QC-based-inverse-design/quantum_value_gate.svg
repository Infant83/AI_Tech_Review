<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">청색 OLED 역설계에서 양자 어닐링을 채택하는 검증 게이트</title>
  <desc id="desc">데이터 계약, 예측기, 표현과 디코더, QUBO, solver 비교, 고정밀 재검증을 순서대로 통과하는 게이트와 중단 조건</desc>
  <defs>
    <style>
      .bg{fill:#faf9f6}.rail{stroke:#b6bdc8;stroke-width:6;fill:none}.gate{fill:#fff;stroke:#354052;stroke-width:2.5}.pass{fill:#eaf6ef;stroke:#28745a;stroke-width:2.5}.qa{fill:#f2ebfa;stroke:#74519a;stroke-width:2.5}.stop{fill:#fff0ef;stroke:#a44343;stroke-width:2}.title{font:700 32px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.sub{font:400 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#5a6575}.g{font:700 19px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.h{font:700 18px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#172033}.body{font:400 15px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#3b4656}.small{font:400 14px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#5a6575}.stoptext{font:700 15px 'Segoe UI','Noto Sans KR',Arial,sans-serif;fill:#983b3b}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b6bdc8"/></marker>
  </defs>
  <rect class="bg" width="1400" height="760"/>
  <text class="title" x="70" y="65">양자 어닐링은 다섯 개의 검증 게이트를 통과한 뒤 평가합니다</text>
  <text class="sub" x="70" y="100">앞 단계의 오류가 크면 solver 성능을 읽을 수 없습니다.</text>
  <path class="rail" d="M120 290 L1280 290" marker-end="url(#arrow)"/>

  <rect class="gate" x="70" y="160" rx="18" width="225" height="260"/>
  <text class="g" x="95" y="195">G0 · 데이터</text>
  <text class="body" x="95" y="235">label provenance</text><text class="body" x="95" y="262">duplicate · leakage</text><text class="body" x="95" y="289">scaffold / pair split</text><text class="body" x="95" y="316">uncertainty</text>
  <rect class="stop" x="90" y="345" rx="10" width="185" height="50"/><text class="stoptext" x="108" y="375">누수·혼합 label이면 중단</text>

  <rect class="gate" x="330" y="160" rx="18" width="225" height="260"/>
  <text class="g" x="355" y="195">G1 · 예측기</text>
  <text class="body" x="355" y="235">GBDT · GP · TabPFN</text><text class="body" x="355" y="262">GNN / pair-GNN</text><text class="body" x="355" y="289">calibration</text><text class="body" x="355" y="316">top-k recall · OOD</text>
  <rect class="stop" x="350" y="345" rx="10" width="185" height="50"/><text class="stoptext" x="370" y="375">기준선 미달이면 중단</text>

  <rect class="gate" x="590" y="160" rx="18" width="225" height="260"/>
  <text class="g" x="615" y="195">G2 · 표현</text>
  <text class="body" x="615" y="235">fragment / SELFIES</text><text class="body" x="615" y="262">decode validity</text><text class="body" x="615" y="289">synthetic filter</text><text class="body" x="615" y="316">target fidelity</text>
  <rect class="stop" x="610" y="345" rx="10" width="185" height="50"/><text class="stoptext" x="627" y="375">decode 오차가 크면 중단</text>

  <rect class="gate" x="850" y="160" rx="18" width="225" height="260"/>
  <text class="g" x="875" y="195">G3 · QUBO</text>
  <text class="body" x="875" y="235">quadratic fit error</text><text class="body" x="875" y="262">constraint feasibility</text><text class="body" x="875" y="289">logical degree</text><text class="body" x="875" y="316">embedding · chain break</text>
  <rect class="stop" x="870" y="345" rx="10" width="185" height="50"/><text class="stoptext" x="891" y="375">근사 손실이 크면 중단</text>

  <rect class="qa" x="1110" y="145" rx="18" width="225" height="290"/>
  <text class="g" x="1135" y="185">G4 · Solver value</text>
  <text class="body" x="1135" y="225">exact · CP-SAT / MILP</text><text class="body" x="1135" y="252">GA/BO · SA/Tabu/SQA</text><text class="body" x="1135" y="279">D-Wave QPU / hybrid</text><text class="body" x="1135" y="306">end-to-end time-to-target</text><text class="body" x="1135" y="333">hit · diversity · stability</text>
  <rect class="pass" x="1130" y="365" rx="10" width="185" height="48"/><text class="stoptext" x="1147" y="395" fill="#26755b">검증 뒤 역할을 채택</text>

  <rect class="pass" x="185" y="505" rx="20" width="1030" height="175"/>
  <text class="h" x="220" y="545">최종 gate · 고정밀 계산과 실험</text>
  <text class="body" x="220" y="578">같은 DFT/TDDFT·실험 예산에서</text>
  <text class="body" x="220" y="603">joint target hit 또는 information gain이 남는가?</text>
  <text class="body" x="220" y="630">개선 유지: optimizer 채택 · 다른 basin 제공: diversity sampler로 축소</text>
  <text class="small" x="220" y="655">개선 소멸: quantum path 중단 · 성공과 중단 모두 재현 가능한 연구결과</text>
</svg>
