<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="-150 -55 1280 470" role="img" aria-labelledby="title desc">
  <title id="title">Q-Prior pipeline</title>
  <desc id="desc">Quantum generator learns invariant statistics from chaotic flow data and provides a reusable prior to a classical autoregressive predictor.</desc>
  <rect width="980" height="360" fill="#f8fafc"/>
  <text x="42" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">QIML pipeline: quantum prior, classical rollout</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#111827">
    <rect x="44" y="104" width="190" height="106" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="74" y="145" font-weight="700">Chaotic flow</text>
    <text x="78" y="174">training data</text>
    <rect x="286" y="104" width="206" height="106" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="328" y="142" font-weight="700">Quantum</text>
    <text x="320" y="171">generator</text>
    <rect x="544" y="104" width="150" height="106" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="585" y="145" font-weight="700">Q-Prior</text>
    <text x="575" y="174">statistics</text>
    <rect x="746" y="104" width="190" height="106" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="783" y="139" font-weight="700">Classical</text>
    <text x="772" y="168">autoregressive</text>
    <text x="807" y="193">predictor</text>
  </g>
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M236 157 H282"/>
    <path d="M494 157 H540"/>
    <path d="M696 157 H742"/>
    <path d="M841 214 C835 265 732 291 602 292 C431 293 310 265 264 219"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <text x="93" y="270" font-family="Arial, sans-serif" font-size="17" fill="#475569">Offline Q-Prior</text>
  <text x="93" y="301" font-family="Arial, sans-serif" font-size="17" fill="#475569">Classical long rollout</text>
</svg>
