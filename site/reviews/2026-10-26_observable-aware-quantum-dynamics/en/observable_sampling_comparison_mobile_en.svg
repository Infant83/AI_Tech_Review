<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" width="600" height="1489" viewBox="0 0 600 1489" role="img">
  <title id="title">The target observable changes the sampling distribution</title>
  <desc id="desc">Exact averaged qDRIFT channels for H=Z+0.2X+0.2Y, same initial state, T=0.4,N=4. Exact-oracle toy distributions minimize MSE for 200 trajectories. Not the StateDRIFT allocation algorithm. No measurement shot noise.</desc>
  <rect width="100%" height="100%" fill="#fffdf8" />
  <style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#23333d}.title{font-size:26px;font-weight:700}.small{font-size:20px}.label{font-size:22px}.tick{font-size:19px}</style>
  <text class="title" x="30" y="37" font-size="26" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d" font-weight="700">The target observable changes the</text>
  <text class="title" x="30" y="71" font-size="26" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d" font-weight="700">sampling distribution</text>
  <text class="small" x="30" y="107" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">H = Z + 0.2X + 0.2Y; T = 0.4; N = 4; M = 200</text>
  <text class="small" x="30" y="136" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">trajectories.</text>
  <text class="label" x="52" y="187" font-size="22" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">Z: MSE = bias squared + trajectory</text>
  <text class="label" x="52" y="216" font-size="22" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">variance/M</text>
  <g transform="translate(20 96)">
    <text x="82" y="157" class="small" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">Coefficient-based qDRIFT</text>
    <rect x="82" y="167" width="97.440" height="25" fill="#bd5939" />
    <rect x="179.440" y="167" width="12.798" height="25" fill="#247f79" />
    <text x="82" y="214" class="small" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">bias=-0.03660; MSE=0.001516</text>
    <text x="82" y="244" class="small" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">Toy optimization for Z</text>
    <rect x="82" y="254" width="51.118" height="25" fill="#bd5939" />
    <rect x="133.118" y="254" width="6.265" height="25" fill="#247f79" />
    <text x="82" y="301" class="small" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">bias=-0.02651; MSE=0.000789</text>
    <text x="82" y="331" class="small" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">Toy optimization for X</text>
    <rect x="82" y="341" width="341.867" height="25" fill="#bd5939" />
    <rect x="423.867" y="341" width="11.378" height="25" fill="#247f79" />
    <text x="82" y="388" class="small" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">bias=-0.06856; MSE=0.004857</text>
    <line x1="82" y1="413" x2="482" y2="413" stroke="#9aa8ad" />
    <text x="82.00" y="433" text-anchor="middle" class="tick" font-size="19" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">0</text>
    <text x="154.73" y="433" text-anchor="middle" class="tick" font-size="19" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">0.001</text>
    <text x="227.45" y="433" text-anchor="middle" class="tick" font-size="19" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">0.002</text>
    <text x="300.18" y="433" text-anchor="middle" class="tick" font-size="19" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">0.003</text>
    <text x="372.91" y="433" text-anchor="middle" class="tick" font-size="19" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">0.004</text>
    <text x="445.64" y="433" text-anchor="middle" class="tick" font-size="19" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">0.005</text>
  </g>
  <text class="label" x="52" y="617" font-size="22" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">X: MSE = bias squared + trajectory</text>
  <text class="label" x="52" y="646" font-size="22" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">variance/M</text>
  <g transform="translate(-545 526)">
    <text x="647" y="157" class="small" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">Coefficient-based qDRIFT</text>
    <rect x="647" y="167" width="70.344" height="25" fill="#bd5939" />
    <rect x="717.344" y="167" width="22.324" height="25" fill="#247f79" />
    <text x="647" y="214" class="small" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">bias=-0.03110; MSE=0.001274</text>
    <text x="647" y="244" class="small" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">Toy optimization for Z</text>
    <rect x="647" y="254" width="265.816" height="25" fill="#bd5939" />
    <rect x="912.816" y="254" width="72.083" height="25" fill="#247f79" />
    <text x="647" y="301" class="small" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">bias=-0.06046; MSE=0.004646</text>
    <text x="647" y="331" class="small" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">Toy optimization for X</text>
    <rect x="647" y="341" width="41.194" height="25" fill="#bd5939" />
    <rect x="688.194" y="341" width="20.588" height="25" fill="#247f79" />
    <text x="647" y="388" class="small" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">bias=-0.02380; MSE=0.000849</text>
    <line x1="647" y1="413" x2="1047" y2="413" stroke="#9aa8ad" />
    <text x="647.00" y="433" text-anchor="middle" class="tick" font-size="19" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">0</text>
    <text x="719.73" y="433" text-anchor="middle" class="tick" font-size="19" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">0.001</text>
    <text x="792.45" y="433" text-anchor="middle" class="tick" font-size="19" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">0.002</text>
    <text x="865.18" y="433" text-anchor="middle" class="tick" font-size="19" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">0.003</text>
    <text x="937.91" y="433" text-anchor="middle" class="tick" font-size="19" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">0.004</text>
    <text x="1010.64" y="433" text-anchor="middle" class="tick" font-size="19" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">0.005</text>
  </g>
  <rect x="42" y="989" width="19" height="19" fill="#bd5939" />
  <text class="small" x="76" y="1007" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">Bias squared</text>
  <rect x="42" y="1029" width="19" height="19" fill="#247f79" />
  <text class="small" x="76" y="1047" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">Trajectory variance / M</text>
  <text class="small" x="30" y="1087" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">Coefficient-based qDRIFT: q(Z,X,Y) = 0.7143,</text>
  <text class="small" x="30" y="1117" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">0.1429, 0.1429.</text>
  <text class="small" x="30" y="1159" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">Toy optimization for Z: q(Z,X,Y) = 0.3155, 0.3543,</text>
  <text class="small" x="30" y="1189" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">0.3302.</text>
  <text class="small" x="30" y="1231" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">Toy optimization for X: q(Z,X,Y) = 0.7762, 0.0413,</text>
  <text class="small" x="30" y="1261" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">0.1825.</text>
  <text class="small" x="30" y="1303" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">Exact-oracle teaching optimization; NOT a</text>
  <text class="small" x="30" y="1333" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">StateDRIFT implementation or molecular</text>
  <text class="small" x="30" y="1363" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">reproduction.</text>
  <text class="small" x="30" y="1405" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">Variance is over random circuit trajectories;</text>
  <text class="small" x="30" y="1435" font-size="20" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#23333d">final quantum measurement shot noise is excluded.</text>
</svg>
