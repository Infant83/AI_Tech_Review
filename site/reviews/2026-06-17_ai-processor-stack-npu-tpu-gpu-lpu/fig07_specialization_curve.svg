<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">가속기 전문화 곡선</title>
  <desc id="desc">CPU에서 GPU, TPU/NPU/LPU/ASIC, QPU와 차세대 전략으로 갈수록 범용성은 줄고 특정 병목에 대한 효율은 높아지는 경향</desc>
  <defs>
    <style>
      .bg { fill: #fbfcfd; }
      .panel { fill: #ffffff; stroke: #d8e0e6; stroke-width: 2; }
      .axis { stroke: #30363d; stroke-width: 3; }
      .curve { fill: none; stroke: #a50034; stroke-width: 8; stroke-linecap: round; }
      .curve-soft { fill: none; stroke: #f2a2b7; stroke-width: 18; stroke-linecap: round; opacity: .45; }
      .label { font: 800 34px Arial, sans-serif; fill: #20252b; letter-spacing: 0; }
      .text { font: 400 20px Arial, sans-serif; fill: #56616d; letter-spacing: 0; }
      .small { font: 400 17px Arial, sans-serif; fill: #66717d; letter-spacing: 0; }
      .tag { fill: #ffffff; stroke: #30363d; stroke-width: 2; }
      .dot { fill: #a50034; }
      .blue { fill: #6ca7c8; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto">
      <path d="M0,0 L0,10 L12,5 z" fill="#30363d"/>
    </marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <rect class="panel" x="70" y="56" width="1460" height="780" rx="26"/>
  <text x="112" y="122" class="label">왜 처리장치는 계속 나뉘는가</text>
  <text x="112" y="162" class="text">전문화는 유행어가 아니라, 범용 코어가 감당하기 어려운 네 가지 비용을 줄이기 위한 선택입니다.</text>

  <line class="axis" x1="210" y1="670" x2="1370" y2="670" marker-end="url(#arrow)"/>
  <line class="axis" x1="210" y1="670" x2="210" y2="235" marker-end="url(#arrow)"/>
  <text x="190" y="728" class="text" style="font-weight:700">범용성·프로그래밍 자유도</text>
  <text x="1015" y="728" class="text" style="font-weight:700">특정 워크로드 효율</text>
  <text x="104" y="596" class="text" style="font-weight:700" transform="rotate(-90 104 596)">연산/전력 효율</text>

  <path class="curve-soft" d="M245 625 C455 590 600 515 748 430 C920 330 1060 270 1325 245"/>
  <path class="curve" d="M245 625 C455 590 600 515 748 430 C920 330 1060 270 1325 245"/>

  <g transform="translate(230 598)">
    <circle class="dot" cx="0" cy="0" r="12"/>
    <rect class="tag" x="-62" y="28" width="125" height="62" rx="9"/>
    <text x="-33" y="67" class="text" style="font-weight:800">CPU</text>
  </g>
  <g transform="translate(525 535)">
    <circle class="dot" cx="0" cy="0" r="12"/>
    <rect class="tag" x="-66" y="28" width="132" height="62" rx="9"/>
    <text x="-35" y="67" class="text" style="font-weight:800">GPU</text>
  </g>
  <g transform="translate(770 418)">
    <circle class="dot" cx="0" cy="0" r="12"/>
    <rect class="tag" x="-96" y="28" width="192" height="62" rx="9"/>
    <text x="-72" y="67" class="text" style="font-weight:800">TPU / NPU</text>
  </g>
  <g transform="translate(1025 300)">
    <circle class="dot" cx="0" cy="0" r="12"/>
    <rect class="tag" x="-112" y="28" width="224" height="62" rx="9"/>
    <text x="-88" y="67" class="text" style="font-weight:800">LPU / ASIC</text>
  </g>
  <g transform="translate(1325 245)">
    <circle class="dot" cx="0" cy="0" r="12"/>
    <rect class="tag" x="-150" y="28" width="300" height="62" rx="9"/>
    <text x="-126" y="67" class="text" style="font-weight:800">Wafer / Analog / QPU</text>
  </g>

  <g transform="translate(256 220)">
    <rect class="panel" width="250" height="100" rx="14"/>
    <rect class="blue" x="24" y="24" width="18" height="52" rx="9"/>
    <text x="58" y="48" class="text" style="font-weight:800">데이터 이동</text>
    <text x="58" y="76" class="small">HBM, SRAM, near-memory</text>
  </g>
  <g transform="translate(530 220)">
    <rect class="panel" width="250" height="100" rx="14"/>
    <rect class="blue" x="24" y="24" width="18" height="52" rx="9"/>
    <text x="58" y="48" class="text" style="font-weight:800">정밀도</text>
    <text x="58" y="76" class="small">INT8, FP8, FP4, sparsity</text>
  </g>
  <g transform="translate(804 220)">
    <rect class="panel" width="250" height="100" rx="14"/>
    <rect class="blue" x="24" y="24" width="18" height="52" rx="9"/>
    <text x="58" y="48" class="text" style="font-weight:800">스케줄링</text>
    <text x="58" y="76" class="small">컴파일러, 정적 라우팅</text>
  </g>
  <g transform="translate(1078 220)">
    <rect class="panel" width="250" height="100" rx="14"/>
    <rect class="blue" x="24" y="24" width="18" height="52" rx="9"/>
    <text x="58" y="48" class="text" style="font-weight:800">통신</text>
    <text x="58" y="76" class="small">NVLink, fabric, optical</text>
  </g>

  <text x="248" y="775" class="small">오른쪽으로 갈수록 특정 병목에는 강해집니다.</text>
  <text x="248" y="804" class="small">워크로드가 바뀌면 사용률, 개발 난이도, 공급망, 소프트웨어 락인이 비용이 됩니다.</text>
</svg>
