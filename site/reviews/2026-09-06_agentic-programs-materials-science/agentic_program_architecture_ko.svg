<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DeMARS의 판단과 결정론적 계산 경계</title>
  <desc id="desc">무질서 CIF 입력에서 근거 추출, 제한된 LLM 판단, 구조 열거와 MLIP 이완, 물리 검증, 독립 검토를 거쳐 인증 또는 거절 기록을 내는 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1726"/><stop offset="1" stop-color="#17283a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#9eb5c9"/></marker>
    <style>
      .box{rx:22;stroke-width:3;filter:url(#shadow)} .det{fill:#163b51;stroke:#3fb9c5}.judge{fill:#412f5f;stroke:#b899eb}.gate{fill:#3f321d;stroke:#e3a43d}.review{fill:#263c31;stroke:#72c59a}.out{fill:#192738;stroke:#dbe8f2}.h{font:700 29px system-ui,sans-serif;fill:#f4f8fb}.p{font:500 21px system-ui,sans-serif;fill:#d6e0e8}.small{font:500 18px system-ui,sans-serif;fill:#c5d1dc}.lane{font:700 19px system-ui,sans-serif;letter-spacing:.08em}.arrow{stroke:#9eb5c9;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="74" class="h" font-size="38">판단은 열어 두되, 결과는 계산으로 묻는다</text>
  <text x="80" y="112" class="p">논문 Fig. 3과 본문을 바탕으로 리뷰어가 재구성한 기능 경계</text>
  <text x="80" y="171" class="lane" fill="#5dd0db">결정론적 코드</text>
  <text x="544" y="171" class="lane" fill="#c9aff5">제한된 LLM 판단</text>
  <text x="1036" y="171" class="lane" fill="#f0b65b">물리·구조 검증</text>
  <rect x="70" y="210" width="275" height="200" class="box det"/>
  <text x="101" y="260" class="h">무질서 CIF</text>
  <text x="101" y="304" class="p">부분 점유·조성·대칭</text>
  <text x="101" y="340" class="p">보고된 결정학 근거</text>
  <text x="101" y="382" class="small">근거 묶음으로 추출</text>
  <path d="M345 310 H440" class="arrow"/>
  <rect x="450" y="210" width="390" height="200" class="box judge"/>
  <text x="483" y="260" class="h">실행 명세 결정</text>
  <text x="483" y="304" class="p">supercell·배타/병합 site</text>
  <text x="483" y="340" class="p">전하 중성 조성·수리 경로</text>
  <text x="483" y="382" class="small">미리 규칙화하기 어려운 지점만 판단</text>
  <path d="M840 310 H935" class="arrow"/>
  <rect x="945" y="210" width="295" height="200" class="box det"/>
  <text x="978" y="260" class="h">열거·이완</text>
  <text x="978" y="304" class="p">후보 구조 생성</text>
  <text x="978" y="340" class="p">SevenNet MLIP 이완</text>
  <text x="978" y="382" class="small">정량값은 코드가 계산</text>
  <path d="M1240 310 H1335" class="arrow"/>
  <rect x="1345" y="210" width="190" height="200" class="box gate"/>
  <text x="1377" y="260" class="h">게이트</text>
  <text x="1377" y="304" class="small">전하 중성</text>
  <text x="1377" y="336" class="small">점유 일치</text>
  <text x="1377" y="368" class="small">연결성</text>
  <path d="M1440 410 V504 H1160" class="arrow"/>
  <rect x="760" y="500" width="400" height="180" class="box judge"/>
  <text x="793" y="550" class="h">결과 분포 판정</text>
  <text x="793" y="594" class="p">수용 또는 명세를 좁혀 재실행</text>
  <text x="793" y="634" class="small">판단 결과는 다시 계산 가능한 가설이 됨</text>
  <path d="M760 590 H665" class="arrow"/>
  <rect x="335" y="500" width="330" height="180" class="box review"/>
  <text x="368" y="550" class="h">새 문맥의 독립 검토</text>
  <text x="368" y="594" class="p">누락된 자유도·일관성 탐색</text>
  <text x="368" y="634" class="small">자기 인증을 피하는 구조</text>
  <path d="M500 680 V760 H742" class="arrow"/>
  <rect x="752" y="718" width="355" height="120" class="box out"/>
  <text x="785" y="766" class="h">인증 모델 또는 명시적 거절</text>
  <text x="785" y="806" class="p">근거·진단·판단을 기계 판독 기록으로 보존</text>
  <path d="M945 500 V455 H645 V410" class="arrow" stroke="#b899eb"/>
  <text x="683" y="446" class="small">게이트 실패 또는 분포 이상이면 반복</text>
  <rect x="82" y="736" width="535" height="105" rx="18" fill="#111d2a" stroke="#567186" stroke-width="2"/>
  <text x="110" y="775" class="small">핵심 원리: LLM은 정량 근거를 만들거나</text>
  <text x="110" y="807" class="small">자기 결과를 인증하지 않고, 코드 사이에서 판단한다.</text>
</svg>
