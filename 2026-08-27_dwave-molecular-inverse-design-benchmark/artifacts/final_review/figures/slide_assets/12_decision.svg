<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#142238}.title{font-size:48px;font-weight:800}.verdict{font-size:38px;font-weight:800}.head{font-size:28px;font-weight:800}.body{font-size:21px}.small{font-size:17px;fill:#657286}.white{fill:#fff}</style>
  <rect width="1600" height="900" fill="#f7f8fa"/><rect width="1600" height="18" fill="#d71920"/>
  <text x="70" y="86" class="title">결론: 파이프라인은 작동했고, 우위 판단은 다음 실험으로 남는다</text>
  <rect x="70" y="140" width="1460" height="104" rx="22" fill="#14243c"/><text x="800" y="205" text-anchor="middle" class="verdict white">현재 판정 · 파이프라인 작동 / 우위 주장은 보류</text>
  <g transform="translate(70 306)">
    <rect width="450" height="350" rx="26" fill="#e4f5ef" stroke="#a8d8c8"/><circle cx="64" cy="62" r="32" fill="#069f83"/><text x="64" y="72" text-anchor="middle" class="head white">1</text><text x="114" y="72" class="head">GO</text><text x="34" y="134" class="body">같은 예산에서 classical champion보다</text><text x="34" y="174" class="body">반복 가능한 추가 정보를 얻는가?</text><text x="34" y="236" class="small">matched initial labels · candidates</text><text x="34" y="270" class="small">batch size · DFT budget · rounds</text>
    <rect x="505" width="450" height="350" rx="26" fill="#e6f1fb" stroke="#b0d1ee"/><circle cx="569" cy="62" r="32" fill="#167abc"/><text x="569" y="72" text-anchor="middle" class="head white">2</text><text x="619" y="72" class="head">SCALE</text><text x="539" y="134" class="body">multiple seeds와 larger shortlist에서도</text><text x="539" y="174" class="body">quality·diversity 이득이 유지되는가?</text><text x="539" y="236" class="small">end-to-end time · cost</text><text x="539" y="270" class="small">DFT success · calibration</text>
    <rect x="1010" width="450" height="350" rx="26" fill="#fae8eb" stroke="#e7b8c1"/><circle cx="1074" cy="62" r="32" fill="#d71920"/><text x="1074" y="72" text-anchor="middle" class="head white">3</text><text x="1124" y="72" class="head">STOP</text><text x="1044" y="134" class="body">quality·diversity 이득이 없거나</text><text x="1044" y="174" class="body">queue·sampling overhead가 목적을 해치는가?</text><text x="1044" y="236" class="small">그렇다면 QPU campaign을 중단</text><text x="1044" y="270" class="small">강한 classical baseline 유지</text>
  </g>
  <rect x="70" y="708" width="1460" height="98" rx="22" fill="#d71920"/><text x="800" y="769" text-anchor="middle" class="verdict white">다음 증거는 matched live-loop bake-off에서 나온다.</text>
  <text x="70" y="864" class="small">Not yet established: persistent generated-space loop · speedup · quantum advantage · molecular discovery</text>
</svg>
