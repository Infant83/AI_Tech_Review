<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img"><title>하나의 판단 과제, 세 가지 관찰</title><desc>A proposal by this review, not a validated universal competence model.</desc><rect width="760" height="650" fill="#fffefa" /><text x="34" y="50" font-family="ReviewFigure,sans-serif" font-size="30" font-weight="700" fill="#19323a">하나의 판단 과제, 세 가지 관찰</text><text x="34" y="89" font-family="ReviewFigure,sans-serif" font-size="21" font-weight="400" fill="#586a71">“방법 A가 B보다 낫다”는 주장을 검토한다</text><rect x="34" y="119" width="692" height="132" rx="10" fill="#f1f4ef" stroke="#d8e0d9" /><rect x="34" y="119" width="7" height="132" rx="3" fill="#a85836" /><text x="60" y="155" font-family="ReviewFigure,sans-serif" font-size="27" font-weight="700" fill="#a85836">기초 이해</text><text x="60" y="195" font-family="ReviewFigure,sans-serif" font-size="22" font-weight="400" fill="#19323a">분모·단위·비교 조건을 읽는다</text><text x="60" y="229" font-family="ReviewFigure,sans-serif" font-size="20" font-weight="400" fill="#586a71">무엇을 이해하고, 무엇을 더 알아야 하는가?</text><rect x="34" y="273" width="692" height="132" rx="10" fill="#f1f4ef" stroke="#d8e0d9" /><rect x="34" y="273" width="7" height="132" rx="3" fill="#14737b" /><text x="60" y="309" font-family="ReviewFigure,sans-serif" font-size="27" font-weight="700" fill="#14737b">AI를 활용한 수행</text><text x="60" y="349" font-family="ReviewFigure,sans-serif" font-size="22" font-weight="400" fill="#19323a">더 큰 자료를 분석하고 대안을 비교한다</text><text x="60" y="383" font-family="ReviewFigure,sans-serif" font-size="20" font-weight="400" fill="#586a71">어떤 결과를 시간·비용 안에서 만드는가?</text><rect x="34" y="427" width="692" height="132" rx="10" fill="#f1f4ef" stroke="#d8e0d9" /><rect x="34" y="427" width="7" height="132" rx="3" fill="#6c5683" /><text x="60" y="463" font-family="ReviewFigure,sans-serif" font-size="27" font-weight="700" fill="#6c5683">위임과 검증의 판단</text><text x="60" y="503" font-family="ReviewFigure,sans-serif" font-size="22" font-weight="400" fill="#19323a">맡길 일을 정하고, 확인하고, 수정한다</text><text x="60" y="537" font-family="ReviewFigure,sans-serif" font-size="20" font-weight="400" fill="#586a71">결과를 채택·보류·추가 확인할 이유는?</text><text x="34" y="610" font-family="ReviewFigure,sans-serif" font-size="21" font-weight="700" fill="#19323a">함께 관찰하되 임의의 총점으로 합치지 않는다</text><text x="34" y="638" font-family="ReviewFigure,sans-serif" font-size="17" font-weight="400" fill="#586a71">리뷰의 교육 설계 제안 · 보편적으로 검증된 척도가 아님</text></svg>
