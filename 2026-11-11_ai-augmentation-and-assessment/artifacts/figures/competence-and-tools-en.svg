<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img"><title>One decision task, three observations</title><desc>A proposal by this review, not a validated universal competence model.</desc><rect width="760" height="650" fill="#fffefa" /><text x="34" y="50" font-family="ReviewFigure,sans-serif" font-size="30" font-weight="700" fill="#19323a">One decision task, three observations</text><text x="34" y="89" font-family="ReviewFigure,sans-serif" font-size="21" font-weight="400" fill="#586a71">Evaluate a claim that method A outperforms B</text><rect x="34" y="119" width="692" height="132" rx="10" fill="#f1f4ef" stroke="#d8e0d9" /><rect x="34" y="119" width="7" height="132" rx="3" fill="#a85836" /><text x="60" y="155" font-family="ReviewFigure,sans-serif" font-size="27" font-weight="700" fill="#a85836">Foundational understanding</text><text x="60" y="195" font-family="ReviewFigure,sans-serif" font-size="22" font-weight="400" fill="#19323a">Read denominators, units and comparison conditions</text><text x="60" y="229" font-family="ReviewFigure,sans-serif" font-size="20" font-weight="400" fill="#586a71">What is understood? What is still unknown?</text><rect x="34" y="273" width="692" height="132" rx="10" fill="#f1f4ef" stroke="#d8e0d9" /><rect x="34" y="273" width="7" height="132" rx="3" fill="#14737b" /><text x="60" y="309" font-family="ReviewFigure,sans-serif" font-size="27" font-weight="700" fill="#14737b">Performance with AI</text><text x="60" y="349" font-family="ReviewFigure,sans-serif" font-size="22" font-weight="400" fill="#19323a">Analyze more data and compare alternatives</text><text x="60" y="383" font-family="ReviewFigure,sans-serif" font-size="20" font-weight="400" fill="#586a71">What can be delivered within time and cost limits?</text><rect x="34" y="427" width="692" height="132" rx="10" fill="#f1f4ef" stroke="#d8e0d9" /><rect x="34" y="427" width="7" height="132" rx="3" fill="#6c5683" /><text x="60" y="463" font-family="ReviewFigure,sans-serif" font-size="27" font-weight="700" fill="#6c5683">Delegation and verification</text><text x="60" y="503" font-family="ReviewFigure,sans-serif" font-size="22" font-weight="400" fill="#19323a">Decide what to delegate, check and revise</text><text x="60" y="537" font-family="ReviewFigure,sans-serif" font-size="20" font-weight="400" fill="#586a71">Why accept, defer or investigate the result?</text><text x="34" y="610" font-family="ReviewFigure,sans-serif" font-size="21" font-weight="700" fill="#19323a">Observe together; do not invent an aggregate score</text><text x="34" y="638" font-family="ReviewFigure,sans-serif" font-size="17" font-weight="400" fill="#586a71">A review proposal, not a universally validated scale</text></svg>
