<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">TabFM PoC evaluation matrix</title>
  <desc id="desc">TabFM PoC에서 비교 모델, split, metric, 운영 검증 항목을 함께 확인하는 매트릭스</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .panel { fill: #ffffff; stroke: #d8d5cb; stroke-width: 1.4; rx: 12; }
      .head { fill: #e9eef5; stroke: #25456f; }
      .good { fill: #e8f3ef; stroke: #0f766e; }
      .warn { fill: #f6eee2; stroke: #a35a16; }
      .risk { fill: #f5eaea; stroke: #8b3a3a; }
      .ink { fill: #17211d; font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif; }
      .muted { fill: #5f6b65; font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif; }
      .title { font-size: 27px; font-weight: 760; }
      .h { font-size: 18px; font-weight: 760; }
      .body { font-size: 15px; }
      .small { font-size: 14px; }
      .cell { fill: #ffffff; stroke: #d8d5cb; stroke-width: 1; }
      .cell-soft { fill: #f2f0ea; stroke: #d8d5cb; stroke-width: 1; }
    </style>
  </defs>
  <rect class="bg" width="1120" height="560"/>
  <text class="ink title" x="52" y="54">TabFM PoC는 모델 하나의 점수보다 평가 설계를 먼저 고정해야 합니다</text>
  <text class="muted body" x="52" y="84">같은 데이터, 같은 split, 같은 metric으로 비교해야 합니다.</text>
  <text class="muted body" x="52" y="106">그래야 TabFM의 빠른 예측이 실제 업무 성능인지 확인할 수 있습니다.</text>

  <rect class="panel" x="64" y="126" width="992" height="324" rx="12"/>
  <g transform="translate(94,160)">
    <rect class="head" x="0" y="0" width="180" height="48"/>
    <rect class="head" x="180" y="0" width="190" height="48"/>
    <rect class="head" x="370" y="0" width="190" height="48"/>
    <rect class="head" x="560" y="0" width="190" height="48"/>
    <rect class="head" x="750" y="0" width="140" height="48"/>
    <text class="ink h" x="22" y="31">모델 후보</text>
    <text class="ink h" x="202" y="31">검증 split</text>
    <text class="ink h" x="392" y="31">성능 metric</text>
    <text class="ink h" x="582" y="31">운영 metric</text>
    <text class="ink h" x="772" y="31">결정</text>

    <rect class="cell" x="0" y="48" width="180" height="56"/>
    <rect class="cell" x="180" y="48" width="190" height="56"/>
    <rect class="cell" x="370" y="48" width="190" height="56"/>
    <rect class="cell" x="560" y="48" width="190" height="56"/>
    <rect class="good" x="750" y="48" width="140" height="56"/>
    <text class="muted small" x="22" y="82">TabFM plain</text>
    <text class="muted small" x="202" y="74">random + time</text>
    <text class="muted small" x="202" y="94">group split</text>
    <text class="muted small" x="392" y="82">AUC, MAE, RMSE</text>
    <text class="muted small" x="582" y="74">latency, memory</text>
    <text class="muted small" x="582" y="94">calibration</text>
    <text class="ink small" x="772" y="82">빠른 baseline</text>

    <rect class="cell-soft" x="0" y="104" width="180" height="56"/>
    <rect class="cell-soft" x="180" y="104" width="190" height="56"/>
    <rect class="cell-soft" x="370" y="104" width="190" height="56"/>
    <rect class="cell-soft" x="560" y="104" width="190" height="56"/>
    <rect class="warn" x="750" y="104" width="140" height="56"/>
    <text class="muted small" x="22" y="138">TabFM-Ensemble</text>
    <text class="muted small" x="202" y="138">동일 split</text>
    <text class="muted small" x="392" y="130">plain 대비 gain</text>
    <text class="muted small" x="392" y="150">overfit 여부</text>
    <text class="muted small" x="582" y="130">ensemble 비용</text>
    <text class="muted small" x="582" y="150">재현성</text>
    <text class="ink small" x="772" y="138">강한 후보</text>

    <rect class="cell" x="0" y="160" width="180" height="56"/>
    <rect class="cell" x="180" y="160" width="190" height="56"/>
    <rect class="cell" x="370" y="160" width="190" height="56"/>
    <rect class="cell" x="560" y="160" width="190" height="56"/>
    <rect class="warn" x="750" y="160" width="140" height="56"/>
    <text class="muted small" x="22" y="194">TabPFN-3 / TabICLv2</text>
    <text class="muted small" x="202" y="194">동일 split</text>
    <text class="muted small" x="392" y="194">many-class, scale</text>
    <text class="muted small" x="582" y="194">license, GPU</text>
    <text class="ink small" x="772" y="194">대안 비교</text>

    <rect class="cell-soft" x="0" y="216" width="180" height="56"/>
    <rect class="cell-soft" x="180" y="216" width="190" height="56"/>
    <rect class="cell-soft" x="370" y="216" width="190" height="56"/>
    <rect class="cell-soft" x="560" y="216" width="190" height="56"/>
    <rect class="risk" x="750" y="216" width="140" height="56"/>
    <text class="muted small" x="22" y="250">XGBoost / LightGBM</text>
    <text class="muted small" x="202" y="250">동일 split</text>
    <text class="muted small" x="392" y="250">tuned baseline</text>
    <text class="muted small" x="582" y="242">설명가능성</text>
    <text class="muted small" x="582" y="262">운영 안정성</text>
    <text class="ink small" x="772" y="250">production 기준</text>
  </g>

  <rect class="panel" x="104" y="478" width="912" height="42" rx="8"/>
  <text class="muted small" x="128" y="500">결과표에는 평균 성능과 split별 순위를 남깁니다.</text>
  <text class="muted small" x="128" y="520">calibration curve, worst-group 성능, 라이선스 상태도 확인합니다.</text>
  <text class="muted small" x="128" y="540">데이터 반출 경계도 같은 표에서 함께 남깁니다.</text>
</svg>
